# sqlc writes internal/adapters/postgres/queries from the schema in db/migrations and the queries in db/queries
# (go generate ./... runs it; CI's generated step fails when the output differs from its sources).
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/adapters/postgres/queries
        sql_package: pgx/v5
        query_parameter_limit: 3
        omit_unused_structs: true
        rename:
          ip: IP
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  # The seeds run in goose's database/sql transactions, so theirs is a second package, on database/sql.
  - engine: postgresql
    schema: db/migrations
    queries: db/seeds/queries.sql
    gen:
      go:
        package: queries
        out: db/seeds/queries
        sql_package: database/sql
        query_parameter_limit: 3
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
