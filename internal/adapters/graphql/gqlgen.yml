# gqlgen's settings: generated.go and models_gen.go from api/graphql/, resolved by the methods gqlgen keeps in
# schema.resolvers.go, on resolver.go's Resolver.
schema:
  - ../../../api/graphql/*.graphqls
exec:
  filename: generated.go
  package: graphql
model:
  filename: models_gen.go
  package: graphql
resolver:
  layout: follow-schema
  dir: .
  package: graphql
  filename_template: "{name}.resolvers.go"
  type: Resolver
omit_gqlgen_version_in_file_notice: true
skip_mod_tidy: true
models:
  Int64:
    model: github.com/99designs/gqlgen/graphql.Int64
  User:
    fields:
      usage: { resolver: true }
      sessions: { resolver: true }
      personalTokens: { resolver: true }
      sshKeys: { resolver: true }
      permissions: { resolver: true }
      organizations: { resolver: true }
      invitations: { resolver: true }
      joinRequests: { resolver: true }
  Organization:
    fields:
      viewerPermissions: { resolver: true }
      members: { resolver: true }
      invitations: { resolver: true }
      joinRequests: { resolver: true }
      roles: { resolver: true }
      apiKeys: { resolver: true }
      repositories: { resolver: true }
      repository: { resolver: true }
      usage: { resolver: true }
      issues: { resolver: true }
      issue: { resolver: true }
      agents: { resolver: true }
      agent: { resolver: true }
      tasks: { resolver: true }
      task: { resolver: true }
      labels: { resolver: true }
      secrets: { resolver: true }
      artifact: { resolver: true }
      modelProviders: { resolver: true }
      availableModelProviders: { resolver: true }
      models: { resolver: true }
  Issue:
    fields:
      activity: { resolver: true }
      branches: { resolver: true }
      chat: { resolver: true }
  # code.go's, which knows the repository its issue and environments resolve from.
  Branch:
    model: cobranch.dev/internal/adapters/graphql.Branch
    fields:
      issue: { resolver: true }
      environments: { resolver: true }
  # jobs.go's, which knows the repository its logs resolve from.
  Run:
    model: cobranch.dev/internal/adapters/graphql.Run
    fields:
      logs: { resolver: true }
  # A null clears an issue's assignee or repository; a field left out keeps it.
  IssuePatch:
    fields:
      assigneeId: { omittable: true }
      repositoryId: { omittable: true }
  # A null clears an agent's own cap; a field left out keeps it.
  AgentPatch:
    fields:
      cap: { omittable: true }
  Repository:
    fields:
      viewerPermissions: { resolver: true }
      access: { resolver: true }
      roles: { resolver: true }
      branches: { resolver: true }
      branch: { resolver: true }
      deletedBranch: { resolver: true }
      history: { resolver: true }
      commit: { resolver: true }
      review: { resolver: true }
      tags: { resolver: true }
      tree: { resolver: true }
      blob: { resolver: true }
      runs: { resolver: true }
      run: { resolver: true }
      chat: { resolver: true }
      branchDiff: { resolver: true }
      commitDiff: { resolver: true }
      environments: { resolver: true }
      environment: { resolver: true }
      delivery: { resolver: true }
      secrets: { resolver: true }
      jobPrincipals: { resolver: true }
      artifacts: { resolver: true }
  Environment:
    fields:
      deliveries: { resolver: true }
    extraFields:
      RepositoryID:
        description: The ID of the environment's repository, which its deliveries read.
        type: string
  Secret:
    fields:
      access: { resolver: true }
  Artifact:
    fields:
      versions: { resolver: true }
      versionByNumber: { resolver: true }
      access: { resolver: true }
  Task:
    fields:
      transcript: { resolver: true }
