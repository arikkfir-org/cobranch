# oapi-codegen's settings for restclient.gen.go: a client of the REST API's calls that an agent's harness and its pod's
# model proxy make, and the models they take.
package: restclient
output: restclient.gen.go
generate:
  models: true
  client: true
output-options:
  include-operation-ids: [getMyTask, listTranscript, appendTranscript, getChatThread, startChatThread, postChatMessage,
    getIssueChatThread, startIssueChatThread, postIssueChatMessage, listChatThreads, listChatUpdates, listIssueChatThreads,
    listIssueChatUpdates, getOrganizationConversationThread, startOrganizationConversationThread,
    postOrganizationConversationMessage, listOrganizationConversationThreads, listOrganizationConversationUpdates,
    getRepositoryConversationThread, startRepositoryConversationThread, postRepositoryConversationMessage,
    listRepositoryConversationThreads, listRepositoryConversationUpdates, getAgentConversationThread,
    startAgentConversationThread, postAgentConversationMessage, listAgentConversationThreads,
    listAgentConversationUpdates, listTasks, getBranchDiff, getBlob, getTree, listReviews, submitReview, recordMyTaskSpend]
  nullable-type: true
