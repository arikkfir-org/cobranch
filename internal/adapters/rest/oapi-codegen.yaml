# oapi-codegen's settings for rest.gen.go: the models and a strict server on the standard library's routing.
package: rest
output: rest.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  # A merge patch tells a null (clear the field) from a field left out (keep it).
  nullable-type: true
