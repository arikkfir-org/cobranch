<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 420" role="img" aria-label="REST handlers, GraphQL resolvers, the Git server, the push worker and run tokens all go through one authorizer in the service layer, which reads grants from PostgreSQL on each request and filters lists in SQL"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="419" rx="8"/><defs><marker id="d47-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="d47-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="d47-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="d47-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="d47-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M266 42L298 42L298 192L330 192" class="edge" marker-end="url(#d47-a)"/><path d="M266 110L298 110L298 192L330 192" class="edge" marker-end="url(#d47-a)"/><path d="M266 186L298 186L298 192L330 192" class="edge" marker-end="url(#d47-a)"/><path d="M266 270L298 270L298 192L330 192" class="edge" marker-end="url(#d47-a)"/><path d="M266 346L298 346L298 192L330 192" class="edge" marker-end="url(#d47-a)"/><path d="M520 172L552 172L552 136L584 136" class="edge" marker-end="url(#d47-a)"/><text x="536" y="128" text-anchor="end" class="t-label">reads</text><path d="M520 212L552 212L552 258L584 258" class="edge" marker-end="url(#d47-a)"/><text x="536" y="254" text-anchor="end" class="t-label">scopes</text><g><rect x="16" y="16" width="250" height="52" rx="8" class="box"/><text x="141" y="38.5" text-anchor="middle" class="t-title">REST handlers</text><text x="141" y="56.5" text-anchor="middle" class="t-body">through the service layer</text></g><g><rect x="16" y="84" width="250" height="52" rx="8" class="box"/><text x="141" y="106.5" text-anchor="middle" class="t-title">GraphQL resolvers</text><text x="141" y="124.5" text-anchor="middle" class="t-body">every object they return</text></g><g><rect x="16" y="152" width="250" height="68" rx="8" class="box"/><text x="141" y="174.5" text-anchor="middle" class="t-title">Git server</text><text x="141" y="192.5" text-anchor="middle" class="t-body"><tspan class="mono">repo.read</tspan> before a fetch, <tspan class="mono">repo.push</tspan></text><text x="141" y="208.5" text-anchor="middle" class="t-body">before it reads a pushed pack</text></g><g><rect x="16" y="236" width="250" height="68" rx="8" class="box"/><text x="141" y="258.5" text-anchor="middle" class="t-title">Push worker</text><text x="141" y="276.5" text-anchor="middle" class="t-body">merge requirements and <tspan class="mono">repo.bypass</tspan>,</text><text x="141" y="292.5" text-anchor="middle" class="t-body">in the push’s transaction</text></g><g><rect x="16" y="320" width="250" height="52" rx="8" class="box"/><text x="141" y="342.5" text-anchor="middle" class="t-title">Job and agent runs</text><text x="141" y="360.5" text-anchor="middle" class="t-body">their run tokens, like anyone’s</text></g><g><rect x="330" y="150" width="190" height="84" rx="8" class="box tone-accent"/><text x="425" y="172.5" text-anchor="middle" class="t-title">The authorizer</text><text x="425" y="190.5" text-anchor="middle" class="t-body">in the service layer; grants</text><text x="425" y="206.5" text-anchor="middle" class="t-body">read once per request,</text><text x="425" y="222.5" text-anchor="middle" class="t-body">never cached across them</text></g><g><path d="M584 102 a80 6 0 0 1 160 0 v68 a80 6 0 0 1 -160 0 z" class="box"/><path d="M584 102 a80 6 0 0 0 160 0" class="rim"/><text x="664" y="126" text-anchor="middle" class="t-title">PostgreSQL</text><text x="664" y="142" text-anchor="middle" class="t-body">grants, roles,</text><text x="664" y="158" text-anchor="middle" class="t-body">group members</text></g><g><rect x="584" y="216" width="160" height="84" rx="8" class="box"/><text x="664" y="238.5" text-anchor="middle" class="t-title">List queries</text><text x="664" y="256.5" text-anchor="middle" class="t-body">filtered in SQL by the</text><text x="664" y="272.5" text-anchor="middle" class="t-body">scopes where the</text><text x="664" y="288.5" text-anchor="middle" class="t-body">permission holds</text></g></svg>
