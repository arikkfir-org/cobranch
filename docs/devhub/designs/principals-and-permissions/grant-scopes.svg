<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" role="img" aria-label="A grant reaches its scope and everything inside it" font-size="13"><style>svg{--text-primary:#1a1d20;--text-secondary:#6b737b;--chart-axis:#8a939b;--chart-grid:#e4e7ea;--chart-categorical-1:#3b6ef0;--chart-reference-tint:#eceef0;font-family:Inter,system-ui,sans-serif}@media (prefers-color-scheme: dark){svg{--text-primary:#f8f9fa;--text-secondary:#b4bcc2;--chart-axis:#8a939b;--chart-grid:#2e3338;--chart-categorical-1:#5a8df7;--chart-reference-tint:#2e3338}}</style><defs><marker id="scope-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" style="fill:var(--text-primary)">A grant reaches its scope and everything inside it</text><g><rect x="24" y="48" width="712" height="396" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="40" y="72" font-weight="600" style="fill:var(--text-primary)">Installation</text><text x="40" y="90" font-size="11.5" style="fill:var(--text-secondary)">Installation admin is granted here, to users only</text></g><g><rect x="40" y="112" width="180" height="72" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="130" y="136" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Users</text><text x="130" y="156" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">live at the installation</text><text x="130" y="172" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">join organizations</text></g><g fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"><path d="M220 148H244" marker-end="url(#scope-arrow)"></path></g><g><rect x="244" y="112" width="476" height="316" rx="8" fill-opacity="0.08" stroke-width="2" style="fill:var(--chart-categorical-1);stroke:var(--chart-categorical-1)"></rect><text x="260" y="136" font-weight="600" style="fill:var(--text-primary)">Organization</text><text x="260" y="154" font-size="11.5" style="fill:var(--text-secondary)">Any role granted here covers every repository in it</text></g><g><rect x="260" y="172" width="444" height="72" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="482" y="196" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Organization principals</text><text x="482" y="216" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">groups, agents, API keys, OAuth apps, workload identities</text></g><g><rect x="260" y="264" width="214" height="148" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="276" y="288" font-weight="600" style="fill:var(--text-primary)">Repository</text><text x="276" y="306" font-size="11.5" style="fill:var(--text-secondary)">Reader, Developer, Maintainer</text><rect x="276" y="324" width="182" height="72" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="367" y="348" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Jobs</text><text x="367" y="368" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">declared permissions</text><text x="367" y="384" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">capped by the ceiling</text></g><g><rect x="490" y="264" width="214" height="148" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="506" y="288" font-weight="600" style="fill:var(--text-primary)">Repository</text><text x="506" y="306" font-size="11.5" style="fill:var(--text-secondary)">Reader, Developer, Maintainer</text><rect x="506" y="324" width="182" height="72" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="597" y="348" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Jobs</text><text x="597" y="368" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">declared permissions</text><text x="597" y="384" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">capped by the ceiling</text></g></svg>
