<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 328" role="img" aria-label="In the Figma file, primitives feed semantic tokens with a Light and a Dark mode; 25 components use only semantic tokens; 8 screens use only component instances. Every variable carries its CSS name, so tokens.css in the devhub repository holds the same tokens for the Console"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="327" rx="8"/><defs><marker id="d54-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="d54-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="d54-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="d54-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="d54-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="160" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">Figma file DevHub</text><rect x="8" y="188" width="744" height="92" rx="10" class="group tone-plain"/><text x="22" y="208" text-anchor="start" class="t-group">devhub repository</text><path d="M164 98L224 98" class="edge" marker-end="url(#d54-a)"/><text x="194" y="90" text-anchor="middle" class="t-label">aliased</text><path d="M380 98L440 98" class="edge" marker-end="url(#d54-a)"/><text x="410" y="90" text-anchor="middle" class="t-label">bound</text><path d="M572 98L632 98" class="edge" marker-end="url(#d54-a)"/><text x="602" y="90" text-anchor="middle" class="t-label">instances</text><path d="M302 152L302 212" class="edge" marker-end="url(#d54-a)"/><text x="310" y="186" text-anchor="start" class="t-label">CSS names</text><path d="M380 240L440 240" class="edge" marker-end="url(#d54-a)"/><path d="M572 240L632 240" class="edge" marker-end="url(#d54-a)"/><g><rect x="24" y="44" width="140" height="108" rx="8" class="box"/><text x="94" y="70.5" text-anchor="middle" class="t-title">Primitives</text><text x="94" y="88.5" text-anchor="middle" class="t-body">gray in 15 steps;</text><text x="94" y="104.5" text-anchor="middle" class="t-body">blue, green, amber,</text><text x="94" y="120.5" text-anchor="middle" class="t-body">red, violet in 11;</text><text x="94" y="136.5" text-anchor="middle" class="t-body">black at 6–60%</text></g><g><rect x="224" y="44" width="156" height="108" rx="8" class="box tone-accent"/><text x="302" y="70.5" text-anchor="middle" class="t-title">Semantic tokens</text><text x="302" y="88.5" text-anchor="middle" class="t-body">collection Color</text><text x="302" y="104.5" text-anchor="middle" class="t-body">modes Light, Dark</text><text x="302" y="120.5" text-anchor="middle" class="t-body">bg, fg, border, action,</text><text x="302" y="136.5" text-anchor="middle" class="t-body">avatar, status, shadow</text></g><g><rect x="440" y="44" width="132" height="108" rx="8" class="box"/><text x="506" y="86.5" text-anchor="middle" class="t-title">25 components</text><text x="506" y="104.5" text-anchor="middle" class="t-body">semantic tokens only;</text><text x="506" y="120.5" text-anchor="middle" class="t-body">never detached</text></g><g><rect x="632" y="44" width="104" height="108" rx="8" class="box"/><text x="684" y="86.5" text-anchor="middle" class="t-title">8 screens</text><text x="684" y="104.5" text-anchor="middle" class="t-body">1440 × 900;</text><text x="684" y="120.5" text-anchor="middle" class="t-body">instances only</text></g><g><path d="M224 218 a78 6 0 0 1 156 0 v44 a78 6 0 0 1 -156 0 z" class="box"/><path d="M224 218 a78 6 0 0 0 156 0" class="rim"/><text x="302" y="242" text-anchor="middle" class="t-title"><tspan class="mono">tokens.css</tspan></text><text x="302" y="258" text-anchor="middle" class="t-body"><tspan class="mono">--color-*</tspan>, <tspan class="mono">--space-*</tspan></text></g><g><rect x="440" y="216" width="132" height="48" rx="8" class="box dashed"/><text x="506" y="236.5" text-anchor="middle" class="t-title">The Console</text><text x="506" y="254.5" text-anchor="middle" class="t-body">imports the tokens</text></g><g><rect x="632" y="216" width="104" height="48" rx="8" class="box"/><text x="684" y="236.5" text-anchor="middle" class="t-title">These pages</text><text x="684" y="254.5" text-anchor="middle" class="t-body">run on them too</text></g></svg>
