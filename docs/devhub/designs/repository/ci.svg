<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 388" role="img" aria-label="On every pull request and merge queue group, one task runs clone, lint, vet, test, build and version in one pod, the steps sharing Go’s build, module and lint caches in an emptyDir, and reports the Continuous Integration check"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="387" rx="8"/><defs><marker id="d51-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="d51-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="d51-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="d51-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="d51-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="88" width="744" height="196" rx="10" class="group"/><text x="22" y="108" text-anchor="start" class="t-group">One task, one pod: 500m CPU, 512Mi of memory, a 1Gi limit</text><path d="M230 60L230 88" class="edge" marker-end="url(#d51-a)"/><path d="M530 60L530 88" class="edge" marker-end="url(#d51-a)"/><path d="M132 158L144 158" class="edge" marker-end="url(#d51-a)"/><path d="M252 158L264 158" class="edge" marker-end="url(#d51-a)"/><path d="M372 158L384 158" class="edge" marker-end="url(#d51-a)"/><path d="M492 158L504 158" class="edge" marker-end="url(#d51-a)"/><path d="M612 158L624 158" class="edge" marker-end="url(#d51-a)"/><path d="M656 284L656 300" class="edge" marker-end="url(#d51-a)"/><g><rect x="120" y="16" width="220" height="44" rx="8" class="box"/><text x="230" y="34.5" text-anchor="middle" class="t-title">A pull request</text><text x="230" y="52.5" text-anchor="middle" class="t-body">whatever its base</text></g><g><rect x="420" y="16" width="220" height="44" rx="8" class="box"/><text x="530" y="42.5" text-anchor="middle" class="t-title">A merge queue group</text></g><g><rect x="24" y="124" width="108" height="68" rx="8" class="box"/><text x="78" y="146.5" text-anchor="middle" class="t-title"><tspan class="mono">clone</tspan></text><text x="78" y="164.5" text-anchor="middle" class="t-body">anonymous fetch</text><text x="78" y="180.5" text-anchor="middle" class="t-body">alpine/git</text></g><g><rect x="144" y="124" width="108" height="68" rx="8" class="box"/><text x="198" y="146.5" text-anchor="middle" class="t-title"><tspan class="mono">lint</tspan></text><text x="198" y="164.5" text-anchor="middle" class="t-body">house linters</text><text x="198" y="180.5" text-anchor="middle" class="t-body">golangci-lint</text></g><g><rect x="264" y="124" width="108" height="68" rx="8" class="box"/><text x="318" y="146.5" text-anchor="middle" class="t-title"><tspan class="mono">vet</tspan></text><text x="318" y="164.5" text-anchor="middle" class="t-body">go vet</text><text x="318" y="180.5" text-anchor="middle" class="t-body">golang</text></g><g><rect x="384" y="124" width="108" height="68" rx="8" class="box"/><text x="438" y="146.5" text-anchor="middle" class="t-title"><tspan class="mono">test</tspan></text><text x="438" y="164.5" text-anchor="middle" class="t-body">go test -race</text><text x="438" y="180.5" text-anchor="middle" class="t-body">golang</text></g><g><rect x="504" y="124" width="108" height="68" rx="8" class="box"/><text x="558" y="146.5" text-anchor="middle" class="t-title"><tspan class="mono">build</tspan></text><text x="558" y="164.5" text-anchor="middle" class="t-body">static binary</text><text x="558" y="180.5" text-anchor="middle" class="t-body">golang</text></g><g><rect x="624" y="124" width="108" height="68" rx="8" class="box"/><text x="678" y="146.5" text-anchor="middle" class="t-title"><tspan class="mono">version</tspan></text><text x="678" y="164.5" text-anchor="middle" class="t-body">devhub version</text><text x="678" y="180.5" text-anchor="middle" class="t-body">golang</text></g><g><path d="M144 220 a234 6 0 0 1 468 0 v44 a234 6 0 0 1 -468 0 z" class="box dashed"/><path d="M144 220 a234 6 0 0 0 468 0" class="rim"/><text x="378" y="244" text-anchor="middle" class="t-title">Go’s build, module and lint caches</text><text x="378" y="260" text-anchor="middle" class="t-body">an emptyDir: shared by the steps, kept by no run</text></g><g><rect x="560" y="300" width="192" height="40" rx="8" class="box tone-success"/><text x="656" y="324.5" text-anchor="middle" class="t-title">Continuous Integration</text></g></svg>
