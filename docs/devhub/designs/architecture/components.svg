<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" role="img" aria-label="All state lives in PostgreSQL and one bucket" font-size="13"><style>svg{--text-primary:#1a1d20;--text-secondary:#6b737b;--chart-axis:#8a939b;--chart-grid:#e4e7ea;--chart-categorical-1:#3b6ef0;--chart-reference-tint:#eceef0;font-family:Inter,system-ui,sans-serif}@media (prefers-color-scheme: dark){svg{--text-primary:#f8f9fa;--text-secondary:#b4bcc2;--chart-axis:#8a939b;--chart-grid:#2e3338;--chart-categorical-1:#5a8df7;--chart-reference-tint:#2e3338}}</style><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" style="fill:var(--text-primary)">All state lives in PostgreSQL and one bucket</text><g><rect x="24" y="148" width="712" height="284" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-grid)"></rect><text x="720" y="420" text-anchor="end" font-size="11.5" style="fill:var(--text-secondary)">DevHub workloads, stateless: any replica takes any work</text></g><g fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"><path d="M142.5 96V164" marker-end="url(#arch-arrow)"></path><path d="M202.5 96V124H319.5V164" marker-end="url(#arch-arrow)"></path><path d="M379.5 96V164" marker-end="url(#arch-arrow)"></path><path d="M616.5 96V164" marker-end="url(#arch-arrow)"></path><path d="M482 208H514" marker-end="url(#arch-arrow)"></path><path d="M616.5 252V300" marker-end="url(#arch-arrow)"></path><path d="M142.5 388V480" marker-end="url(#arch-arrow)"></path><path d="M379.5 432V480" marker-end="url(#arch-arrow)"></path><path d="M616.5 432V480" marker-end="url(#arch-arrow)"></path></g><text x="150.5" y="144" font-size="11.5" style="fill:var(--text-secondary)">pages</text><text x="261" y="117" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">REST, GraphQL</text><text x="387.5" y="144" font-size="11.5" style="fill:var(--text-secondary)">REST</text><text x="624.5" y="144" font-size="11.5" style="fill:var(--text-secondary)">HTTPS, SSH</text><text x="624.5" y="280" font-size="11.5" style="fill:var(--text-secondary)">waits for commit</text><text x="150.5" y="462" font-size="11.5" style="fill:var(--text-secondary)">creates pods</text><g><rect x="40" y="56" width="205" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="142.5" y="80" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Browser</text></g><g><rect x="277" y="56" width="205" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="379.5" y="80" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">SDK, script or agent</text></g><g><rect x="514" y="56" width="205" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="616.5" y="80" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Git client</text></g><g><rect x="40" y="164" width="205" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="142.5" y="188" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Console, Back-office</text><text x="142.5" y="208" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">Caddy, static files</text><text x="142.5" y="224" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">the browser runs them</text><text x="142.5" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">no state</text></g><g><rect x="277" y="164" width="205" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="379.5" y="188" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">API server</text><text x="379.5" y="208" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">REST, GraphQL, subscriptions</text><text x="379.5" y="224" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">sign-in, uploads, job logs</text><text x="379.5" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">PostgreSQL · bucket</text></g><g><rect x="514" y="164" width="205" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="616.5" y="188" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Git server</text><text x="616.5" y="208" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">Git over HTTPS and SSH</text><text x="616.5" y="224" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">pack cache on local disk</text><text x="616.5" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">PostgreSQL · bucket</text></g><g><rect x="40" y="300" width="205" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="142.5" y="324" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Controller</text><text x="142.5" y="344" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">jobs, agents, webhooks, cron</text><text x="142.5" y="360" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">the only one that makes pods</text><text x="142.5" y="376" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">PostgreSQL · bucket</text></g><g><rect x="277" y="300" width="205" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="379.5" y="324" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Maintenance CronJob</text><text x="379.5" y="344" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">compacts packs hourly</text><text x="379.5" y="360" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">deletes expired data</text><text x="379.5" y="376" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">PostgreSQL · bucket</text></g><g><rect x="514" y="300" width="205" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--chart-axis)"></rect><text x="616.5" y="324" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Push worker</text><text x="616.5" y="344" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">one transaction per push</text><text x="616.5" y="360" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">the only writer of refs</text><text x="616.5" y="376" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">PostgreSQL</text></g><g><rect x="40" y="480" width="205" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" style="stroke:var(--chart-axis)"></rect><text x="142.5" y="504" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Job and agent pods</text><text x="142.5" y="524" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">in their own namespaces</text><text x="142.5" y="540" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">call back with their token</text></g><g><rect x="277" y="480" width="205" height="72" rx="8" fill-opacity="0.12" stroke-width="2" stroke-dasharray="none" style="fill:var(--chart-categorical-1);stroke:var(--chart-categorical-1)"></rect><text x="379.5" y="504" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">PostgreSQL</text><text x="379.5" y="524" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">refs, commits, branches</text><text x="379.5" y="540" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">events, tasks, grants</text></g><g><rect x="514" y="480" width="205" height="72" rx="8" fill-opacity="0.12" stroke-width="2" stroke-dasharray="none" style="fill:var(--chart-categorical-1);stroke:var(--chart-categorical-1)"></rect><text x="616.5" y="504" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Bucket, via Go Cloud</text><text x="616.5" y="524" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">Git packs, job logs</text><text x="616.5" y="540" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">uploads, artifacts</text></g></svg>
