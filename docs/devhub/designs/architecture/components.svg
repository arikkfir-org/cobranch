e-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="501" rx="8"/><defs><marker id="d12-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="d12-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="d12-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="d12-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="d12-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="12" y="96" width="736" height="240" rx="10" class="group"/><text x="734" y="326" text-anchor="end" class="t-note">DevHub workloads: stateless, any replica takes any work</text><path d="M100 56L100 132" class="edge" marker-end="url(#d12-a)"/><text x="108" y="98" text-anchor="start" class="t-label">pages</text><path d="M190 56L190 76L330 76L330 132" class="edge" marker-end="url(#d12-a)"/><text x="260" y="70" text-anchor="middle" class="t-label">REST, GraphQL</text><path d="M410 56L410 132" class="edge" marker-end="url(#d12-a)"/><text x="418" y="98" text-anchor="start" class="t-label">REST</text><path d="M630 56L630 132" class="edge" marker-end="url(#d12-a)"/><text x="638" y="98" text-anchor="start" class="t-label">HTTPS, SSH</text><path d="M486 168L524 168" class="edge" marker-end="url(#d12-a)"/><path d="M630 204L630 236" class="edge" marker-end="url(#d12-a)"/><text x="638" y="224" text-anchor="start" class="t-label">waits for commit</text><path d="M130 308L130 380" class="edge" marker-end="url(#d12-a)"/><text x="138" y="348" text-anchor="start" class="t-label">creates pods</text><path d="M380 336L380 374" class="edge" marker-end="url(#d12-a)"/><path d="M630 336L630 374" class="edge" marker-end="url(#d12-a)"/><g><rect x="24" y="16" width="212" height="40" rx="8" class="box"/><text x="130" y="40.5" text-anchor="middle" class="t-title">Browser</text></g><g><rect x="274" y="16" width="212" height="40" rx="8" class="box"/><text x="380" y="40.5" text-anchor="middle" class="t-title">SDK, script or agent</text></g><g><rect x="524" y="16" width="212" height="40" rx="8" class="box"/><text x="630" y="40.5" text-anchor="middle" class="t-title">Git client</text></g><g><rect x="24" y="132" width="212" height="72" rx="8" class="box"/><text x="130" y="156.5" text-anchor="middle" class="t-title">Console, Back-office</text><text x="130" y="174.5" text-anchor="middle" class="t-body">Caddy, static files</text><text x="130" y="190.5" text-anchor="middle" class="t-body">the browser runs them</text></g><g><rect x="274" y="132" width="212" height="72" rx="8" class="box"/><text x="380" y="156.5" text-anchor="middle" class="t-title">API server</text><text x="380" y="174.5" text-anchor="middle" class="t-body">REST, GraphQL, subscriptions</text><text x="380" y="190.5" text-anchor="middle" class="t-body">sign-in, uploads, job logs</text></g><g><rect x="524" y="132" width="212" height="72" rx="8" class="box"/><text x="630" y="156.5" text-anchor="middle" class="t-title">Git server</text><text x="630" y="174.5" text-anchor="middle" class="t-body">Git over HTTPS and SSH</text><text x="630" y="190.5" text-anchor="middle" class="t-body">a pack cache on local disk</text></g><g><rect x="24" y="236" width="212" height="72" rx="8" class="box"/><text x="130" y="260.5" text-anchor="middle" class="t-title">Controller</text><text x="130" y="278.5" text-anchor="middle" class="t-body">jobs, agents, webhooks, cron</text><text x="130" y="294.5" text-anchor="middle" class="t-body">the only one that makes pods</text></g><g><rect x="274" y="236" width="212" height="72" rx="8" class="box"/><text x="380" y="260.5" text-anchor="middle" class="t-title">Maintenance CronJob</text><text x="380" y="278.5" text-anchor="middle" class="t-body">compacts packs hourly</text><text x="380" y="294.5" text-anchor="middle" class="t-body">deletes expired data</text></g><g><rect x="524" y="236" width="212" height="72" rx="8" class="box"/><text x="630" y="260.5" text-anchor="middle" class="t-title">Push worker</text><text x="630" y="278.5" text-anchor="middle" class="t-body">one transaction per push</text><text x="630" y="294.5" text-anchor="middle" class="t-body">the only writer of refs</text></g><g><rect x="24" y="380" width="212" height="72" rx="8" class="box dashed"/><text x="130" y="404.5" text-anchor="middle" class="t-title">Job and agent pods</text><text x="130" y="422.5" text-anchor="middle" class="t-body">in their own namespaces</text><text x="130" y="438.5" text-anchor="middle" class="t-body">call back with their token</text></g><g><path d="M274 380 a106 6 0 0 1 212 0 v68 a106 6 0 0 1 -212 0 z" class="box tone-accent"/><path d="M274 380 a106 6 0 0 0 212 0" class="rim tone-accent"/><text x="380" y="404" text-anchor="middle" class="t-title">PostgreSQL</text><text x="380" y="420" text-anchor="middle" class="t-body">refs, commits, branches</text><text x="380" y="436" text-anchor="middle" class="t-body">events, tasks, grants</text></g><g><path d="M524 380 a106 6 0 0 1 212 0 v68 a106 6 0 0 1 -212 0 z" class="box tone-accent"/><path d="M524 380 a106 6 0 0 0 212 0" class="rim tone-accent"/><text x="630" y="404" text-anchor="middle" class="t-title">Bucket, via Go Cloud</text><text x="630" y="420" text-anchor="middle" class="t-body">Git packs, job logs</text><text x="630" y="436" text-anchor="middle" class="t-body">uploads, artifacts</text></g></svg>
