title">Browser</text><text x="106" y="48.5" text-anchor="middle" class="t-body">Console or Back-office</text></g><g><rect x="16" y="72" width="180" height="52" rx="8" class="box"/><text x="106" y="94.5" text-anchor="middle" class="t-title">Git over HTTPS</text><text x="106" y="112.5" text-anchor="middle" class="t-body">and the command line</text></g><g><rect x="16" y="144" width="180" height="40" rx="8" class="box"/><text x="106" y="168.5" text-anchor="middle" class="t-title">Git over SSH</text></g><g><rect x="16" y="200" width="180" height="52" rx="8" class="box"/><text x="106" y="222.5" text-anchor="middle" class="t-title">Script, SDK</text><text x="106" y="240.5" text-anchor="middle" class="t-body">or an outside agent</text></g><g><rect x="16" y="264" width="180" height="52" rx="8" class="box"/><text x="106" y="286.5" text-anchor="middle" class="t-title">OAuth app</text><text x="106" y="304.5" text-anchor="middle" class="t-body">a later slice</text></g><g><rect x="16" y="328" width="180" height="52" rx="8" class="box"/><text x="106" y="350.5" text-anchor="middle" class="t-title">Workload elsewhere</text><text x="106" y="368.5" text-anchor="middle" class="t-body">on another platform</text></g><g><rect x="16" y="392" width="180" height="52" rx="8" class="box"/><text x="106" y="414.5" text-anchor="middle" class="t-title">Job or agent run</text><text x="106" y="432.5" text-anchor="middle" class="t-body">inside DevHub</text></g><g><rect x="470" y="46" width="150" height="40" rx="8" class="box"/><text x="545" y="70.5" text-anchor="middle" class="t-title">A user</text></g><g><rect x="470" y="144" width="150" height="40" rx="8" class="box"/><text x="545" y="168.5" text-anchor="middle" class="t-title">The key’s principal</text></g><g><rect x="470" y="206" width="150" height="40" rx="8" class="box"/><text x="545" y="230.5" text-anchor="middle" class="t-title">An API key</text></g><g><rect x="470" y="264" width="150" height="52" rx="8" class="box"/><text x="545" y="286.5" t