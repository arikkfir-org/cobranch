<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 856" role="img" aria-label="The Git client sends the pack; the Git server quarantines it, builds the manifest, uploads the pack and waits while the push worker commits one transaction; then the client returns"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="855" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V814" class="lifeline"/><path d="M187.3 46 V814" class="lifeline"/><path d="M310.5 46 V814" class="lifeline"/><path d="M433.8 46 V814" class="lifeline"/><path d="M557 46 V814" class="lifeline"/><path d="M680.3 46 V814" class="lifeline"/><rect x="182.3" y="487" width="10" height="279" rx="2" class="activation"/><text x="125.6" y="62" text-anchor="middle" class="t-label">1. connect over</text><text x="125.6" y="76" text-anchor="middle" class="t-label">HTTPS or SSH</text><path d="M64 82 H186.3" class="edge" marker-end="url(#dg-a)"/><text x="201.3" y="112" text-anchor="start" class="t-label">2. authenticate; check write permission before</text><text x="201.3" y="126" text-anchor="start" class="t-label">reading a byte of the pack</text><path d="M187.3 134 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="125.6" y="164" text-anchor="middle" class="t-label">3. the pack and the</text><text x="125.6" y="178" text-anchor="middle" class="t-label">ref updates</text><path d="M64 184 H186.3" class="edge" marker-end="url(#dg-a)"/><text x="201.3" y="214" text-anchor="start" class="t-label">4. <tspan class="mono">receive-pack</tspan> quarantines the pack;</text><text x="201.3" y="228" text-anchor="start" class="t-label"><tspan class="mono">index-pack --fix-thin</tspan> completes it</text><path d="M187.3 236 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="201.3" y="268" text-anchor="start" class="t-label">5. the pre-receive hook builds the manifest</text><path d="M187.3 276 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><rect x="83.9" y="300" width="330" height="87" rx="6" class="note"/><text x="95.9" y="317" text-anchor="start" class="t-body">The manifest: the ref updates; the new commits with</text><text x="95.9" y="332" text-anchor="start" class="t-body">their metadata and signatures; each updated tip’s</text><text x="95.9" y="347" text-anchor="start" class="t-body">/devhub.yaml; and the graph facts that need the</text><text x="95.9" y="362" text-anchor="start" class="t-body">objects: which branches contain their base, which</text><text x="95.9" y="377" text-anchor="start" class="t-body">merged into an updated base, ahead and behind counts.</text><text x="248.9" y="409" text-anchor="middle" class="t-label">6. upload the</text><text x="248.9" y="423" text-anchor="middle" class="t-label">quarantined pack</text><path d="M187.3 429 H309.5" class="edge" marker-end="url(#dg-a)"/><text x="310.5" y="457" text-anchor="middle" class="t-label">7. the manifest and a push ID, then wait</text><path d="M187.3 463 H432.8" class="edge" marker-end="url(#dg-a)"/><text x="495.4" y="491" text-anchor="middle" class="t-label">8. one transaction</text><path d="M433.8 497 H556" class="edge" marker-end="url(#dg-a)"/><rect x="364" y="519" width="380" height="117" rx="6" class="note tone-accent"/><text x="376" y="536" text-anchor="start" class="t-body">Move every ref by compare-and-swap on its old SHA; list the</text><text x="376" y="551" text-anchor="start" class="t-body">pack; insert the commits and the push; check signatures; map</text><text x="376" y="566" text-anchor="start" class="t-body">authors to principals; create or move branches and recompute</text><text x="376" y="581" text-anchor="start" class="t-body">their status; a pending annotation for each job the new tips</text><text x="376" y="596" text-anchor="start" class="t-body">declare; mark merged branches Merged, the pusher merging;</text><text x="376" y="611" text-anchor="start" class="t-body">apply /devhub.yaml when the default branch changed it; append</text><text x="376" y="626" text-anchor="start" class="t-body">events and tasks; NOTIFY.</text><text x="495.4" y="658" text-anchor="middle" class="t-label">9. committed</text><path d="M557 664 H434.8" class="edge dashed" marker-end="url(#dg-a)"/><text x="618.6" y="692" text-anchor="middle" class="t-label">10. NOTIFY:</text><text x="618.6" y="706" text-anchor="middle" class="t-label">Consoles update</text><path d="M557 712 H679.3" class="edge dashed" marker-end="url(#dg-a)"/><text x="310.5" y="740" text-anchor="middle" class="t-label">11. ok</text><path d="M433.8 746 H188.3" class="edge dashed" marker-end="url(#dg-a)"/><text x="125.6" y="774" text-anchor="middle" class="t-label">12. push accepted</text><path d="M187.3 780 H65" class="edge dashed" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Git client</text><rect x="139.3" y="12" width="96" height="34" rx="8" class="box"/><text x="187.3" y="33.5" text-anchor="middle" class="t-title">Git server</text><rect x="262.5" y="12" width="96" height="34" rx="8" class="box"/><text x="310.5" y="33.5" text-anchor="middle" class="t-title">Bucket</text><rect x="382.9" y="12" width="101.8" height="34" rx="8" class="box tone-accent"/><text x="433.8" y="33.5" text-anchor="middle" class="t-title">Push worker</text><rect x="507.9" y="12" width="98.2" height="34" rx="8" class="box"/><text x="557" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="616.5" y="12" width="127.5" height="34" rx="8" class="box"/><text x="680.3" y="33.5" text-anchor="middle" class="t-title">GraphQL servers</text></svg>
