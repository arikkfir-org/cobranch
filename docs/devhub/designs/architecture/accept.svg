<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 608" role="img" aria-label="A client may not push under devhub/; a push into a branch with merge requirements is accepted only if every new commit is in a Ready branch, or the pusher holds repo.bypass"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="607" rx="8"/><defs><marker id="d23-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="d23-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="d23-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="d23-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="d23-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M300 42L300 70" class="edge" marker-end="url(#d23-a)"/><path d="M460 108L520 108" class="edge" marker-end="url(#d23-a)"/><text x="490" y="100" text-anchor="middle" class="t-label">yes</text><path d="M300 146L300 180" class="edge" marker-end="url(#d23-a)"/><text x="308" y="167" text-anchor="start" class="t-label">no</text><path d="M300 256L300 290" class="edge" marker-end="url(#d23-a)"/><text x="308" y="277" text-anchor="start" class="t-label">yes</text><path d="M300 376L300 410" class="edge" marker-end="url(#d23-a)"/><text x="308" y="397" text-anchor="start" class="t-label">no</text><path d="M300 486L300 520" class="edge" marker-end="url(#d23-a)"/><text x="308" y="507" text-anchor="start" class="t-label">yes</text><path d="M460 448L520 448" class="edge" marker-end="url(#d23-a)"/><text x="490" y="440" text-anchor="middle" class="t-label">no</text><path d="M140 218L60 218L60 540L220 540" class="edge" marker-end="url(#d23-a)"/><text x="100" y="210" text-anchor="middle" class="t-label">no</text><path d="M100 333L60 333" class="edge"/><text x="80" y="325" text-anchor="middle" class="t-label">yes</text><g><rect x="250" y="12" width="100" height="30" rx="15" class="box"/><text x="300" y="31.5" text-anchor="middle" class="t-title">A push</text></g><g><polygon points="300,70 460,108 300,146 140,108" class="box"/><text x="300" y="105" text-anchor="middle" class="t-title">A client pushing a ref</text><text x="300" y="120" text-anchor="middle" class="t-body">under <tspan class="mono">devhub/</tspan>?</text></g><g><rect x="520" y="82" width="224" height="52" rx="8" class="box tone-danger"/><text x="632" y="104.5" text-anchor="middle" class="t-title">Rejected</text><text x="632" y="122.5" text-anchor="middle" class="t-body">only DevHub writes <tspan class="mono">devhub/</tspan></text></g><g><polygon points="300,180 460,218 300,256 140,218" class="box"/><text x="300" y="215" text-anchor="middle" class="t-title">Into a branch with</text><text x="300" y="230" text-anchor="middle" class="t-body">merge requirements?</text></g><g><polygon points="300,290 500,333 300,376 100,333" class="box"/><text x="300" y="330" text-anchor="middle" class="t-title">Is every new commit, but merges,</text><text x="300" y="345" text-anchor="middle" class="t-body">in a Ready branch based on it?</text></g><g><polygon points="300,410 460,448 300,486 140,448" class="box"/><text x="300" y="445" text-anchor="middle" class="t-title">Does the pusher hold</text><text x="300" y="460" text-anchor="middle" class="t-body"><tspan class="mono">repo.bypass</tspan>?</text></g><g><rect x="520" y="422" width="224" height="52" rx="8" class="box tone-danger"/><text x="632" y="444.5" text-anchor="middle" class="t-title">Rejected</text><text x="632" y="462.5" text-anchor="middle" class="t-body">naming the requirement</text></g><g><rect x="220" y="520" width="160" height="40" rx="8" class="box tone-success"/><text x="300" y="544.5" text-anchor="middle" class="t-title">Accepted</text></g></svg>
