<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="A push returns only after PostgreSQL commits it" font-size="13"><style>svg{--text-primary:#1a1d20;--text-secondary:#6b737b;--chart-axis:#8a939b;--chart-grid:#e4e7ea;--chart-categorical-1:#3b6ef0;--chart-reference-tint:#eceef0;font-family:Inter,system-ui,sans-serif}@media (prefers-color-scheme: dark){svg{--text-primary:#f8f9fa;--text-secondary:#b4bcc2;--chart-axis:#8a939b;--chart-grid:#2e3338;--chart-categorical-1:#5a8df7;--chart-reference-tint:#2e3338}}</style><defs><marker id="push-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" style="fill:var(--text-primary)">A push returns only after PostgreSQL commits it</text><g stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--chart-grid)"><line x1="80" y1="88" x2="80" y2="516"></line><line x1="240" y1="88" x2="240" y2="516"></line><line x1="400" y1="88" x2="400" y2="244"></line><line x1="540" y1="88" x2="540" y2="312"></line><line x1="540" y1="396" x2="540" y2="516"></line><line x1="672" y1="88" x2="672" y2="312"></line><line x1="672" y1="396" x2="672" y2="516"></line></g><g><rect x="236" y="264" width="8" height="196" stroke-width="1" style="fill:var(--chart-reference-tint);stroke:var(--chart-axis)"></rect></g><g><rect x="24" y="52" width="112" height="36" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="80" y="74" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Git client</text></g><g><rect x="184" y="52" width="112" height="36" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="240" y="74" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Git server</text></g><g><rect x="344" y="52" width="112" height="36" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="400" y="74" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Bucket</text></g><g><rect x="484" y="52" width="112" height="36" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="540" y="74" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">Push worker</text></g><g><rect x="616" y="52" width="112" height="36" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"></rect><text x="672" y="74" text-anchor="middle" font-weight="600" style="fill:var(--text-primary)">PostgreSQL</text></g><g fill="none" stroke-width="1.25" style="stroke:var(--chart-axis)"><path d="M80 120H240" marker-end="url(#push-arrow)"></path><path d="M240 144h12v16h-12" marker-end="url(#push-arrow)"></path><path d="M240 176h12v16h-12" marker-end="url(#push-arrow)"></path><path d="M240 224H400" marker-end="url(#push-arrow)"></path><path d="M244 264H540" marker-end="url(#push-arrow)"></path><path d="M540 296H672" marker-end="url(#push-arrow)"></path></g><g fill="none" stroke-width="1.25" stroke-dasharray="5 4" style="stroke:var(--chart-axis)"><path d="M672 428H540" marker-end="url(#push-arrow)"></path><path d="M540 460H244" marker-end="url(#push-arrow)"></path><path d="M240 492H80" marker-end="url(#push-arrow)"></path></g><text x="160" y="112" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">1. pack and ref updates</text><text x="258" y="156" font-size="11.5" style="fill:var(--text-primary)">2. quarantine pack</text><text x="258" y="188" font-size="11.5" style="fill:var(--text-primary)">3. build manifest</text><text x="320" y="216" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">4. upload the pack</text><text x="390" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">5. manifest, push ID; waits</text><text x="606" y="288" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">6. one transaction</text><g><rect x="476" y="312" width="260" height="84" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--chart-categorical-1);stroke:var(--chart-categorical-1)"></rect><text x="606" y="334" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">moves every ref by compare-and-swap</text><text x="606" y="350" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">lists the pack, inserts the commits</text><text x="606" y="366" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">updates branches and their status</text><text x="606" y="382" text-anchor="middle" font-size="11.5" style="fill:var(--text-primary)">queues events and tasks, NOTIFY</text></g><text x="606" y="420" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">committed</text><text x="390" y="452" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">7. ok</text><text x="160" y="484" text-anchor="middle" font-size="11.5" style="fill:var(--text-secondary)">7. push accepted</text></svg>
