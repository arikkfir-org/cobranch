<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 348" role="img" aria-label="The operator brings the cluster, the domain, ingress, SSH exposure and autoscaling; the chart installs the Console, the Back-office, the API server, the Git server, the push worker, the controller and the maintenance CronJob; the controller creates job and agent pods; state lives in PostgreSQL and blob storage"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="347" rx="8"/><defs><marker id="d9-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="d9-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="d9-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="d9-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="d9-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="292" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">The operator brings the cluster, the domain and ingress, SSH exposure and autoscaling</text><rect x="24" y="40" width="712" height="152" rx="10" class="group tone-surface"/><text x="38" y="60" text-anchor="start" class="t-group">The DevHub chart installs</text><path d="M638 112L638 128" class="edge" marker-end="url(#d9-a)"/><text x="646" y="124" text-anchor="start" class="t-label">waits for</text><path d="M120 168L120 220" class="edge" marker-end="url(#d9-a)"/><text x="128" y="204" text-anchor="start" class="t-label">creates</text><g><rect x="40" y="72" width="160" height="40" rx="8" class="box"/><text x="120" y="96.5" text-anchor="middle" class="t-title">Console</text></g><g><rect x="212" y="72" width="160" height="40" rx="8" class="box"/><text x="292" y="96.5" text-anchor="middle" class="t-title">Back-office</text></g><g><rect x="384" y="72" width="160" height="40" rx="8" class="box tone-accent"/><text x="464" y="96.5" text-anchor="middle" class="t-title">API server</text></g><g><rect x="556" y="72" width="164" height="40" rx="8" class="box"/><text x="638" y="96.5" text-anchor="middle" class="t-title">Git server</text></g><g><rect x="556" y="128" width="164" height="40" rx="8" class="box"/><text x="638" y="152.5" text-anchor="middle" class="t-title">Push worker</text></g><g><rect x="40" y="128" width="160" height="40" rx="8" class="box"/><text x="120" y="152.5" text-anchor="middle" class="t-title">Controller</text></g><g><rect x="212" y="128" width="332" height="40" rx="8" class="box"/><text x="378" y="152.5" text-anchor="middle" class="t-title">Maintenance CronJob</text></g><g><rect x="40" y="220" width="160" height="52" rx="8" class="box dashed"/><text x="120" y="242.5" text-anchor="middle" class="t-title">Job pods</text><text x="120" y="260.5" text-anchor="middle" class="t-body">made at run time</text></g><g><rect x="212" y="220" width="160" height="52" rx="8" class="box tone-ai dashed"/><text x="292" y="242.5" text-anchor="middle" class="t-title">Agent pods</text><text x="292" y="260.5" text-anchor="middle" class="t-body">made at run time</text></g><g><path d="M384 214 a80 6 0 0 1 160 0 v64 a80 6 0 0 1 -160 0 z" class="box"/><path d="M384 214 a80 6 0 0 0 160 0" class="rim"/><text x="464" y="238" text-anchor="middle" class="t-title">PostgreSQL</text><text x="464" y="254" text-anchor="middle" class="t-body">the chart’s, or yours</text></g><g><path d="M556 214 a82 6 0 0 1 164 0 v64 a82 6 0 0 1 -164 0 z" class="box"/><path d="M556 214 a82 6 0 0 0 164 0" class="rim"/><text x="638" y="238" text-anchor="middle" class="t-title">Blob storage</text><text x="638" y="254" text-anchor="middle" class="t-body">any, through Go Cloud</text></g></svg>
