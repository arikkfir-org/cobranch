rker-end="url(#dg-a)"/><g><rect x="120" y="16" width="220" height="44" rx="8" class="box"/><text x="230" y="34.5" text-anchor="middle" class="t-title">A pull request</text><text x="230" y="52.5" text-anchor="middle" class="t-body">whatever its base</text></g><g><rect x="420" y="16" width="220" height="44" rx="8" class="box"/><text x="530" y="42.5" text-anchor="middle" class="t-title">A merge queue group</text></g><g><rect x="24" y="128" width="146" height="48" rx="8" class="box"/><text x="97" y="148.5" text-anchor="middle" class="t-title"><tspan class="mono">clone</tspan></text><text x="97" y="166.5" text-anchor="middle" class="t-body">anonymous fetch</text></g><g><rect x="24" y="184" width="146" height="48" rx="8" class="box"/><text x="97" y="204.5" text-anchor="middle" class="t-title"><tspan class="mono">generated</tspan></text><text x="97" y="222.5" text-anchor="middle" class="t-body">stubs current</text></g><g><rect x="24" y="240" width="146" height="48" rx="8" class="box"/><text x="97" y="260.5" text-anchor="middle" class="t-title"><tspan class="mono">build</tspan></text><text x="97" y="278.5" text-anchor="middle" class="t-body">static binary</text></g><g><rect x="24" y="296" width="146" height="48" rx="8" class="box"/><text x="97" y="316.5" text-anchor="middle" class="t-title"><tspan class="mono">version</tspan></text><text x="97" y="334.5" text-anchor="middle" class="t-body">cobranch version</text></g><g><rect x="210" y="128" width="146" height="48" rx="8" class="box"/><text x="283" y="148.5" text-anchor="middle" class="t-title"><tspan class="mono">clone</tspan></text><text x="283" y="166.5" text-anchor="middle" class="t-body">anonymous fetch</text></g><g><rect x="210" y="184" width="146" height="48" rx="8" class="box"/><text x="283" y="204.5" text-anchor="middle" class="t-title"><tspan class="mono">lint</tspan></text><text x="283" y="222.5" text-anchor="middle" class="t-body">house linters</text></g><g><rect x="210" y="240" width="146" height="48" rx="8" class="box"/><text x="283" y="260.5" text-anchor="middle" class="t-title"><tspan class="mono">vet</tspan></text><text x="283" y="278.5" text-anchor="middle" class="t-body">go vet</text></g><g><rect x="396" y="128" width="146" height="48" rx="8" class="box"/><text x="469" y="148.5" text-anchor="middle" class="t-title"><tspan class="mono">clone</tspan></text><text x="469" y="166.5" text-anchor="middle" class="t-body">anonymous fetch</text></g><g><rect x="396" y="184" width="146" height="48" rx="8" class="box"/><text x="469" y="204.5" text-anchor="middle" class="t-title"><tspan class="mono">test</tspan></text><text x="469" y="222.5" text-anchor="middle" class="t-body">go test -race</text></g><g><path d="M396 254 a73 6 0 0 1 146 0 v66 a73 6 0 0 1 -146 0 z" class="box"/><path d="M396 254 a73 6 0 0 0 146 0" class="rim"/><text x="469" y="278" text-anchor="middle" class="t-title">PostgreSQL 18</text><text x="469" y="294" text-anchor="middle" class="t-body">sidecar: a database</text><text x="469" y="310" text-anchor="middle" class="t-body">per test</text></g><g><rect x="582" y="128" width="146" height="48" rx="8" class="box"/><text x="655" y="148.5" text-anchor="middle" class="t-title"><tspan class="mono">clone</tspan></text><text x="655" y="166.5" text-anchor="middle" class="t-body">anonymous fetch</text></g><g><rect x="582" y="184" width="146" height="76" rx="8" class="box"/><text x="655" y="210.5" text-anchor="middle" class="t-title">Ten more steps</text><text x="655" y="228.5" text-anchor="middle" class="t-body">images, a kind cluster,</text><text x="655" y="244.5" text-anchor="middle" class="t-body">install, test, upgrade</text></g><g><path d="M582 278 a73 6 0 0 1 146 0 v44 a73 6 0 0 1 -146 0 z" class="box"/><path d="M582 278 a73 6 0 0 0 146 0" class="rim"/><text x="655" y="302" text-anchor="middle" class="t-title"><tspan class="mono">dockerd</tspan></text><text x="655" y="318" text-anchor="middle" class="t-body">sidecar, privileged</text></g><g><rect x="284" y="392" width