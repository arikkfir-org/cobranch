<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 572" role="img" aria-label="The owner publishes a GitHub release, which creates tag v1.2.3; Octomaton reads pipeline tag at main and runs it as ci-cobranch-release; its steps, run from a checkout of main, refuse a tag that is not a version, a commit not on main or one whose chart defaults to other images, wait for main’s images of the commit, add tag 1.2.3 to cobranch and cobranch-console, then package the commit’s chart at 1.2.3, its app version the same, and push it as charts/cobranch; an operator installs that chart, which pulls the images tagged 1.2.3"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="571" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V530" class="lifeline"/><path d="M190.4 46 V530" class="lifeline"/><path d="M316.8 46 V530" class="lifeline"/><path d="M443.2 46 V530" class="lifeline"/><path d="M569.6 46 V530" class="lifeline"/><path d="M696 46 V530" class="lifeline"/><rect x="438.2" y="202" width="10" height="208" rx="2" class="activation"/><text x="127.2" y="62" text-anchor="middle" class="t-label">publish release</text><text x="127.2" y="76" text-anchor="middle" class="t-label">1.2.3: tag <tspan class="mono">v1.2.3</tspan></text><path d="M64 82 H189.4" class="edge" marker-end="url(#dg-a)"/><text x="253.6" y="110" text-anchor="middle" class="t-label">push</text><text x="253.6" y="124" text-anchor="middle" class="t-label"><tspan class="mono">refs/tags/v1.2.3</tspan></text><path d="M190.4 130 H315.8" class="edge" marker-end="url(#dg-a)"/><text x="380" y="158" text-anchor="middle" class="t-label">run <tspan class="mono">tag</tspan>, read at</text><text x="380" y="172" text-anchor="middle" class="t-label"><tspan class="mono">main</tspan></text><path d="M316.8 178 H442.2" class="edge" marker-end="url(#dg-a)"/><text x="457.2" y="208" text-anchor="start" class="t-label">a version, on <tspan class="mono">main</tspan>, its chart ours? or fail</text><path d="M443.2 216 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="506.4" y="246" text-anchor="middle" class="t-label">wait for</text><text x="506.4" y="260" text-anchor="middle" class="t-label"><tspan class="mono">cobranch:abc1234</tspan></text><text x="506.4" y="274" text-anchor="middle" class="t-label">and the Console’s</text><path d="M443.2 280 H568.6" class="edge" marker-end="url(#dg-a)"/><text x="506.4" y="308" text-anchor="middle" class="t-label">tag both <tspan class="mono">1.2.3</tspan>,</text><text x="506.4" y="322" text-anchor="middle" class="t-label">rebuilding nothing</text><path d="M443.2 328 H568.6" class="edge" marker-end="url(#dg-a)"/><text x="506.4" y="356" text-anchor="middle" class="t-label">push the commit’s</text><text x="506.4" y="370" text-anchor="middle" class="t-label">chart as</text><text x="506.4" y="384" text-anchor="middle" class="t-label"><tspan class="mono">charts/cobranch:1.2.3</tspan></text><path d="M443.2 390 H568.6" class="edge" marker-end="url(#dg-a)"/><text x="632.8" y="418" text-anchor="middle" class="t-label"><tspan class="mono">helm install …</tspan></text><text x="632.8" y="432" text-anchor="middle" class="t-label">--version 1.2.3<tspan class="mono"></tspan></text><path d="M696 438 H570.6" class="edge" marker-end="url(#dg-a)"/><rect x="256.8" y="460" width="372.8" height="42" rx="6" class="note"/><text x="268.8" y="477" text-anchor="start" class="t-body">Every script comes from a checkout of <tspan class="mono">main</tspan>: a tag can name</text><text x="268.8" y="492" text-anchor="start" class="t-body">any commit, whose files are only data here.</text><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">The owner</text><rect x="142.4" y="12" width="96" height="34" rx="8" class="box"/><text x="190.4" y="33.5" text-anchor="middle" class="t-title">GitHub</text><rect x="268.8" y="12" width="96" height="34" rx="8" class="box"/><text x="316.8" y="33.5" text-anchor="middle" class="t-title">Octomaton</text><rect x="394.8" y="12" width="96.7" height="34" rx="8" class="box tone-accent"/><text x="443.2" y="33.5" text-anchor="middle" class="t-title">Pipeline tag</text><rect x="506.8" y="12" width="125.6" height="34" rx="8" class="box"/><text x="569.6" y="33.5" text-anchor="middle" class="t-title">Artifact Registry</text><rect x="648" y="12" width="96" height="34" rx="8" class="box"/><text x="696" y="33.5" text-anchor="middle" class="t-title">An operator</text></svg>
