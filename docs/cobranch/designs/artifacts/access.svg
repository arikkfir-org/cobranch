<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 428" role="img" aria-label="The permissions a principal holds on an artifact are the union of the artifact permissions its roles give through grants on the artifact, on its owner (everyone holds list and read on themselves), on the repository it is attached to and at its organization for an attached artifact, and of the artifact’s audience: the repository’s readers, holding repo.read there, get view or edit, and the organization’s members, holding org.read there, get view or edit. The request’s credential then narrows the union: a personal token to the permissions it lists, a task token to those the task’s assigner holds too"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="427" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M101 68L101 84L340 84L340 188" class="edge" marker-end="url(#dg-a)"/><path d="M287 68L287 78L365 78L365 188" class="edge" marker-end="url(#dg-a)"/><path d="M473 68L473 78L395 78L395 188" class="edge" marker-end="url(#dg-a)"/><path d="M659 68L659 84L420 84L420 188" class="edge" marker-end="url(#dg-a)"/><path d="M166 168L166 206L230 206" class="edge" marker-end="url(#dg-a)"/><path d="M594 168L594 206L530 206" class="edge" marker-end="url(#dg-a)"/><path d="M380 224L380 252" class="edge" marker-end="url(#dg-a)"/><path d="M380 316L380 344" class="edge" marker-end="url(#dg-a)"/><g><rect x="16" y="16" width="170" height="52" rx="8" class="box tone-accent"/><text x="101" y="38.5" text-anchor="middle" class="t-title">On the artifact</text><text x="101" y="56.5" text-anchor="middle" class="t-body">viewer, editor, owner</text></g><g><rect x="202" y="16" width="170" height="52" rx="8" class="box"/><text x="287" y="38.5" text-anchor="middle" class="t-title">On its owner</text><text x="287" y="56.5" text-anchor="middle" class="t-body">lister, viewer; oneself</text></g><g><rect x="388" y="16" width="170" height="52" rx="8" class="box"/><text x="473" y="38.5" text-anchor="middle" class="t-title">On its repository</text><text x="473" y="56.5" text-anchor="middle" class="t-body">if attached</text></g><g><rect x="574" y="16" width="170" height="52" rx="8" class="box"/><text x="659" y="38.5" text-anchor="middle" class="t-title">At its organization</text><text x="659" y="56.5" text-anchor="middle" class="t-body">if attached</text></g><g><rect x="16" y="100" width="300" height="68" rx="8" class="box"/><text x="166" y="122.5" text-anchor="middle" class="t-title">Audience · repository</text><text x="166" y="140.5" text-anchor="middle" class="t-body">view or edit, to whoever holds</text><text x="166" y="156.5" text-anchor="middle" class="t-body"><tspan class="mono">repo.read</tspan> on its repository</text></g><g><rect x="444" y="100" width="300" height="68" rx="8" class="box"/><text x="594" y="122.5" text-anchor="middle" class="t-title">Audience · organization</text><text x="594" y="140.5" text-anchor="middle" class="t-body">view or edit, to whoever holds</text><text x="594" y="156.5" text-anchor="middle" class="t-body"><tspan class="mono">org.read</tspan> at its organization</text></g><g><rect x="230" y="188" width="300" height="36" rx="18" class="box"/><text x="380" y="210.5" text-anchor="middle" class="t-title">The union: list, read, write, manage</text></g><g><rect x="196" y="252" width="368" height="64" rx="8" class="box"/><text x="380" y="272.5" text-anchor="middle" class="t-title">Narrowed by the request’s credential</text><text x="380" y="290.5" text-anchor="middle" class="t-body">a personal token: what it lists</text><text x="380" y="306.5" text-anchor="middle" class="t-body">a task token: what its assigner holds too</text></g><g><rect x="230" y="344" width="300" height="36" rx="18" class="box tone-success"/><text x="380" y="366.5" text-anchor="middle" class="t-title">What the request may do</text></g></svg>
