<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 666" role="img" aria-label="A person asks an agent in a conversation; Ask starts a task. The harness gives the model the artifact tools; the model calls create_artifact with a title, a kind, a format and the body. The harness posts the artifact to the REST API with the task’s token, the call’s key as its ID, attached to the conversation’s repository if it has one, so a restarted pod creates nothing more. For an attached artifact the API checks artifacts.create on the repository for the agent and for the task’s assigner, then writes the artifact, its first version and its grants in one transaction: owned by the assigner, who holds Artifact owner, with Artifact editor to the agent, and both audiences none. The harness then posts a card into the task’s thread, which the pane shows; the person opens it"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="665" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V624" class="lifeline"/><path d="M274.3 46 V624" class="lifeline"/><path d="M484.6 46 V624" class="lifeline"/><path d="M694.9 46 V624" class="lifeline"/><rect x="4" y="288" width="750.9" height="308" rx="6" class="frame"/><path d="M4 308 H34 L42 300 V288" class="frame"/><text x="12" y="302.5" text-anchor="start" class="t-frame">alt</text><text x="50" y="302.5" text-anchor="start" class="t-label">both hold it</text><path d="M4 506 H754.9" class="frame dashed"/><text x="12" y="520.5" text-anchor="start" class="t-label">either lacks it</text><text x="169.1" y="62" text-anchor="middle" class="t-label">1. “@Builder write the release notes for</text><text x="169.1" y="76" text-anchor="middle" class="t-label">0.4”: a task, in this conversation</text><path d="M64 82 H273.3" class="edge" marker-end="url(#dg-a)"/><text x="288.3" y="112" text-anchor="start" class="t-label">2. the model calls <tspan class="mono">create_artifact</tspan>: title,</text><text x="288.3" y="126" text-anchor="start" class="t-label">kind, format, body</text><path d="M274.3 134 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="379.4" y="164" text-anchor="middle" class="t-label">3. <tspan class="mono">POST …/repos/{repo}/artifacts</tspan>, or</text><text x="379.4" y="178" text-anchor="middle" class="t-label"><tspan class="mono">…/artifacts</tspan> in an issue’s or the</text><text x="379.4" y="192" text-anchor="middle" class="t-label">organization’s conversation, with the task’s</text><text x="379.4" y="206" text-anchor="middle" class="t-label">token, the call’s key as its ID</text><path d="M274.3 212 H483.6" class="edge" marker-end="url(#dg-a)"/><text x="589.8" y="240" text-anchor="middle" class="t-label">4. <tspan class="mono">artifacts.create</tspan> on the repository, or</text><text x="589.8" y="254" text-anchor="middle" class="t-label"><tspan class="mono">org.read</tspan>: the agent’s, and its assigner’s</text><path d="M484.6 260 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="589.8" y="328" text-anchor="middle" class="t-label">5. one transaction: the artifact owned by the</text><text x="589.8" y="342" text-anchor="middle" class="t-label">assigner, version 1, Artifact owner to the</text><text x="589.8" y="356" text-anchor="middle" class="t-label">assigner, Artifact editor to the agent, private</text><path d="M484.6 362 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="379.4" y="390" text-anchor="middle" class="t-label">6. 201, the artifact</text><path d="M484.6 396 H275.3" class="edge dashed" marker-end="url(#dg-a)"/><text x="379.4" y="424" text-anchor="middle" class="t-label">7. post the card into the task’s thread</text><text x="379.4" y="438" text-anchor="middle" class="t-label">(<tspan class="mono">artifactId</tspan>)</text><path d="M274.3 444 H483.6" class="edge" marker-end="url(#dg-a)"/><text x="274.3" y="472" text-anchor="middle" class="t-label">8. the card, live in the pane</text><path d="M484.6 478 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="379.4" y="546" text-anchor="middle" class="t-label">9. 403: the model is told why, and says so</text><text x="379.4" y="560" text-anchor="middle" class="t-label">in the thread</text><path d="M484.6 566 H275.3" class="edge dashed tone-danger" marker-end="url(#dg-a-danger)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Person</text><rect x="226.3" y="12" width="96" height="34" rx="8" class="box tone-ai"/><text x="274.3" y="33.5" text-anchor="middle" class="t-title">Harness</text><rect x="436.6" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="484.6" y="33.5" text-anchor="middle" class="t-title">REST API</text><rect x="645.8" y="12" width="98.2" height="34" rx="8" class="box"/><text x="694.9" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text></svg>
