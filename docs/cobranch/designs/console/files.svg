<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 416" role="img" aria-label="Caddy serves the shell, index.html, for every path it has no file for, with the configuration and the names of the Console’s files written in, and the Console’s modules and stylesheets under /assets/@&lt;release&gt;/. The shell asks for every file at once and imports console.js, which starts the Console. Shared modules in assets/lib hold the router, the frames of an organization and a repository, the API client and what several pages draw. Each page is a module of its own: the three the router names, and under pages/org and pages/repo one per route, which lib/assets.js finds by the names the shell holds. A stylesheet beside a module holds its styles"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="415" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="104" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">Caddy serves, every file Cache-Control: no-cache</text><rect x="8" y="128" width="744" height="104" rx="10" class="group"/><text x="22" y="148" text-anchor="start" class="t-group">Shared modules</text><rect x="8" y="248" width="744" height="120" rx="10" class="group"/><text x="22" y="268" text-anchor="start" class="t-group">Pages</text><path d="M184 96L184 164" class="edge" marker-end="url(#dg-a)"/><text x="192" y="124" text-anchor="start" class="t-label">imports</text><path d="M298 164L298 136L626 136L626 96" class="edge" marker-end="url(#dg-a)"/><text x="420" y="130" text-anchor="middle" class="t-label">imports by name</text><path d="M478 216L478 284" class="edge" marker-end="url(#dg-a)"/><path d="M478 216L478 236L626 236L626 284" class="edge" marker-end="url(#dg-a)"/><path d="M478 216L478 236L134 236L134 284" class="edge" marker-end="url(#dg-a)"/><g><rect x="24" y="44" width="220" height="52" rx="8" class="box"/><text x="134" y="66.5" text-anchor="middle" class="t-title"><tspan class="mono">index.html</tspan>, the shell</text><text x="134" y="84.5" text-anchor="middle" class="t-body">every path without a file</text></g><g><rect x="270" y="44" width="220" height="52" rx="8" class="box"/><text x="380" y="66.5" text-anchor="middle" class="t-title">Written into the shell</text><text x="380" y="84.5" text-anchor="middle" class="t-body">configuration, files’ names</text></g><g><rect x="516" y="44" width="220" height="52" rx="8" class="box tone-accent"/><text x="626" y="66.5" text-anchor="middle" class="t-title"><tspan class="mono">/assets/@&lt;release&gt;/</tspan></text><text x="626" y="84.5" text-anchor="middle" class="t-body">its own release’s files</text></g><g><rect x="24" y="164" width="176" height="52" rx="8" class="box"/><text x="112" y="186.5" text-anchor="middle" class="t-title"><tspan class="mono">console.js</tspan></text><text x="112" y="204.5" text-anchor="middle" class="t-body">config, viewer, pages</text></g><g><rect x="216" y="164" width="164" height="52" rx="8" class="box tone-accent"/><text x="298" y="186.5" text-anchor="middle" class="t-title"><tspan class="mono">lib/assets.js</tspan></text><text x="298" y="204.5" text-anchor="middle" class="t-body">finds pages by name</text></g><g><rect x="396" y="164" width="164" height="52" rx="8" class="box"/><text x="478" y="186.5" text-anchor="middle" class="t-title"><tspan class="mono">lib/router.js</tspan></text><text x="478" y="204.5" text-anchor="middle" class="t-body">a path to its page</text></g><g><rect x="576" y="164" width="160" height="52" rx="8" class="box"/><text x="656" y="186.5" text-anchor="middle" class="t-title">Frames and parts</text><text x="656" y="204.5" text-anchor="middle" class="t-body">header, nav, tabs; API</text></g><g><rect x="24" y="284" width="220" height="68" rx="8" class="box"/><text x="134" y="306.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/*.js</tspan></text><text x="134" y="324.5" text-anchor="middle" class="t-body">sign-in, welcome, settings:</text><text x="134" y="340.5" text-anchor="middle" class="t-body">the router names them</text></g><g><rect x="270" y="284" width="220" height="68" rx="8" class="box tone-success"/><text x="380" y="306.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/org/&lt;part&gt;.js</tspan></text><text x="380" y="324.5" text-anchor="middle" class="t-body"><tspan class="mono">/acme/&lt;part&gt;/…</tspan></text><text x="380" y="340.5" text-anchor="middle" class="t-body"><tspan class="mono">index.js</tspan>: its home</text></g><g><rect x="516" y="284" width="220" height="68" rx="8" class="box tone-success"/><text x="626" y="306.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/repo/&lt;part&gt;.js</tspan></text><text x="626" y="324.5" text-anchor="middle" class="t-body"><tspan class="mono">/acme/website/&lt;part&gt;/…</tspan></text><text x="626" y="340.5" text-anchor="middle" class="t-body"><tspan class="mono">index.js</tspan>: its code</text></g></svg>
