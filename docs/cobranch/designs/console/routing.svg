></g><g><polygon points="161,112 266,152 161,192 56,152" class="box"/><text x="161" y="156.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/&lt;1st&gt;.js</tspan>?</text></g><g><polygon points="161,224 266,264 161,304 56,264" class="box"/><text x="161" y="268.5" text-anchor="middle" class="t-title">An organization?</text></g><g><polygon points="161,336 266,376 161,416 56,376" class="box"/><text x="161" y="380.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/org/&lt;2nd&gt;.js</tspan>?</text></g><g><polygon points="161,448 266,488 161,528 56,488" class="box"/><text x="161" y="492.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/repo/&lt;3rd&gt;.js</tspan>?</text></g><g><rect x="340" y="14" width="400" height="52" rx="8" class="box"/><text x="540" y="36.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/sign-in.js</tspan></text><text x="540" y="54.5" text-anchor="middle" class="t-body">every path, signed out</text></g><g><rect x="340" y="126" width="400" height="52" rx="8" class="box"/><text x="540" y="148.5" text-anchor="middle" class="t-title">That page, in the app shell</text><text x="540" y="166.5" text-anchor="middle" class="t-body"><tspan class="mono">settings.js</tspan>, <tspan class="mono">help.js</tspan>: a default export</text></g><g><rect x="340" y="238" width="400" height="52" rx="8" class="box"/><text x="540" y="260.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/welcome.js</tspan></text><text x="540" y="278.5" text-anchor="middle" class="t-body">no organization, or one of the Console’s own paths</text></g><g><rect x="340" y="342" width="400" height="68" rx="8" class="box tone-success"/><text x="540" y="372.5" text-anchor="middle" class="t-title">That page, in the app shell</text><text x="540" y="390.5" text-anchor="middle" class="t-body">if <tspan class="mono">allowed(can)</tspan>; else the organization’s home</text></g><g><rect x="340" y="454" width="400" height="68" rx="8" class="box tone-success"/><text x="540" y="476.5" text-anchor="middle" class="t-title">That page, in the repository’s frame</text><text x="540" y="494.5" text-anchor="middle" class="t-body">if <tspan class="mono">allowed(can)</tspan> and <tspan class="mono">accepts(rest)</tspan>;</text><text x="540" y="510.5" text-anchor="middle" class="t-body">else the repository’s root</text></g><g><rect x="340" y="560" width="400" height="52" rx="8" class="box"/><text x="540" y="582.5" text-anchor="middle" class="t-title"><tspan class="mono">pages/repo/index.js</tspan></text><text x="540" y="600.5" text-anchor="middle" class="t-body">the repository’s code, at its root</text></g></svg>
