e: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="327" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M236 50L258 50L258 94L280 94" class="edge" marker-end="url(#dg-a)"/><path d="M236 138L258 138L258 94L280 94" class="edge" marker-end="url(#dg-a)"/><path d="M400 94L444 94" class="edge" marker-end="url(#dg-a)"/><path d="M236 246L280 246" class="edge" marker-end="url(#dg-a)"/><text x="258" y="238" text-anchor="middle" class="t-label">holds</text><path d="M420 246L444 246" class="edge" marker-end="url(#dg-a)"/><path d="M126 212L126 196L594 196L594 136" class="edge dashed" marker-end="url(#dg-a)"/><text x="360" y="190" text-anchor="middle" class="t-label">acts as</text><g><rect x="16" y="16" width="220" height="68" rx="8" class="box"/><text x="126" y="38.5" text-anchor="middle" class="t-title">The job’s <tspan class="mono">permissions</tspan></text><text x="126" y="56.5" text-anchor="middle" class="t-body"><tspan class="mono">repo.read</tspan>, <tspan class="mono">annotations.write</tspan></text><text x="126" y="72.5" text-anchor="middle" class="t-body">by default</text></g><g><rect x="16" y="104" width="220" height="68" rx="8" class="box"/><text x="126" y="126.5" text-anchor="middle" class="t-title"><tspan class="mono">main</tspan>’s ceiling</text><text x="126" y="144.5" text-anchor="middle" class="t-body"><tspan class="mono">repository.jobs.ceiling</tspan>,</text><text x="126" y="160.5" text-anchor="middle" class="t-body">Automation by default</text></g><g><polygon points="340,58 400,94 340,130 280,94" class="box"/><text x="340" y="98.5" text-anchor="middle" class="t-title">both</text></g><g><rect x="444" y="52" width="300" height="84" rx="8" class="box tone-accent"/><text x="594" y="74.5" text-anchor="middle" class="t-title">The run’s token, <tspan class="mono">cbr_…</tspan></text><text x="594" y="92.5" text-anchor="middle" class="t-body">those permissions, on its repository,</text><text x="594" y="108.5" text-anchor="middle" class="t-body">for the run, at most 24 hours;</text><text x="594" y="124.5" text-anchor="middle" class="t-body">REST, GraphQL and Git accept it</text></g><g><rect x="16" y="212" width="220" height="68" rx="8" class="box"/><text x="126" y="234.5" text-anchor="middle" class="t-title">The job’s principal</text><text x="126" y="252.5" text-anchor="middle" class="t-body">kind <tspan class="mono">job</tspan>, one per name,</text><text x="126" y="268.5" text-anchor="middle" class="t-body">owned by the repository</text></g><g><rect x="280" y="212" width="140" height="68" rx="8" class="box"/><text x="350" y="234.5" text-anchor="middle" class="t-title">Secret reader</text><text x="350" y="252.5" text-anchor="middle" class="t-body">on the organization,</text><text x="350" y="268.5" text-anchor="middle" class="t-body">repository or a secret</text></g><g><rect x="444" y="212" width="300" height="68" rx="8" class="box"/><text x="594" y="234.5" text-anchor="middle" class="t-title">The secrets it names</text><text x="594" y="252.5" text-anchor="middle" class="t-body">opened by the controller; any it</text><text x="594" y="268.5" text-anchor="middle" class="t-body">may not read fails the run first</text></g></svg>
