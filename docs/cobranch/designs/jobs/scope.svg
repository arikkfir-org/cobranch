<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 626" role="img" aria-label="ENG-214 builds jobs in /cobranch.yaml, triggers from branch events, external events and cron, job principals and run tokens, the controller, job namespaces with pods and scripts, webhooks, secrets in settings, the outside-push gate, and runs in the Console and APIs. Later: ID tokens for clouds, artifacts and caches, path filters and concurrency options, organization-wide jobs, and phase 2’s pinned job security"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="625" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="364" height="570" rx="10" class="group tone-surface"/><text x="22" y="28" text-anchor="start" class="t-group">ENG-214 builds</text><rect x="388" y="8" width="364" height="570" rx="10" class="group"/><text x="402" y="28" text-anchor="start" class="t-group">Later slices</text><g><rect x="24" y="44" width="332" height="44" rx="8" class="box tone-accent"/><text x="190" y="62.5" text-anchor="middle" class="t-title">Jobs in <tspan class="mono">/cobranch.yaml</tspan></text><text x="190" y="80.5" text-anchor="middle" class="t-body">parsed, checked, recorded per tip</text></g><g><rect x="24" y="96" width="332" height="44" rx="8" class="box"/><text x="190" y="114.5" text-anchor="middle" class="t-title">Triggers</text><text x="190" y="132.5" text-anchor="middle" class="t-body">push, tag, annotation, review, event, cron, manual</text></g><g><rect x="24" y="148" width="332" height="44" rx="8" class="box"/><text x="190" y="166.5" text-anchor="middle" class="t-title">Job principals and run tokens</text><text x="190" y="184.5" text-anchor="middle" class="t-body">within <tspan class="mono">main</tspan>’s ceiling</text></g><g><rect x="24" y="200" width="332" height="44" rx="8" class="box tone-accent"/><text x="190" y="218.5" text-anchor="middle" class="t-title">The controller</text><text x="190" y="236.5" text-anchor="middle" class="t-body">a new workload; runs are its queue</text></g><g><rect x="24" y="252" width="332" height="44" rx="8" class="box"/><text x="190" y="270.5" text-anchor="middle" class="t-title">Job namespaces</text><text x="190" y="288.5" text-anchor="middle" class="t-body">one per organization, no ingress</text></g><g><rect x="24" y="304" width="332" height="44" rx="8" class="box tone-accent"/><text x="190" y="322.5" text-anchor="middle" class="t-title">Pods and scripts</text><text x="190" y="340.5" text-anchor="middle" class="t-body">checkout, logs, annotations</text></g><g><rect x="24" y="356" width="332" height="44" rx="8" class="box"/><text x="190" y="374.5" text-anchor="middle" class="t-title">Webhooks</text><text x="190" y="392.5" text-anchor="middle" class="t-body">signed, never into the cluster</text></g><g><rect x="24" y="408" width="332" height="44" rx="8" class="box"/><text x="190" y="426.5" text-anchor="middle" class="t-title">Secrets in settings</text><text x="190" y="444.5" text-anchor="middle" class="t-body">encrypted; Secret reader grants</text></g><g><rect x="24" y="460" width="332" height="44" rx="8" class="box"/><text x="190" y="478.5" text-anchor="middle" class="t-title">The outside-push gate</text><text x="190" y="496.5" text-anchor="middle" class="t-body">Waiting until a member starts it</text></g><g><rect x="24" y="512" width="332" height="44" rx="8" class="box"/><text x="190" y="530.5" text-anchor="middle" class="t-title">Runs in the Console and APIs</text><text x="190" y="548.5" text-anchor="middle" class="t-body">start, cancel, re-run, logs</text></g><g><rect x="404" y="44" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="62.5" text-anchor="middle" class="t-title">ID tokens for clouds</text><text x="570" y="80.5" text-anchor="middle" class="t-body">a run trades its token at the Auth server</text></g><g><rect x="404" y="96" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="114.5" text-anchor="middle" class="t-title">Artifacts and caches</text><text x="570" y="132.5" text-anchor="middle" class="t-body">files a run publishes and keeps</text></g><g><rect x="404" y="148" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="166.5" text-anchor="middle" class="t-title">Path filters</text><text x="570" y="184.5" text-anchor="middle" class="t-body">run only when paths change</text></g><g><rect x="404" y="200" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="218.5" text-anchor="middle" class="t-title">Concurrency options</text><text x="570" y="236.5" text-anchor="middle" class="t-body">queue or keep the latest</text></g><g><rect x="404" y="252" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="270.5" text-anchor="middle" class="t-title">Organization-wide jobs</text><text x="570" y="288.5" text-anchor="middle" class="t-body">one definition for every repository</text></g><g><rect x="404" y="304" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="322.5" text-anchor="middle" class="t-title">Pinned job security</text><text x="570" y="340.5" text-anchor="middle" class="t-body">phase 2: <tspan class="mono">main</tspan> limits overrides</text></g><g><rect x="404" y="356" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="374.5" text-anchor="middle" class="t-title">Agents</text><text x="570" y="392.5" text-anchor="middle" class="t-body">ENG-215, in the same namespaces</text></g><g><rect x="404" y="408" width="332" height="44" rx="8" class="box dashed"/><text x="570" y="426.5" text-anchor="middle" class="t-title">Delete and merge triggers</text><text x="570" y="444.5" text-anchor="middle" class="t-body">events without a commit to run on</text></g></svg>
