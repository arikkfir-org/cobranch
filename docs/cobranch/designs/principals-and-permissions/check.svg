nchor="middle" class="t-body">to a principal; none is Anonymous</text></g><g><polygon points="380,152 510,186 380,220 250,186" class="box"/><text x="380" y="183" text-anchor="middle" class="t-title">Expired, revoked</text><text x="380" y="198" text-anchor="middle" class="t-body">or suspended?</text></g><g><rect x="250" y="244" width="260" height="52" rx="8" class="box"/><text x="380" y="266.5" text-anchor="middle" class="t-title">Resolve the object’s scopes</text><text x="380" y="284.5" text-anchor="middle" class="t-body">repository, organization, installation</text></g><g><rect x="210" y="320" width="340" height="84" rx="8" class="box"/><text x="380" y="342.5" text-anchor="middle" class="t-title">Load the grants at those scopes</text><text x="380" y="360.5" text-anchor="middle" class="t-body">its own, its groups’ and Anonymous’s;</text><text x="380" y="376.5" text-anchor="middle" class="t-body">a user’s count only with a provider</text><text x="380" y="392.5" text-anchor="middle" class="t-body">the organization allows</text></g><g><rect x="250" y="428" width="260" height="52" rx="8" class="box"/><text x="380" y="450.5" text-anchor="middle" class="t-title">Apply the cap of its kind</text><text x="380" y="468.5" text-anchor="middle" class="t-body">assigner, ceiling, consent, token</text></g><g><polygon points="380,504 490,538 380,572 270,538" class="box"/><text x="380" y="535" text-anchor="middle" class="t-title">Is the permission</text><text x="380" y="550" text-anchor="middle" class="t-body">left?</text></g><g><polygon points="650,504 740,538 650,572 560,538" class="box"/><text x="650" y="535" text-anchor="middle" class="t-title">Can it see</text><text x="650" y="550" text-anchor="middle" class="t-body">the object?</text></g><g><rect x="300" y="600" width="160" height="44" rx="8" class="box tone-success"/><text x="380" y="626.5" text-anchor="middle" class="t-title">Allowed</text></g></svg>
