<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 508" role="img" aria-label="A person opens a repository’s page; the pane asks for their conversation about it. The service checks repo.read, then the store answers the subject with its deterministic ID, whether or not the row exists yet, and an empty page. When the person starts a thread, one transaction takes the chat’s advisory lock on the ID, inserts the conversation if it is missing, holds it against deletion, inserts the thread and its first message, appends the event and notifies the followers once it commits"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="507" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V466" class="lifeline"/><path d="M274.3 46 V466" class="lifeline"/><path d="M484.6 46 V466" class="lifeline"/><path d="M694.9 46 V466" class="lifeline"/><text x="169.1" y="62" text-anchor="middle" class="t-label">1. <tspan class="mono">GET</tspan></text><text x="169.1" y="76" text-anchor="middle" class="t-label">/orgs/acme/repos/website/conversation<tspan class="mono"></tspan></text><path d="M64 82 H273.3" class="edge" marker-end="url(#dg-a)"/><text x="379.4" y="110" text-anchor="middle" class="t-label">2. <tspan class="mono">Repository(viewer, org, repo)</tspan>:</text><text x="379.4" y="124" text-anchor="middle" class="t-label"><tspan class="mono">repo.read</tspan>, or 404</text><path d="M274.3 130 H483.6" class="edge" marker-end="url(#dg-a)"/><text x="589.8" y="158" text-anchor="middle" class="t-label">3. the repository, its default branch and</text><text x="589.8" y="172" text-anchor="middle" class="t-label">head; the ID from the viewer and the</text><text x="589.8" y="186" text-anchor="middle" class="t-label">subject</text><path d="M484.6 192 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="169.1" y="220" text-anchor="middle" class="t-label">4. an empty page, <tspan class="mono">after</tspan> 0: the pane</text><text x="169.1" y="234" text-anchor="middle" class="t-label">follows it from there</text><path d="M274.3 240 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="169.1" y="268" text-anchor="middle" class="t-label">5. <tspan class="mono">POST …/conversation/threads</tspan></text><path d="M64 274 H273.3" class="edge" marker-end="url(#dg-a)"/><text x="589.8" y="302" text-anchor="middle" class="t-label">6. one transaction: lock the ID; insert the</text><text x="589.8" y="316" text-anchor="middle" class="t-label">conversation unless there; hold it; the thread</text><text x="589.8" y="330" text-anchor="middle" class="t-label">and its message; event <tspan class="mono">chat.thread.started</tspan></text><path d="M484.6 336 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="589.8" y="364" text-anchor="middle" class="t-label">7. <tspan class="mono">NOTIFY</tspan> with the ID, after the</text><text x="589.8" y="378" text-anchor="middle" class="t-label">commit</text><path d="M694.9 384 H485.6" class="edge dashed" marker-end="url(#dg-a)"/><text x="169.1" y="412" text-anchor="middle" class="t-label">8. 201, the thread; every follower of the ID</text><text x="169.1" y="426" text-anchor="middle" class="t-label">wakes</text><path d="M274.3 432 H65" class="edge dashed" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Person</text><rect x="208.5" y="12" width="131.6" height="34" rx="8" class="box tone-accent"/><text x="274.3" y="33.5" text-anchor="middle" class="t-title">REST or GraphQL</text><rect x="430.1" y="12" width="108.9" height="34" rx="8" class="box"/><text x="484.6" y="33.5" text-anchor="middle" class="t-title">Chats service</text><rect x="645.8" y="12" width="98.2" height="34" rx="8" class="box"/><text x="694.9" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text></svg>
