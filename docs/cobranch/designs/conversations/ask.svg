<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 502" role="img" aria-label="A person mentions an agent in a message; the composer sends the message with ask naming the agent. In one transaction the service posts the message and assigns the agent a task whose thread is the message’s thread, capped by the person, with the chat’s repository and branch where it has them. The controller runs the task’s pod; the harness reads the thread and posts its replies there with the task’s token, and asks and waits there when it needs an answer. In a private conversation, the task is private to its assigner too"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="501" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V460" class="lifeline"/><path d="M274.7 46 V460" class="lifeline"/><path d="M485.3 46 V460" class="lifeline"/><path d="M696 46 V460" class="lifeline"/><rect x="4" y="342" width="752" height="90" rx="6" class="frame"/><path d="M4 362 H37.3 L45.3 354 V342" class="frame"/><text x="12" y="356.5" text-anchor="start" class="t-frame">opt</text><text x="53.3" y="356.5" text-anchor="start" class="t-label">it needs an answer</text><text x="169.3" y="62" text-anchor="middle" class="t-label">1. “@Builder why does the push worker</text><text x="169.3" y="76" text-anchor="middle" class="t-label">retry?”, <tspan class="mono">ask</tspan>: Builder</text><path d="M64 82 H273.7" class="edge" marker-end="url(#dg-a)"/><text x="288.7" y="112" text-anchor="start" class="t-label">2. one transaction: the message, and a task</text><text x="288.7" y="126" text-anchor="start" class="t-label">of Builder’s in its thread, assigned by the</text><text x="288.7" y="140" text-anchor="start" class="t-label">person (<tspan class="mono">agents.assign</tspan>)</text><path d="M274.7 148 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="169.3" y="178" text-anchor="middle" class="t-label">3. the message, linking task #21:</text><text x="169.3" y="192" text-anchor="middle" class="t-label">Queued</text><path d="M274.7 198 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="590.7" y="226" text-anchor="middle" class="t-label">4. the task’s pod, with its token</text><path d="M485.3 232 H695" class="edge" marker-end="url(#dg-a)"/><text x="485.3" y="260" text-anchor="middle" class="t-label">5. <tspan class="mono">read_thread</tspan>, then <tspan class="mono">post_message</tspan> as</text><text x="485.3" y="274" text-anchor="middle" class="t-label">Builder, linking #21</text><path d="M696 280 H275.7" class="edge" marker-end="url(#dg-a)"/><text x="169.3" y="308" text-anchor="middle" class="t-label">6. the reply, live in the pane</text><path d="M274.7 314 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="485.3" y="382" text-anchor="middle" class="t-label">7. <tspan class="mono">ask</tspan>: the task waits; the person’s next</text><text x="485.3" y="396" text-anchor="middle" class="t-label">message in the thread answers it</text><path d="M696 402 H275.7" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Person</text><rect x="209.1" y="12" width="131.1" height="34" rx="8" class="box"/><text x="274.7" y="33.5" text-anchor="middle" class="t-title">Chats and agents</text><rect x="437.3" y="12" width="96" height="34" rx="8" class="box"/><text x="485.3" y="33.5" text-anchor="middle" class="t-title">Controller</text><rect x="648" y="12" width="96" height="34" rx="8" class="box tone-ai"/><text x="696" y="33.5" text-anchor="middle" class="t-title">Harness</text></svg>
