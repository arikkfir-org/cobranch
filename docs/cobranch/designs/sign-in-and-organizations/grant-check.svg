<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 512" role="img" aria-label="Granting or revoking a role at a scope takes org.grants.manage there and every permission of the role; the result must leave the scope valid, a grant to a principal that can hold it and a revocation that keeps an Owner; then the grant and its event are written in one transaction"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="511" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M350 52L350 76" class="edge" marker-end="url(#dg-a)"/><path d="M490 112L560 112" class="edge" marker-end="url(#dg-a)"/><text x="525" y="104" text-anchor="middle" class="t-label">no</text><path d="M350 148L350 172" class="edge" marker-end="url(#dg-a)"/><text x="358" y="164" text-anchor="start" class="t-label">yes</text><path d="M510 214L560 214" class="edge" marker-end="url(#dg-a)"/><text x="535" y="206" text-anchor="middle" class="t-label">no</text><path d="M350 256L350 280" class="edge" marker-end="url(#dg-a)"/><text x="358" y="272" text-anchor="start" class="t-label">yes</text><path d="M530 332L560 332" class="edge" marker-end="url(#dg-a)"/><text x="545" y="324" text-anchor="middle" class="t-label">no</text><path d="M350 384L350 412" class="edge" marker-end="url(#dg-a)"/><text x="358" y="402" text-anchor="start" class="t-label">yes</text><g><rect x="200" y="16" width="300" height="36" rx="18" class="box"/><text x="350" y="38.5" text-anchor="middle" class="t-title">Grant or revoke a role, at a scope</text></g><g><polygon points="350,76 490,112 350,148 210,112" class="box"/><text x="350" y="109" text-anchor="middle" class="t-title">Does the actor hold</text><text x="350" y="124" text-anchor="middle" class="t-body"><tspan class="mono">org.grants.manage</tspan> there?</text></g><g><rect x="560" y="88" width="184" height="48" rx="8" class="box tone-danger"/><text x="652" y="108.5" text-anchor="middle" class="t-title"><tspan class="mono">403</tspan></text><text x="652" y="126.5" text-anchor="middle" class="t-body">or <tspan class="mono">404</tspan> if it can’t see it</text></g><g><polygon points="350,172 510,214 350,256 190,214" class="box"/><text x="350" y="211" text-anchor="middle" class="t-title">And every permission</text><text x="350" y="226" text-anchor="middle" class="t-body">of the role, there?</text></g><g><rect x="560" y="190" width="184" height="48" rx="8" class="box tone-danger"/><text x="652" y="210.5" text-anchor="middle" class="t-title"><tspan class="mono">403</tspan></text><text x="652" y="228.5" text-anchor="middle" class="t-body">never more than it holds</text></g><g><polygon points="350,280 530,332 350,384 170,332" class="box"/><text x="350" y="321.5" text-anchor="middle" class="t-title">Is the result valid?</text><text x="350" y="336.5" text-anchor="middle" class="t-body">a grant: the principal may hold it there;</text><text x="350" y="351.5" text-anchor="middle" class="t-body">a revocation: an Owner remains</text></g><g><rect x="560" y="308" width="184" height="48" rx="8" class="box tone-danger"/><text x="652" y="336.5" text-anchor="middle" class="t-title"><tspan class="mono">409</tspan> or <tspan class="mono">422</tspan></text></g><g><rect x="175" y="412" width="350" height="52" rx="8" class="box tone-success"/><text x="350" y="434.5" text-anchor="middle" class="t-title">Write or delete the grant, with its event</text><text x="350" y="452.5" text-anchor="middle" class="t-body">in one transaction; in effect on the next request</text></g></svg>
