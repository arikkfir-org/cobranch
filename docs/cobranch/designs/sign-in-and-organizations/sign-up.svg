/text></g><g><rect x="590" y="206" width="154" height="56" rx="8" class="box tone-danger"/><text x="667" y="230.5" text-anchor="middle" class="t-title">Refused</text><text x="667" y="248.5" text-anchor="middle" class="t-body">nothing is stored</text></g><g><rect x="230" y="334" width="300" height="52" rx="8" class="box"/><text x="380" y="356.5" text-anchor="middle" class="t-title">Create the user</text><text x="380" y="374.5" text-anchor="middle" class="t-body">its identity, its verified email, events</text></g><g><rect x="230" y="404" width="300" height="68" rx="8" class="box"/><text x="380" y="426.5" text-anchor="middle" class="t-title">Grant at the installation</text><text x="380" y="444.5" text-anchor="middle" class="t-body">Installation user, while self-serve is on;</text><text x="380" y="460.5" text-anchor="middle" class="t-body">Installation admin, if <tspan class="mono">auth.admins</tspan> lists it</text></g><g><rect x="280" y="516" width="200" height="34" rx="17" class="box tone-accent"/><text x="380" y="537.5" text-anchor="middle" class="t-title">No organization</text></g></svg>
