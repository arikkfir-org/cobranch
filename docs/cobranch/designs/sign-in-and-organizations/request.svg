<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 716" role="img" aria-label="A caller sends a session cookie or an API key; the server refuses a cookie-authenticated mutation that is not JSON from the Console’s origin; the service layer finds the session or secret by its hash and its principal; no credential runs as Anonymous, a bad one is 401; the authorizer loads the grants at the object’s scopes and allows, or answers 403 or 404"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="715" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M81.4 46 V674" class="lifeline"/><path d="M285.9 46 V674" class="lifeline"/><path d="M490.4 46 V674" class="lifeline"/><path d="M694.9 46 V674" class="lifeline"/><rect x="225.9" y="246" width="529" height="174" rx="6" class="frame"/><path d="M225.9 266 H255.9 L263.9 258 V246" class="frame"/><text x="233.9" y="260.5" text-anchor="start" class="t-frame">alt</text><text x="271.9" y="260.5" text-anchor="start" class="t-label">no credential at all</text><path d="M225.9 344 H754.9" class="frame dashed"/><text x="233.9" y="358.5" text-anchor="start" class="t-label">one that matches nothing, expired or was revoked</text><text x="183.6" y="62" text-anchor="middle" class="t-label">1. a request: the session cookie, or</text><text x="183.6" y="76" text-anchor="middle" class="t-label"><tspan class="mono">Authorization: Bearer cbk_…</tspan></text><path d="M81.4 82 H284.9" class="edge" marker-end="url(#dg-a)"/><text x="299.9" y="112" text-anchor="start" class="t-label">2. a mutation by cookie: JSON only,</text><text x="299.9" y="126" text-anchor="start" class="t-label">and from the Console’s origin</text><path d="M285.9 134 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="388.1" y="164" text-anchor="middle" class="t-label">3. authenticate</text><path d="M285.9 170 H489.4" class="edge" marker-end="url(#dg-a)"/><text x="592.6" y="198" text-anchor="middle" class="t-label">4. by the token’s SHA-256: the session</text><text x="592.6" y="212" text-anchor="middle" class="t-label">or secret, live, and its principal, active</text><path d="M490.4 218 H693.9" class="edge" marker-end="url(#dg-a)"/><rect x="419.5" y="280" width="324.5" height="42" rx="6" class="note"/><text x="431.5" y="297" text-anchor="start" class="t-body">The caller is Anonymous, and holds only</text><text x="431.5" y="312" text-anchor="start" class="t-body">Anonymous’s grants.</text><text x="388.1" y="384" text-anchor="middle" class="t-label">5. <tspan class="mono">401</tspan></text><path d="M490.4 390 H286.9" class="edge dashed" marker-end="url(#dg-a)"/><text x="592.6" y="442" text-anchor="middle" class="t-label">6. mark it seen, at most once a</text><text x="592.6" y="456" text-anchor="middle" class="t-label">minute</text><path d="M490.4 462 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="388.1" y="490" text-anchor="middle" class="t-label">7. the operation, as that principal</text><path d="M285.9 496 H489.4" class="edge" marker-end="url(#dg-a)"/><text x="592.6" y="524" text-anchor="middle" class="t-label">8. grants at the object’s scopes: its own</text><text x="592.6" y="538" text-anchor="middle" class="t-label">and Anonymous’s; a user’s in an</text><text x="592.6" y="552" text-anchor="middle" class="t-label">organization only through a provider it</text><text x="592.6" y="566" text-anchor="middle" class="t-label">allows</text><path d="M490.4 572 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="388.1" y="600" text-anchor="middle" class="t-label">9. the result, <tspan class="mono">403</tspan> or <tspan class="mono">404</tspan></text><path d="M490.4 606 H286.9" class="edge dashed" marker-end="url(#dg-a)"/><text x="183.6" y="634" text-anchor="middle" class="t-label">10. the answer</text><path d="M285.9 640 H82.4" class="edge dashed" marker-end="url(#dg-a)"/><rect x="16" y="12" width="130.8" height="34" rx="8" class="box"/><text x="81.4" y="33.5" text-anchor="middle" class="t-title">Browser or script</text><rect x="198.7" y="12" width="174.4" height="34" rx="8" class="box"/><text x="285.9" y="33.5" text-anchor="middle" class="t-title">GraphQL or REST server</text><rect x="437.8" y="12" width="105.2" height="34" rx="8" class="box tone-accent"/><text x="490.4" y="33.5" text-anchor="middle" class="t-title">Service layer</text><rect x="645.8" y="12" width="98.2" height="34" rx="8" class="box"/><text x="694.9" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text></svg>
