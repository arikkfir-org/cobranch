lor-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="321" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M34 40L72 40" class="edge" marker-end="url(#dg-a)"/><path d="M308 40L400 40" class="edge" marker-end="url(#dg-a)"/><text x="354" y="32" text-anchor="middle" class="t-label">yes</text><path d="M190 72L190 120" class="edge" marker-end="url(#dg-a)"/><text x="200" y="104" text-anchor="start" class="t-label">no</text><path d="M308 152L400 152" class="edge" marker-end="url(#dg-a)"/><text x="354" y="144" text-anchor="middle" class="t-label">yes</text><path d="M190 184L190 248L400 248" class="edge" marker-end="url(#dg-a)"/><text x="200" y="220" text-anchor="start" class="t-label">no</text><circle cx="25" cy="40" r="7" class="dot"/><g><polygon points="190,8 308,40 190,72 72,40" class="box"/><text x="190" y="44.5" text-anchor="middle" class="t-title">Trying Cobranch out, on one node?</text></g><g><polygon points="190,120 308,152 190,184 72,152" class="box"/><text x="190" y="156.5" text-anchor="middle" class="t-title">Will packs outgrow the database?</text></g><g><rect x="400" y="14" width="344" height="52" rx="8" class="box"/><text x="572" y="36.5" text-anchor="middle" class="t-title">Local files: <tspan class="mono">file://</tspan> on <tspan class="mono">blob.volume</tspan></text><text x="572" y="54.5" text-anchor="middle" class="t-body">a volume that lasts; one node’s, or ReadWriteMany</text></g><g><rect x="400" y="126" width="344" height="52" rx="8" class="box"/><text x="572" y="148.5" text-anchor="middle" class="t-title">A cloud’s bucket: <tspan class="mono">s3://</tspan>, <tspan class="mono">gs://</tspan>, <tspan class="mono">azblob://</tspan></text><text x="572" y="166.5" text-anchor="middle" class="t-body">its credentials from workload identity or a Secret</text></g><g><rect x="400" y="222" width="344" height="52" rx="8" class="box tone-success"/><text x="572" y="244.5" text-anchor="middle" class="t-title">PostgreSQL, the default: <tspan class="mono">blob.url</tspan> empty</text><text x="572" y="262.5" text-anchor="middle" class="t-body">one store to run, back up and restore</text></g></svg>
