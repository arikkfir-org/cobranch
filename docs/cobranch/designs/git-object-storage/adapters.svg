<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 436" role="img" aria-label="The Git server and the maintenance job keep packs through one abstraction, a bucket of Go Cloud’s blob package. blob.url picks its adapter: empty, the default, keeps every object as a large object in the installation’s own PostgreSQL; s3, gs or azblob URLs keep them in a cloud’s bucket; a file URL keeps them in a directory on a volume. PostgreSQL holds the refs and the pack list in every case, and each Git server pod keeps a cache of packs that is never authoritative"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="435" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="100" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">Cobranch workloads that keep packs</text><rect x="8" y="212" width="744" height="176" rx="10" class="group"/><text x="22" y="232" text-anchor="start" class="t-group">Adapters, one per installation, chosen by <tspan class="mono">blob.url</tspan></text><path d="M194 92L194 114L330 114L330 136" class="edge" marker-end="url(#dg-a)"/><path d="M566 92L566 114L430 114L430 136" class="edge" marker-end="url(#dg-a)"/><path d="M290 184L290 200L136 200L136 248" class="edge tone-success" marker-end="url(#dg-a-success)"/><text x="214" y="194" text-anchor="middle" class="t-label">or</text><path d="M380 184L380 248" class="edge" marker-end="url(#dg-a)"/><text x="392" y="222" text-anchor="start" class="t-label">or</text><path d="M470 184L470 200L624 200L624 248" class="edge" marker-end="url(#dg-a)"/><text x="546" y="194" text-anchor="middle" class="t-label">or</text><g><rect x="24" y="44" width="340" height="48" rx="8" class="box tone-accent"/><text x="194" y="64.5" text-anchor="middle" class="t-title">Git server</text><text x="194" y="82.5" text-anchor="middle" class="t-body">writes each push’s pack; reads into its cache</text></g><g><rect x="396" y="44" width="340" height="48" rx="8" class="box"/><text x="566" y="64.5" text-anchor="middle" class="t-title">Maintenance</text><text x="566" y="82.5" text-anchor="middle" class="t-body">repacks; deletes what nobody lists</text></g><g><rect x="208" y="136" width="344" height="48" rx="8" class="box tone-accent"/><text x="380" y="156.5" text-anchor="middle" class="t-title">Go Cloud <tspan class="mono">blob.Bucket</tspan></text><text x="380" y="174.5" text-anchor="middle" class="t-body">write once, read, list, delete by key</text></g><g><path d="M24 254 a112 6 0 0 1 224 0 v108 a112 6 0 0 1 -224 0 z" class="box tone-success"/><path d="M24 254 a112 6 0 0 0 224 0" class="rim tone-success"/><text x="136" y="278" text-anchor="middle" class="t-title">PostgreSQL</text><text x="136" y="294" text-anchor="middle" class="t-body">large objects in table <tspan class="mono">blobs</tspan>,</text><text x="136" y="310" text-anchor="middle" class="t-body">the installation’s database</text><text x="136" y="326" text-anchor="middle" class="t-body">Default: <tspan class="mono">blob.url</tspan> empty</text></g><g><path d="M268 254 a112 6 0 0 1 224 0 v108 a112 6 0 0 1 -224 0 z" class="box"/><path d="M268 254 a112 6 0 0 0 224 0" class="rim"/><text x="380" y="278" text-anchor="middle" class="t-title">A cloud’s bucket</text><text x="380" y="294" text-anchor="middle" class="t-body"><tspan class="mono">s3://</tspan>, <tspan class="mono">gs://</tspan>, <tspan class="mono">azblob://</tspan></text><text x="380" y="310" text-anchor="middle" class="t-body">for packs that outgrow</text><text x="380" y="326" text-anchor="middle" class="t-body">the database</text></g><g><path d="M512 254 a112 6 0 0 1 224 0 v108 a112 6 0 0 1 -224 0 z" class="box"/><path d="M512 254 a112 6 0 0 0 224 0" class="rim"/><text x="624" y="278" text-anchor="middle" class="t-title">Local files</text><text x="624" y="294" text-anchor="middle" class="t-body"><tspan class="mono">file://</tspan> on <tspan class="mono">blob.volume</tspan></text><text x="624" y="310" text-anchor="middle" class="t-body">for trying Cobranch out,</text><text x="624" y="326" text-anchor="middle" class="t-body">on a volume that lasts</text></g></svg>
