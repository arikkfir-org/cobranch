<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 410" role="img" aria-label="A store method names a scope for its queries. A scope that pins an organization runs its transaction as role cobranch_tenant with the organization in a session variable, and each table’s policy shows that role the pinned organization’s rows alone. A scope that spans organizations runs as the role Cobranch connects as, which owns the tables and is bound by no policy."><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="409" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="92" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">A store, the only code that reaches the database</text><rect x="8" y="128" width="744" height="96" rx="10" class="group"/><text x="22" y="148" text-anchor="start" class="t-group">One transaction</text><rect x="8" y="252" width="744" height="110" rx="10" class="group"/><text x="22" y="272" text-anchor="start" class="t-group">PostgreSQL</text><path d="M194 88L194 160" class="edge" marker-end="url(#dg-a)"/><path d="M566 88L566 160" class="edge" marker-end="url(#dg-a)"/><path d="M194 212L194 286" class="edge tone-success" marker-end="url(#dg-a-success)"/><text x="204" y="250" text-anchor="start" class="t-label">bound</text><path d="M364 318L396 318" class="edge tone-success" marker-end="url(#dg-a-success)"/><path d="M566 212L566 283" class="edge" marker-end="url(#dg-a)"/><text x="576" y="250" text-anchor="start" class="t-label">unbound</text><g><rect x="24" y="40" width="340" height="48" rx="8" class="box tone-accent"/><text x="194" y="60.5" text-anchor="middle" class="t-title"><tspan class="mono">In(org)</tspan> or <tspan class="mono">Of(table, id)</tspan></text><text x="194" y="78.5" text-anchor="middle" class="t-body">work in one organization</text></g><g><rect x="396" y="40" width="340" height="48" rx="8" class="box"/><text x="566" y="60.5" text-anchor="middle" class="t-title"><tspan class="mono">Everywhere(why)</tspan></text><text x="566" y="78.5" text-anchor="middle" class="t-body">work that spans organizations, saying why</text></g><g><rect x="24" y="160" width="340" height="52" rx="8" class="box tone-accent"/><text x="194" y="182.5" text-anchor="middle" class="t-title">Role <tspan class="mono">cobranch_tenant</tspan></text><text x="194" y="200.5" text-anchor="middle" class="t-body"><tspan class="mono">cobranch.org_id</tspan> = the organization</text></g><g><rect x="396" y="160" width="340" height="52" rx="8" class="box"/><text x="566" y="182.5" text-anchor="middle" class="t-title">The connecting role</text><text x="566" y="200.5" text-anchor="middle" class="t-body">the tables’ owner; no organization</text></g><g><rect x="24" y="286" width="340" height="64" rx="8" class="box tone-success"/><text x="194" y="306.5" text-anchor="middle" class="t-title">Policy <tspan class="mono">organization</tspan></text><text x="194" y="324.5" text-anchor="middle" class="t-body"><tspan class="mono">org_id = current_org()</tspan>,</text><text x="194" y="340.5" text-anchor="middle" class="t-body">on every table with <tspan class="mono">org_id</tspan></text></g><g><path d="M396 289 a170 6 0 0 1 340 0 v58 a170 6 0 0 1 -340 0 z" class="box"/><path d="M396 289 a170 6 0 0 0 340 0" class="rim"/><text x="566" y="313" text-anchor="middle" class="t-title">Rows</text><text x="566" y="329" text-anchor="middle" class="t-body">every organization’s; the policy</text><text x="566" y="345" text-anchor="middle" class="t-body">passes the pinned one’s</text></g></svg>
