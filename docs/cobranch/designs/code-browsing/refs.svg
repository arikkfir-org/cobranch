<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 572" role="img" aria-label="The Console splits a path such as tree/feature/login/docs by the longest branch or tag name its segments start with, or a full commit name, into a ref and a path. The Git server then tries the ref as a full commit name, then as refs/heads, then as refs/tags, in the snapshot it read; none answers 404 ref.not_found; an annotated tag is peeled to its commit; then the path is read in that commit’s tree, or 404 path.not_found"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="571" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="100" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">The Console</text><rect x="8" y="124" width="744" height="400" rx="10" class="group"/><text x="22" y="144" text-anchor="start" class="t-group">The Git server, one snapshot</text><path d="M324 68L436 68" class="edge" marker-end="url(#dg-a)"/><path d="M586 92L586 140L350 140L350 160" class="edge" marker-end="url(#dg-a)"/><path d="M350 224L350 248" class="edge" marker-end="url(#dg-a)"/><text x="358" y="240" text-anchor="start" class="t-label">no</text><path d="M350 312L350 336" class="edge" marker-end="url(#dg-a)"/><text x="358" y="328" text-anchor="start" class="t-label">no</text><path d="M500 368L576 368" class="edge" marker-end="url(#dg-a)"/><text x="538" y="360" text-anchor="middle" class="t-label">no</text><path d="M200 192L100 192L100 424" class="edge" marker-end="url(#dg-a)"/><text x="150" y="184" text-anchor="middle" class="t-label">yes</text><path d="M200 280L100 280" class="edge" marker-end="url(#dg-a)"/><text x="150" y="272" text-anchor="middle" class="t-label">yes</text><path d="M200 368L100 368" class="edge" marker-end="url(#dg-a)"/><text x="150" y="360" text-anchor="middle" class="t-label">yes</text><path d="M324 448L400 448" class="edge" marker-end="url(#dg-a)"/><g><rect x="24" y="44" width="300" height="48" rx="8" class="box"/><text x="174" y="64.5" text-anchor="middle" class="t-title"><tspan class="mono">…/tree/feature/login/docs</tspan></text><text x="174" y="82.5" text-anchor="middle" class="t-body">the page’s path</text></g><g><rect x="436" y="44" width="300" height="48" rx="8" class="box tone-accent"/><text x="586" y="64.5" text-anchor="middle" class="t-title">ref <tspan class="mono">feature/login</tspan>, path <tspan class="mono">docs</tspan></text><text x="586" y="82.5" text-anchor="middle" class="t-body">the longest branch or tag it starts with</text></g><g><polygon points="350,160 500,192 350,224 200,192" class="box"/><text x="350" y="196.5" text-anchor="middle" class="t-title">A full commit name?</text></g><g><polygon points="350,248 500,280 350,312 200,280" class="box"/><text x="350" y="284.5" text-anchor="middle" class="t-title"><tspan class="mono">refs/heads/&lt;ref&gt;</tspan>?</text></g><g><polygon points="350,336 500,368 350,400 200,368" class="box"/><text x="350" y="372.5" text-anchor="middle" class="t-title"><tspan class="mono">refs/tags/&lt;ref&gt;</tspan>?</text></g><g><rect x="576" y="342" width="160" height="52" rx="8" class="box tone-danger"/><text x="656" y="364.5" text-anchor="middle" class="t-title"><tspan class="mono">404</tspan></text><text x="656" y="382.5" text-anchor="middle" class="t-body"><tspan class="mono">ref.not_found</tspan></text></g><g><rect x="24" y="424" width="300" height="48" rx="8" class="box"/><text x="174" y="444.5" text-anchor="middle" class="t-title">Peel to a commit</text><text x="174" y="462.5" text-anchor="middle" class="t-body">an annotated tag names one</text></g><g><rect x="400" y="424" width="336" height="48" rx="8" class="box tone-success"/><text x="568" y="444.5" text-anchor="middle" class="t-title">The path in its tree</text><text x="568" y="462.5" text-anchor="middle" class="t-body">else <tspan class="mono">404</tspan> <tspan class="mono">path.not_found</tspan></text></g><text x="24" y="504" text-anchor="start" class="t-note">Nothing but a full name or a ref reaches <tspan class="mono">git</tspan>’s revision parser: no abbreviations, no <tspan class="mono">HEAD~2</tspan>.</text></svg>
