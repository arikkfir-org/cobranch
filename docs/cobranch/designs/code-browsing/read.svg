<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 750" role="img" aria-label="The Console asks the REST server for a tree at a ref and path. The REST server checks repo.read, then calls the Git server’s internal port with the token. The Git server reads a snapshot, builds a throwaway repository over its pack cache, resolves the ref and lists the path’s tree with git. The REST server finds a README among the entries, asks the Git server for its blob, renders it and answers the entries, the README’s HTML and an ETag from the commit. The Console draws the listing and the README in a sandboxed frame"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="749" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V708" class="lifeline"/><path d="M222 46 V708" class="lifeline"/><path d="M380 46 V708" class="lifeline"/><path d="M538 46 V708" class="lifeline"/><path d="M696 46 V708" class="lifeline"/><text x="143" y="62" text-anchor="middle" class="t-label">1. <tspan class="mono">GET …/tree?ref=main&amp;path=docs</tspan></text><path d="M64 68 H221" class="edge" marker-end="url(#dg-a)"/><text x="301" y="96" text-anchor="middle" class="t-label">2. the viewer’s grants: <tspan class="mono">repo.read</tspan>, else</text><text x="301" y="110" text-anchor="middle" class="t-label"><tspan class="mono">404</tspan></text><path d="M222 116 H379" class="edge" marker-end="url(#dg-a)"/><text x="380" y="144" text-anchor="middle" class="t-label">3. <tspan class="mono">GET /internal/v1/repos/&lt;id&gt;/tree</tspan>, the</text><text x="380" y="158" text-anchor="middle" class="t-label">token as bearer</text><path d="M222 164 H537" class="edge" marker-end="url(#dg-a)"/><text x="459" y="192" text-anchor="middle" class="t-label">4. the refs and the pack list, in one</text><text x="459" y="206" text-anchor="middle" class="t-label">statement</text><path d="M538 212 H381" class="edge" marker-end="url(#dg-a)"/><text x="552" y="242" text-anchor="start" class="t-label">5. a throwaway repository</text><text x="552" y="256" text-anchor="start" class="t-label">over the pack cache</text><path d="M538 264 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="617" y="294" text-anchor="middle" class="t-label">6. resolve <tspan class="mono">main</tspan>; <tspan class="mono">ls-tree</tspan> of</text><text x="617" y="308" text-anchor="middle" class="t-label"><tspan class="mono">docs</tspan></text><path d="M538 314 H695" class="edge" marker-end="url(#dg-a)"/><text x="617" y="342" text-anchor="middle" class="t-label">7. names, modes, objects,</text><text x="617" y="356" text-anchor="middle" class="t-label">sizes</text><path d="M696 362 H539" class="edge dashed" marker-end="url(#dg-a)"/><text x="380" y="390" text-anchor="middle" class="t-label">8. the commit, the tree, its entries</text><path d="M538 396 H223" class="edge dashed" marker-end="url(#dg-a)"/><text x="236" y="426" text-anchor="start" class="t-label">9. a README among</text><text x="236" y="440" text-anchor="start" class="t-label">them?</text><path d="M222 448 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="380" y="478" text-anchor="middle" class="t-label">10. <tspan class="mono">…/blob</tspan> of <tspan class="mono">docs/README.md</tspan> at that</text><text x="380" y="492" text-anchor="middle" class="t-label">commit</text><path d="M222 498 H537" class="edge" marker-end="url(#dg-a)"/><text x="380" y="526" text-anchor="middle" class="t-label">11. its bytes</text><path d="M538 532 H223" class="edge dashed" marker-end="url(#dg-a)"/><text x="236" y="562" text-anchor="start" class="t-label">12. render and sanitize; ETag</text><text x="236" y="576" text-anchor="start" class="t-label">from the commit and the path</text><path d="M222 584 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="143" y="614" text-anchor="middle" class="t-label">13. the entries and the README’s HTML</text><path d="M222 620 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="78" y="650" text-anchor="start" class="t-label">14. the listing; the README</text><text x="78" y="664" text-anchor="start" class="t-label">in a sandboxed frame</text><path d="M64 672 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Console</text><rect x="171.1" y="12" width="101.8" height="34" rx="8" class="box tone-accent"/><text x="222" y="33.5" text-anchor="middle" class="t-title">REST server</text><rect x="330.9" y="12" width="98.2" height="34" rx="8" class="box"/><text x="380" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="490" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="538" y="33.5" text-anchor="middle" class="t-title">Git server</text><rect x="648" y="12" width="96" height="34" rx="8" class="box"/><text x="696" y="33.5" text-anchor="middle" class="t-title">git</text></svg>
