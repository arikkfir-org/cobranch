<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 820" role="img" aria-label="Milestones 1, Design, 2, Installable foundations, and 3, Identity and organizations, are done: ENG-193 architecture, ENG-194 the design system, ENG-196 principals and permissions, ENG-200 the core screens, ENG-202 diagram-first designs, ENG-203 the design review and ENG-220 the roadmap; ENG-192 the monorepo, ENG-195 the skeleton with its Helm chart, ENG-207 releases, ENG-208 pull request previews, ENG-209 a demo of main, ENG-221 the Cobranch name and ENG-222 the domains in Terraform. In milestone 3: ENG-223 sqlc, ENG-224 the audit log, ENG-197 sign-in and organizations, and ENG-219 the Back-office, which followed ENG-197. Milestone 4, Code and CI: ENG-198 Git hosting, after ENG-197 and ENG-223, is done, and so is ENG-199 branch status and merges, after it; ENG-228, browsing code in the Console with its Markdown rendered, is in progress, and ENG-214 jobs follows ENG-199; ENG-235 adds metrics for page-view times, the cost of code reads and cache hit rates; ENG-237, in progress, keeps Git objects in PostgreSQL by default, with a bucket or local files as options. Milestone 5, AI agents and review: ENG-215 agents, then ENG-216 AI review. Milestone 6, Issues and delivery: ENG-217 issues, then ENG-218 delivery. After the MVP: ENG-225, a Terraform provider; ENG-229, Continuous Intelligence, and ENG-230, repository hooks, which both need discussion; ENG-231, an MCP server with Claude Code skills and mods; ENG-233, continuous documentation in virtual READMEs; ENG-234, an AI side panel in the Console; and ENG-238, storage and push quotas per user and organization; with the rest of phase 2"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-s