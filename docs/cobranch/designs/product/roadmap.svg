<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 724" role="img" aria-label="Milestones 1, Design, and 2, Installable foundations, are done: ENG-193 architecture, ENG-194 the design system, ENG-196 principals and permissions, ENG-200 the core screens, ENG-202 diagram-first designs, ENG-203 the design review and ENG-220 the roadmap; ENG-192 the monorepo, ENG-195 the skeleton with its Helm chart, ENG-207 releases, ENG-208 pull request previews, ENG-209 a demo of main, ENG-221 the Cobranch name and ENG-222 the domains in Terraform. Milestone 3, Identity and organizations: ENG-223 sqlc, ENG-224 the audit log and ENG-197 sign-in and organizations are done, and ENG-219 the Back-office, which follows ENG-197, is in progress. Milestone 4, Code and CI: ENG-198 Git hosting, after ENG-197 and ENG-223, is in progress, then ENG-199 branch status, then ENG-214 jobs. Milestone 5, AI agents and review: ENG-215 agents, then ENG-216 AI review. Milestone 6, Issues and delivery: ENG-217 issues, then ENG-218 delivery. After the MVP: ENG-225, a Terraform provider, with the rest of phase 2"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-su