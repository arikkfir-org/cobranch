idth="170" height="52" rx="8" class="box tone-accent"/><text x="101" y="38.5" text-anchor="middle" class="t-title">Principal</text><text x="101" y="56.5" text-anchor="middle" class="t-body">anyone who acts</text></g><g><rect x="300" y="16" width="170" height="52" rx="8" class="box"/><text x="385" y="38.5" text-anchor="middle" class="t-title">Organization</text><text x="385" y="56.5" text-anchor="middle" class="t-body">settings in the database</text></g><g><rect x="584" y="16" width="160" height="52" rx="8" class="box"/><text x="664" y="38.5" text-anchor="middle" class="t-title">Issue</text><text x="664" y="56.5" text-anchor="middle" class="t-body">Linear-like</text></g><g><rect x="16" y="120" width="170" height="52" rx="8" class="box tone-ai"/><text x="101" y="142.5" text-anchor="middle" class="t-title">Agent</text><text x="101" y="160.5" text-anchor="middle" class="t-body">a principal it owns</text></g><g><rect x="300" y="120" width="170" height="52" rx="8" class="box"/><text x="385" y="142.5" text-anchor="middle" class="t-title">Repository</text><text x="385" y="160.5" text-anchor="middle" class="t-body">settings in <tspan class="mono">/cobranch.yaml</tspan></text></g><g><rect x="16" y="224" width="170" height="52" rx="8" class="box"/><text x="101" y="246.5" text-anchor="middle" class="t-title">Job</text><text x="101" y="264.5" text-anchor="middle" class="t-body">a principal per job name</text></g><g><rect x="300" y="224" width="170" height="52" rx="8" class="box tone-accent"/><text x="385" y="246.5" text-anchor="middle" class="t-title">Branch</text><text x="385" y="264.5" text-anchor="middle" class="t-body">a request to merge</text></g><g><rect x="584" y="224" width="160" height="52" rx="8" class="box"/><text x="664" y="246.5" text-anchor="middle" class="t-title">Chat</text><text x="664" y="264.5" text-anchor="middle" class="t-body">threaded, real-time</text></g><g><rect x="16" y="328" width="170" height="52" rx="8" class="box"/><text x="101" y="350.5" text-anchor="middle" class="t-title">Annotation</text><text x="101" y="368.5" text-anchor="middle" class="t-body">pending, in progress, …</text></g><g><rect x="300" y="328" width="170" height="52" rx="8" class="box"/><text x="385" y="350.5" text-anchor="middle" class="t-title">Commit</text><text x="385" y="368.5" text-anchor="middle" class="t-body">its author and pusher</text></g><g><rect x="584" y="328" width="160" height="52" rx="8" class="box"/><text x="664" y="350.5" text-anchor="middle" class="t-title">Review</text><text x="664" y="368.5" text-anchor="middle" class="t-body">approved, changes, neutral</text></g></svg>
