<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 510" role="img" aria-label="ENG-199 builds annotations on commits, merge requirements from /cobranch.yaml, graph facts on every push, the status of every branch, merges by a push and by asking Cobranch, and the Console’s branch pages. Later slices: reviews and change requests, jobs that set annotations, path rules and editing settings in the Console, choosing a branch’s base, rebasing a branch, and the branch chat"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="509" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="364" height="454" rx="10" class="group tone-surface"/><text x="22" y="28" text-anchor="start" class="t-group">ENG-199 builds</text><rect x="388" y="8" width="364" height="454" rx="10" class="group"/><text x="402" y="28" text-anchor="start" class="t-group">Later slices</text><g><rect x="24" y="44" width="332" height="48" rx="8" class="box tone-accent"/><text x="190" y="64.5" text-anchor="middle" class="t-title">Annotations on commits</text><text x="190" y="82.5" text-anchor="middle" class="t-body">set, changed and deleted through the APIs</text></g><g><rect x="24" y="102" width="332" height="48" rx="8" class="box"/><text x="190" y="122.5" text-anchor="middle" class="t-title">Merge requirements</text><text x="190" y="140.5" text-anchor="middle" class="t-body">from <tspan class="mono">main</tspan>’s <tspan class="mono">/cobranch.yaml</tspan></text></g><g><rect x="24" y="160" width="332" height="48" rx="8" class="box"/><text x="190" y="180.5" text-anchor="middle" class="t-title">Graph facts on every push</text><text x="190" y="198.5" text-anchor="middle" class="t-body">ahead, behind, merges, from the Git server</text></g><g><rect x="24" y="218" width="332" height="48" rx="8" class="box tone-accent"/><text x="190" y="238.5" text-anchor="middle" class="t-title">Branch status</text><text x="190" y="256.5" text-anchor="middle" class="t-body">computed by the push worker</text></g><g><rect x="24" y="276" width="332" height="48" rx="8" class="box"/><text x="190" y="296.5" text-anchor="middle" class="t-title">Merging by a push</text><text x="190" y="314.5" text-anchor="middle" class="t-body">only Ready branches into a protected one</text></g><g><rect x="24" y="334" width="332" height="48" rx="8" class="box tone-accent"/><text x="190" y="354.5" text-anchor="middle" class="t-title">Merging by asking Cobranch</text><text x="190" y="372.5" text-anchor="middle" class="t-body">the Git server builds it, as a push</text></g><g><rect x="24" y="392" width="332" height="48" rx="8" class="box"/><text x="190" y="412.5" text-anchor="middle" class="t-title">The Console’s branch pages</text><text x="190" y="430.5" text-anchor="middle" class="t-body">status, requirements, annotations, Merge</text></g><g><rect x="404" y="44" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="64.5" text-anchor="middle" class="t-title">Reviews and change requests</text><text x="570" y="82.5" text-anchor="middle" class="t-body">ENG-216: approvals join the requirements</text></g><g><rect x="404" y="102" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="122.5" text-anchor="middle" class="t-title">Jobs that set annotations</text><text x="570" y="140.5" text-anchor="middle" class="t-body">ENG-214, pending at each push</text></g><g><rect x="404" y="160" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="180.5" text-anchor="middle" class="t-title">Path rules</text><text x="570" y="198.5" text-anchor="middle" class="t-body">requirements for the paths a branch changes</text></g><g><rect x="404" y="218" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="238.5" text-anchor="middle" class="t-title">Editing settings in the Console</text><text x="570" y="256.5" text-anchor="middle" class="t-body">through <tspan class="mono">cobranch/settings</tspan></text></g><g><rect x="404" y="276" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="296.5" text-anchor="middle" class="t-title">Choosing a branch’s base</text><text x="570" y="314.5" text-anchor="middle" class="t-body">stacked branches</text></g><g><rect x="404" y="334" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="354.5" text-anchor="middle" class="t-title">Rebasing a branch onto its base</text><text x="570" y="372.5" text-anchor="middle" class="t-body">an action of its own</text></g><g><rect x="404" y="392" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="412.5" text-anchor="middle" class="t-title">The branch chat</text><text x="570" y="430.5" text-anchor="middle" class="t-body">threads that point at code</text></g></svg>
