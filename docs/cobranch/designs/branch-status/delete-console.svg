<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 536" role="img" aria-label="On a branch’s page: main offers nothing; a viewer without repo.push, or without repo.bypass on a branch /cobranch.yaml names, sees nothing; a Merged or Empty branch gets Delete branch with a plain confirmation; a branch with commits main lacks gets a danger Delete branch whose confirmation names how many. Merging offers Delete the branch once merged, checked by default, which deletes it at the head it merged. Afterwards the page shows the deletion"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="535" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M330 42L330 66" class="edge" marker-end="url(#dg-a)"/><path d="M530 112L568 112" class="edge" marker-end="url(#dg-a)"/><text x="549" y="104" text-anchor="middle" class="t-label">no</text><path d="M330 158L330 188" class="edge" marker-end="url(#dg-a)"/><text x="338" y="177" text-anchor="start" class="t-label">yes</text><path d="M150 226L116 226L116 300" class="edge" marker-end="url(#dg-a)"/><text x="133" y="218" text-anchor="middle" class="t-label">no</text><path d="M330 264L330 300" class="edge" marker-end="url(#dg-a)"/><text x="338" y="286" text-anchor="start" class="t-label">yes, and Ready</text><path d="M510 226L634 226L634 300" class="edge" marker-end="url(#dg-a)"/><text x="572" y="218" text-anchor="middle" class="t-label">yes</text><path d="M116 364L116 414" class="edge" marker-end="url(#dg-a)"/><path d="M330 364L330 414" class="edge" marker-end="url(#dg-a)"/><text x="440" y="394" text-anchor="middle" class="t-label">deleted at the head it merged</text><path d="M634 364L634 414" class="edge" marker-end="url(#dg-a)"/><g><rect x="250" y="12" width="160" height="30" rx="15" class="box"/><text x="330" y="31.5" text-anchor="middle" class="t-title">A branch’s page</text></g><g><polygon points="330,66 530,112 330,158 130,112" class="box"/><text x="330" y="101.5" text-anchor="middle" class="t-title">Is it a branch but <tspan class="mono">main</tspan>, and does the</text><text x="330" y="116.5" text-anchor="middle" class="t-body">viewer hold <tspan class="mono">repo.push</tspan>, and <tspan class="mono">repo.bypass</tspan></text><text x="330" y="131.5" text-anchor="middle" class="t-body">where <tspan class="mono">/cobranch.yaml</tspan> names it?</text></g><g><rect x="568" y="88" width="176" height="48" rx="8" class="box tone-muted"/><text x="656" y="116.5" text-anchor="middle" class="t-title">No Delete</text></g><g><polygon points="330,188 510,226 330,264 150,226" class="box"/><text x="330" y="223" text-anchor="middle" class="t-title">Has it commits</text><text x="330" y="238" text-anchor="middle" class="t-body"><tspan class="mono">main</tspan> lacks?</text></g><g><rect x="16" y="300" width="200" height="64" rx="8" class="box tone-accent"/><text x="116" y="320.5" text-anchor="middle" class="t-title">Delete branch</text><text x="116" y="338.5" text-anchor="middle" class="t-body">Merged or Empty: a</text><text x="116" y="354.5" text-anchor="middle" class="t-body">plain confirmation</text></g><g><rect x="232" y="300" width="196" height="64" rx="8" class="box tone-accent"/><text x="330" y="320.5" text-anchor="middle" class="t-title">Merge</text><text x="330" y="338.5" text-anchor="middle" class="t-body">and Delete the branch</text><text x="330" y="354.5" text-anchor="middle" class="t-body">once merged, checked</text></g><g><rect x="524" y="300" width="220" height="64" rx="8" class="box tone-danger"/><text x="634" y="320.5" text-anchor="middle" class="t-title">Delete branch, in danger</text><text x="634" y="338.5" text-anchor="middle" class="t-body">its confirmation names</text><text x="634" y="354.5" text-anchor="middle" class="t-body">the commits main lacks</text></g><g><rect x="16" y="414" width="728" height="52" rx="8" class="box tone-success"/><text x="380" y="436.5" text-anchor="middle" class="t-title">The deleted branch’s page</text><text x="380" y="454.5" text-anchor="middle" class="t-body">who deleted it and when, its head, linked to its commit, and its merge, linked to <tspan class="mono">main</tspan>’s history</text></g><text x="16" y="500" text-anchor="start" class="t-note">Merge offers the checkbox only to a viewer who may delete the branch too; a branch that moved in between is kept.</text></svg>
