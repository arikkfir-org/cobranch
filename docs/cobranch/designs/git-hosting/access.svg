<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 692" role="img" aria-label="A request’s credential resolves to a principal; the authorizer reads, in one query, the permissions of the principal’s grants on the repository and the repository permissions of its roles at the organization; a personal token keeps only the permissions it lists; without repo.read the repository answers 404; with it but without the operation’s permission, 403; otherwise the operation runs"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="691" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M380 52L380 76" class="edge" marker-end="url(#dg-a)"/><path d="M300 128L300 144L189 144L189 160" class="edge" marker-end="url(#dg-a)"/><path d="M460 128L460 144L571 144L571 160" class="edge" marker-end="url(#dg-a)"/><path d="M189 212L189 228L330 228L330 244" class="edge" marker-end="url(#dg-a)"/><path d="M571 212L571 228L430 228L430 244" class="edge" marker-end="url(#dg-a)"/><path d="M380 296L380 324" class="edge" marker-end="url(#dg-a)"/><path d="M380 376L380 404" class="edge" marker-end="url(#dg-a)"/><path d="M510 438L576 438" class="edge" marker-end="url(#dg-a)"/><text x="543" y="430" text-anchor="middle" class="t-label">no</text><path d="M380 472L380 500" class="edge" marker-end="url(#dg-a)"/><text x="388" y="490" text-anchor="start" class="t-label">yes</text><path d="M530 538L576 538" class="edge" marker-end="url(#dg-a)"/><text x="553" y="530" text-anchor="middle" class="t-label">no</text><path d="M380 576L380 604" class="edge" marker-end="url(#dg-a)"/><text x="388" y="594" text-anchor="start" class="t-label">yes</text><g><rect x="230" y="16" width="300" height="36" rx="18" class="box"/><text x="380" y="38.5" text-anchor="middle" class="t-title">A request about a repository</text></g><g><rect x="210" y="76" width="340" height="52" rx="8" class="box"/><text x="380" y="98.5" text-anchor="middle" class="t-title">Its credential’s principal</text><text x="380" y="116.5" text-anchor="middle" class="t-body">a session, a personal token, an API key</text></g><g><rect x="24" y="160" width="330" height="52" rx="8" class="box tone-accent"/><text x="189" y="182.5" text-anchor="middle" class="t-title">Grants on the repository</text><text x="189" y="200.5" text-anchor="middle" class="t-body">every permission of their roles</text></g><g><rect x="406" y="160" width="330" height="52" rx="8" class="box tone-accent"/><text x="571" y="182.5" text-anchor="middle" class="t-title">Roles at its organization</text><text x="571" y="200.5" text-anchor="middle" class="t-body">their repository permissions only</text></g><g><rect x="230" y="244" width="300" height="52" rx="8" class="box"/><text x="380" y="266.5" text-anchor="middle" class="t-title">Both, in one query</text><text x="380" y="284.5" text-anchor="middle" class="t-body">nothing cached between requests</text></g><g><rect x="230" y="324" width="300" height="52" rx="8" class="box"/><text x="380" y="346.5" text-anchor="middle" class="t-title">A personal token keeps</text><text x="380" y="364.5" text-anchor="middle" class="t-body">only the permissions it lists</text></g><g><polygon points="380,404 510,438 380,472 250,438" class="box"/><text x="380" y="442.5" text-anchor="middle" class="t-title">Holds <tspan class="mono">repo.read</tspan>?</text></g><g><rect x="576" y="412" width="160" height="52" rx="8" class="box tone-danger"/><text x="656" y="434.5" text-anchor="middle" class="t-title"><tspan class="mono">404</tspan></text><text x="656" y="452.5" text-anchor="middle" class="t-body">as if it weren’t there</text></g><g><polygon points="380,500 530,538 380,576 230,538" class="box"/><text x="380" y="535" text-anchor="middle" class="t-title">Holds the operation’s</text><text x="380" y="550" text-anchor="middle" class="t-body">permission?</text></g><g><rect x="576" y="512" width="160" height="52" rx="8" class="box tone-danger"/><text x="656" y="534.5" text-anchor="middle" class="t-title"><tspan class="mono">403</tspan></text><text x="656" y="552.5" text-anchor="middle" class="t-body">it may see, not do</text></g><g><rect x="280" y="604" width="200" height="40" rx="8" class="box tone-success"/><text x="380" y="628.5" text-anchor="middle" class="t-title">The operation runs</text></g></svg>
