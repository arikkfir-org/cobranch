-anchor="middle" class="t-body">repositories, branches, commits</text></g><g><rect x="24" y="392" width="332" height="48" rx="8" class="box"/><text x="190" y="412.5" text-anchor="middle" class="t-title">Compaction and clean-up</text><text x="190" y="430.5" text-anchor="middle" class="t-body">the maintenance job repacks</text></g><g><rect x="404" y="44" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="64.5" text-anchor="middle" class="t-title">Branch status, merge requirements</text><text x="570" y="82.5" text-anchor="middle" class="t-body">ENG-199: what a push must merge</text></g><g><rect x="404" y="102" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="122.5" text-anchor="middle" class="t-title">Jobs on a push</text><text x="570" y="140.5" text-anchor="middle" class="t-body">ENG-214, from the push’s tasks</text></g><g><rect x="404" y="160" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="180.5" text-anchor="middle" class="t-title">Settings from <tspan class="mono">/cobranch.yaml</tspan></text><text x="570" y="198.5" text-anchor="middle" class="t-body">the default branch’s copy</text></g><g><rect x="404" y="218" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="238.5" text-anchor="middle" class="t-title">Signature checks</text><text x="570" y="256.5" text-anchor="middle" class="t-body">with users’ signing keys</text></g><g><rect x="404" y="276" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="296.5" text-anchor="middle" class="t-title">Public repositories</text><text x="570" y="314.5" text-anchor="middle" class="t-body">grants to Anonymous, and refusing them</text></g><g><rect x="404" y="334" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="354.5" text-anchor="middle" class="t-title">Deleting repositories</text><text x="570" y="372.5" text-anchor="middle" class="t-body">with their packs</text></g><g><rect x="404" y="392" width="332" height="48" rx="8" class="box dashed"/><text x="570" y="412.5" text-anchor="middle" class="t-title">Browsing files and diffs</text><text x="570" y="430.5" text-anchor="middle" class="t-body">the Git server reads objects</text></g></svg>
