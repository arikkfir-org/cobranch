<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 630" role="img" aria-label="A signed-in user asks the Console for a personal token with a name, permissions and an expiry; the REST server checks the request comes from a session, makes the cbp_ secret and stores its hash with the permissions and the session’s identity; the Console shows it once; the user gives it to Git, whose credential helper sends it as the Basic password; the Git server resolves it to the user, narrowed to its permissions"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="629" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V588" class="lifeline"/><path d="M178.4 46 V588" class="lifeline"/><path d="M292.8 46 V588" class="lifeline"/><path d="M407.2 46 V588" class="lifeline"/><path d="M521.6 46 V588" class="lifeline"/><path d="M636 46 V588" class="lifeline"/><text x="121.2" y="62" text-anchor="middle" class="t-label">1. a new token: a</text><text x="121.2" y="76" text-anchor="middle" class="t-label">name,</text><text x="121.2" y="90" text-anchor="middle" class="t-label">permissions, an</text><text x="121.2" y="104" text-anchor="middle" class="t-label">expiry</text><path d="M64 110 H177.4" class="edge" marker-end="url(#dg-a)"/><text x="235.6" y="138" text-anchor="middle" class="t-label">2. <tspan class="mono">POST /v1/me/tokens</tspan>, with the session</text><text x="235.6" y="152" text-anchor="middle" class="t-label">cookie</text><path d="M178.4 158 H291.8" class="edge" marker-end="url(#dg-a)"/><text x="306.8" y="188" text-anchor="start" class="t-label">3. a session only: no token makes a</text><text x="306.8" y="202" text-anchor="start" class="t-label">token</text><path d="M292.8 210 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="350" y="240" text-anchor="middle" class="t-label">4. its hash, hint, permissions, expiry, and the</text><text x="350" y="254" text-anchor="middle" class="t-label">session’s identity</text><path d="M292.8 260 H406.2" class="edge" marker-end="url(#dg-a)"/><text x="235.6" y="288" text-anchor="middle" class="t-label">5. the <tspan class="mono">cbp_</tspan></text><text x="235.6" y="302" text-anchor="middle" class="t-label">secret, once</text><path d="M292.8 308 H179.4" class="edge dashed" marker-end="url(#dg-a)"/><text x="121.2" y="336" text-anchor="middle" class="t-label">6. copy it now: it</text><text x="121.2" y="350" text-anchor="middle" class="t-label">is never shown</text><text x="121.2" y="364" text-anchor="middle" class="t-label">again</text><path d="M178.4 370 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="292.8" y="398" text-anchor="middle" class="t-label">7. the token, when Git asks for a</text><text x="292.8" y="412" text-anchor="middle" class="t-label">password</text><path d="M64 418 H520.6" class="edge" marker-end="url(#dg-a)"/><text x="578.8" y="446" text-anchor="middle" class="t-label">8. Basic: any name, the token as the</text><text x="578.8" y="460" text-anchor="middle" class="t-label">password</text><path d="M521.6 466 H635" class="edge" marker-end="url(#dg-a)"/><text x="521.6" y="494" text-anchor="middle" class="t-label">9. find it by its hash: live, not revoked</text><path d="M636 500 H408.2" class="edge" marker-end="url(#dg-a)"/><text x="650" y="530" text-anchor="start" class="t-label">10. the user, narrowed</text><text x="650" y="544" text-anchor="start" class="t-label">to the token</text><path d="M636 552 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">User</text><rect x="130.4" y="12" width="96" height="34" rx="8" class="box"/><text x="178.4" y="33.5" text-anchor="middle" class="t-title">Console</text><rect x="241.9" y="12" width="101.8" height="34" rx="8" class="box"/><text x="292.8" y="33.5" text-anchor="middle" class="t-title">REST server</text><rect x="358.1" y="12" width="98.2" height="34" rx="8" class="box"/><text x="407.2" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="473.6" y="12" width="96" height="34" rx="8" class="box"/><text x="521.6" y="33.5" text-anchor="middle" class="t-title">Git client</text><rect x="588" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="636" y="33.5" text-anchor="middle" class="t-title">Git server</text></svg>
