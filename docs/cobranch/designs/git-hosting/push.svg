<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 950" role="img" aria-label="The Git server authenticates the push and checks repo.push before reading the pack, builds a throwaway repository from a snapshot and runs git receive-pack on it; receive-pack quarantines and indexes the pack and runs the pre-receive hook, cobranch git-hook, which posts the ref updates to its Git server over loopback; the Git server builds the manifest with rev-list and cat-file, uploads the pack and commits the push in one PostgreSQL transaction by its push ID; the answer flows back through the hook, which exits 0, and receive-pack reports ok to the client. Later the transaction’s notification wakes the push worker, which claims the push and maps its commits to principals"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="949" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V908" class="lifeline"/><path d="M189.8 46 V908" class="lifeline"/><path d="M315.6 46 V908" class="lifeline"/><path d="M441.5 46 V908" class="lifeline"/><path d="M567.3 46 V908" class="lifeline"/><path d="M693.1 46 V908" class="lifeline"/><rect x="310.6" y="310" width="10" height="317" rx="2" class="activation"/><rect x="507.3" y="669" width="245.8" height="211" rx="6" class="frame"/><path d="M507.3 689 H548 L556 681 V669" class="frame"/><text x="515.3" y="683.5" text-anchor="start" class="t-frame">later</text><text x="564" y="683.5" text-anchor="start" class="t-label">whenever a push worker runs</text><text x="126.9" y="62" text-anchor="middle" class="t-label">1. <tspan class="mono">POST …/git-receive-pack</tspan>: ref updates</text><text x="126.9" y="76" text-anchor="middle" class="t-label">and a pack</text><path d="M64 82 H188.8" class="edge" marker-end="url(#dg-a)"/><text x="203.8" y="112" text-anchor="start" class="t-label">2. authenticate; <tspan class="mono">repo.push</tspan> before a</text><text x="203.8" y="126" text-anchor="start" class="t-label">byte of the pack</text><path d="M189.8 134 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="252.7" y="164" text-anchor="middle" class="t-label">3. a throwaway repository from a</text><text x="252.7" y="178" text-anchor="middle" class="t-label">snapshot; <tspan class="mono">--stateless-rpc</tspan></text><path d="M189.8 184 H314.6" class="edge" marker-end="url(#dg-a)"/><text x="329.6" y="214" text-anchor="start" class="t-label">4. quarantine the pack;</text><text x="329.6" y="228" text-anchor="start" class="t-label"><tspan class="mono">index-pack --fix-thin</tspan></text><path d="M315.6 236 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="252.7" y="266" text-anchor="middle" class="t-label">5. <tspan class="mono">pre-receive</tspan>: the ref updates, over</text><text x="252.7" y="280" text-anchor="middle" class="t-label">loopback with the push’s token</text><path d="M315.6 286 H190.8" class="edge" marker-end="url(#dg-a)"/><text x="203.8" y="316" text-anchor="start" class="t-label">6. refuse other refs; the manifest from</text><text x="203.8" y="330" text-anchor="start" class="t-label"><tspan class="mono">rev-list</tspan> and <tspan class="mono">cat-file</tspan></text><path d="M189.8 338 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="315.6" y="368" text-anchor="middle" class="t-label">7. upload the quarantined pack and its</text><text x="315.6" y="382" text-anchor="middle" class="t-label">index</text><path d="M189.8 388 H440.5" class="edge" marker-end="url(#dg-a)"/><text x="378.6" y="416" text-anchor="middle" class="t-label">8. one transaction, by the push ID</text><path d="M189.8 422 H566.3" class="edge" marker-end="url(#dg-a)"/><rect x="354.4" y="444" width="300" height="87" rx="6" class="note tone-accent"/><text x="366.4" y="461" text-anchor="start" class="t-body">Lock the repository; check every ref’s old SHA;</text><text x="366.4" y="476" text-anchor="start" class="t-body">list the pack; insert the push, waiting for the push</text><text x="366.4" y="491" text-anchor="start" class="t-body">worker, and its new commits; move the refs;</text><text x="366.4" y="506" text-anchor="start" class="t-body">create, move and delete branches; append event</text><text x="366.4" y="521" text-anchor="start" class="t-body">repo.pushed; notify cobranch_pushes.</text><text x="378.6" y="553" text-anchor="middle" class="t-label">9. committed</text><path d="M567.3 559 H190.8" class="edge dashed" marker-end="url(#dg-a)"/><text x="252.7" y="587" text-anchor="middle" class="t-label">10. accepted: the</text><text x="252.7" y="601" text-anchor="middle" class="t-label">hook exits 0</text><path d="M189.8 607 H314.6" class="edge dashed" marker-end="url(#dg-a)"/><text x="189.8" y="635" text-anchor="middle" class="t-label">11. <tspan class="mono">ok refs/heads/main</tspan>: the push returns</text><path d="M315.6 641 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="630.2" y="709" text-anchor="middle" class="t-label">12. the notification</text><text x="630.2" y="723" text-anchor="middle" class="t-label">wakes it</text><path d="M567.3 729 H692.1" class="edge dashed" marker-end="url(#dg-a)"/><text x="630.2" y="757" text-anchor="middle" class="t-label">13. claim the oldest waiting</text><text x="630.2" y="771" text-anchor="middle" class="t-label">push, <tspan class="mono">SKIP LOCKED</tspan></text><path d="M693.1 777 H568.3" class="edge" marker-end="url(#dg-a)"/><rect x="484" y="799" width="260" height="57" rx="6" class="note"/><text x="496" y="816" text-anchor="start" class="t-body">Map its commits’ authors and committers</text><text x="496" y="831" text-anchor="start" class="t-body">to principals; mark it processed. A failure</text><text x="496" y="846" text-anchor="start" class="t-body">waits for a retry.</text><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Git client</text><rect x="141.8" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="189.8" y="33.5" text-anchor="middle" class="t-title">Git server</text><rect x="245.1" y="12" width="141" height="34" rx="8" class="box"/><text x="315.6" y="33.5" text-anchor="middle" class="t-title">receive-pack, hook</text><rect x="393.5" y="12" width="96" height="34" rx="8" class="box"/><text x="441.5" y="33.5" text-anchor="middle" class="t-title">Bucket</text><rect x="518.2" y="12" width="98.2" height="34" rx="8" class="box"/><text x="567.3" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="642.2" y="12" width="101.8" height="34" rx="8" class="box tone-accent"/><text x="693.1" y="33.5" text-anchor="middle" class="t-title">Push worker</text></svg>
