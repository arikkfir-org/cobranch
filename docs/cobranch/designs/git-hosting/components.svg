<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 470" role="img" aria-label="Git clients reach the Git server over HTTPS, later SSH; the Git server reads PostgreSQL, reads and writes packs in the bucket, and sends each push’s manifest to the push worker, which writes PostgreSQL in one transaction. The browser loads the Console, which calls the REST and GraphQL servers for repositories, branches and commits. The operator routes urls.git to the Git server, may supply the internal secret, and exposes SSH"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="469" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="96" width="744" height="220" rx="10" class="group"/><text x="22" y="116" text-anchor="start" class="t-group">Cobranch</text><rect x="8" y="334" width="744" height="88" rx="10" class="group dashed"/><text x="22" y="354" text-anchor="start" class="t-group">The operator’s</text><path d="M116 64L116 136" class="edge" marker-end="url(#dg-a)"/><text x="124" y="104" text-anchor="start" class="t-label">HTTPS, then SSH</text><path d="M536 64L536 136" class="edge" marker-end="url(#dg-a)"/><text x="544" y="104" text-anchor="start" class="t-label">API</text><path d="M676 64L676 136" class="edge" marker-end="url(#dg-a)"/><text x="684" y="104" text-anchor="start" class="t-label">pages</text><path d="M208 170L272 170" class="edge" marker-end="url(#dg-a)"/><text x="240" y="162" text-anchor="middle" class="t-label">manifest</text><path d="M116 204L116 236" class="edge" marker-end="url(#dg-a)"/><path d="M190 204L190 220L290 220L290 236" class="edge" marker-end="url(#dg-a)"/><text x="298" y="216" text-anchor="start" class="t-label">reads</text><path d="M380 204L380 236" class="edge" marker-end="url(#dg-a)"/><text x="388" y="226" text-anchor="start" class="t-label">writes</text><path d="M520 204L520 236" class="edge" marker-end="url(#dg-a)"/><g><rect x="24" y="16" width="200" height="48" rx="8" class="box"/><text x="124" y="36.5" text-anchor="middle" class="t-title">Git client</text><text x="124" y="54.5" text-anchor="middle" class="t-body">a token, or an SSH key</text></g><g><rect x="440" y="16" width="296" height="48" rx="8" class="box"/><text x="588" y="36.5" text-anchor="middle" class="t-title">Browser</text><text x="588" y="54.5" text-anchor="middle" class="t-body">the Console’s pages, the session cookie</text></g><g><rect x="24" y="136" width="184" height="68" rx="8" class="box tone-accent"/><text x="116" y="158.5" text-anchor="middle" class="t-title">Git server</text><text x="116" y="176.5" text-anchor="middle" class="t-body"><tspan class="mono">cobranch git-server</tspan>, new</text><text x="116" y="192.5" text-anchor="middle" class="t-body">a pack cache on <tspan class="mono">emptyDir</tspan></text></g><g><rect x="272" y="136" width="152" height="68" rx="8" class="box tone-accent"/><text x="348" y="158.5" text-anchor="middle" class="t-title">Push worker</text><text x="348" y="176.5" text-anchor="middle" class="t-body"><tspan class="mono">cobranch push-worker</tspan>,</text><text x="348" y="192.5" text-anchor="middle" class="t-body">new: the only ref writer</text></g><g><rect x="440" y="136" width="160" height="68" rx="8" class="box"/><text x="520" y="158.5" text-anchor="middle" class="t-title">REST, GraphQL</text><text x="520" y="176.5" text-anchor="middle" class="t-body">repositories, tokens,</text><text x="520" y="192.5" text-anchor="middle" class="t-body">branches, commits</text></g><g><rect x="616" y="136" width="120" height="68" rx="8" class="box"/><text x="676" y="166.5" text-anchor="middle" class="t-title">Console</text><text x="676" y="184.5" text-anchor="middle" class="t-body">code pages</text></g><g><path d="M24 242 a100 6 0 0 1 200 0 v48 a100 6 0 0 1 -200 0 z" class="box"/><path d="M24 242 a100 6 0 0 0 200 0" class="rim"/><text x="124" y="266" text-anchor="middle" class="t-title">Bucket</text><text x="124" y="282" text-anchor="middle" class="t-body"><tspan class="mono">git/&lt;repo-id&gt;/</tspan> packs</text></g><g><path d="M256 242 a240 6 0 0 1 480 0 v48 a240 6 0 0 1 -480 0 z" class="box"/><path d="M256 242 a240 6 0 0 0 480 0" class="rim"/><text x="496" y="266" text-anchor="middle" class="t-title">PostgreSQL</text><text x="496" y="282" text-anchor="middle" class="t-body">repositories, refs, packs, pushes, commits, branches, tokens</text></g><g><rect x="24" y="362" width="220" height="48" rx="8" class="box dashed"/><text x="134" y="382.5" text-anchor="middle" class="t-title">A route to <tspan class="mono">urls.git</tspan></text><text x="134" y="400.5" text-anchor="middle" class="t-body">a host, or a path prefix</text></g><g><rect x="268" y="362" width="220" height="48" rx="8" class="box dashed"/><text x="378" y="382.5" text-anchor="middle" class="t-title">The internal secret</text><text x="378" y="400.5" text-anchor="middle" class="t-body">generated, or a Secret</text></g><g><rect x="512" y="362" width="224" height="48" rx="8" class="box dashed"/><text x="624" y="382.5" text-anchor="middle" class="t-title">SSH exposure</text><text x="624" y="400.5" text-anchor="middle" class="t-body">a load balancer, a node port</text></g></svg>
