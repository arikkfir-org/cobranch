<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 660" role="img" aria-label="A clone or fetch is two requests, the ref advertisement and the fetch. For each the Git server authenticates, checks repo.read, reads the refs and the pack list in one statement, downloads the packs its cache lacks, builds a throwaway bare repository whose pack directory hard-links the snapshot’s packs and whose packed-refs holds the refs, and runs git upload-pack on it"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="659" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V618" class="lifeline"/><path d="M219.2 46 V618" class="lifeline"/><path d="M374.3 46 V618" class="lifeline"/><path d="M529.5 46 V618" class="lifeline"/><path d="M684.6 46 V618" class="lifeline"/><text x="141.6" y="62" text-anchor="middle" class="t-label">1. <tspan class="mono">GET …/info/refs?service=git-upload-pack</tspan></text><path d="M64 68 H218.2" class="edge" marker-end="url(#dg-a)"/><text x="233.2" y="98" text-anchor="start" class="t-label">2. no credential: <tspan class="mono">401</tspan>, so Git asks for</text><text x="233.2" y="112" text-anchor="start" class="t-label">one</text><path d="M219.2 120 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="296.7" y="150" text-anchor="middle" class="t-label">3. the credential; <tspan class="mono">repo.read</tspan>, else <tspan class="mono">404</tspan></text><path d="M219.2 156 H373.3" class="edge" marker-end="url(#dg-a)"/><text x="296.7" y="184" text-anchor="middle" class="t-label">4. the refs and the pack list, in one</text><text x="296.7" y="198" text-anchor="middle" class="t-label">statement</text><path d="M219.2 204 H373.3" class="edge" marker-end="url(#dg-a)"/><text x="374.3" y="232" text-anchor="middle" class="t-label">5. the packs the cache lacks, and their indexes</text><path d="M219.2 238 H528.5" class="edge" marker-end="url(#dg-a)"/><text x="233.2" y="268" text-anchor="start" class="t-label">6. a throwaway bare repository: hard</text><text x="233.2" y="282" text-anchor="start" class="t-label">links to the snapshot’s packs, its</text><text x="233.2" y="296" text-anchor="start" class="t-label">refs in <tspan class="mono">packed-refs</tspan></text><path d="M219.2 304 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="451.9" y="334" text-anchor="middle" class="t-label">7. <tspan class="mono">--advertise-refs</tspan></text><path d="M219.2 340 H683.6" class="edge" marker-end="url(#dg-a)"/><text x="374.3" y="368" text-anchor="middle" class="t-label">8. the refs, through the Git server</text><path d="M684.6 374 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="141.6" y="402" text-anchor="middle" class="t-label">9. <tspan class="mono">POST …/git-upload-pack</tspan>: wants and haves</text><path d="M64 408 H218.2" class="edge" marker-end="url(#dg-a)"/><text x="233.2" y="438" text-anchor="start" class="t-label">10. the same checks, a fresh</text><text x="233.2" y="452" text-anchor="start" class="t-label">snapshot, another throwaway</text><text x="233.2" y="466" text-anchor="start" class="t-label">repository</text><path d="M219.2 474 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="451.9" y="504" text-anchor="middle" class="t-label">11. <tspan class="mono">--stateless-rpc</tspan></text><path d="M219.2 510 H683.6" class="edge" marker-end="url(#dg-a)"/><text x="374.3" y="538" text-anchor="middle" class="t-label">12. the pack</text><path d="M684.6 544 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="233.2" y="574" text-anchor="start" class="t-label">13. delete the throwaway repository</text><path d="M219.2 582 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Git client</text><rect x="171.2" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="219.2" y="33.5" text-anchor="middle" class="t-title">Git server</text><rect x="325.2" y="12" width="98.2" height="34" rx="8" class="box"/><text x="374.3" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="479.5" y="12" width="99.9" height="34" rx="8" class="box"/><text x="529.5" y="33.5" text-anchor="middle" class="t-title">Object store</text><rect x="625.3" y="12" width="118.7" height="34" rx="8" class="box"/><text x="684.6" y="33.5" text-anchor="middle" class="t-title">git upload-pack</text></svg>
