<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 872 320" role="img" aria-label="New table reviews, keyed by ID, on a repository’s commit, by a reviewer, with its state, body and task; new table review_settings, a parsed copy of main’s /cobranch-review.yaml; merge_requirements gains approvals and ai; chat_threads gains the review a comment belongs to; agent_tasks gains kind review; agents are ENG-215’s, with built_in"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="871" height="319" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M236 44.5L310 44.5" class="edge" marker-end="url(#dg-a)"/><text x="273" y="36.5" text-anchor="middle" class="t-label">receives</text><path d="M530 74.5L604 74.5" class="edge" marker-end="url(#dg-a)"/><text x="567" y="66.5" text-anchor="middle" class="t-label">opens</text><path d="M604 214L567 214L567 112L530 112" class="edge" marker-end="url(#dg-a)"/><text x="574" y="160" text-anchor="start" class="t-label">submits</text><g><rect x="16" y="16" width="220" height="57" rx="6" class="box tone-muted"/><path d="M16 44 H236" class="rule"/><text x="28" y="35" text-anchor="start" class="t-title mono">commits</text><text x="28" y="62" text-anchor="start" class="t-field">repo_id, sha</text></g><g><rect x="310" y="16" width="220" height="117" rx="6" class="box tone-accent"/><path d="M310 44 H530" class="rule"/><text x="322" y="35" text-anchor="start" class="t-title mono">reviews</text><text x="322" y="62" text-anchor="start" class="t-field">id; repo_id, sha</text><text x="322" y="77" text-anchor="start" class="t-field">reviewer_id</text><text x="322" y="92" text-anchor="start" class="t-field">state</text><text x="518" y="92" text-anchor="end" class="t-note">three</text><text x="322" y="107" text-anchor="start" class="t-field">body, submitted_at</text><text x="322" y="122" text-anchor="start" class="t-field">task_id</text><text x="518" y="122" text-anchor="end" class="t-note">when an agent’s</text></g><g><rect x="604" y="16" width="220" height="72" rx="6" class="box tone-ai"/><path d="M604 44 H824" class="rule"/><text x="616" y="35" text-anchor="start" class="t-title mono">chat_threads</text><text x="616" y="62" text-anchor="start" class="t-field">ENG-215’s: sha, path, lines</text><text x="616" y="77" text-anchor="start" class="t-field">+ review_id</text></g><g><rect x="16" y="170" width="220" height="87" rx="6" class="box tone-accent"/><path d="M16 198 H236" class="rule"/><text x="28" y="189" text-anchor="start" class="t-title mono">merge_requirements</text><text x="28" y="216" text-anchor="start" class="t-field">repo_id, branch</text><text x="224" y="216" text-anchor="end" class="t-note">key</text><text x="28" y="231" text-anchor="start" class="t-field">+ approvals</text><text x="28" y="246" text-anchor="start" class="t-field">+ ai</text></g><g><rect x="310" y="170" width="220" height="102" rx="6" class="box tone-accent"/><path d="M310 198 H530" class="rule"/><text x="322" y="189" text-anchor="start" class="t-title mono">review_settings</text><text x="322" y="216" text-anchor="start" class="t-field">repo_id</text><text x="518" y="216" text-anchor="end" class="t-note">key</text><text x="322" y="231" text-anchor="start" class="t-field">enabled, branches</text><text x="322" y="246" text-anchor="start" class="t-field">ignore, instructions,</text><text x="322" y="261" text-anchor="start" class="t-field">include, max_diff_lines</text></g><g><rect x="604" y="170" width="220" height="87" rx="6" class="box tone-ai"/><path d="M604 198 H824" class="rule"/><text x="616" y="189" text-anchor="start" class="t-title mono">agent_tasks</text><text x="616" y="216" text-anchor="start" class="t-field">ENG-215’s: state, agent</text><text x="616" y="231" text-anchor="start" class="t-field">+ kind review</text><text x="616" y="246" text-anchor="start" class="t-field">repo_id, branch_id, sha</text></g></svg>
