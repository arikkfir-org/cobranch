<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 460" role="img" aria-label="ENG-216 builds reviews on commits, required reviews in main’s /cobranch.yaml and the branch status, diffs of branches and commits, /cobranch-review.yaml, the built-in AI reviewer and its review tasks. It uses ENG-215’s agents, model choice, tasks, harness and branch chats, and ENG-214’s controller, outside-push gate and job triggers. Later: approvals that survive a push, change requests resolved one by one, reviews required from named people or groups through path rules"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="459" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="360" height="404" rx="10" class="group tone-surface"/><text x="22" y="28" text-anchor="start" class="t-group">ENG-216 builds</text><rect x="392" y="8" width="360" height="260" rx="10" class="group"/><text x="406" y="28" text-anchor="start" class="t-group">It builds on</text><rect x="392" y="284" width="360" height="128" rx="10" class="group"/><text x="406" y="304" text-anchor="start" class="t-group">Later slices</text><g><rect x="24" y="44" width="328" height="50" rx="8" class="box tone-accent"/><text x="188" y="65.5" text-anchor="middle" class="t-title">Reviews on commits</text><text x="188" y="83.5" text-anchor="middle" class="t-body">Approved, Changes requested, Neutral</text></g><g><rect x="24" y="105" width="328" height="50" rx="8" class="box"/><text x="188" y="126.5" text-anchor="middle" class="t-title">Required reviews</text><text x="188" y="144.5" text-anchor="middle" class="t-body"><tspan class="mono">requires.reviews</tspan> in <tspan class="mono">main</tspan>’s file</text></g><g><rect x="24" y="166" width="328" height="50" rx="8" class="box"/><text x="188" y="187.5" text-anchor="middle" class="t-title">Diffs</text><text x="188" y="205.5" text-anchor="middle" class="t-body">a branch against <tspan class="mono">main</tspan>, a commit against its parent</text></g><g><rect x="24" y="227" width="328" height="50" rx="8" class="box"/><text x="188" y="248.5" text-anchor="middle" class="t-title"><tspan class="mono">/cobranch-review.yaml</tspan></text><text x="188" y="266.5" text-anchor="middle" class="t-body">the reviewer’s settings, from <tspan class="mono">main</tspan></text></g><g><rect x="24" y="288" width="328" height="50" rx="8" class="box tone-ai"/><text x="188" y="309.5" text-anchor="middle" class="t-title">The built-in AI reviewer</text><text x="188" y="327.5" text-anchor="middle" class="t-body">an agent of every organization</text></g><g><rect x="24" y="349" width="328" height="50" rx="8" class="box tone-ai"/><text x="188" y="370.5" text-anchor="middle" class="t-title">A review task on every push</text><text x="188" y="388.5" text-anchor="middle" class="t-body">queued by the push worker</text></g><g><rect x="408" y="44" width="328" height="66" rx="8" class="box tone-ai"/><text x="572" y="65.5" text-anchor="middle" class="t-title">ENG-215: agents and branch chats</text><text x="572" y="83.5" text-anchor="middle" class="t-body">agents and their models, tasks, the harness,</text><text x="572" y="99.5" text-anchor="middle" class="t-body">anchored chat threads</text></g><g><rect x="408" y="124" width="328" height="66" rx="8" class="box"/><text x="572" y="145.5" text-anchor="middle" class="t-title">ENG-214: jobs</text><text x="572" y="163.5" text-anchor="middle" class="t-body">the controller, the outside-push gate,</text><text x="572" y="179.5" text-anchor="middle" class="t-body">the <tspan class="mono">review</tspan> trigger’s matching</text></g><g><rect x="408" y="204" width="328" height="50" rx="8" class="box tone-muted"/><text x="572" y="225.5" text-anchor="middle" class="t-title">ENG-199: branch status</text><text x="572" y="243.5" text-anchor="middle" class="t-body">checks, Processing and Blocked</text></g><g><rect x="408" y="316" width="328" height="40" rx="8" class="box dashed"/><text x="572" y="340.5" text-anchor="middle" class="t-title">Approvals that survive a push</text></g><g><rect x="408" y="364" width="328" height="40" rx="8" class="box dashed"/><text x="572" y="388.5" text-anchor="middle" class="t-title">Path rules naming who must approve</text></g></svg>
