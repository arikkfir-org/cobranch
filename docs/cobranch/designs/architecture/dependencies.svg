<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 436" role="img" aria-label="The operator brings PostgreSQL, one bucket, identity providers and the routes in; the chart generates signing keys, the internal call secret and the secrets key; all of it reaches the workloads as environment variables"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="435" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="300" height="380" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">The operator brings</text><rect x="540" y="76" width="212" height="232" rx="10" class="group"/><text x="554" y="96" text-anchor="start" class="t-group">The chart generates, if absent</text><path d="M292 84L324 84L324 190L356 190" class="edge" marker-end="url(#dg-a)"/><path d="M292 180L324 180L324 190L356 190" class="edge" marker-end="url(#dg-a)"/><path d="M292 274L324 274L324 190L356 190" class="edge" marker-end="url(#dg-a)"/><path d="M292 344L324 344L324 190L356 190" class="edge" marker-end="url(#dg-a)"/><path d="M556 138L531 138L531 190L506 190" class="edge" marker-end="url(#dg-a)"/><path d="M556 202L531 202L531 190L506 190" class="edge" marker-end="url(#dg-a)"/><path d="M556 266L531 266L531 190L506 190" class="edge" marker-end="url(#dg-a)"/><g><path d="M24 50 a134 6 0 0 1 268 0 v68 a134 6 0 0 1 -268 0 z" class="box"/><path d="M24 50 a134 6 0 0 0 268 0" class="rim"/><text x="158" y="74" text-anchor="middle" class="t-title">PostgreSQL 16 or later</text><text x="158" y="90" text-anchor="middle" class="t-body">its URL in a Secret,</text><text x="158" y="106" text-anchor="middle" class="t-body">or the chart’s StatefulSet</text></g><g><path d="M24 146 a134 6 0 0 1 268 0 v68 a134 6 0 0 1 -268 0 z" class="box"/><path d="M24 146 a134 6 0 0 0 268 0" class="rim"/><text x="158" y="170" text-anchor="middle" class="t-title">One bucket, a Go Cloud URL</text><text x="158" y="186" text-anchor="middle" class="t-body"><tspan class="mono">s3://</tspan>, <tspan class="mono">gs://</tspan>, <tspan class="mono">azblob://</tspan>,</text><text x="158" y="202" text-anchor="middle" class="t-body">or <tspan class="mono">file://</tspan> for a single node</text></g><g><rect x="24" y="240" width="268" height="68" rx="8" class="box"/><text x="158" y="262.5" text-anchor="middle" class="t-title">Identity providers</text><text x="158" y="280.5" text-anchor="middle" class="t-body">any OpenID Connect provider,</text><text x="158" y="296.5" text-anchor="middle" class="t-body">Google a preset; GitHub’s OAuth later</text></g><g><rect x="24" y="324" width="268" height="40" rx="8" class="box"/><text x="158" y="348.5" text-anchor="middle" class="t-title">The domain, TLS and the routes</text></g><g><rect x="356" y="156" width="150" height="68" rx="8" class="box tone-accent"/><text x="431" y="178.5" text-anchor="middle" class="t-title">Cobranch workloads</text><text x="431" y="196.5" text-anchor="middle" class="t-body">configured only by</text><text x="431" y="212.5" text-anchor="middle" class="t-body">environment variables</text></g><g><rect x="556" y="112" width="180" height="52" rx="8" class="box"/><text x="646" y="134.5" text-anchor="middle" class="t-title">Signing keys</text><text x="646" y="152.5" text-anchor="middle" class="t-body">for sessions and tokens</text></g><g><rect x="556" y="176" width="180" height="52" rx="8" class="box"/><text x="646" y="198.5" text-anchor="middle" class="t-title">Internal call secret</text><text x="646" y="216.5" text-anchor="middle" class="t-body">never rotated on upgrade</text></g><g><rect x="556" y="240" width="180" height="52" rx="8" class="box"/><text x="646" y="262.5" text-anchor="middle" class="t-title">Secrets key</text><text x="646" y="280.5" text-anchor="middle" class="t-body">encrypts stored secrets</text></g></svg>
