<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 1022" role="img" aria-label="The Git client sends the pack; the Git server quarantines it, builds the manifest, uploads the pack and commits one transaction that moves the refs; then the client returns. The transaction’s NOTIFY wakes the GraphQL servers, which update Consoles, and the push worker, which claims the push and does what can wait in a transaction of its own"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="1021" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V980" class="lifeline"/><path d="M187.3 46 V980" class="lifeline"/><path d="M310.5 46 V980" class="lifeline"/><path d="M433.8 46 V980" class="lifeline"/><path d="M557 46 V980" class="lifeline"/><path d="M680.3 46 V980" class="lifeline"/><rect x="182.3" y="453" width="10" height="182" rx="2" class="activation"/><rect x="373.8" y="711" width="366.5" height="241" rx="6" class="frame"/><path d="M373.8 731 H414.5 L422.5 723 V711" class="frame"/><text x="381.8" y="725.5" text-anchor="start" class="t-frame">later</text><text x="430.5" y="725.5" text-anchor="start" class="t-label">whenever a push worker runs</text><text x="125.6" y="62" text-anchor="middle" class="t-label">1. connect over</text><text x="125.6" y="76" text-anchor="middle" class="t-label">HTTPS or SSH</text><path d="M64 82 H186.3" class="edge" marker-end="url(#dg-a)"/><text x="201.3" y="112" text-anchor="start" class="t-label">2. authenticate; check write permission before</text><text x="201.3" y="126" text-anchor="start" class="t-label">reading a byte of the pack</text><path d="M187.3 134 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="125.6" y="164" text-anchor="middle" class="t-label">3. the pack and the</text><text x="125.6" y="178" text-anchor="middle" class="t-label">ref updates</text><path d="M64 184 H186.3" class="edge" marker-end="url(#dg-a)"/><text x="201.3" y="214" text-anchor="start" class="t-label">4. <tspan class="mono">receive-pack</tspan> quarantines the pack;</text><text x="201.3" y="228" text-anchor="start" class="t-label"><tspan class="mono">index-pack --fix-thin</tspan> completes it</text><path d="M187.3 236 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="201.3" y="268" text-anchor="start" class="t-label">5. the pre-receive hook builds the manifest</text><path d="M187.3 276 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><rect x="83.9" y="300" width="330" height="87" rx="6" class="note"/><text x="95.9" y="317" text-anchor="start" class="t-body">The manifest: the ref updates; the new commits with</text><text x="95.9" y="332" text-anchor="start" class="t-body">their metadata and signatures; each updated tip’s</text><text x="95.9" y="347" text-anchor="start" class="t-body">/cobranch.yaml; and the graph facts that need the</text><text x="95.9" y="362" text-anchor="start" class="t-body">objects: which branches contain their base, which</text><text x="95.9" y="377" text-anchor="start" class="t-body">merged into an updated base, ahead and behind counts.</text><text x="248.9" y="409" text-anchor="middle" class="t-label">6. upload the</text><text x="248.9" y="423" text-anchor="middle" class="t-label">quarantined pack</text><path d="M187.3 429 H309.5" class="edge" marker-end="url(#dg-a)"/><text x="310.5" y="457" text-anchor="middle" class="t-label">7. one transaction, by the push ID</text><path d="M187.3 463 H432.8" class="edge" marker-end="url(#dg-a)"/><rect x="243.8" y="485" width="380" height="102" rx="6" class="note tone-accent"/><text x="255.8" y="502" text-anchor="start" class="t-body">Move every ref by compare-and-swap on its old SHA, refusing a</text><text x="255.8" y="517" text-anchor="start" class="t-body">push into a protected branch that merges no Ready branch; list</text><text x="255.8" y="532" text-anchor="start" class="t-body">the pack; insert the commits and the push, waiting for the push</text><text x="255.8" y="547" text-anchor="start" class="t-body">worker; create, move or delete branches; apply /cobranch.yaml</text><text x="255.8" y="562" text-anchor="start" class="t-body">when the default branch changed it; append event repo.pushed;</text><text x="255.8" y="577" text-anchor="start" class="t-body">NOTIFY.</text><text x="310.5" y="609" text-anchor="middle" class="t-label">8. committed</text><path d="M433.8 615 H188.3" class="edge dashed" marker-end="url(#dg-a)"/><text x="125.6" y="643" text-anchor="middle" class="t-label">9. push accepted</text><path d="M187.3 649 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="557" y="677" text-anchor="middle" class="t-label">10. NOTIFY: Consoles update</text><path d="M433.8 683 H679.3" class="edge dashed" marker-end="url(#dg-a)"/><text x="495.4" y="751" text-anchor="middle" class="t-label">11. NOTIFY wakes</text><text x="495.4" y="765" text-anchor="middle" class="t-label">it</text><path d="M433.8 771 H556" class="edge dashed" marker-end="url(#dg-a)"/><text x="495.4" y="799" text-anchor="middle" class="t-label">12. claim the push,</text><text x="495.4" y="813" text-anchor="middle" class="t-label"><tspan class="mono">SKIP LOCKED</tspan></text><path d="M557 819 H434.8" class="edge" marker-end="url(#dg-a)"/><rect x="373.8" y="841" width="366.5" height="87" rx="6" class="note tone-accent"/><text x="385.8" y="858" text-anchor="start" class="t-body">Check signatures; map authors to principals; recompute the</text><text x="385.8" y="873" text-anchor="start" class="t-body">branches’ status; a pending annotation for each job the new</text><text x="385.8" y="888" text-anchor="start" class="t-body">tips declare; mark merged branches Merged, the pusher</text><text x="385.8" y="903" text-anchor="start" class="t-body">merging; append events and tasks; mark the push processed;</text><text x="385.8" y="918" text-anchor="start" class="t-body">NOTIFY.</text><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Git client</text><rect x="139.3" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="187.3" y="33.5" text-anchor="middle" class="t-title">Git server</text><rect x="260.5" y="12" width="99.9" height="34" rx="8" class="box"/><text x="310.5" y="33.5" text-anchor="middle" class="t-title">Object store</text><rect x="384.7" y="12" width="98.2" height="34" rx="8" class="box"/><text x="433.8" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="506.1" y="12" width="101.8" height="34" rx="8" class="box tone-accent"/><text x="557" y="33.5" text-anchor="middle" class="t-title">Push worker</text><rect x="616.5" y="12" width="127.5" height="34" rx="8" class="box"/><text x="680.3" y="33.5" text-anchor="middle" class="t-title">GraphQL servers</text></svg>
