or="middle" class="t-title">Secrets in manifests</text><text x="570" y="243.5" text-anchor="middle" class="t-body">Cobranch’s secrets into values</text></g><g><rect x="404" y="260" width="332" height="46" rx="8" class="box dashed"/><text x="570" y="279.5" text-anchor="middle" class="t-title">Cloud identities for clusters</text><text x="570" y="297.5" text-anchor="middle" class="t-body">tokens traded, no kubeconfig to keep</text></g><g><rect x="404" y="314" width="332" height="46" rx="8" class="box dashed"/><text x="570" y="333.5" text-anchor="middle" class="t-title">Several namespaces per environment</text><text x="570" y="351.5" text-anchor="middle" class="t-body">and cluster-wide objects in this cluster</text></g><g><rect x="404" y="368" width="332" height="46" rx="8" class="box dashed"/><text x="570" y="387.5" text-anchor="middle" class="t-title">Diffs before applying</text><text x="570" y="405.5" text-anchor="middle" class="t-body">what a push would change, on its branch</text></g><g><rect x="404" y="422" width="332" height="46" rx="8" class="box dashed"/><text x="570" y="441.5" text-anchor="middle" class="t-title">Progressive delivery</text><text x="570" y="459.5" text-anchor="middle" class="t-body">canaries; rolling back on health</text></g></svg>
