<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 416" role="img" aria-label="Each rendered object is checked: a namespaced object takes the environment’s namespace and may not name another; a cluster-scoped object is refused in this installation’s cluster; an object another environment or nobody of Cobranch’s owns is refused; the rest gets the environment’s label, is ordered by kind, server-side applied with field manager cobranch, CRDs first until Established; then the inventory is recorded and what the previous inventory held and this one doesn’t is deleted"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="415" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M166 36L196 36" class="edge" marker-end="url(#dg-a)"/><path d="M428 36L610 36L610 96" class="edge" marker-end="url(#dg-a)"/><text x="452" y="28" text-anchor="start" class="t-label">yes</text><path d="M312 72L312 96" class="edge" marker-end="url(#dg-a)"/><text x="320" y="86" text-anchor="start" class="t-label">no, or another cluster</text><path d="M428 132L476 132" class="edge" marker-end="url(#dg-a)"/><text x="452" y="124" text-anchor="middle" class="t-label">yes</text><path d="M312 168L312 192" class="edge" marker-end="url(#dg-a)"/><text x="320" y="182" text-anchor="start" class="t-label">no; none takes the environment’s</text><path d="M428 228L610 228L610 168" class="edge" marker-end="url(#dg-a)"/><text x="452" y="220" text-anchor="start" class="t-label">yes</text><path d="M312 264L312 284L102 284L102 300" class="edge" marker-end="url(#dg-a)"/><text x="120" y="278" text-anchor="start" class="t-label">no, or it is this environment’s</text><path d="M188 334L204 334" class="edge" marker-end="url(#dg-a)"/><path d="M376 334L392 334" class="edge" marker-end="url(#dg-a)"/><path d="M564 334L580 334" class="edge" marker-end="url(#dg-a)"/><g><rect x="16" y="21" width="150" height="30" rx="15" class="box"/><text x="91" y="40.5" text-anchor="middle" class="t-title">The render</text></g><g><polygon points="312,0 428,36 312,72 196,36" class="box"/><text x="312" y="33" text-anchor="middle" class="t-title">Cluster-scoped?</text><text x="312" y="48" text-anchor="middle" class="t-body">in this installation’s cluster</text></g><g><polygon points="312,96 428,132 312,168 196,132" class="box"/><text x="312" y="129" text-anchor="middle" class="t-title">Another namespace?</text><text x="312" y="144" text-anchor="middle" class="t-body">than the environment’s</text></g><g><polygon points="312,192 428,228 312,264 196,228" class="box"/><text x="312" y="225" text-anchor="middle" class="t-title">Already there?</text><text x="312" y="240" text-anchor="middle" class="t-body">and not this environment’s</text></g><g><rect x="476" y="96" width="268" height="72" rx="8" class="box tone-danger"/><text x="610" y="120.5" text-anchor="middle" class="t-title">The delivery fails</text><text x="610" y="138.5" text-anchor="middle" class="t-body">naming each object refused;</text><text x="610" y="154.5" text-anchor="middle" class="t-body">nothing is applied</text></g><g><rect x="16" y="300" width="172" height="68" rx="8" class="box"/><text x="102" y="322.5" text-anchor="middle" class="t-title">Label and order</text><text x="102" y="340.5" text-anchor="middle" class="t-body"><tspan class="mono">cobranch.dev/environment</tspan>;</text><text x="102" y="356.5" text-anchor="middle" class="t-body">Helm’s kind order</text></g><g><rect x="204" y="300" width="172" height="68" rx="8" class="box tone-accent"/><text x="290" y="322.5" text-anchor="middle" class="t-title">Server-side apply</text><text x="290" y="340.5" text-anchor="middle" class="t-body">field manager <tspan class="mono">cobranch</tspan>,</text><text x="290" y="356.5" text-anchor="middle" class="t-body">CRDs Established first</text></g><g><rect x="392" y="300" width="172" height="68" rx="8" class="box"/><text x="478" y="322.5" text-anchor="middle" class="t-title">Inventory</text><text x="478" y="340.5" text-anchor="middle" class="t-body">every object applied,</text><text x="478" y="356.5" text-anchor="middle" class="t-body">with its UID</text></g><g><rect x="580" y="300" width="164" height="68" rx="8" class="box"/><text x="662" y="322.5" text-anchor="middle" class="t-title">Prune</text><text x="662" y="340.5" text-anchor="middle" class="t-body">what the last held and</text><text x="662" y="356.5" text-anchor="middle" class="t-body">this one doesn’t</text></g></svg>
