ize: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="291" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M152 90L164 90" class="edge" marker-end="url(#dg-a)"/><path d="M300 90L312 90" class="edge" marker-end="url(#dg-a)"/><path d="M448 90L460 90" class="edge" marker-end="url(#dg-a)"/><path d="M596 90L608 90" class="edge" marker-end="url(#dg-a)"/><path d="M380 192L380 140" class="edge" marker-end="url(#dg-a)"/><path d="M528 192L528 140" class="edge" marker-end="url(#dg-a)"/><path d="M676 192L676 140" class="edge" marker-end="url(#dg-a)"/><g><rect x="16" y="40" width="136" height="100" rx="8" class="box"/><text x="84" y="70.5" text-anchor="middle" class="t-title">1. Rendering</text><text x="84" y="88.5" text-anchor="middle" class="t-body"><tspan class="mono">delivery</tspan> parsed,</text><text x="84" y="104.5" text-anchor="middle" class="t-body">roots rendered,</text><text x="84" y="120.5" text-anchor="middle" class="t-body"><tspan class="mono">cobranch render</tspan></text></g><g><rect x="164" y="40" width="136" height="100" rx="8" class="box"/><text x="232" y="70.5" text-anchor="middle" class="t-title">2. Applying</text><text x="232" y="88.5" text-anchor="middle" class="t-body">apply, order,</text><text x="232" y="104.5" text-anchor="middle" class="t-body">ownership, prune,</text><text x="232" y="120.5" text-anchor="middle" class="t-body">health</text></g><g><rect x="312" y="40" width="136" height="100" rx="8" class="box"/><text x="380" y="70.5" text-anchor="middle" class="t-title">3. Environments</text><text x="380" y="88.5" text-anchor="middle" class="t-body">queued with pushes,</text><text x="380" y="104.5" text-anchor="middle" class="t-body">Pending; Console</text><text x="380" y="120.5" text-anchor="middle" class="t-body">and APIs</text></g><g><rect x="460" y="40" width="136" height="100" rx="8" class="box"/><text x="528" y="70.5" text-anchor="middle" class="t-title">4. This cluster</text><text x="528" y="88.5" text-anchor="middle" class="t-body">the controller,</text><text x="528" y="104.5" text-anchor="middle" class="t-body">render pods,</text><text x="528" y="120.5" text-anchor="middle" class="t-body">chart’s RBAC</text></g><g><rect x="608" y="40" width="136" height="100" rx="8" class="box"/><text x="676" y="70.5" text-anchor="middle" class="t-title">5. Other clusters</text><text x="676" y="88.5" text-anchor="middle" class="t-body">kubeconfigs,</text><text x="676" y="104.5" text-anchor="middle" class="t-body">teardown;</text><text x="676" y="120.5" text-anchor="middle" class="t-body">closes ENG-218</text></g><g><rect x="312" y="192" width="136" height="52" rx="8" class="box dashed"/><text x="380" y="214.5" text-anchor="middle" class="t-title">Jobs PR 1</text><text x="380" y="232.5" text-anchor="middle" class="t-body">the parser</text></g><g><rect x="460" y="192" width="136" height="52" rx="8" class="box dashed"/><text x="528" y="214.5" text-anchor="middle" class="t-title">Jobs PR 2</text><text x="528" y="232.5" text-anchor="middle" class="t-body">the controller</text></g><g><rect x="608" y="192" width="136" height="52" rx="8" class="box dashed"/><text x="676" y="214.5" text-anchor="middle" class="t-title">Jobs PR 3</text><text x="676" y="232.5" text-anchor="middle" class="t-body">secrets</text></g><text x="16" y="20" text-anchor="start" class="t-note">Each pull request is Part of ENG-218, with its tests, and keeps main working; the first two need nothing of jobs.</text></svg>
