<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 477" role="img" aria-label="The push worker commits the delivery with the push’s processing; the controller is down, so the NOTIFY reaches nobody; a replica starts and claims it; it dies while applying; its lease expires; another replica claims the delivery again, renders or reuses the stored render, applies again, which changes nothing already applied, and prunes"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="476" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M66.9 46 V435" class="lifeline"/><path d="M222.3 46 V435" class="lifeline"/><path d="M377.7 46 V435" class="lifeline"/><path d="M533.1 46 V435" class="lifeline"/><path d="M688.5 46 V435" class="lifeline"/><text x="144.6" y="62" text-anchor="middle" class="t-label">the delivery, with the</text><text x="144.6" y="76" text-anchor="middle" class="t-label">push</text><path d="M66.9 82 H221.3" class="edge" marker-end="url(#dg-a)"/><rect x="162.3" y="104" width="275.4" height="42" rx="6" class="note"/><text x="174.3" y="121" text-anchor="start" class="t-body">The controller is down or scaled to zero; the</text><text x="174.3" y="136" text-anchor="start" class="t-body">NOTIFY reaches nobody.</text><text x="300" y="168" text-anchor="middle" class="t-label">starts; claims every waiting delivery</text><path d="M377.7 174 H223.3" class="edge" marker-end="url(#dg-a)"/><text x="533.1" y="202" text-anchor="middle" class="t-label">applies half of it, then dies</text><path d="M377.7 208 H687.5" class="edge" marker-end="url(#dg-a)"/><rect x="162.3" y="230" width="430.8" height="27" rx="6" class="note"/><text x="174.3" y="247" text-anchor="start" class="t-body">Its lease expires; the delivery is Queued again, its render kept.</text><text x="377.7" y="279" text-anchor="middle" class="t-label">claims it</text><path d="M533.1 285 H223.3" class="edge" marker-end="url(#dg-a)"/><text x="610.8" y="313" text-anchor="middle" class="t-label">applies it all: the half already there is</text><text x="610.8" y="327" text-anchor="middle" class="t-label">unchanged</text><path d="M533.1 333 H687.5" class="edge" marker-end="url(#dg-a)"/><text x="610.8" y="361" text-anchor="middle" class="t-label">prunes, from the last recorded inventory</text><path d="M533.1 367 H687.5" class="edge" marker-end="url(#dg-a)"/><text x="377.7" y="395" text-anchor="middle" class="t-label">inventory, revision, Succeeded</text><path d="M533.1 401 H223.3" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="101.8" height="34" rx="8" class="box tone-accent"/><text x="66.9" y="33.5" text-anchor="middle" class="t-title">Push worker</text><rect x="173.2" y="12" width="98.2" height="34" rx="8" class="box"/><text x="222.3" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="329.4" y="12" width="96.5" height="34" rx="8" class="box tone-accent"/><text x="377.7" y="33.5" text-anchor="middle" class="t-title">Controller A</text><rect x="484.8" y="12" width="96.5" height="34" rx="8" class="box tone-accent"/><text x="533.1" y="33.5" text-anchor="middle" class="t-title">Controller B</text><rect x="632.9" y="12" width="111.1" height="34" rx="8" class="box"/><text x="688.5" y="33.5" text-anchor="middle" class="t-title">Target cluster</text></svg>
