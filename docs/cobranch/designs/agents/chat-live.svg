<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 651" role="img" aria-label="A person posts a message through GraphQL; the GraphQL server writes the message and an event and sends NOTIFY in one transaction; every GraphQL server’s listener wakes the branch’s subscribers, which read the events after their cursor and push them over WebSocket; a reconnecting client sends its last cursor and gets what it missed"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="650" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M69.9 46 V609" class="lifeline"/><path d="M225.9 46 V609" class="lifeline"/><path d="M381.9 46 V609" class="lifeline"/><path d="M537.8 46 V609" class="lifeline"/><path d="M693.8 46 V609" class="lifeline"/><rect x="477.8" y="457" width="276" height="124" rx="6" class="frame"/><path d="M477.8 477 H507.8 L515.8 469 V457" class="frame"/><text x="485.8" y="471.5" text-anchor="start" class="t-frame">alt</text><text x="523.8" y="471.5" text-anchor="start" class="t-label">Bob’s connection drops</text><text x="615.8" y="62" text-anchor="middle" class="t-label">1. subscribe</text><text x="615.8" y="76" text-anchor="middle" class="t-label"><tspan class="mono">chatUpdates(branch,</tspan></text><text x="615.8" y="90" text-anchor="middle" class="t-label">after)<tspan class="mono"></tspan></text><path d="M693.8 96 H538.8" class="edge" marker-end="url(#dg-a)"/><text x="147.9" y="124" text-anchor="middle" class="t-label">2. <tspan class="mono">postChatMessage</tspan></text><path d="M69.9 130 H224.9" class="edge" marker-end="url(#dg-a)"/><text x="303.9" y="158" text-anchor="middle" class="t-label">3. one transaction</text><path d="M225.9 164 H380.9" class="edge" marker-end="url(#dg-a)"/><rect x="153.9" y="186" width="300" height="57" rx="6" class="note tone-accent"/><text x="165.9" y="203" text-anchor="start" class="t-body">Insert the message; append event</text><text x="165.9" y="218" text-anchor="start" class="t-body">chat.message.posted, subject the branch;</text><text x="165.9" y="233" text-anchor="start" class="t-body">NOTIFY chats with the branch’s ID.</text><text x="147.9" y="265" text-anchor="middle" class="t-label">4. the message</text><path d="M225.9 271 H70.9" class="edge dashed" marker-end="url(#dg-a)"/><text x="459.8" y="299" text-anchor="middle" class="t-label">5. NOTIFY: the branch’s</text><text x="459.8" y="313" text-anchor="middle" class="t-label">ID</text><path d="M381.9 319 H536.8" class="edge dashed" marker-end="url(#dg-a)"/><text x="459.8" y="347" text-anchor="middle" class="t-label">6. events after Bob’s</text><text x="459.8" y="361" text-anchor="middle" class="t-label">cursor, if he still reads</text><text x="459.8" y="375" text-anchor="middle" class="t-label">the repository</text><path d="M537.8 381 H382.9" class="edge" marker-end="url(#dg-a)"/><text x="615.8" y="409" text-anchor="middle" class="t-label">7. the update and its</text><text x="615.8" y="423" text-anchor="middle" class="t-label">cursor</text><path d="M537.8 429 H692.8" class="edge dashed" marker-end="url(#dg-a)"/><text x="615.8" y="497" text-anchor="middle" class="t-label">8. subscribe again with</text><text x="615.8" y="511" text-anchor="middle" class="t-label">the last cursor</text><path d="M693.8 517 H538.8" class="edge" marker-end="url(#dg-a)"/><text x="615.8" y="545" text-anchor="middle" class="t-label">9. every update since</text><path d="M537.8 551 H692.8" class="edge dashed" marker-end="url(#dg-a)"/><rect x="16" y="12" width="107.9" height="34" rx="8" class="box"/><text x="69.9" y="33.5" text-anchor="middle" class="t-title">Alice’s client</text><rect x="165.9" y="12" width="120.1" height="34" rx="8" class="box tone-accent"/><text x="225.9" y="33.5" text-anchor="middle" class="t-title">GraphQL server</text><rect x="332.8" y="12" width="98.2" height="34" rx="8" class="box"/><text x="381.9" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="477.8" y="12" width="120.1" height="34" rx="8" class="box tone-accent"/><text x="537.8" y="33.5" text-anchor="middle" class="t-title">GraphQL server</text><rect x="643.5" y="12" width="100.5" height="34" rx="8" class="box"/><text x="693.8" y="33.5" text-anchor="middle" class="t-title">Bob’s client</text></svg>
