<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 575" role="img" aria-label="The harness asks the model proxy for a turn; the proxy sends it on to the provider with the key, reads the tokens the answer says it read and wrote, and reports them as the task to the REST API, which prices them at the organization’s prices, adds them to the task’s spend and, once the spend reaches the lower of the agent’s and the model’s caps, fails the task saying why; the proxy then refuses every further turn"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="574" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V533" class="lifeline"/><path d="M221.7 46 V533" class="lifeline"/><path d="M379.5 46 V533" class="lifeline"/><path d="M537.2 46 V533" class="lifeline"/><path d="M694.9 46 V533" class="lifeline"/><rect x="477.2" y="274" width="277.7" height="90" rx="6" class="frame"/><path d="M477.2 294 H507.2 L515.2 286 V274" class="frame"/><text x="485.2" y="288.5" text-anchor="start" class="t-frame">alt</text><text x="523.2" y="288.5" text-anchor="start" class="t-label">spent reaches its cap</text><text x="142.9" y="62" text-anchor="middle" class="t-label">1. a turn of the task’s</text><text x="142.9" y="76" text-anchor="middle" class="t-label">model, asked whole</text><path d="M64 82 H220.7" class="edge" marker-end="url(#dg-a)"/><text x="300.6" y="110" text-anchor="middle" class="t-label">2. the turn, with the key</text><path d="M221.7 116 H378.5" class="edge tone-ai" marker-end="url(#dg-a-ai)"/><text x="300.6" y="144" text-anchor="middle" class="t-label">3. the answer and its</text><text x="300.6" y="158" text-anchor="middle" class="t-label">usage</text><path d="M379.5 164 H222.7" class="edge dashed tone-ai" marker-end="url(#dg-a-ai)"/><text x="379.5" y="192" text-anchor="middle" class="t-label">4. <tspan class="mono">POST /v1/me/task/spend</tspan>: call ID, tokens</text><path d="M221.7 198 H536.2" class="edge" marker-end="url(#dg-a)"/><text x="616" y="226" text-anchor="middle" class="t-label">5. lock the task; price the</text><text x="616" y="240" text-anchor="middle" class="t-label">call; add it once</text><path d="M537.2 246 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="616" y="314" text-anchor="middle" class="t-label">6. the task Failed, saying</text><text x="616" y="328" text-anchor="middle" class="t-label">why</text><path d="M537.2 334 H693.9" class="edge" marker-end="url(#dg-a)"/><text x="379.5" y="386" text-anchor="middle" class="t-label">7. spent, cap, ended</text><path d="M537.2 392 H222.7" class="edge dashed" marker-end="url(#dg-a)"/><text x="142.9" y="420" text-anchor="middle" class="t-label">8. the answer</text><path d="M221.7 426 H65" class="edge dashed" marker-end="url(#dg-a)"/><rect x="16" y="448" width="300" height="57" rx="6" class="note tone-accent"/><text x="28" y="465" text-anchor="start" class="t-body">Once the task has ended, the proxy answers 402</text><text x="28" y="480" text-anchor="start" class="t-body">to every turn; a report that failed goes again</text><text x="28" y="495" text-anchor="start" class="t-body">before the next turn, which waits for it.</text><rect x="16" y="12" width="96" height="34" rx="8" class="box tone-ai"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Harness</text><rect x="172" y="12" width="99.4" height="34" rx="8" class="box tone-accent"/><text x="221.7" y="33.5" text-anchor="middle" class="t-title">Model proxy</text><rect x="331.5" y="12" width="96" height="34" rx="8" class="box tone-ai"/><text x="379.5" y="33.5" text-anchor="middle" class="t-title">Provider</text><rect x="489.2" y="12" width="96" height="34" rx="8" class="box"/><text x="537.2" y="33.5" text-anchor="middle" class="t-title">REST API</text><rect x="645.8" y="12" width="98.2" height="34" rx="8" class="box"/><text x="694.9" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text></svg>
