<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 372" role="img" aria-label="The Git server reads the snapshot, lays out the repository’s few files and links each pack from the cache: a hit when the cache holds it, a miss when it downloads it from storage first. The time from the snapshot’s read to the last link is the repository’s build time. The request then runs git on it; when it ends, the server sums the files in the repository that nothing else links, which is its disk, and removes it"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="371" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="196" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group"><tspan class="mono">cobranch.git.workspace.duration</tspan>: from the snapshot’s read to the last pack linked</text><rect x="8" y="228" width="744" height="96" rx="10" class="group"/><text x="22" y="248" text-anchor="start" class="t-group"><tspan class="mono">cobranch.git.workspace.size</tspan>: counted when it goes</text><path d="M42 74L56 74" class="edge" marker-end="url(#dg-a)"/><path d="M252 74L276 74" class="edge" marker-end="url(#dg-a)"/><path d="M472 74L500 74" class="edge" marker-end="url(#dg-a)"/><path d="M638 108L638 132" class="edge" marker-end="url(#dg-a)"/><text x="648" y="124" text-anchor="start" class="t-label">yes</text><path d="M580 98L580 116L374 116L374 132" class="edge" marker-end="url(#dg-a)"/><text x="470" y="110" text-anchor="middle" class="t-label">no</text><path d="M472 158L540 158" class="edge" marker-end="url(#dg-a)"/><text x="506" y="152" text-anchor="middle" class="t-label">then</text><path d="M638 184L638 256" class="edge" marker-end="url(#dg-a)"/><path d="M540 282L472 282" class="edge" marker-end="url(#dg-a)"/><path d="M276 282L74 282" class="edge" marker-end="url(#dg-a)"/><circle cx="33" cy="74" r="7" class="dot"/><g><rect x="56" y="48" width="196" height="52" rx="8" class="box"/><text x="154" y="70.5" text-anchor="middle" class="t-title">Read the snapshot</text><text x="154" y="88.5" text-anchor="middle" class="t-body">refs and packs, one statement</text></g><g><rect x="276" y="48" width="196" height="52" rx="8" class="box"/><text x="374" y="70.5" text-anchor="middle" class="t-title">Lay it out</text><text x="374" y="88.5" text-anchor="middle" class="t-body"><tspan class="mono">HEAD</tspan>, <tspan class="mono">config</tspan>, <tspan class="mono">packed-refs</tspan></text></g><g><polygon points="618,40 736,74 618,108 500,74" class="box"/><text x="618" y="78.5" text-anchor="middle" class="t-title">Each pack: in the cache?</text></g><g><rect x="276" y="132" width="196" height="52" rx="8" class="box tone-warning"/><text x="374" y="154.5" text-anchor="middle" class="t-title">Download it from storage</text><text x="374" y="172.5" text-anchor="middle" class="t-body">a lookup’s <tspan class="mono">miss</tspan></text></g><g><rect x="540" y="132" width="196" height="52" rx="8" class="box tone-success"/><text x="638" y="154.5" text-anchor="middle" class="t-title">Hard-link it</text><text x="638" y="172.5" text-anchor="middle" class="t-body">a <tspan class="mono">hit</tspan> when it was there</text></g><g><rect x="540" y="256" width="196" height="52" rx="8" class="box"/><text x="638" y="278.5" text-anchor="middle" class="t-title">Serve the request</text><text x="638" y="296.5" text-anchor="middle" class="t-body"><tspan class="mono">git</tspan> on the repository</text></g><g><rect x="276" y="256" width="196" height="52" rx="8" class="box tone-accent"/><text x="374" y="278.5" text-anchor="middle" class="t-title">Remove it</text><text x="374" y="296.5" text-anchor="middle" class="t-body">sum the files nothing else links</text></g><circle cx="65" cy="282" r="9" class="ring"/><circle cx="65" cy="282" r="5" class="dot"/></svg>
