<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 488" role="img" aria-label="The Console in the viewer’s browser times each page view and counts the Git reads each answer names in Server-Timing, then reports the views to the REST server. The REST and GraphQL servers time their routes and fields and read code through the Git server’s internal call; the Git server times and sizes each throwaway repository and counts its pack cache’s hits. Each workload’s OpenTelemetry SDK exports its metrics, pushed over OTLP to the operator’s collector or vendor, or served at /metrics for the operator’s scraper"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="487" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="8" width="744" height="84" rx="10" class="group"/><text x="22" y="28" text-anchor="start" class="t-group">The viewer’s browser</text><rect x="8" y="124" width="744" height="200" rx="10" class="group"/><text x="22" y="144" text-anchor="start" class="t-group">Cobranch’s workloads</text><rect x="8" y="356" width="744" height="84" rx="10" class="group"/><text x="22" y="376" text-anchor="start" class="t-group">The operator’s, whichever they run</text><path d="M128 80L128 160" class="edge" marker-end="url(#dg-a)"/><text x="138" y="110" text-anchor="start" class="t-label">page views; API calls</text><path d="M632 80L632 160" class="edge" marker-end="url(#dg-a)"/><text x="642" y="110" text-anchor="start" class="t-label">API calls</text><path d="M232 198L276 198" class="edge" marker-end="url(#dg-a)"/><path d="M528 198L484 198" class="edge" marker-end="url(#dg-a)"/><path d="M128 236L128 260" class="edge" marker-end="url(#dg-a)"/><path d="M380 236L380 260" class="edge" marker-end="url(#dg-a)"/><path d="M632 236L632 260" class="edge" marker-end="url(#dg-a)"/><path d="M300 308L300 384" class="edge" marker-end="url(#dg-a)"/><text x="310" y="342" text-anchor="start" class="t-label"><tspan class="mono">otlp</tspan>: pushed</text><path d="M566 384L566 308" class="edge" marker-end="url(#dg-a)"/><text x="576" y="342" text-anchor="start" class="t-label"><tspan class="mono">prometheus</tspan>: scraped</text><g><rect x="24" y="36" width="712" height="44" rx="8" class="box tone-accent"/><text x="380" y="54.5" text-anchor="middle" class="t-title">Console</text><text x="380" y="72.5" text-anchor="middle" class="t-body">times each page view; counts the <tspan class="mono">git</tspan> entries of each answer’s <tspan class="mono">Server-Timing</tspan></text></g><g><rect x="24" y="160" width="208" height="76" rx="8" class="box tone-accent"/><text x="128" y="178.5" text-anchor="middle" class="t-title">REST server</text><text x="128" y="196.5" text-anchor="middle" class="t-body"><tspan class="mono">POST /v1/page-views</tspan>:</text><text x="128" y="212.5" text-anchor="middle" class="t-body">page times and reads;</text><text x="128" y="228.5" text-anchor="middle" class="t-body">its routes’ times</text></g><g><rect x="276" y="160" width="208" height="76" rx="8" class="box tone-accent"/><text x="380" y="178.5" text-anchor="middle" class="t-title">Git server</text><text x="380" y="196.5" text-anchor="middle" class="t-body">throwaway repositories:</text><text x="380" y="212.5" text-anchor="middle" class="t-body">time and disk;</text><text x="380" y="228.5" text-anchor="middle" class="t-body">the pack cache’s hits</text></g><g><rect x="528" y="160" width="208" height="76" rx="8" class="box"/><text x="632" y="186.5" text-anchor="middle" class="t-title">GraphQL server</text><text x="632" y="204.5" text-anchor="middle" class="t-body">root fields’ times;</text><text x="632" y="220.5" text-anchor="middle" class="t-body">its route’s time</text></g><g><rect x="24" y="260" width="712" height="48" rx="8" class="box"/><text x="380" y="280.5" text-anchor="middle" class="t-title">OpenTelemetry’s SDK, in every workload</text><text x="380" y="298.5" text-anchor="middle" class="t-body">one meter provider, configured by <tspan class="mono">OTEL_METRICS_EXPORTER</tspan> and its variables</text></g><g><rect x="24" y="384" width="340" height="44" rx="8" class="box"/><text x="194" y="402.5" text-anchor="middle" class="t-title">A collector or a vendor</text><text x="194" y="420.5" text-anchor="middle" class="t-body">OTLP over HTTP, pushed every interval</text></g><g><rect x="396" y="384" width="340" height="44" rx="8" class="box"/><text x="566" y="402.5" text-anchor="middle" class="t-title">A Prometheus-compatible scraper</text><text x="566" y="420.5" text-anchor="middle" class="t-body"><tspan class="mono">/metrics</tspan> on container port <tspan class="mono">metrics</tspan></text></g></svg>
