<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 608" role="img" aria-label="The Back-office’s page asks the Admin server who the viewer is and gets 401; it sends the browser to the Auth server with a return URL under the Back-office’s own; after the provider, the Auth server sets the session cookie and returns there; the page asks again and gets the viewer with the permissions they hold at the installation, and shows the pages those allow"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="607" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V566" class="lifeline"/><path d="M217.8 46 V566" class="lifeline"/><path d="M371.6 46 V566" class="lifeline"/><path d="M525.4 46 V566" class="lifeline"/><path d="M679.2 46 V566" class="lifeline"/><text x="140.9" y="62" text-anchor="middle" class="t-label">1. a page</text><path d="M64 68 H216.8" class="edge" marker-end="url(#dg-a)"/><text x="217.8" y="96" text-anchor="middle" class="t-label">2. <tspan class="mono">GET /v1/me</tspan>, with no session</text><path d="M64 102 H370.6" class="edge" marker-end="url(#dg-a)"/><text x="217.8" y="130" text-anchor="middle" class="t-label">3. <tspan class="mono">401</tspan></text><path d="M371.6 136 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="294.7" y="164" text-anchor="middle" class="t-label">4. sign in: a provider, and a return URL under the</text><text x="294.7" y="178" text-anchor="middle" class="t-label">Back-office’s</text><path d="M64 184 H524.4" class="edge" marker-end="url(#dg-a)"/><text x="539.4" y="214" text-anchor="start" class="t-label">5. keep the return only if it is under</text><text x="539.4" y="228" text-anchor="start" class="t-label">the Console’s or the Back-office’s</text><text x="539.4" y="242" text-anchor="start" class="t-label">URL</text><path d="M525.4 250 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="602.3" y="280" text-anchor="middle" class="t-label">6. the code flow, as for</text><text x="602.3" y="294" text-anchor="middle" class="t-label">the Console</text><path d="M525.4 300 H678.2" class="edge" marker-end="url(#dg-a)"/><text x="602.3" y="328" text-anchor="middle" class="t-label">7. an ID token</text><path d="M679.2 334 H526.4" class="edge dashed" marker-end="url(#dg-a)"/><text x="294.7" y="362" text-anchor="middle" class="t-label">8. the session cookie, for every Cobranch URL;</text><text x="294.7" y="376" text-anchor="middle" class="t-label">redirect to the return URL</text><path d="M525.4 382 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="217.8" y="410" text-anchor="middle" class="t-label">9. <tspan class="mono">GET /v1/me</tspan>, with the cookie</text><path d="M64 416 H370.6" class="edge" marker-end="url(#dg-a)"/><text x="217.8" y="444" text-anchor="middle" class="t-label">10. the user, and what they hold at the</text><text x="217.8" y="458" text-anchor="middle" class="t-label">installation</text><path d="M371.6 464 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="78" y="494" text-anchor="start" class="t-label">11. show the pages those permissions</text><text x="78" y="508" text-anchor="start" class="t-label">allow; none: “you administer nothing</text><text x="78" y="522" text-anchor="start" class="t-label">here”</text><path d="M64 530 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Browser</text><rect x="169.8" y="12" width="96" height="34" rx="8" class="box tone-accent"/><text x="217.8" y="33.5" text-anchor="middle" class="t-title">Back-office</text><rect x="318.9" y="12" width="105.5" height="34" rx="8" class="box tone-accent"/><text x="371.6" y="33.5" text-anchor="middle" class="t-title">Admin server</text><rect x="477.4" y="12" width="96" height="34" rx="8" class="box"/><text x="525.4" y="33.5" text-anchor="middle" class="t-title">Auth server</text><rect x="614.4" y="12" width="129.6" height="34" rx="8" class="box"/><text x="679.2" y="33.5" text-anchor="middle" class="t-title">Identity provider</text></svg>
