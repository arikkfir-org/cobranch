<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 460" role="img" aria-label="The browser loads the Back-office’s pages, signs in at the Auth server and calls the Admin server with its session cookie; scripts may call the Admin server with an API key. The Admin server and the Auth server use PostgreSQL; the Auth server reads the installation’s settings and identity providers there and in the chart’s values. The operator routes both workloads, perhaps on an internal gateway, and sets the chart’s values and the secrets key"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="459" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="8" y="96" width="560" height="208" rx="10" class="group"/><text x="22" y="116" text-anchor="start" class="t-group">Cobranch</text><rect x="8" y="320" width="744" height="92" rx="10" class="group dashed"/><text x="22" y="340" text-anchor="start" class="t-group">The operator’s</text><path d="M84 64L84 136" class="edge" marker-end="url(#dg-a)"/><text x="92" y="86" text-anchor="start" class="t-label">pages</text><path d="M220 64L220 136" class="edge" marker-end="url(#dg-a)"/><text x="228" y="86" text-anchor="start" class="t-label">sign in</text><path d="M356 64L356 136" class="edge" marker-end="url(#dg-a)"/><text x="364" y="86" text-anchor="start" class="t-label">cookie</text><path d="M492 64L492 136" class="edge" marker-end="url(#dg-a)"/><text x="500" y="86" text-anchor="start" class="t-label">API key</text><path d="M280 150L288 150L288 120L668 120L668 136" class="edge" marker-end="url(#dg-a)"/><text x="600" y="113" text-anchor="middle" class="t-label">exchanges codes</text><path d="M220 188L220 220" class="edge" marker-end="url(#dg-a)"/><path d="M424 188L424 220" class="edge" marker-end="url(#dg-a)"/><g><rect x="24" y="16" width="392" height="48" rx="8" class="box"/><text x="220" y="36.5" text-anchor="middle" class="t-title">Browser</text><text x="220" y="54.5" text-anchor="middle" class="t-body">the Back-office’s pages, the session cookie</text></g><g><rect x="432" y="16" width="120" height="48" rx="8" class="box"/><text x="492" y="36.5" text-anchor="middle" class="t-title">Script</text><text x="492" y="54.5" text-anchor="middle" class="t-body">an API key</text></g><g><rect x="24" y="136" width="120" height="52" rx="8" class="box tone-accent"/><text x="84" y="158.5" text-anchor="middle" class="t-title">Back-office</text><text x="84" y="176.5" text-anchor="middle" class="t-body">static pages, new</text></g><g><rect x="160" y="136" width="120" height="52" rx="8" class="box"/><text x="220" y="158.5" text-anchor="middle" class="t-title">Auth server</text><text x="220" y="176.5" text-anchor="middle" class="t-body">signs in</text></g><g><rect x="296" y="136" width="256" height="52" rx="8" class="box tone-accent"/><text x="424" y="158.5" text-anchor="middle" class="t-title">Admin server</text><text x="424" y="176.5" text-anchor="middle" class="t-body">the Admin API under <tspan class="mono">/v1/</tspan>, new</text></g><g><path d="M160 226 a196 6 0 0 1 392 0 v48 a196 6 0 0 1 -392 0 z" class="box"/><path d="M160 226 a196 6 0 0 0 392 0" class="rim"/><text x="356" y="250" text-anchor="middle" class="t-title">PostgreSQL</text><text x="356" y="266" text-anchor="middle" class="t-body">organizations, users, settings, providers</text></g><g><rect x="24" y="224" width="120" height="52" rx="8" class="box dashed"/><text x="84" y="246.5" text-anchor="middle" class="t-title">Console, APIs</text><text x="84" y="264.5" text-anchor="middle" class="t-body">as before</text></g><g><rect x="592" y="136" width="152" height="68" rx="8" class="box"/><text x="668" y="158.5" text-anchor="middle" class="t-title">Identity providers</text><text x="668" y="176.5" text-anchor="middle" class="t-body">the values’ and</text><text x="668" y="192.5" text-anchor="middle" class="t-body">the Back-office’s</text></g><g><rect x="24" y="352" width="248" height="48" rx="8" class="box dashed"/><text x="148" y="372.5" text-anchor="middle" class="t-title">A route for each</text><text x="148" y="390.5" text-anchor="middle" class="t-body">perhaps on a gateway only operators reach</text></g><g><rect x="288" y="352" width="248" height="48" rx="8" class="box dashed"/><text x="412" y="372.5" text-anchor="middle" class="t-title">The chart’s values</text><text x="412" y="390.5" text-anchor="middle" class="t-body">URLs; settings they lock; providers</text></g><g><rect x="552" y="352" width="184" height="48" rx="8" class="box dashed"/><text x="644" y="372.5" text-anchor="middle" class="t-title">The secrets key</text><text x="644" y="390.5" text-anchor="middle" class="t-body">generated, or a Secret</text></g></svg>
