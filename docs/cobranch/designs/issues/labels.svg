<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 320" role="img" aria-label="Organization acme owns labels Bug in red, Feature in blue, Docs in green, Design in yellow and Chore in gray; issues.manage creates, renames, recolours and deletes them; issue ACME-3 carries Bug and Design, which issues.write ticks; the issues list filters by labels"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="319" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><rect x="232" y="8" width="232" height="252" rx="10" class="group tone-surface"/><text x="246" y="28" text-anchor="start" class="t-group">acme’s labels</text><path d="M200 126L232 126" class="edge" marker-end="url(#dg-a)"/><text x="216" y="118" text-anchor="middle" class="t-label">owns</text><path d="M464 86L528 86" class="edge" marker-end="url(#dg-a)"/><text x="496" y="78" text-anchor="middle" class="t-label">ticked</text><path d="M464 206L528 206" class="edge" marker-end="url(#dg-a)"/><text x="496" y="198" text-anchor="middle" class="t-label">filter</text><g><rect x="16" y="92" width="184" height="68" rx="8" class="box"/><text x="108" y="122.5" text-anchor="middle" class="t-title">Organization <tspan class="mono">acme</tspan></text><text x="108" y="140.5" text-anchor="middle" class="t-body">names unique, in any case</text></g><g><rect x="256" y="44" width="184" height="30" rx="15" class="box tone-danger"/><text x="348" y="63.5" text-anchor="middle" class="t-title">Bug · red</text></g><g><rect x="256" y="86" width="184" height="30" rx="15" class="box tone-accent"/><text x="348" y="105.5" text-anchor="middle" class="t-title">Feature · blue</text></g><g><rect x="256" y="128" width="184" height="30" rx="15" class="box tone-success"/><text x="348" y="147.5" text-anchor="middle" class="t-title">Docs · green</text></g><g><rect x="256" y="170" width="184" height="30" rx="15" class="box tone-warning"/><text x="348" y="189.5" text-anchor="middle" class="t-title">Design · yellow</text></g><g><rect x="256" y="212" width="184" height="30" rx="15" class="box tone-muted"/><text x="348" y="231.5" text-anchor="middle" class="t-title">Chore · gray</text></g><g><rect x="528" y="44" width="216" height="84" rx="8" class="box tone-accent"/><text x="636" y="74.5" text-anchor="middle" class="t-title"><tspan class="mono">ACME-3</tspan></text><text x="636" y="92.5" text-anchor="middle" class="t-body">carries Bug and Design</text><text x="636" y="108.5" text-anchor="middle" class="t-body">at most 20 labels</text></g><g><rect x="528" y="172" width="216" height="68" rx="8" class="box"/><text x="636" y="194.5" text-anchor="middle" class="t-title">Issues list</text><text x="636" y="212.5" text-anchor="middle" class="t-body">filtered by labels:</text><text x="636" y="228.5" text-anchor="middle" class="t-body">those carrying them all</text></g><text x="16" y="284" text-anchor="start" class="t-note"><tspan class="mono">issues.manage</tspan> creates, renames, recolours and deletes them; <tspan class="mono">issues.write</tspan> ticks them on an issue; <tspan class="mono">issues.read</tspan> sees them.</text></svg>
