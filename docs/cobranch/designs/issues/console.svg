perties</text><text x="628" y="112.5" text-anchor="middle" class="t-body">State</text><text x="628" y="128.5" text-anchor="middle" class="t-body">Priority</text><text x="628" y="144.5" text-anchor="middle" class="t-body">Assignee</text><text x="628" y="160.5" text-anchor="middle" class="t-body">Repository</text><text x="628" y="176.5" text-anchor="middle" class="t-body">Labels</text><text x="628" y="192.5" text-anchor="middle" class="t-body">Created by, when</text></g><g><rect x="520" y="248" width="216" height="40" rx="8" class="box tone-ai"/><text x="628" y="272.5" text-anchor="middle" class="t-title">Assign to an agent</text></g></svg>
