<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 792 600" role="img" aria-label="A client pushes acme-42-login; the Git server records the push; later the push worker claims it, finds ACME-42 in the name, links the branch and moves the issue from Todo to In progress for the pusher. Separately, someone creates issue ACME-43, and the API server links the live branches that name it in the same transaction"><style>svg{--color-bg-inverse:#1a1d20;--color-bg-selected:#eceef0;--color-bg-sunken:#f8f9fa;--color-bg-surface:#ffffff;--color-border-default:#e4e7ea;--color-border-strong:#d3d8dc;--color-fg-default:#1a1d20;--color-fg-inverse:#ffffff;--color-fg-muted:#6b737b;--color-fg-subtle:#8a939b;--color-status-ai-bg:#f5f3ff;--color-status-ai-solid:#8b5cf6;--color-status-danger-bg:#fef2f2;--color-status-danger-solid:#e5484d;--color-status-info-bg:#eef4ff;--color-status-info-solid:#3b6ef0;--color-status-success-bg:#ecfdf3;--color-status-success-solid:#16a35f;--color-status-warning-bg:#fff8eb;--color-status-warning-solid:#db8a0c;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){svg{--color-bg-inverse:#f8f9fa;--color-bg-selected:#2e3338;--color-bg-sunken:#0c0d0f;--color-bg-surface:#1a1d20;--color-border-default:#2e3338;--color-border-strong:#4a5158;--color-fg-default:#f8f9fa;--color-fg-inverse:#131517;--color-fg-muted:#b4bcc2;--color-fg-subtle:#8a939b;--color-status-ai-bg:#2e1065;--color-status-ai-solid:#a78bfa;--color-status-danger-bg:#3f0a0c;--color-status-danger-solid:#f87171;--color-status-info-bg:#0f1d40;--color-status-info-solid:#5a8df7;--color-status-success-bg:#062a1b;--color-status-success-solid:#34c27a;--color-status-warning-bg:#361c05;--color-status-warning-solid:#f5a524}}.dg text{font-family: var(--font-sans);fill: var(--color-fg-default);}.dg .t-title{font-size: 13px;font-weight: 600;}.dg .t-title.mono{font-family: var(--font-mono);font-size: 12px;}.dg .t-body,.dg .t-label,.dg .t-note{font-size: 11.5px;fill: var(--color-fg-muted);}.dg .t-note{font-size: 11px;}.dg .t-label{paint-order: stroke;stroke: var(--color-bg-surface);stroke-width: 4px;stroke-linejoin: round;}.dg .t-group{font-size: 11.5px;font-weight: 600;fill: var(--color-fg-muted);}.dg .t-field{font-family: var(--font-mono);font-size: 11px;}.dg .t-frame{font-size: 11px;font-weight: 600;}.dg .t-op{font-size: 20px;font-weight: 500;fill: var(--color-fg-muted);}.dg .mono{font-family: var(--font-mono);font-size: 0.92em;}.dg .box,.dg .rim{fill: var(--color-bg-surface);stroke: var(--color-border-strong);stroke-width: 1.25;}.dg .rim{fill: none;}.dg .group{fill: var(--color-bg-sunken);stroke: var(--color-border-default);stroke-width: 1;}.dg .rule{stroke: var(--color-border-default);}.dg .edge{fill: none;stroke: var(--color-fg-subtle);stroke-width: 1.25;}.dg .arrow{fill: var(--color-fg-subtle);}.dg .dashed{stroke-dasharray: 4 4;}.dg .lifeline{stroke: var(--color-border-strong);stroke-dasharray: 3 4;}.dg .activation{fill: var(--color-bg-selected);stroke: var(--color-border-strong);}.dg .note{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .frame{fill: none;stroke: var(--color-border-strong);}.dg .dot{fill: var(--color-fg-default);}.dg .ring{fill: none;stroke: var(--color-fg-default);stroke-width: 1.25;}.dg .tone-accent.box,.dg .tone-accent.note,.dg .tone-accent.group{fill: var(--color-status-info-bg);stroke: var(--color-status-info-solid);}.dg .tone-success.box,.dg .tone-success.note{fill: var(--color-status-success-bg);stroke: var(--color-status-success-solid);}.dg .tone-danger.box,.dg .tone-danger.note{fill: var(--color-status-danger-bg);stroke: var(--color-status-danger-solid);}.dg .tone-warning.box,.dg .tone-warning.note{fill: var(--color-status-warning-bg);stroke: var(--color-status-warning-solid);}.dg .tone-ai.box,.dg .tone-ai.note,.dg .tone-ai.group{fill: var(--color-status-ai-bg);stroke: var(--color-status-ai-solid);}.dg .tone-muted.box{fill: var(--color-bg-sunken);stroke: var(--color-border-default);}.dg .tone-ink.box{fill: var(--color-bg-inverse);stroke: var(--color-bg-inverse);}.dg .tone-ink.box ~ text,.dg g:has(> .tone-ink) text{fill: var(--color-fg-inverse);}.dg .group.tone-plain{fill: none;}.dg .group.tone-surface{fill: var(--color-bg-surface);}.dg .rim.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-accent{stroke: var(--color-status-info-solid);}.dg .edge.tone-success{stroke: var(--color-status-success-solid);}.dg .edge.tone-danger{stroke: var(--color-status-danger-solid);}.dg .edge.tone-ai{stroke: var(--color-status-ai-solid);}.dg .arrow.tone-accent{fill: var(--color-status-info-solid);}.dg .arrow.tone-success{fill: var(--color-status-success-solid);}.dg .arrow.tone-danger{fill: var(--color-status-danger-solid);}.dg .arrow.tone-ai{fill: var(--color-status-ai-solid);}.dg .mono,.dg .t-field,.dg .t-title.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}.dg .bg{fill:var(--color-bg-surface);stroke:var(--color-border-default)}</style><rect class="bg" x="-15.5" y="-15.5" width="791" height="599" rx="8"/><defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="dg-a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-accent"/></marker><marker id="dg-a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-success"/></marker><marker id="dg-a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-danger"/></marker><marker id="dg-a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow tone-ai"/></marker></defs><path d="M64 46 V558" class="lifeline"/><path d="M190.4 46 V558" class="lifeline"/><path d="M316.8 46 V558" class="lifeline"/><path d="M443.2 46 V558" class="lifeline"/><path d="M569.6 46 V558" class="lifeline"/><path d="M696 46 V558" class="lifeline"/><rect x="256.8" y="392" width="499.2" height="138" rx="6" class="frame"/><path d="M256.8 412 H319.6 L327.6 404 V392" class="frame"/><text x="264.8" y="406.5" text-anchor="start" class="t-frame">any time</text><text x="335.6" y="406.5" text-anchor="start" class="t-label">an issue is created</text><rect x="256.8" y="178" width="246.4" height="192" rx="6" class="frame"/><path d="M256.8 198 H297.5 L305.5 190 V178" class="frame"/><text x="264.8" y="192.5" text-anchor="start" class="t-frame">later</text><text x="313.5" y="192.5" text-anchor="start" class="t-label">when the push worker processes the push</text><text x="127.2" y="62" text-anchor="middle" class="t-label">1. push</text><text x="127.2" y="76" text-anchor="middle" class="t-label"><tspan class="mono">acme-42-login</tspan></text><path d="M64 82 H189.4" class="edge" marker-end="url(#dg-a)"/><text x="253.6" y="110" text-anchor="middle" class="t-label">2. the push’s transaction, as before</text><path d="M190.4 116 H315.8" class="edge" marker-end="url(#dg-a)"/><text x="127.2" y="144" text-anchor="middle" class="t-label">3. the push returns</text><path d="M190.4 150 H65" class="edge dashed" marker-end="url(#dg-a)"/><text x="380" y="218" text-anchor="middle" class="t-label">4. claim the push</text><path d="M316.8 224 H442.2" class="edge dashed" marker-end="url(#dg-a)"/><text x="457.2" y="254" text-anchor="start" class="t-label">5. each branch it created, or with no link</text><text x="457.2" y="268" text-anchor="start" class="t-label">yet: the first <tspan class="mono">ACME-&lt;n&gt;</tspan> word in its</text><text x="457.2" y="282" text-anchor="start" class="t-label">name</text><path d="M443.2 290 h28 v14 h-26" class="edge" marker-end="url(#dg-a)"/><text x="380" y="320" text-anchor="middle" class="t-label">6. link it; Backlog or Todo turns In</text><text x="380" y="334" text-anchor="middle" class="t-label">progress, for the pusher; record both</text><path d="M443.2 340 H317.8" class="edge" marker-end="url(#dg-a)"/><text x="632.8" y="432" text-anchor="middle" class="t-label">7. <tspan class="mono">POST /issues</tspan>, gets</text><text x="632.8" y="446" text-anchor="middle" class="t-label"><tspan class="mono">ACME-43</tspan></text><path d="M696 452 H570.6" class="edge" marker-end="url(#dg-a)"/><text x="443.2" y="480" text-anchor="middle" class="t-label">8. the issue, and links to the live branches naming</text><text x="443.2" y="494" text-anchor="middle" class="t-label"><tspan class="mono">ACME-43</tspan> with no link yet, in one transaction</text><path d="M569.6 500 H317.8" class="edge" marker-end="url(#dg-a)"/><rect x="16" y="12" width="96" height="34" rx="8" class="box"/><text x="64" y="33.5" text-anchor="middle" class="t-title">Git client</text><rect x="142.4" y="12" width="96" height="34" rx="8" class="box"/><text x="190.4" y="33.5" text-anchor="middle" class="t-title">Git server</text><rect x="267.7" y="12" width="98.2" height="34" rx="8" class="box"/><text x="316.8" y="33.5" text-anchor="middle" class="t-title">PostgreSQL</text><rect x="392.3" y="12" width="101.8" height="34" rx="8" class="box tone-accent"/><text x="443.2" y="33.5" text-anchor="middle" class="t-title">Push worker</text><rect x="521.6" y="12" width="96" height="34" rx="8" class="box"/><text x="569.6" y="33.5" text-anchor="middle" class="t-title">API server</text><rect x="648" y="12" width="96" height="34" rx="8" class="box"/><text x="696" y="33.5" text-anchor="middle" class="t-title">Member</text></svg>
