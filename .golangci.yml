# golangci-lint v2, run by CI's lint step. The linters are the house rules' (https://docs.dev.kfirs.com/CONTRIBUTING.md,
# "Go") on top of golangci-lint's standard set.
version: "2"
linters:
  default: standard
  enable:
    - contextcheck
    - depguard
    - funlen
    - gocognit
    - revive
    - sloglint
    - spancheck
    - wrapcheck
  settings:
    # Dependencies point inward: domain services never import the adapters that implement their ports.
    depguard:
      rules:
        services:
          files: ["**/internal/services/**"]
          deny:
            - pkg: cobranch.dev/internal/adapters
              desc: services reach the outside only through their ports, which adapters implement
    funlen:
      lines: 60
      statements: -1
    gocognit:
      min-complexity: 20
    # revive's default rules, plus use-any.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: use-any
        - name: var-declaration
        - name: var-naming
    sloglint:
      context: all
  exclusions:
    rules:
      # gqlgen writes the resolvers' signatures, ctx included, and keeps only their bodies.
      - path: \.resolvers\.go$
        linters: [revive]
        text: unused-parameter
formatters:
  enable:
    - gofmt
