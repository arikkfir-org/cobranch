<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobranch</title>
  <!-- The Console's first screens: sign in, the welcome page (create, join, invitations), an organization's home,
       members, roles and settings under its slug, its repositories under theirs with their files, Markdown and READMEs rendered, branches
       with their status, history and commits with their annotations, and the viewer's own settings with their personal tokens and SSH keys. The design system's colours (docs/cobranch/designs/design-system), the REST
       API at the URL config.json names, the Auth server at the other URL it names, and the Git server, whose URLs, over
       HTTPS and SSH, a repository's clone URLs start with, when it names them. Caddy serves this page for
       every path, and it routes on the path: the organization's slug first, then its page or a repository's slug,
       then the repository's page, then what that page shows: a branch's name or a commit's, or a ref and a path. -->
  <style>
    :root {
      color-scheme: light;
      --color-bg-canvas: #ffffff;
      --color-bg-sunken: #f8f9fa;
      --color-bg-raised: #ffffff;
      --color-fg-default: #1a1d20;
      --color-fg-muted: #6b737b;
      --color-border-default: #e4e7ea;
      --color-accent: #2f6fed;
      --color-accent-fg: #ffffff;
      --color-status-success-fg: #0e6a3f;
      --color-status-success-bg: #ecfdf3;
      --color-status-success-border: #a6f0c4;
      --color-status-warning-fg: #8c500b;
      --color-status-warning-bg: #fff8eb;
      --color-status-warning-border: #fdd98a;
      --color-status-danger-fg: #a1262b;
      --color-status-danger-bg: #fff1f1;
      --color-status-danger-border: #f7b8bb;
      --color-status-neutral-fg: #4a5158;
      --color-status-neutral-bg: #f1f3f5;
      --color-status-neutral-border: #e4e7ea;
      --color-status-info-fg: #1e45ab;
      --color-status-info-bg: #eef4ff;
      --color-status-info-border: #bcd3ff;
      --color-bg-inverse: #1a1d20;
      --color-fg-inverse: #ffffff;
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --color-bg-canvas: #131517;
        --color-bg-sunken: #0c0d0f;
        --color-bg-raised: #1b1e21;
        --color-fg-default: #f8f9fa;
        --color-fg-muted: #b4bcc2;
        --color-border-default: #2e3338;
        --color-accent: #6b9bff;
        --color-accent-fg: #0c0d0f;
        --color-status-success-fg: #6cdda0;
        --color-status-success-bg: #062a1b;
        --color-status-success-border: #105335;
        --color-status-warning-fg: #fcc04d;
        --color-status-warning-bg: #361c05;
        --color-status-warning-border: #723f0f;
        --color-status-danger-fg: #ff8a8e;
        --color-status-danger-bg: #3a0d0f;
        --color-status-danger-border: #7a2024;
        --color-status-neutral-fg: #d3d8dc;
        --color-status-neutral-bg: #23272b;
        --color-status-neutral-border: #4a5158;
        --color-status-info-fg: #8db4ff;
        --color-status-info-bg: #0f1d40;
        --color-status-info-border: #1c3a85;
        --color-bg-inverse: #f8f9fa;
        --color-fg-inverse: #131517;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg-canvas);
      color: var(--color-fg-default);
      font: 14px/20px var(--font-sans);
    }
    body.centered { display: grid; place-items: center; }
    h1 { margin: 0; font-size: 30px; line-height: 36px; letter-spacing: -0.6px; font-weight: 600; }
    h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    h3 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: 0.4px; font-size: 12px; }
    p { margin: 0; color: var(--color-fg-muted); }
    a { color: var(--color-accent); }
    code { font-family: var(--font-mono); font-size: 13px; color: var(--color-fg-default); }
    [hidden] { display: none !important; }
    main.card {
      width: min(440px, calc(100vw - 32px));
      display: grid;
      gap: 16px;
      padding: 32px;
      border: 1px solid var(--color-border-default);
      border-radius: 12px;
      background: var(--color-bg-sunken);
    }
    .status {
      justify-self: start;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-status-warning-border);
      background: var(--color-status-warning-bg);
      color: var(--color-status-warning-fg);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }
    .status[data-state="ready"] {
      border-color: var(--color-status-success-border);
      background: var(--color-status-success-bg);
      color: var(--color-status-success-fg);
    }
    .buttons { display: grid; gap: 8px; }
    .button {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-raised);
      color: var(--color-fg-default);
      font: inherit;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .buttons .button { display: block; width: 100%; }
    .button.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
    .button.danger { color: var(--color-status-danger-fg); border-color: var(--color-status-danger-border); }
    .button.small { padding: 3px 10px; font-size: 13px; }
    .button:disabled { opacity: 0.6; cursor: default; }
    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-status-danger-border);
      background: var(--color-status-danger-bg);
      color: var(--color-status-danger-fg);
    }
    .notice {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-status-success-border);
      background: var(--color-status-success-bg);
      color: var(--color-status-success-fg);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .demo { padding-top: 12px; border-top: 1px solid var(--color-border-default); display: grid; gap: 8px; }
    form { display: grid; gap: 10px; }
    form.inline { grid-template-columns: 1fr auto; align-items: end; }
    form.inline.with-role { grid-template-columns: 1fr auto auto; }
    label { display: grid; gap: 4px; font-weight: 500; }
    label span { color: var(--color-fg-muted); font-weight: 400; font-size: 12px; }
    label.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
    input, select, textarea {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-raised);
      color: var(--color-fg-default);
      font: inherit;
      width: 100%;
    }
    header.bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--color-border-default);
      background: var(--color-bg-sunken);
      flex-wrap: wrap;
    }
    header.bar .brand { font-weight: 600; letter-spacing: -0.2px; text-decoration: none; color: var(--color-fg-default); }
    header.bar select { width: auto; }
    header.bar nav { display: flex; gap: 4px; }
    header.bar nav a, nav.tabs a { padding: 5px 10px; border-radius: 8px; color: var(--color-fg-muted); text-decoration: none; font-weight: 500; }
    header.bar nav a.current, nav.tabs a.current { background: var(--color-bg-raised); color: var(--color-fg-default); border: 1px solid var(--color-border-default); }
    nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .heading { display: grid; gap: 8px; }
    .heading .row { justify-content: flex-start; }
    header.bar .spacer { flex: 1; }
    main.page { width: min(880px, 100%); margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
    section.panel { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--color-border-default); border-radius: 12px; background: var(--color-bg-sunken); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--color-border-default); vertical-align: middle; }
    th { color: var(--color-fg-muted); font-weight: 500; font-size: 12px; }
    td.actions { text-align: right; white-space: nowrap; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--color-border-default); background: var(--color-bg-raised); font-size: 12px; margin-right: 4px; }
    .perms { display: flex; flex-wrap: wrap; gap: 4px; }
    .perms code { font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--color-bg-raised); border: 1px solid var(--color-border-default); }
    .chip button { all: unset; cursor: pointer; margin-left: 4px; color: var(--color-fg-muted); }
    .chip button:hover { color: var(--color-status-danger-fg); }
    .grant { display: inline-flex; gap: 4px; align-items: center; margin-top: 4px; }
    .grant select { padding: 2px 6px; font-size: 13px; }
    .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 12px; }
    .picks label { display: flex; gap: 6px; align-items: center; font-weight: 400; font-size: 13px; }
    .picks label code { font-size: 12px; }
    .picks input { width: auto; }
    .muted { color: var(--color-fg-muted); font-size: 12px; }
    section.panel.notice code { word-break: break-all; }
    .commits td { vertical-align: top; }
    .commits td.sha { text-align: right; white-space: nowrap; }
    .commits a.subject { color: var(--color-fg-default); font-weight: 500; text-decoration: none; }
    .commits a.subject:hover { color: var(--color-accent); }
    pre.message { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 13px; color: var(--color-fg-default); }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dl.facts dt { color: var(--color-fg-muted); }
    dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    /* The design system's status language: one word, one icon and one tone per status. */
    .tone-neutral { --tone-fg: var(--color-status-neutral-fg); --tone-bg: var(--color-status-neutral-bg); --tone-border: var(--color-status-neutral-border); }
    .tone-info { --tone-fg: var(--color-status-info-fg); --tone-bg: var(--color-status-info-bg); --tone-border: var(--color-status-info-border); }
    .tone-success { --tone-fg: var(--color-status-success-fg); --tone-bg: var(--color-status-success-bg); --tone-border: var(--color-status-success-border); }
    .tone-danger { --tone-fg: var(--color-status-danger-fg); --tone-bg: var(--color-status-danger-bg); --tone-border: var(--color-status-danger-border); }
    .tone-inverse { --tone-fg: var(--color-fg-inverse); --tone-bg: var(--color-bg-inverse); --tone-border: var(--color-bg-inverse); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; border-radius: 999px; border: 1px solid var(--tone-border);
      background: var(--tone-bg); color: var(--tone-fg); font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; }
    .icon { display: inline-flex; color: var(--tone-fg); vertical-align: -3px; }
    .icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .badge .icon svg { width: 14px; height: 14px; }
    .icons { display: inline-flex; gap: 2px; margin-right: 8px; }
    .annotations td { vertical-align: top; }
    .annotations td.state { width: 1%; white-space: nowrap; }
    .branches td.counts { white-space: nowrap; }
    .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title h2 code { font-size: 18px; overflow-wrap: anywhere; }
    .checks { list-style: none; margin: 0; padding: 0; display: grid; }
    .checks li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--color-border-default); }
    .checks li:first-child { border-top: 0; }
    .checks li .detail { margin-left: auto; color: var(--color-fg-muted); font-size: 13px; text-align: right; }
    section.panel.blocked { border-color: var(--color-status-danger-border); }
    .why { display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 8px; border: 1px solid var(--tone-border); background: var(--tone-bg); color: var(--tone-fg); }
    .why p { color: inherit; }
    .why strong { font-weight: 600; }
    select.ref { width: auto; max-width: 240px; }
    form.merge { justify-content: flex-start; }
    form.merge select { width: auto; }
    code.crumbs { overflow-wrap: anywhere; }
    .spacer { flex: 1; }
    details.clone { position: relative; }
    details.clone summary { list-style: none; }
    details.clone summary::-webkit-details-marker { display: none; }
    details.clone[open] > section { position: absolute; right: 0; z-index: 1; width: min(560px, calc(100vw - 48px)); margin-top: 6px; background: var(--color-bg-raised); }
    .files td.name { width: 60%; overflow-wrap: anywhere; }
    .files td.size { text-align: right; white-space: nowrap; }
    .source { display: grid; grid-template-columns: max-content 1fr; border: 1px solid var(--color-border-default); border-radius: 8px; background: var(--color-bg-raised); overflow: hidden; }
    .source pre { margin: 0; padding: 8px 12px; font: 13px/20px var(--font-mono); }
    .source pre.ln { text-align: right; color: var(--color-fg-muted); user-select: none; border-right: 1px solid var(--color-border-default); }
    .source pre.text { overflow-x: auto; tab-size: 4; }
    .image { display: grid; place-items: center; padding: 16px; border: 1px solid var(--color-border-default); border-radius: 8px; background: var(--color-bg-raised); }
    .image img { max-width: 100%; }
    iframe.markdown { display: block; width: 100%; height: 0; border: 0; background: transparent; }
    .readme { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--color-border-default); }
    .readme pre { margin: 0; white-space: pre-wrap; font: 13px/20px var(--font-mono); }
    .markdown-file { display: grid; gap: 12px; }
    .tabs { display: flex; gap: 4px; }
    .tabs button[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-accent); }
  </style>
</head>
<body class="centered">
  <div id="app"></div>
  <script>
    // The Console's root, wherever the operator mounts it (its route strips the prefix): the path of the Console's URL,
    // which config.json names, and which every directory serves. Every page's path is relative to it; the Auth
    // server sends a failed sign-in back to /sign-in.
    let base = "/";
    const byId = (id) => document.getElementById(id);
    const app = byId("app");
    // What a failed sign-in's error code means, by the code the Auth server sent us back with.
    const signInErrors = {
      provider: "The identity provider didn't sign you in. Try again.",
      flow: "The sign-in took too long, or began in another browser. Try again.",
      refused: "This installation doesn't let you sign up. Ask its operator for an invitation.",
      email_taken: "Another account already holds your email, through a different identity provider. Sign in with that one.",
      unknown_provider: "That identity provider isn't set up here.",
      internal: "Something went wrong on our side. Try again in a moment.",
    };
    // The Console's own paths, which no organization's slug is.
    const reserved = ["sign-in", "new", "join", "invitations", "me", "settings"];
    let config = { restUrl: "", authUrl: "", gitUrl: "", gitSshUrl: "" };
    let me = null;
    let orgs = [];
    let roles = []; // the roles the organization shown grants
    let permissions = []; // what a role at an organization may hold

    // api calls the REST API with the session cookie, and rejects with the problem it answered.
    async function api(method, path, body, headers = {}) {
      const options = { method, credentials: "include", headers: { Accept: "application/json", ...headers } };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const r = await fetch(config.restUrl + "/v1" + path, options);
      if (r.status === 204) return null;
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(data.detail || data.title || r.statusText), { status: r.status, code: data.code });
      return data;
    }
    // apiPage reads a page of a list the REST API pages, at the API's path or at the URL a previous page linked, and
    // the URL of the next page, as its Link names it: null after the last.
    async function apiPage(pathOrUrl) {
      const url = new URL(pathOrUrl.startsWith("/") ? config.restUrl + "/v1" + pathOrUrl : pathOrUrl, location.href).href;
      const r = await fetch(url, { credentials: "include", headers: { Accept: "application/json" } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(data.detail || data.title || r.statusText), { status: r.status, code: data.code });
      const next = /<([^>]*)>\s*;\s*rel="next"/.exec(r.headers.get("Link") || "");
      return { data, next: next ? new URL(next[1], url).href : null };
    }
    const h = (tag, attrs = {}, ...children) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") el.className = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else if (k === "hidden" || k === "disabled" || k === "checked" || k === "selected") el[k] = v;
        else if (v !== undefined && v !== null) el.setAttribute(k, v);
      }
      el.append(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
      return el;
    };
    const when = (at) => new Date(at).toLocaleDateString(undefined, { dateStyle: "medium" });
    const whenExactly = (at) => new Date(at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    // go navigates within the Console; render draws the page for the path.
    function go(path, replace) {
      history[replace ? "replaceState" : "pushState"](null, "", base + path.replace(/^\//, ""));
      render();
    }
    // route is the page's path under the Console's root: [] for its home, [slug] or [slug, page] for an organization's,
    // [slug, repository] or [slug, repository, page, ...what it shows] for a repository's, each part decoded.
    function route() {
      const rest = location.pathname.slice(base.length).replace(/\/$/, "");
      const decode = (part) => { try { return decodeURIComponent(part); } catch { return part; } };
      return rest ? rest.split("/").map(decode) : [];
    }
    window.addEventListener("popstate", render);
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-nav]");
      if (a && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        go(a.getAttribute("href").slice(base.length - 1));
      }
    });

    // The first load: where the APIs are, the version, and who the viewer is.
    // config.json sits beside the page's directory: for the Console's root without a trailing slash too.
    fetch(new URL("config.json", location.origin + location.pathname.replace(/\/?$/, "/"))).then((r) => r.json()).then(async (c) => {
      config = { restUrl: c.restUrl || "", authUrl: c.authUrl || "", gitUrl: (c.gitUrl || "").replace(/\/$/, ""), gitSshUrl: (c.gitSshUrl || "").replace(/\/$/, "") };
      if (c.consoleUrl) base = new URL(c.consoleUrl).pathname.replace(/\/?$/, "/");
      try {
        me = await api("GET", "/me");
        [orgs, permissions] = await Promise.all([api("GET", "/me/organizations").then((d) => d.organizations), api("GET", "/permissions?scope=organization").then((d) => d.permissions)]);
      } catch (err) {
        if (err.status !== 401) throw err;
      }
      render();
    }).catch(() => showCard(h("span", { class: "status" }, "REST API unreachable"), h("p", {}, "The Console couldn't reach this installation's REST API. Try again in a moment.")));

    function showCard(...children) {
      document.body.className = "centered";
      app.replaceChildren(h("main", { class: "card" }, h("h1", {}, "Cobranch"), ...children));
    }

    function render() {
      const parts = route();
      if (!me) return showSignIn();
      if (parts.length === 0) {
        const remembered = (() => { try { return localStorage.getItem("cobranch.org"); } catch { return null; } })();
        const first = orgs.find((o) => o.slug === remembered) || orgs[0];
        if (first) return go("/" + first.slug, true);
        return showWelcome();
      }
      if (parts[0] === "new") return showWelcome();
      if (parts[0] === "settings") return showMySettings();
      if (reserved.includes(parts[0])) return showWelcome();
      return showOrganization(parts[0], parts[1] || "", parts[2] || "", parts.slice(3));
    }

    async function showSignIn() {
      const card = [];
      const params = new URLSearchParams(location.search);
      const code = params.get("error");
      if (code) card.push(h("p", { class: "alert" }, signInErrors[code] || signInErrors.internal));
      if (!config.authUrl) {
        return showCard(h("h2", {}, "Sign in"), ...card, h("p", {}, "Sign-in isn't set up yet: this installation lists no identity provider. Its operator adds one to the chart's ", h("code", {}, "auth.providers"), "."));
      }
      try {
        const { providers, seeded } = await (await fetch(config.authUrl + "/providers", { headers: { Accept: "application/json" } })).json();
        if (providers.length === 0 && seeded.length === 0) card.push(h("p", {}, "Sign-in isn't set up yet: this installation lists no identity provider."));
        card.push(h("div", { class: "buttons" }, providers.map((p) => h("a", { class: "button primary", href: config.authUrl + "/sign-in?" + new URLSearchParams({ provider: p.id, return: "/" }) }, "Sign in with " + p.name))));
        if (seeded.length) {
          card.push(h("div", { class: "demo" }, h("p", {}, "Demo data is on: sign in as one of its users."),
            h("div", { class: "buttons" }, seeded.map((u) => h("a", { class: "button", href: config.authUrl + "/sign-in?" + new URLSearchParams({ user: u.subject, return: "/" }) }, u.displayName + " (" + u.subject + ")")))));
        }
      } catch {
        card.push(h("p", {}, "Sign-in isn't answering. Try again in a moment."));
      }
      showCard(h("h2", {}, "Sign in"), ...card);
    }

    function signOut() {
      fetch(config.authUrl + "/sign-out", { method: "POST", credentials: "include" }).finally(() => location.replace(base));
    }

    // The welcome page: a user who belongs nowhere creates, asks to join, or accepts an invitation. It is also /new.
    async function showWelcome() {
      const [invitations, requests] = await Promise.all([api("GET", "/me/invitations").then((d) => d.invitations), api("GET", "/me/join-requests").then((d) => d.joinRequests)]);
      const error = h("p", { class: "alert", hidden: true });

    }

    // revealToken shows a personal token just made, which the API never shows again.
    function revealToken(created) {
      const code = h("code", {}, created.secret);
      const copy = h("button", { class: "button small", type: "button", onclick: () => {
        navigator.clipboard.writeText(created.secret).then(() => { copy.textContent = "Copied"; }).catch(() => { getSelection().selectAllChildren(code); });
      } }, "Copy");
      return h("section", { class: "panel notice" }, h("h3", {}, "Your new token"),
        h("p", {}, "Copy ", h("strong", {}, created.token.name), " now: it is shown here and never again. Give it to Git as your password, with any user name."),
        h("div", { class: "row" }, code, copy));
    }

    // tokenLifetime chooses when a personal token ends: in 30 days (the default), 7 or 90 days, a year, or on a date
    // within a year.
    function tokenLifetime() {
      const day = 24 * 60 * 60 * 1000;
      const local = (t) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
      const date = h("input", { type: "date", hidden: true, min: local(Date.now() + day), max: local(Date.now() + 365 * day) });
      const pick = h("select", { onchange: () => { date.hidden = pick.value !== "date"; date.required = !date.hidden; } },
        h("option", { value: "30" }, "Expires in 30 days"), h("option", { value: "7" }, "Expires in 7 days"), h("option", { value: "90" }, "Expires in 90 days"),
        h("option", { value: "365" }, "Expires in a year"), h("option", { value: "date" }, "Expires on a date…"));
      const el = h("label", {}, "Expiry", pick, date);
      const value = () => pick.value === "30" ? {} : pick.value === "date" ? { expiresAt: new Date(date.value + "T00:00:00").toISOString() }
        : { expiresAt: new Date(Date.now() + Number(pick.value) * day).toISOString() };
      return { el, value };
    }

    // expiryPicker chooses when a new secret stops working: in a year (the default), never, or on a date.
    function expiryPicker() {
      const date = h("input", { type: "date", hidden: true });
      const pick = h("select", { onchange: () => { date.hidden = pick.value !== "date"; if (!date.hidden) date.required = true; } },
        h("option", { value: "year" }, "Expires in a year"), h("option", { value: "never" }, "Never expires"), h("option", { value: "date" }, "Expires on a date…"));
      const el = h("label", {}, "Expiry", pick, date);
      const value = () => pick.value === "never" ? { neverExpires: true } : pick.value === "date" ? { expiresAt: new Date(date.value + "T00:00:00").toISOString() } : {};
      return { el, value };
    }

    // showApiKeys renders the organization's API keys; shown is a secret just made, which this render shows once.
    async function showApiKeys(org, main, can, shown = null) {
      const manage = can("org.principals.manage");
      const error = h("p", { class: "alert", hidden: true });
      const fail = (err) => { error.textContent = err.message; error.hidden = false; };
      const refresh = (created) => showApiKeys(org, main, can, created || null).catch(fail);
      // reveal shows a new secret, which the API never shows again.
      const reveal = (created) => {
        const code = h("code", {}, created.secret);
        const copy = h("button", { class: "button small", type: "button", onclick: () => {
          navigator.clipboard.writeText(created.secret).then(() => { copy.textContent = "Copied"; }).catch(() => { getSelection().selectAllChildren(code); });
        } }, "Copy");
        return h("section", { class: "panel notice" }, h("h3", {}, "The secret of ", created.apiKey.name),
          h("p", {}, "Put it in the script's own secret store now: it is shown here and never again. Scripts send it as ", h("code", {}, "Authorization: Bearer …"), "."),
          h("div", { class: "row" }, code, copy));
      };
      const state = (s) => {
        const now = Date.now();
        if (s.revokedAt) return "revoked " + when(s.revokedAt);
        if (s.expiresAt && new Date(s.expiresAt) <= now) return "expired " + when(s.expiresAt);
        return (s.expiresAt ? "expires " + when(s.expiresAt) : "never expires") + (s.lastUsedAt ? ", last used " + when(s.lastUsedAt) : ", never used");
      };
      const keys = (await api("GET", "/orgs/" + org.slug + "/api-keys")).apiKeys;
      const secretRow = (k, s) => h("div", { class: "row" }, h("span", {}, h("code", {}, "…" + s.hint), " ", h("span", { class: "muted" }, state(s))),
        manage && !s.revokedAt ? h("button", { class: "button small danger", type: "button", onclick: () => api("DELETE", "/orgs/" + org.slug + "/api-keys/" + k.id + "/secrets/" + s.id).then(() => refresh()).catch(fail) }, "Revoke") : null);
      const keyRow = (k) => {
        const live = k.secrets.filter((s) => !s.revokedAt && !(s.expiresAt && new Date(s.expiresAt) <= Date.now())).length;
        const row = h("tr", {}, h("td", {}, k.name, h("p", {}, "made " + when(k.createdAt), live ? "" : " · no live secret: rotate it")),
          h("td", {}, k.roles.map((r) => h("span", { class: "chip" }, r.name))),
          h("td", {}, k.secrets.map((s) => secretRow(k, s))),
          h("td", { class: "actions" }, manage ? [
            h("button", { class: "button small", type: "button", disabled: live >= 2, title: live >= 2 ? "Two secrets already work; revoke one first." : "A new secret beside the old one", onclick: () => {
              const picker = expiryPicker();
              const editor = h("tr", {}, h("td", { colspan: 4 }, h("form", { class: "inline", onsubmit: (e) => { e.preventDefault(); api("POST", "/orgs/" + org.slug + "/api-keys/" + k.id + "/secrets", picker.value()).then(refresh).catch(fail); } },
                picker.el, h("div", {}, h("button", { class: "button primary", type: "submit" }, "Rotate"), " ", h("button", { class: "button", type: "button", onclick: () => editor.replaceWith(row) }, "Cancel")))));
              row.replaceWith(editor);
            } }, "Rotate"), " ",
            h("button", { class: "button small danger", type: "button", onclick: () => api("DELETE", "/orgs/" + org.slug + "/api-keys/" + k.id).then(() => refresh()).catch(fail) }, "Delete"),
          ] : null));
        return row;
      };
      const sections = [h("h1", {}, "API keys"), error];
      if (shown) sections.push(reveal(shown));
      sections.push(h("section", { class: "panel" }, h("p", {}, "A key is a principal of this organization that a script acts as, with roles of its own; a key never borrows a person's access. Rotating a key adds a second secret, so the script changes over without failing; then revoke the old one."),
        keys.length ? h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Key"), h("th", {}, "Roles"), h("th", {}, "Secrets"), h("th", {}))), h("tbody", {}, keys.map(keyRow))) : h("p", {}, "No API keys yet.")));
      if (manage) {
        const name = h("input", { name: "name", required: true, maxlength: 100, placeholder: "Deploy script" });
        const picks = roles.map((r) => h("label", {}, h("input", { type: "checkbox", value: r.id }), r.name));
        const picker = expiryPicker();
        sections.push(h("section", { class: "panel" }, h("h3", {}, "Make a key"), h("p", {}, "Only roles whose every permission you hold here yourself."),
          h("form", { onsubmit: (e) => {
            e.preventDefault();
            const roleIds = picks.map((l) => l.firstChild).filter((c) => c.checked).map((c) => c.value);
            api("POST", "/orgs/" + org.slug + "/api-keys", { name: name.value, roleIds, ...picker.value() }).then(refresh).catch(fail);
          } }, h("label", {}, "Name", name), h("label", {}, "Roles", h("div", { class: "picks" }, picks)), picker.el,
            h("div", {}, h("button", { class: "button primary", type: "submit" }, "Make the key")))));
      }
      main.replaceChildren(...sections);
    }

    async function showSettings(org, main) {
      const error = h("p", { class: "alert", hidden: true });
      const saved = h("p", { class: "notice", hidden: true }, "Saved.");
      const name = h("input", { name: "name", required: true, value: org.name });
      const slug = h("input", { name: "slug", required: true, value: org.slug, pattern: "[a-z0-9]+(-[a-z0-9]+)*", minlength: 2, maxlength: 39 });
      const role = roleSelect(org.membershipRoleId);
      const accepts = h("input", { name: "acceptsJoinRequests", type: "checkbox", checked: org.acceptsJoinRequests });
      const providers = h("input", { name: "providers", value: (org.providers || []).join(", "), placeholder: "All of this installation's" });
      const form = h("form", { onsubmit: async (e) => {
        e.preventDefault();
        error.hidden = saved.hidden = true;
        const list = providers.value.split(",").map((s) => s.trim()).filter(Boolean);
        try {
          const updated = await api("PATCH", "/orgs/" + org.slug, { name: name.value, slug: slug.value, membershipRoleId: role.value, acceptsJoinRequests: accepts.checked, providers: list });
          orgs = (await api("GET", "/me/organizations")).organizations;
          if (updated.slug !== org.slug) return go("/" + updated.slug + "/settings");
          saved.hidden = false;
          org = updated;
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        }
      } },
        h("label", {}, "Name", name),
        h("label", {}, "Slug", h("span", {}, "Its URL. The old slug keeps pointing here after a change."), slug),
        h("label", {}, "Membership role", h("span", {}, "The role everyone who joins gets."), role),
        h("label", { class: "check" }, accepts, "Accept join requests by slug"),
        h("label", {}, "Identity providers", h("span", {}, "The providers members may sign in with, by ID, comma-separated; empty for all of this installation's."), providers),
        h("div", {}, h("button", { class: "button primary", type: "submit" }, "Save")));
      main.replaceChildren(h("h1", {}, "Settings"), error, saved, h("section", { class: "panel" }, form));
    }
  </script>
</body>
</html>
