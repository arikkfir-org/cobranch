<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobranch</title>
  <!-- The Console: sign in, the welcome page (create, join, invitations), an organization's pages under its slug, its
       repositories' pages under theirs, and the viewer's own settings, routed in the browser. Caddy serves this page
       for every path; its modules and stylesheets are under assets/ at the Console's root, a page of an organization
       or a repository a module of its own (assets/lib/assets.js). The design system's colours
       (docs/cobranch/designs/design-system), the REST API at the URL config.json names, the Auth server at the other
       URL it names, and the Git server, whose URLs, over HTTPS and SSH, a repository's clone URLs start with, when it
       names them. -->
  <script type="module">
    // config.json sits beside the page's directory, for the Console's root without a trailing slash too, and names the
    // Console's root, where its modules are; a page at any depth knows it only from there.
    const loaded = fetch(new URL("config.json", location.origin + location.pathname.replace(/\/?$/, "/"))).then((r) => r.json());
    const root = await loaded.then((c) => c.consoleUrl ? new URL(c.consoleUrl).pathname.replace(/\/?$/, "/") : "/", () => "/");
    try {
      (await import(root + "assets/console.js")).start(loaded, root);
    } catch {
      document.getElementById("app").textContent = "The Console couldn't load. Try again in a moment.";
    }
  </script>
</head>
<body class="centered">
  <div id="app"></div>
</body>
</html>
