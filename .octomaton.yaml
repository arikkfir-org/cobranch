# DevHub's CI, run by Octomaton (https://github.com/arikkfir-org/octomaton/blob/main/README.md, the schema).
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request and every merge queue group.
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m

  # Publish both images of every push to main, tagged with the commit's short SHA (also the version the binary
  # reports), for an installation that runs main. Never give it a paths filter: every commit of main has images.
  - name: main
    pipelineRun: .tekton/main.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # An installation runs the images of whatever commit main is at: only the newest waiting push needs building.
    concurrency:
      group: main
      policy: latest
