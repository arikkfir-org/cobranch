# Cobranch's CI, run by Octomaton (https://github.com/arikkfir-org/octomaton/blob/main/README.md, the schema).
apiVersion: octomaton.dev/v1
pipelines:
  # Lint, vet, test and build every pull request and every merge queue group.
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # A run whose pod the cluster took away (a Spot node reclaimed, an upgrade, an eviction) runs again, while its check
    # stays pending: a merge queue entry keeps its place.
    disruptions:
      reruns: 2

  # Publish both images of every pull request's head commit, tagged with its short SHA, for its preview: delivery's
  # ApplicationSet cobranch-pull-requests installs the chart at that commit with them. Not a required check: a preview
  # waits for its images, and the pull request's own checks are ci's. Each push supersedes the build of the one before.
  - name: preview
    pipelineRun: .tekton/preview.yaml
    on:
      pull_request: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # A build whose pod the cluster took away runs again, as a new run: the preview waits for its images, and pushing
    # the same tags twice is harmless. Its task doesn't retry: Tekton leaves a failed attempt's Docker daemon running.
    disruptions:
      reruns: 2

  # Publish both images of main's newest commit, tagged with its short SHA (also the version the binary reports), for
  # an installation that follows main. Never give it a paths filter: main's newest commit must always have its images.
  - name: main
    pipelineRun: .tekton/main.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # An installation runs the images of whatever commit main is at: only the newest waiting push needs building, so a
    # push that a newer one overtakes while it waits publishes nothing.
    concurrency:
      group: main
      policy: latest
    # A build whose pod the cluster took away runs again, as a new run: an installation runs the images of the commit
    # main is at, and pushing the same tags twice is harmless. Its task doesn't retry: Tekton leaves a failed attempt's
    # Docker daemon running.
    disruptions:
      reruns: 2

  # A version: a v* tag (v1.2.3, which publishing a GitHub release creates) adds 1.2.3 to the images main published for
  # the tagged commit, rebuilding nothing, and publishes the chart at 1.2.3, once the tag is confirmed to be a version
  # and the commit to be on main. A tag push runs main's definitions, so a tag can't skip the check.
  - name: tag
    pipelineRun: .tekton/tag.yaml
    on:
      push:
        tags: ["v*"]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
      tag: "{{ .Tag }}"
    timeout: 30m
