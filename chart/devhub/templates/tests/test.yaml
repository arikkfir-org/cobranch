{{- $fullname := include "devhub.fullname" . }}
# helm test: both servers are ready and answer, and the Console serves its page and where it finds the REST API.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test
  labels:
    {{- include "devhub.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after a failure, for its logs, until the next test run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      # The devhub image has what the test needs: a shell and wget.
      image: {{ include "devhub.image" (dict "root" . "image" .Values.images.devhub) }}
      imagePullPolicy: {{ .Values.images.devhub.pullPolicy }}
      command: [/bin/sh, -ec]
      args:
        - |
          rest=http://{{ $fullname }}-rest-server
          graphql=http://{{ $fullname }}-graphql-server
          console=http://{{ $fullname }}-console
          version='"version":"{{ .Values.images.devhub.tag | default .Chart.AppVersion }}"'
          wget -qO- "$rest/readyz"; echo
          wget -qO- "$rest/v1/version" | tee /dev/stderr | grep -q "$version"
          wget -qO- "$graphql/readyz"; echo
          wget -qO- --header 'Content-Type: application/json' --post-data '{"query":"{ version }"}' "$graphql/" | grep -q "$version"
          wget -qO- "$console/healthz"; echo
          wget -qO- "$console/" | grep -q '<h1>DevHub</h1>'
          wget -qO- "$console/config.json" | tee /dev/stderr | grep -q '"restUrl":"{{ .Values.urls.rest | trimSuffix "/" }}"'
          echo "DevHub {{ .Values.images.devhub.tag | default .Chart.AppVersion }} answers"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        {{- include "devhub.containerSecurityContext" . | nindent 8 }}
