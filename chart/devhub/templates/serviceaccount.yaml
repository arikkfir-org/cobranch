apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devhub.serviceAccount" . }}
  labels:
    {{- include "devhub.labels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The servers call no Kubernetes API.
automountServiceAccountToken: false
