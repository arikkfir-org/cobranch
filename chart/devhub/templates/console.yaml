{{- $component := dict "root" . "component" "console" }}
{{- $name := printf "%s-console" (include "devhub.fullname" .) }}
{{- $values := .Values.console }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
  annotations:
    # Argo CD rolls the Console out with the servers whose API it calls, once the migrate Job is done.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $values.replicas }}
  selector:
    matchLabels:
      {{- include "devhub.selectorLabels" $component | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "devhub.labels" $component | nindent 8 }}
      {{- with $values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "devhub.spread" $component | nindent 6 }}
      {{- include "devhub.placement" $values | nindent 6 }}
      containers:
        - name: console
          image: {{ include "devhub.image" (dict "root" . "image" .Values.images.console) }}
          imagePullPolicy: {{ .Values.images.console.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- with .Values.urls.rest }}
          # Where the Console's pages find the REST API; without it, at the root of their own host.
          env:
            - name: DEVHUB_REST_URL
              value: {{ . | trimSuffix "/" | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          securityContext:
            {{- include "devhub.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # Caddy's state (XDG_DATA_HOME and XDG_CONFIG_HOME).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
spec:
  selector:
    {{- include "devhub.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "devhub.selectorLabels" $component | nindent 6 }}
