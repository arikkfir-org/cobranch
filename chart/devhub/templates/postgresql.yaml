{{- if .Values.postgresql.enabled }}
{{- $component := dict "root" . "component" "postgresql" }}
{{- $name := include "devhub.postgresql" . }}
{{- $values := .Values.postgresql }}
{{- if not $values.auth.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
  annotations:
    # Kept on uninstall, as the volume is: a reinstall finds the password its data was made with.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data $values.auth.secretKey) }}
  {{ $values.auth.secretKey }}: {{ index $existing.data $values.auth.secretKey }}
  {{- else }}
  {{ $values.auth.secretKey }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "devhub.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devhub.labels" $component | nindent 8 }}
      {{- with $values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own postgres user, so the server starts without root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      {{- include "devhub.placement" $values | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ $values.image.repository }}:{{ $values.image.tag }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $values.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ $values.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devhub.postgresql.secret" . }}
                  key: {{ $values.auth.secretKey }}
          # Over TCP: while the image initialises the database, its server listens only on its socket.
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready --host=127.0.0.1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready --host=127.0.0.1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          securityContext:
            {{- include "devhub.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "devhub.selectorLabels" $component | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $values.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
spec:
  selector:
    {{- include "devhub.selectorLabels" $component | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "devhub.selectorLabels" $component | nindent 6 }}
---
# Only the servers and the migrate Job reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "devhub.labels" $component | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devhub.selectorLabels" $component | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [rest-server, graphql-server, migrate]
      ports:
        - port: postgresql
{{- end }}
