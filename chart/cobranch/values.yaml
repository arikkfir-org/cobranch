# Cobranch's chart. Every value has a default; values.schema.json checks them at install.

# The images, as Cobranch publishes them. An empty tag means the chart's appVersion: one version names the chart and
# every image it runs.
images:
  cobranch:
    repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch
    tag: ""
    pullPolicy: IfNotPresent
  console:
    repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch-console
    tag: ""
    pullPolicy: IfNotPresent
  backOffice:
    repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch-back-office
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

# Where you mount each workload, all under one parent domain: a host each, or paths on one host. Every workload serves
# as if it were alone (the Console, the Back-office and GraphQL at /, REST and Admin under /v1/), so a URL's path is a
# prefix its HTTPRoute strips. A server lets the pages that call it do so (CORS): the Console's, or the Back-office's
# for the Admin server. Each HTTPRoute takes its URL's host and path. Empty: the workload has none.
urls:
  # Such as https://cobranch.example.com.
  console: ""
  # Such as https://api.cobranch.example.com, or https://cobranch.example.com/api.
  rest: ""
  # Such as https://graphql.cobranch.example.com, or https://cobranch.example.com/graphql.
  graphql: ""
  # The Auth server, which signs people in: such as https://auth.cobranch.example.com, or
  # https://cobranch.example.com/auth. Each identity provider's redirect URI is this URL plus /callback. Without it,
  # nobody can sign in.
  auth: ""
  # The Admin server, which the Back-office calls: such as https://admin.cobranch.example.com/api. With it, the chart
  # runs the Admin server and the Back-office, which backOffice names; without it, neither. Both may stay on a gateway
  # only your operators reach; the Admin API checks every caller's permissions either way.
  admin: ""
  # The Back-office, where the installation's administrators run it: such as https://admin.cobranch.example.com.
  backOffice: ""
  # The Git server, where Git clients clone, fetch and push over HTTPS: such as https://git.cobranch.example.com, or
  # https://cobranch.example.com/git. With it, the chart runs the Git server and the push worker, and the Console shows
  # clone URLs under it; without it, neither. Git clients carry no cookie, so it needn't share the others' parent
  # domain.
  git: ""
  # The Git server's SSH address, where Git clients clone, fetch and push with an SSH key their user added: such as
  # ssh://git@git.cobranch.example.com, or ssh://git@cobranch.example.com:2222. With it and git, the Git server also
  # serves SSH, behind its Service of gitServer.ssh.service, and the Console shows clone URLs under it too. No route
  # reaches it: give the Service a LoadBalancer, or route TCP to it yourself.
  gitSsh: ""

# Sign-in (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/sign-in-and-organizations.md). Without a provider, the Console
# says that sign-in isn't set up yet.
auth:
  # The identity providers, any OpenID Connect provider each: its id (lowercase letters, digits and dashes; it names
  # the provider in URLs and the database, so keep it), the name the sign-in page shows, its issuer URL or a preset
  # (google) that fills the issuer in, the client you registered there with urls.auth plus /callback as its redirect
  # URI, and the Secret of yours that holds the client's secret.
  #   - id: google
  #     name: Google
  #     preset: google
  #     clientId: 1234.apps.googleusercontent.com
  #     clientSecret:
  #       secretName: cobranch-google
  #       key: client-secret
  providers: []
  # Who may sign up: anyone, domains (a verified email in signUpDomains) or invited (a pending invitation to a verified
  # email). A first administrator's email may always sign up. Set, it and signUpDomains are the values', which the
  # Back-office only shows; empty, the Back-office's (anyone until an administrator changes it).
  signUp: ""
  signUpDomains: []
  # The first administrators' emails: a verified sign-in with one grants Installation admin, which runs the
  # Back-office, and an email that leaves the list loses that grant at its next sign-in. Grants made in the Back-office
  # are never touched.
  admins: []

# The key that seals the secrets Cobranch keeps in its database, the Back-office's identity providers' client secrets:
# 32 characters at least. A Secret of yours that holds it under secretKey; without one, the chart generates a key on
# install and keeps it on upgrade, which needs the cluster at render time: under Argo CD, or anything else that renders
# without the cluster, give one. A lost key loses those secrets, which administrators then enter again.
secretsKey:
  existingSecret: ""
  secretKey: key

organizations:
  # Every new user may create organizations (Installation user). Off, only the administrators grant it. Set, it is the
  # values', which the Back-office only shows; null, the Back-office's (on until an administrator changes it).
  selfServe: null

# The object store, where the Git server and maintenance keep Git's packs
# (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/git-object-storage.md).
blob:
  # Empty keeps every object in the database, as a large object: one store to run, and a backup of the database holds
  # every repository whole (postgresql.storage.size then holds the packs too). Or a Go Cloud URL: a cloud's bucket,
  # s3://cobranch-objects?region=eu-west-1, gs://cobranch-objects or azblob://cobranch-objects, for packs that outgrow
  # the database; or file:///var/lib/cobranch/blobs, a directory on blob.volume, for trying Cobranch out.
  url: ""
  # The store objects move from, named as url names one, while an installation moves its packs into url's: the Git
  # server reads from it what url's store lacks, and maintenance copies it over every hour and logs how many objects
  # are left. Once a run logs that none are, remove moveFrom, and delete the old store when you like: nothing deletes
  # it for you. A file:// store must be on blob.volume, under mountPath, and lasting: on an emptyDir, each pod's own,
  # maintenance never sees the Git server's packs, so the chart refuses it.
  moveFrom: ""
  # A Secret whose keys become the Git server's and maintenance's environment, for credentials the URL's driver reads
  # (such as AWS_ACCESS_KEY_ID). Prefer the cloud's workload identity: serviceAccount.annotations.
  envFromSecret: ""
  # A volume, as a pod spec writes one without its name, mounted at mountPath: the directory of a file:// URL. Every Git
  # server and maintenance mount it, so it must last and reach them all, such as a ReadWriteMany claim; an emptyDir is
  # each pod's own, and loses its packs with the pod.
  volume: {}
  mountPath: /var/lib/cobranch/blobs

# The ServiceAccount of the Git server and maintenance, which reach the object store.
serviceAccount:
  # Binds them to the cloud's workload identity, for a bucket.
  annotations: {}

# Every Cobranch workload's logs and traces. Logs are JSON on stdout, for the cluster's log collector. Traces go over
# OTLP/HTTP to your OpenTelemetry Collector or a vendor's endpoint, as OpenTelemetry's own OTEL_ variables.
telemetry:
  # The lowest level logged: debug, info, warn or error.
  logLevel: info
  traces:
    # Such as http://otel-collector.observability:4318. Empty: no span leaves a pod, and trace IDs still name every
    # request in the logs. Google Cloud Trace takes a Collector with Google's exporter.
    endpoint: ""
    # A Secret of yours that holds the OTLP headers under headersKey, as key=value pairs separated by commas: a
    # vendor's API key, say.
    headersSecret: ""
    headersKey: headers
    # The share of new traces kept, from 0 to 1. A trace that a caller started follows the caller's choice.
    sampleRatio: 1
  # More of OpenTelemetry's variables, such as OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production. Each
  # workload names itself as the service.
  env: {}

# The Auth server: the only workload that talks to the identity providers and sets the session cookie.
authServer:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The REST API's server.
restServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The GraphQL API's server.
graphqlServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Admin API's server, with urls.admin, which the Back-office calls. A few administrators use it, so one replica
# serves.
adminServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Console: its static files and config.json, served by Caddy.
console:
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Back-office, with urls.admin: its static files and config.json, served by Caddy, as the Console's. A few
# administrators use it, so one replica serves.
backOffice:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Git server, with urls.git: Git's smart HTTP protocol over the bucket's packs, which each pod keeps a cache of on
# its own disk, and the git CLI, which the cobranch image holds.
gitServer:
  replicas: 2
  cache:
    # How much of the bucket's packs a pod keeps, such as 10Gi; it evicts the least recently used repositories' first.
    size: 10Gi
  # The largest pack a push may send, such as 2Gi.
  maxPushSize: 2Gi
  # The pod's disk, an emptyDir that holds the cache and the repositories of the requests in flight: keep it above
  # cache.size by a few maxPushSize.
  storage:
    sizeLimit: 16Gi
  # SSH, with urls.gitSsh.
  ssh:
    # The Service SSH clients reach the Git server through, on port 22 or yours: ClusterIP for a route of yours, or
    # LoadBalancer, with your cloud's annotations, to reach it directly.
    service:
      type: ClusterIP
      port: 22
      annotations: {}
    # The private key, in PEM, that SSH clients know the server by. Without existingSecret, the chart generates an
    # Ed25519 key on install and keeps it on upgrade, which needs the cluster at render time: under Argo CD, or
    # anything else that renders without the cluster, give one, or every render changes the key clients trust.
    hostKey:
      existingSecret: ""
      secretKey: key
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The push worker, with urls.git: it does what follows each push the Git server recorded, from the database, which
# wakes it; nobody calls it. Set replicas to null to leave the count to an autoscaler, which may scale it to zero
# while no push waits: the pushes waiting are SELECT count(*) FROM pushes WHERE processed_at IS NULL AND retry_at <=
# now(), as KEDA's PostgreSQL scaler asks.
pushWorker:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Job that migrates the database before the servers of a new version roll out.
migrate:
  # How long it may wait for the database and migrate, after which it fails.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The CronJob that deletes what expired: sign-in flows and sessions, hourly.
maintenance:
  schedule: "0 * * * *"
  # How long a run may take, after which it fails: within the hour, so it never skips the next.
  activeDeadlineSeconds: 3000
  # With urls.git, each run also compacts the packs of every repository that has this many into one, and deletes what
  # compaction replaced a day later. Null leaves packs alone, as a file:// URL on an emptyDir (blob.volume) does:
  # maintenance can't reach a directory that only each Git server's pod holds.
  compaction:
    packs: 8
  # The pod's disk while it compacts, an emptyDir: keep it above twice the packs of the largest repository.
  storage:
    sizeLimit: 16Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Cobranch's demo data (db/seeds): users, organizations, repositories and the rest, for a demo installation such as
# Cobranch's own pull request previews. Never turn it on for a real one: the sign-in page then signs anyone in as a demo
# user.
seed:
  # The migrate Job adds the demo data it lacks after migrating the schema, and the Auth server signs in as its users.
  # With the Git server, a Job after each install and upgrade pushes a history to the demo organization's website,
  # unless it has one.
  enabled: false

# The bundled PostgreSQL: one replica of the official image, on a persistent volume. Turn it off to bring your own
# database through externalDatabase.
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 18.6-alpine
    pullPolicy: IfNotPresent
  auth:
    database: cobranch
    username: cobranch
    # A Secret of yours that holds the password under secretKey. Without one, the chart generates a password on
    # install and keeps it on upgrade, which needs the cluster at render time: under Argo CD, or anything else that
    # renders without the cluster, give one.
    existingSecret: ""
    secretKey: password
  storage:
    size: 8Gi
    # Empty uses the cluster's default storage class.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Your own PostgreSQL, when postgresql.enabled is false: a Secret holds its URL, sslmode included, under urlKey.
externalDatabase:
  existingSecret: ""
  urlKey: url

# An HTTPRoute per workload with a URL, on your Gateway, from the URL's host and path. The Gateway brings TLS.
httpRoute:
  enabled: false
  annotations: {}
  # The Gateway's listeners to attach to: [{name: public, namespace: gateways, sectionName: https}].
  parentRefs: []
