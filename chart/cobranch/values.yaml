# Cobranch's chart. Only blob.url is required; values.schema.json checks the rest at install.

# The images, as Cobranch publishes them. An empty tag means the chart's appVersion: one version names the chart and
# every image it runs.
images:
  cobranch:
    repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch
    tag: ""
    pullPolicy: IfNotPresent
  console:
    repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch-console
    tag: ""
    pullPolicy: IfNotPresent
  backOffice:
    repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch-back-office
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

# Where you mount each workload, all under one parent domain: a host each, or paths on one host. Every workload serves
# as if it were alone (the Console, the Back-office and GraphQL at /, REST and Admin under /v1/), so a URL's path is a
# prefix its HTTPRoute strips. A server lets the pages that call it do so (CORS): the Console's, or the Back-office's
# for the Admin server. Each HTTPRoute takes its URL's host and path. Empty: the workload has none.
urls:
  # Such as https://cobranch.example.com.
  console: ""
  # Such as https://api.cobranch.example.com, or https://cobranch.example.com/api.
  rest: ""
  # Such as https://graphql.cobranch.example.com, or https://cobranch.example.com/graphql.
  graphql: ""
  # The Auth server, which signs people in: such as https://auth.cobranch.example.com, or
  # https://cobranch.example.com/auth. Each identity provider's redirect URI is this URL plus /callback. Without it,
  # nobody can sign in.
  auth: ""
  # The Admin server, which the Back-office calls: such as https://admin.cobranch.example.com/api. With it, the chart
  # runs the Admin server and the Back-office, which backOffice names; without it, neither. Both may stay on a gateway
  # only your operators reach; the Admin API checks every caller's permissions either way.
  admin: ""
  # The Back-office, where the installation's administrators run it: such as https://admin.cobranch.example.com.
  backOffice: ""

# Sign-in (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/sign-in-and-organizations.md). Without a provider, the Console
# says that sign-in isn't set up yet.
auth:
  # The identity providers, any OpenID Connect provider each: its id (lowercase letters, digits and dashes; it names
  # the provider in URLs and the database, so keep it), the name the sign-in page shows, its issuer URL or a preset
  # (google) that fills the issuer in, the client you registered there with urls.auth plus /callback as its redirect
  # URI, and the Secret of yours that holds the client's secret.
  #   - id: google
  #     name: Google
  #     preset: google
  #     clientId: 1234.apps.googleusercontent.com
  #     clientSecret:
  #       secretName: cobranch-google
  #       key: client-secret
  providers: []
  # Who may sign up: anyone, domains (a verified email in signUpDomains) or invited (a pending invitation to a verified
  # email). A first administrator's email may always sign up. Set, it and signUpDomains are the values', which the
  # Back-office only shows; empty, the Back-office's (anyone until an administrator changes it).
  signUp: ""
  signUpDomains: []
  # The first administrators' emails: a verified sign-in with one grants Installation admin, which runs the
  # Back-office, and an email that leaves the list loses that grant at its next sign-in. Grants made in the Back-office
  # are never touched.
  admins: []

# The key that seals the secrets Cobranch keeps in its database, the Back-office's identity providers' client secrets:
# 32 characters at least. A Secret of yours that holds it under secretKey, which the Auth and Admin servers read.
secretsKey:
  existingSecret: ""
  secretKey: key

organizations:
  # Every new user may create organizations (Installation user). Off, only the administrators grant it. Set, it is the
  # values', which the Back-office only shows; null, the Back-office's (on until an administrator changes it).
  selfServe: null

# The bucket, which only the servers reach: Go Cloud names it by URL (s3://, gs://, azblob:// or file://).
blob:
  # Required, such as s3://cobranch-objects?region=eu-west-1 or gs://cobranch-objects.
  url: ""
  # A Secret whose keys become the servers' environment, for credentials the URL's driver reads (such as
  # AWS_ACCESS_KEY_ID). Prefer the cloud's workload identity: serviceAccount.annotations.
  envFromSecret: ""
  # A volume, as a pod spec writes one without its name, mounted at mountPath: the directory of a file:// bucket.
  volume: {}
  mountPath: /var/lib/cobranch/blobs

# The servers' ServiceAccount, which both share.
serviceAccount:
  # Binds the servers to the cloud's workload identity, for the bucket.
  annotations: {}

# Every Cobranch workload's logs and traces. Logs are JSON on stdout, for the cluster's log collector. Traces go over
# OTLP/HTTP to your OpenTelemetry Collector or a vendor's endpoint, as OpenTelemetry's own OTEL_ variables.
telemetry:
  # The lowest level logged: debug, info, warn or error.
  logLevel: info
  traces:
    # Such as http://otel-collector.observability:4318. Empty: no span leaves a pod, and trace IDs still name every
    # request in the logs. Google Cloud Trace takes a Collector with Google's exporter.
    endpoint: ""
    # A Secret of yours that holds the OTLP headers under headersKey, as key=value pairs separated by commas: a
    # vendor's API key, say.
    headersSecret: ""
    headersKey: headers
    # The share of new traces kept, from 0 to 1. A trace that a caller started follows the caller's choice.
    sampleRatio: 1
  # More of OpenTelemetry's variables, such as OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production. Each
  # workload names itself as the service.
  env: {}

# The Auth server: the only workload that talks to the identity providers and sets the session cookie.
authServer:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The REST API's server.
restServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The GraphQL API's server.
graphqlServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Admin API's server, with urls.admin, which the Back-office calls. A few administrators use it, so one replica
# serves.
adminServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Console: its static files and config.json, served by Caddy.
console:
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Back-office, with urls.admin: its static files and config.json, served by Caddy, as the Console's. A few
# administrators use it, so one replica serves.
backOffice:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The Job that migrates the database before the servers of a new version roll out.
migrate:
  # How long it may wait for the database and migrate, after which it fails.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The CronJob that deletes what expired: sign-in flows and sessions, hourly.
maintenance:
  schedule: "0 * * * *"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Cobranch's demo data (db/seeds): users, organizations, repositories and the rest, for a demo installation such as
# Cobranch's own pull request previews. Never turn it on for a real one: the sign-in page then signs anyone in as a demo
# user.
seed:
  # The migrate Job adds the demo data it lacks after migrating the schema, and the Auth server signs in as its users.
  enabled: false

# The bundled PostgreSQL: one replica of the official image, on a persistent volume. Turn it off to bring your own
# database through externalDatabase.
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 18.6-alpine
    pullPolicy: IfNotPresent
  auth:
    database: cobranch
    username: cobranch
    # A Secret of yours that holds the password under secretKey. Without one, the chart generates a password on
    # install and keeps it on upgrade, which needs the cluster at render time: under Argo CD, or anything else that
    # renders without the cluster, give one.
    existingSecret: ""
    secretKey: password
  storage:
    size: 8Gi
    # Empty uses the cluster's default storage class.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Your own PostgreSQL, when postgresql.enabled is false: a Secret holds its URL, sslmode included, under urlKey.
externalDatabase:
  existingSecret: ""
  urlKey: url

# An HTTPRoute per workload with a URL, on your Gateway, from the URL's host and path. The Gateway brings TLS.
httpRoute:
  enabled: false
  annotations: {}
  # The Gateway's listeners to attach to: [{name: public, namespace: gateways, sectionName: https}].
  parentRefs: []
