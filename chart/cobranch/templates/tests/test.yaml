{{- $fullname := include "cobranch.fullname" . }}
# helm test: both servers are ready and answer, and the Console serves its page and where it finds the REST API.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test
  labels:
    {{- include "cobranch.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after a failure, for its logs, until the next test run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      # The cobranch image has what the test needs: a shell and wget.
      image: {{ include "cobranch.image" (dict "root" . "image" .Values.images.cobranch) }}
      imagePullPolicy: {{ .Values.images.cobranch.pullPolicy }}
      command: [/bin/sh, -ec]
      args:
        - |
          rest=http://{{ $fullname }}-rest-server
          graphql=http://{{ $fullname }}-graphql-server
          console=http://{{ $fullname }}-console
          wget -qO- "$rest/readyz"; echo
          # The version the binary was built as: a release's images are main's, retagged, so they report its commit.
          version=$(wget -qO- "$rest/v1/version" | tee /dev/stderr | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          [ -n "$version" ]
          wget -qO- "$graphql/readyz"; echo
          wget -qO- --header 'Content-Type: application/json' --post-data '{"query":"{ version }"}' "$graphql/" | grep -q "\"version\":\"$version\""
          wget -qO- "$console/healthz"; echo
          wget -qO- "$console/" | grep -q '<h1>Cobranch</h1>'
          wget -qO- "$console/config.json" | tee /dev/stderr | grep -q '"restUrl":"{{ .Values.urls.rest | trimSuffix "/" }}"'
          echo "Cobranch {{ .Values.images.cobranch.tag | default .Chart.AppVersion }} answers, built as $version"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        {{- include "cobranch.containerSecurityContext" . | nindent 8 }}
