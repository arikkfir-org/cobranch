{{- $fullname := include "cobranch.fullname" . }}
# helm test: every server is ready and answers, the Console and the Back-office serve their pages and where they find
# the APIs, and, with the demo data on, a seeded sign-in makes a session the REST API accepts, which the Admin API
# refuses unless the user administers the installation, who reads its settings and identity providers; with the Git
# server, the user makes a personal token, clones a repository the demo data's Job pushed to, pushes to it and finds
# the push in a fresh clone and in the REST API's files, and its SSH Service, given one, answers.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test
  labels:
    {{- include "cobranch.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after a failure, for its logs, until the next test run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      # The cobranch image has what the test needs: a shell, wget and git.
      image: {{ include "cobranch.image" (dict "root" . "image" .Values.images.cobranch) }}
      imagePullPolicy: {{ .Values.images.cobranch.pullPolicy }}
      command: [/bin/sh, -ec]
      args:
        - |
          rest=http://{{ $fullname }}-rest-server
          graphql=http://{{ $fullname }}-graphql-server
          console=http://{{ $fullname }}-console
          auth=http://{{ $fullname }}-auth-server
          wget -qO- "$rest/readyz"; echo
          {{- if .Values.urls.auth }}
          wget -qO- "$auth/readyz"; echo
          {{- end }}
          # The version the binary was built as: a release's images are main's, retagged, so they report its commit.
          version=$(wget -qO- "$rest/v1/version" | tee /dev/stderr | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          [ -n "$version" ]
          wget -qO- "$graphql/readyz"; echo
          wget -qO- --header 'Content-Type: application/json' --post-data '{"query":"{ version }"}' "$graphql/" | grep -q "\"version\":\"$version\""
          wget -qO- "$console/healthz"; echo
          # The page routes in the browser, so any path gets it, and any directory answers config.json.
          wget -qO- "$console/acme/members" | grep -q '<title>Cobranch</title>'
          wget -qO- "$console/acme/config.json" | grep -q '"consoleUrl"'
          wget -qO- "$console/config.json" | tee /dev/stderr | grep -q '"restUrl":"{{ .Values.urls.rest | trimSuffix "/" }}","authUrl":"{{ .Values.urls.auth | trimSuffix "/" }}","consoleUrl":"{{ .Values.urls.console | trimSuffix "/" }}","gitUrl":"{{ .Values.urls.git | trimSuffix "/" }}","gitSshUrl":"{{ and .Values.urls.git .Values.urls.gitSsh }}"'
          # Anonymous gets 401 from /v1/me, as a problem.
          wget -qO- --server-response "$rest/v1/me" 2>&1 | grep -q 'HTTP/1.1 401'
          {{- if .Values.urls.git }}
          gitserver=http://{{ $fullname }}-git-server
          wget -qO- "$gitserver/readyz"; echo
          # Without a credential, the Git server asks for one.
          wget -qO- --server-response "$gitserver/acme/website.git/info/refs?service=git-upload-pack" 2>&1 | grep -q 'HTTP/1.1 401'
          {{- if .Values.urls.gitSsh }}
          # Its SSH Service answers with the Git server's banner.
          sleep 2 | nc {{ $fullname }}-git-server-ssh {{ .Values.gitServer.ssh.service.port }} | tee /dev/stderr | grep -q '^SSH-2.0-Cobranch'
          {{- end }}
          {{- end }}
          {{- if .Values.urls.admin }}
          admin=http://{{ $fullname }}-admin-server
          backoffice=http://{{ $fullname }}-back-office
          wget -qO- "$admin/readyz"; echo
          wget -qO- "$admin/v1/version" | grep -q "\"version\":\"$version\""
          wget -qO- --server-response "$admin/v1/orgs" 2>&1 | grep -q 'HTTP/1.1 401'
          wget -qO- "$backoffice/healthz"; echo
          wget -qO- "$backoffice/users" | grep -q '<title>Cobranch Back-office</title>'
          wget -qO- "$backoffice/config.json" | tee /dev/stderr | grep -q '"adminUrl":"{{ .Values.urls.admin | trimSuffix "/" }}","authUrl":"{{ .Values.urls.auth | trimSuffix "/" }}","backOfficeUrl":"{{ .Values.urls.backOffice | trimSuffix "/" }}","consoleUrl":"{{ .Values.urls.console | trimSuffix "/" }}"'
          {{- end }}
          {{- if and .Values.seed.enabled .Values.urls.auth }}
          # The sign-in page lists the demo users, a seeded sign-in sets the session cookie, and the cookie signs in.
          wget -qO- "$auth/providers" | tee /dev/stderr | grep -q '"subject":"owner"'
          {{- include "cobranch.signIn" . | nindent 10 }}
          cookie=$(signIn owner)
          [ -n "$cookie" ]
          wget -qO- --header "Cookie: $cookie" "$rest/v1/me" | tee /dev/stderr | grep -q '"displayName":"Olivia Owner"'
          {{- if .Values.urls.admin }}
          # An Owner administers nothing: the Admin API refuses them.
          wget -qO- --server-response --header "Cookie: $cookie" "$admin/v1/orgs" 2>&1 | grep -q 'HTTP/1.1 403'
          {{- if has "ada@cobranch.example" .Values.auth.admins }}
          # The demo administrator, whom auth.admins lists, lists the installation's organizations.
          cookie=$(signIn admin)
          [ -n "$cookie" ]
          wget -qO- --header "Cookie: $cookie" "$admin/v1/orgs" | tee /dev/stderr | grep -q '"slug":"acme"'
          # They read the installation's settings, with their ETag.
          wget -qO- --server-response --header "Cookie: $cookie" "$admin/v1/settings" 2>&1 | tee /dev/stderr | grep -qi 'etag: "'
          # They list the identity providers.
          wget -qO- --header "Cookie: $cookie" "$admin/v1/providers" | tee /dev/stderr | grep -q '"items":\['
          {{- end }}
          {{- end }}
          {{- if .Values.urls.git }}
          # Olivia, who maintains Acme's website, makes a personal token from her session and clones the website with
          # it. Her commit's push returns once the Git server recorded it, and a fresh clone, from any Git server,
          # brings it.
          cookie=$(signIn owner)
          token=$(wget -qO- --header "Cookie: $cookie" --header 'Content-Type: application/json' --post-data '{"name":"helm test"}' "$rest/v1/me/tokens" \
            | sed -n 's/.*"secret":"\([^"]*\)".*/\1/p')
          [ -n "$token" ]
          export HOME=/tmp/git GIT_TERMINAL_PROMPT=0
          mkdir -p /tmp/git && cd /tmp/git
          url="http://git:$token@${gitserver#http://}/acme/website.git"
          git clone -q "$url" website
          # The demo data's Job pushed the website's history before the test ran.
          [ "$(git -C website tag -l v1.0.0)" = v1.0.0 ]
          echo "Pushed by helm test at $(date -u +%FT%TZ)" >website/README.md
          git -C website add README.md
          git -C website -c user.name='Helm test' -c user.email=helm-test@cobranch.example commit -qm 'Run helm test'
          git -C website push origin HEAD:refs/heads/main
          git clone -q "$url" fresh
          [ "$(git -C fresh rev-parse HEAD)" = "$(git -C website rev-parse HEAD)" ]
          # The REST API reads the pushed files from the Git server's internal port: main's root lists the README and
          # renders it, and its bytes are the commit's.
          tree="$(wget -qO- --header "Cookie: $cookie" "$rest/v1/orgs/acme/repos/website/tree")"
          echo "$tree" >&2
          echo "$tree" | grep -q "\"commit\":\"$(git -C website rev-parse HEAD)\""
          echo "$tree" | grep -qF '"html":"\u003cp\u003ePushed by helm test'
          wget -qO- --header "Cookie: $cookie" "$rest/v1/orgs/acme/repos/website/raw?path=README.md" | grep -q 'Pushed by helm test'
          # Its history through every parent, which the Git server walks, holds the commit.
          wget -qO- --header "Cookie: $cookie" "$rest/v1/orgs/acme/repos/website/commits?parents=all" | tee /dev/stderr \
            | grep -q "\"sha\":\"$(git -C website rev-parse HEAD)\""
          {{- end }}
          {{- end }}
          echo "Cobranch {{ .Values.images.cobranch.tag | default .Chart.AppVersion }} answers, built as $version"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        {{- include "cobranch.containerSecurityContext" . | nindent 8 }}
      volumeMounts:
        # The clones, and git's HOME.
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
