{{- include "cobranch.checkDatabase" . }}
{{- if and .Values.auth.providers (not .Values.urls.auth) }}
{{- fail "auth.providers needs urls.auth: the providers send browsers back to it" }}
{{- end }}
{{- if and .Values.urls.auth (not .Values.urls.console) }}
{{- fail "urls.auth needs urls.console: the Auth server sends signed-in browsers back to the Console" }}
{{- end }}
{{- /* Without urls.auth the providers have no URL to send browsers back to, so the Auth server isn't deployed and the
Console says sign-in isn't set up. */}}
{{- if .Values.urls.auth }}
{{- include "cobranch.server" (dict "root" . "component" "auth-server" "values" .Values.authServer) }}
{{- end }}
