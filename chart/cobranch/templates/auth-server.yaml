{{- include "cobranch.checkDatabase" . }}
{{- if and .Values.auth.providers (not .Values.urls.auth) }}
{{- fail "auth.providers needs urls.auth: the providers send browsers back to it" }}
{{- end }}
{{- /* Without urls.auth the Auth server has no URL to send browsers back to, so it isn't deployed and the Console says
sign-in isn't set up. */}}
{{- if .Values.urls.auth }}
{{- include "cobranch.server" (dict "root" . "component" "auth-server" "values" .Values.authServer) }}
{{- end }}
