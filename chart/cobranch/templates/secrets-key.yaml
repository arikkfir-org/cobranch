{{- if and (not .Values.secretsKey.existingSecret) (or .Values.urls.auth .Values.urls.admin) }}
{{- $name := include "cobranch.secretsKey.secret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cobranch.labels" (dict "root" . "component" "secrets-key") | nindent 4 }}
  annotations:
    # Kept on uninstall, as the database is: a reinstall finds the key its secrets were sealed with.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data .Values.secretsKey.secretKey) }}
  {{ .Values.secretsKey.secretKey }}: {{ index $existing.data .Values.secretsKey.secretKey }}
  {{- else }}
  {{ .Values.secretsKey.secretKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
