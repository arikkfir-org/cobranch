{{- include "cobranch.checkDatabase" . }}
{{- /* It reads runs' logs: ended runs' from the object store, running runs' from their pods, as the servers'
ServiceAccount, whose token it mounts where runs execute pods. */}}
{{- $env := list (include "cobranch.gitInternalEnv" . | trim) (include "cobranch.runLogsEnv" . | trim) | compact | join "\n" }}
{{- $account := ternary (include "cobranch.serviceAccount" .) "" .Values.jobs.pods }}
{{- include "cobranch.server" (dict "root" . "component" "rest-server" "values" .Values.restServer "bucket" true "serviceAccount" $account "env" $env) }}
