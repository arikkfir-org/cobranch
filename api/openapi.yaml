  /orgs/{org}/artifacts/{id}/versions/{version}/raw:
    get:
      operationId: getArtifactVersionRaw
      summary: >-
        A version's body, 0 for the newest version's, served as something that runs nothing and loads nothing but data
        URLs, whatever it holds: an HTML page sandboxed, an SVG as an image. Takes artifacts.read on the artifact.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/artifactVersionNumber"
        - name: download
          in: query
          description: Whether to answer the body as an attachment, named after the artifact's title and the version's format.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The body, as the version's format.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              description: private, no-cache, so a revoked grant stops the next read.
              required: true
              schema:
                type: string
            Content-Disposition:
              description: attachment, with a file name, when download is true.
              schema:
                type: string
            Content-Security-Policy:
              description: Sandboxes the body and lets it load data URLs and its own inline styles alone, so it runs nothing and calls nowhere.
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              description: nosniff, so no browser takes the body for another type.
              required: true
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: same-site, so only the installation's own pages embed the body.
              required: true
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
