            type: array
            items:
              $ref: "#/components/schemas/TaskState"
        - name: repositoryId
          in: query
          description: Only the tasks that work in this repository, by its ID.
          x-go-name: RepositoryID
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: Where the page starts, as the previous page's Link names it; the newest task when left out. Opaque.
          schema:
            type: string
        - name: limit
          in: query
          description: How many tasks the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: The page's tasks, newest first.
          headers:
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: assignTask
      summary: >-
        Assigns a task to one of the organization's agents, queued until the controller runs it; whatever it does is
        capped by the assigner's permissions as they are when it acts. Takes agents.assign, and repo.read on the
        repository it names. An agent assigns no tasks.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: The task, queued.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/tasks/{number}:
    get:
      operationId: getTask
      summary: >-
        One of the organization's tasks by its number; takes org.read, repo.read on the repository it names, and
        issues.read for an issue's task.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/taskNumber"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The task.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "304":
          description: The task is still the version If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/tasks/{number}/cancel:
    post:
      operationId: cancelTask
      summary: >-
        Cancels one of the organization's tasks that hasn't ended; takes being its assigner, or org.principals.manage.
        A task that has ended answers 409 task.ended; If-Match, when given, refuses with 412 a change made meanwhile.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/taskNumber"
