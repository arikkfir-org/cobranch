# Cobranch's REST contract, written first: internal/adapters/rest generates its server from it, and the SDKs will be
# generated from it too (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/architecture.md, "API conventions").
openapi: 3.1.0
info:
  title: Cobranch API
  version: v1
  description: The REST surface of Cobranch, the surface of its SDKs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The version of Cobranch that serves this installation.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  /page-views:
    post:
      operationId: reportPageViews
      summary: >-
        Reports how long Console pages took to show and how many Git reads each took, for the installation's metrics
        (cobranch.console.page.duration and cobranch.console.page.git.reads). Takes no credential: the sign-in page
        reports too. Records nothing about who viewed what.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViews"
      responses:
        "204":
          description: >-
            Recorded every view that names a page and a navigation of this API's, with a time and a count in range. A
            view that doesn't is skipped, so a Console newer than the server loses only the views of its new pages.
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Who the request's credential signs in.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/task:
    get:
      operationId: getMyTask
      summary: >-
        The task the request's task token works, with its organization's slug, for the agent's harness to start from;
        403 for any other credential.
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTask"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/task/spend:
    post:
      operationId: recordMyTaskSpend
      summary: >-
        Records a call of the model of the task the request's task token works, as the model proxy of its pod reports
        it, and answers what the task spent so far; 403 for any other credential. Cobranch prices the call at the
        organization's prices for that model of its agent's provider, or for its agent's model when the organization
        has none for that one. A report that repeats a call's ID records nothing. The call that brings the task to its
        cap, its agent's, ends it Failed, saying so, and its token then acts no more; a task that has ended answers
        409 task.ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUsage"
      responses:
        "200":
          description: What the task spent, with the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSpend"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: The user's live sessions, newest first.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      summary: Revokes one of the user's sessions; the next request with its cookie fails.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/tokens:
    get:
      operationId: listMyTokens
      summary: The user's personal tokens that are not revoked, expired ones included, newest first.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMyToken
      summary: Makes a personal token that acts as the user, narrowed to the permissions it lists, and shows it once; only from a session, never from another token or an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalTokenInput"
      responses:
        "201":
          description: The token and its secret, which is shown here and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalTokenCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/tokens/{id}:
    delete:
      operationId: revokeMyToken
      summary: Revokes one of the user's personal tokens; the next request with it fails.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/ssh-keys:
    get:
      operationId: listMySSHKeys
      summary: The user's SSH keys, newest first.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [sshKeys]
                properties:
                  sshKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/SSHKey"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMySSHKey
      summary: Adds an SSH key that acts as the user over SSH, as their session would; only from a session, never from a token or an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHKeyInput"
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/ssh-keys/{id}:
    delete:
      operationId: deleteMySSHKey
      summary: Deletes one of the user's SSH keys; the next connection with it fails. Only from a session, never from a token or an API key.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/preferences:
    get:
      operationId: getMyPreferences
      summary: >-
        How Cobranch looks to the viewer, kept with them so it follows them to every browser: the defaults, at
        version 0, until they first change one. Only a person has preferences; any other credential answers 403.
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The preferences.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "304":
          description: The preferences are still the ones If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMyPreferences
      summary: >-
        Changes the viewer's preferences the merge patch (RFC 7396) names. The change names the ETag it was made from
        in If-Match ("0" before the first change, * for whichever is there); without it, the answer is 428.
      parameters:
        - $ref: "#/components/parameters/ifMatchPreferences"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/PreferencesPatch"
      responses:
        "200":
          description: The preferences as they now are.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: The organizations the user belongs to, by name.
      responses:
        "200":
          description: The organizations.
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/usage:
    get:
      operationId: getMyUsage
      summary: What the user takes of what the limits cap, each against the limit that applies; the user's own, so it takes no permission.
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The user's usage.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerUsage"
        "304":
          description: The usage is still the one If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations:
    get:
      operationId: listMyInvitations
      summary: The invitations waiting for the user's verified emails, oldest first.
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations/{id}/accept:
    post:
      operationId: acceptInvitation
      summary: Joins the organization through an invitation to one of the user's verified emails.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The organization joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations/{id}/decline:
    post:
      operationId: declineInvitation
      summary: Declines an invitation to one of the user's verified emails.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/artifact-access:
    get:
      operationId: listMyArtifactAccess
      summary: Who lists or reads every artifact the user owns, in each organization both belong to; the roles they hold on the user, by name.
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtifactGrant"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: shareMyArtifacts
      summary: >-
        Gives a member of one of the user's organizations, or an agent of one, lister or viewer on the user, in place of
        any role it held there: it then lists, or reads, every artifact the user owns in each organization both belong
        to. Only from a session, never from a token or an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactShare"
      responses:
        "204":
          description: Shared.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/artifact-access/{principal}:
    delete:
      operationId: unshareMyArtifacts
      summary: Takes every role a principal holds on the user; only from a session, never from a token or an API key.
      parameters:
        - $ref: "#/components/parameters/principal"
      responses:
        "204":
          description: Unshared.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/join-requests:
    get:
      operationId: listMyJoinRequests
      summary: The user's requests to join organizations that still wait, oldest first.
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [joinRequests]
                properties:
                  joinRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /roles:
    get:
      operationId: listBuiltInRoles
      deprecated: true
      summary: The built-in roles granted at a scope. Deprecated, since roles are an organization's; the organization's roles list them all.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [organization]
      responses:
        "200":
          description: The built-in roles, with the route's end announced.
          headers:
            Deprecation:
              description: When the route was deprecated, as RFC 9745 says.
              schema:
                type: string
            Sunset:
              description: When the route goes, as RFC 8594 says.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /permissions:
    get:
      operationId: listPermissions
      summary: The permissions a role granted at a scope may hold, from the catalog.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [organization]
      responses:
        "200":
          description: The permissions.
          content:
            application/json:
              schema:
                type: object
                required: [permissions, labels]
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                  labels:
                    type: array
                    description: Every permission of permissions as people read it, by area, in the order a role editor lists them.
                    items:
                      $ref: "#/components/schemas/PermissionLabel"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs:
    post:
      operationId: createOrganization
      summary: Creates an organization, with the user its first Owner; takes orgs.create. A user who created as many organizations as the installation allows is refused with 409 limit.organizations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  description: 2 to 39 lowercase letters, digits and single hyphens, unique among organizations and their old slugs.
                name:
                  type: string
      responses:
        "201":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}:
    get:
      operationId: getOrganization
      summary: An organization by its slug, or an old slug of its; takes org.read, and otherwise answers 404.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The organization, with its current slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrganization
      summary: Changes an organization's name, slug or settings, its issue key among them; takes org.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSettings"
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/usage:
    get:
      operationId: getOrganizationUsage
      summary: What the organization takes of what its limits cap, each against the limit that applies, with the Git data of each of its repositories the viewer reads; takes org.read. The totals count every repository, those the viewer doesn't read too.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The organization's usage.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUsage"
        "304":
          description: The usage is still the one If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/leave:
    post:
      operationId: leaveOrganization
      summary: Leaves the organization, dropping every role held there; its last Owner can't.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "204":
          description: Left.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members:
    get:
      operationId: listMembers
      summary: The organization's members with the roles they hold there; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}:
    delete:
      operationId: removeMember
      summary: Removes a member, with every role they hold; takes org.members.manage and every permission of those roles.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}/roles:
    post:
      operationId: grantRole
      summary: Gives a member a role; takes org.grants.manage and every permission of the role.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Granted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}/roles/{role}:
    delete:
      operationId: revokeRole
      summary: Takes a role from a member; takes org.grants.manage and every permission of the role. The last Owner keeps Owner.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
        - $ref: "#/components/parameters/role"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/roles:
    get:
      operationId: listRoles
      summary: The roles the organization grants, the built-in ones first, then its own; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
