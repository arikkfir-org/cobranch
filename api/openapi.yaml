          description: Where the updates start, as listChatThreads' after or a previous answer's names it. Opaque.
          schema:
            type: string
        - name: wait
          in: query
          description: How many seconds to wait for an update when there is none yet; at most 15, so a server that stops lets every wait end first.
          schema:
            type: integer
            minimum: 0
            maximum: 15
            default: 0
      responses:
        "200":
          description: The updates, at most 100, in order.
          content:
