          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/diff:
    get:
      operationId: getBranchDiff
      summary: >-
        The branch's change as a request to merge into its base: from the merge base of its base's tip and its head
        to its head, so what its base gained since doesn't show; takes repo.read. Main merges into nothing and answers
        400 branch.default. It reads the Git server: an installation without one answers 503.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The branch's diff.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        "304":
          description: The diff is still the one If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/deleted-branches/{branch}:
    get:
      operationId: getDeletedBranch
      summary: The latest deletion of the repository's branch of a name, which no live branch has, with who deleted it and when, the head it was at and its last merge; takes repo.read. A name no deleted branch had, or a live branch has, answers 404.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      responses:
        "200":
          description: The deleted branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedBranch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/issue:
    put:
      operationId: linkBranch
      summary: >-
        Links the branch to one of the organization's issues by hand, in place of any issue it works on, for the
        viewer; takes issues.write, and repo.read. An issue in Backlog or Todo moves to In progress. main works on no
        issue: 400 branch.default, as for an issue the organization doesn't have, issue.invalid.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBranchInput"
      responses:
        "200":
          description: The branch's issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchIssue"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unlinkBranch
      summary: >-
        Unlinks the branch from its issue by hand, for the viewer, so its name never links it again; takes issues.write,
        and repo.read. A branch with no issue answers 204 too.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      responses:
        "204":
          description: The branch works on no issue.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/merge:
    post:
      operationId: mergeBranch
      summary: >-
        Merges the branch into its base, main, for the viewer, and answers once Cobranch has recorded the merge as a push
        of main, which makes the branch merged once the push worker processes it; takes repo.merge for a ready branch,
        and repo.bypass for one that isn't, which also passes main's merge requirements. A head the branch has moved
        from, or a branch or a main that moved while Cobranch built the merge, answers 409 branch.moved; a branch with
        nothing to merge, one that isn't ready, a fast-forward of one behind main, a merge commit of one that conflicts
        with main and a push the merge requirements refuse answer 409 with codes of their own. It builds the merge on
        the Git server: an installation without one answers 503.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeInput"
      responses:
        "200":
          description: The merge, recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/chat:
    get:
      operationId: listChatThreads
      summary: >-
        A page of the branch's chat, its threads newest first, each with its messages in the order they were posted;
        takes repo.read. Its after is where the chat's updates stood when the page was read: listChatUpdates after it
        answers every change the page may lack.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - name: cursor
          in: query
          description: Where the page starts, as the previous page's Link names it; the newest thread when left out. Opaque.
          schema:
            type: string
        - name: limit
          in: query
          description: How many threads the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: The page's threads, newest first.
          headers:
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [threads, after]
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatThread"
                  after:
                    type: string
                    description: Where the chat's updates stood when the page was read, as listChatUpdates takes it. Opaque.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/chat/threads:
    post:
      operationId: startChatThread
      summary: >-
        Starts a thread on the branch's chat for the viewer, with its first message, perhaps anchored to lines of a file
        at one of the repository's commits; takes messages.post. Starting the viewer's thread again by the ID it picked
        answers it as it is, and an ID of another's thread answers 409.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatThreadInput"
      responses:
        "201":
          description: The thread, with its message.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/chat/threads/{thread}:
    get:
      operationId: getChatThread
      summary: One of the branch's chat threads, with its messages in the order they were posted; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/thread"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The thread.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "304":
          description: The thread is still the one If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateChatThread
      summary: >-
        Resolves one of the branch's chat threads, or opens it again; takes messages.post for a thread the viewer started
        and messages.moderate for another's. The change names the thread's ETag in If-Match; without it, the answer is
        428. A thread already so is answered as it is.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/thread"
        - $ref: "#/components/parameters/ifMatchChat"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ChatThreadPatch"
      responses:
        "200":
          description: The thread as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/chat/threads/{thread}/messages:
    post:
      operationId: postChatMessage
      summary: >-
        Posts a message to one of the branch's chat threads for the viewer; takes messages.post. Posting the viewer's
        message to the thread again by the ID it picked answers it as it is, and an ID of another message answers 409.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/thread"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The message.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/chat/threads/{thread}/messages/{message}:
    get:
      operationId: getChatMessage
      summary: One of the messages of one of the branch's chat threads; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/thread"
        - $ref: "#/components/parameters/message"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The message.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "304":
          description: The message is still the one If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: editChatMessage
      summary: >-
        Changes the body of one of the viewer's messages; takes messages.post, and only a message's author edits it. The
        edit names the message's ETag in If-Match; without it, the answer is 428. A deleted message answers 409.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/thread"
        - $ref: "#/components/parameters/message"
        - $ref: "#/components/parameters/ifMatchChat"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ChatMessagePatch"
      responses:
        "200":
          description: The message as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteChatMessage
      summary: >-
        Deletes a message, which empties it and keeps its place in its thread, marked with who deleted it; takes
        messages.post for the viewer's own and messages.moderate for another's. The deletion names the message's ETag in
        If-Match; without it, the answer is 428.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - $ref: "#/components/parameters/thread"
        - $ref: "#/components/parameters/message"
        - $ref: "#/components/parameters/ifMatchChat"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches/{branch}/chat/updates:
    get:
      operationId: listChatUpdates
      summary: >-
        The changes to the branch's chat after a cursor, in order, each with its thread and message as they are now;
        takes repo.read, checked at every read. With none yet, it waits up to wait seconds for one, so a client follows
        the chat by asking again after the answer's after. Applying them in order, replacing threads and messages by ID,
        holds the chat as it is.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
        - name: after
          in: query
          required: true
          description: Where the updates start, as listChatThreads' after or a previous answer's names it. Opaque.
          schema:
            type: string
        - name: wait
          in: query
          description: How many seconds to wait for an update when there is none yet; at most 15, so a server that stops lets every wait end first.
          schema:
            type: integer
            minimum: 0
            maximum: 15
            default: 0
      responses:
        "200":
          description: The updates, at most 100, in order.
          content:
            application/json:
              schema:
                type: object
                required: [updates, after]
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatUpdate"
                  after:
                    type: string
                    description: Where the next read starts, after the last update; the request's after when there is none. Opaque.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits:
    get:
      operationId: listCommits
      summary: >-
        A page of history, nearest first; takes repo.read. Along first parents, as git log --first-parent lists it, it
        walks the commits pushes recorded, and a branch at no commit a push recorded has none. Along every parent, as
        git log --date-order lists it (no commit before its children, the newest first among those the graph leaves
        free), it reads the Git server (an installation without one answers 503) and leaves out any commit
        no push recorded.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: query
          description: The branch whose history the page lists, without refs/heads/, unless ref names another start.
          schema:
            type: string
            default: main
        - name: ref
          in: query
          description: >-
            Where the history starts instead of branch: a branch's or a tag's name, without refs/heads/ or refs/tags/,
            or a commit's full name. A full name is tried first, then a branch, then a tag.
          schema:
            type: string
        - name: parents
          in: query
          description: Which parents of each commit the history follows, the first alone or every one.
          schema:
            type: string
            enum: [first, all]
            default: first
        - name: cursor
          in: query
          description: >-
            Where the page starts, as the previous page's Link names it, in place of branch and ref; the start's commit
            when left out. Opaque: every parent's cursor holds the commit the first page started from, so later pages
            hold still while the branch moves on.
          schema:
            type: string
        - name: limit
          in: query
          description: How many commits the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The page's commits, nearest first, without their pushes.
          headers:
            ETag:
              description: A strong entity tag of the page, which its commits and its next page's link fix.
              required: true
              schema:
                type: string
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commit"
        "304":
          description: The page is still the one If-None-Match names.
          headers:
            ETag:
              description: A strong entity tag of the page, which its commits and its next page's link fix.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}:
    get:
      operationId: getCommit
      summary: One of the repository's commits by its full name, with the push that first brought it; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
      responses:
        "200":
          description: The commit, with its push.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commit"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}/annotations:
    get:
      operationId: listAnnotations
      summary: The annotations principals set on one of the repository's commits, by name; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
      responses:
        "200":
          description: The annotations.
          content:
            application/json:
              schema:
                type: object
                required: [annotations]
                properties:
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}/annotations/{name}:
    put:
      operationId: setAnnotation
      summary: Sets an annotation on one of the repository's commits for the viewer, or changes the one the viewer set there before; takes annotations.write. An annotation of that name that another principal set is refused, naming them, until it is deleted. A change names the ETag it was made from in If-Match, and a new annotation If-None-Match *; without either, the answer is 428.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
        - $ref: "#/components/parameters/annotation"
        - $ref: "#/components/parameters/ifMatchAnnotation"
        - $ref: "#/components/parameters/ifNoneMatchAnnotation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationInput"
      responses:
        "200":
          description: The annotation as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnnotation
      summary: Deletes an annotation from one of the repository's commits, which frees its name there; takes annotations.write for the viewer's own, and annotations.delete_any for another principal's. The deletion names the ETag it was decided on in If-Match; without it, the answer is 428.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
        - $ref: "#/components/parameters/annotation"
        - $ref: "#/components/parameters/ifMatchAnnotation"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}/diff:
    get:
      operationId: getCommitDiff
      summary: >-
