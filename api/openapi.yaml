    post:
      operationId: requestReview
      summary: >-
        Asks the organization's AI reviewer for another review of the branch's head; takes repo.push. It cancels the
        branch's open review task and queues a new one, which starts even for a head pushed from outside the
        organization. Main's pushes are never reviewed, and a branch that main's /cobranch-review.yaml leaves out answers
        409 review.off; a reviewer without a model answers 409 reviewer.no_model, and a suspended one 409
        reviewer.suspended.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      responses:
        "202":
          description: The review, queued; Location names its task.
          headers:
            Location:
              description: The review task's URL.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIReview"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
