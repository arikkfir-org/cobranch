        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/raw:
    get:
      operationId: getRaw
      summary: >-
        The bytes of the file or symlink at a path of the commit a ref names, served as nothing that runs: an image as
        its type, text as text/plain, anything else as an attachment; takes repo.read. It reads the Git server: an
        installation without one answers 503.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/ref"
        - name: path
          in: query
          required: true
          description: The file's path from the repository's root, as names separated by /.
          schema:
            type: string
        - name: download
          in: query
          description: Whether to answer the bytes as an attachment, whatever they are.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The bytes.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/RawCacheControl"
            Content-Disposition:
              description: attachment, with the file's name, for anything but an image or text, or when download is true.
              schema:
                type: string
            Content-Security-Policy:
              description: Lets the bytes load images of their own origin and data URLs alone, and sandboxes them, so an HTML or SVG file runs nothing.
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              description: nosniff, so no browser takes the bytes for another type.
              required: true
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: same-site, so only the installation's own pages embed the bytes.
              required: true
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "304":
          description: The bytes are still those If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/RawCacheControl"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    environmentId:
      name: environment
      in: path
      required: true
      description: The environment's ID.
      schema:
        type: string
        format: uuid
    deliveryNumber:
      name: number
      in: path
      required: true
      description: The delivery's number in its repository.
      schema:
        type: integer
        format: int64
        minimum: 1
    runNumber:
      name: number
      in: path
      required: true
      description: The run's number in its repository.
      schema:
        type: integer
        format: int64
        minimum: 1
    number:
      name: number
      in: path
      required: true
      description: The issue's number in its organization, such as 42 for ACME-42.
      schema:
        type: integer
    label:
      name: label
      in: path
      required: true
      description: The label's ID.
      x-go-name: LabelID
      schema:
        type: string
        format: uuid
    ifMatchLabel:
      name: If-Match
      in: header
      description: The ETag of the label the change was made from; a change made meanwhile is refused with 412.
      schema:
        type: string
    ifMatchIssue:
      name: If-Match
      in: header
      description: The ETag of the issue the change was made from, or its version alone, quoted; a change made meanwhile is refused with 412, while a changed issue key, which renames the issue, is not.
      schema:
        type: string
    sha:
      name: sha
      in: path
      required: true
      description: The commit's full name, in lowercase hexadecimal.
      x-go-name: SHA
      schema:
        type: string
    branch:
      name: branch
      in: path
      required: true
      description: The branch's name, without refs/heads/, such as feature/login; a slash in it travels escaped, as feature%2Flogin.
      x-go-name: BranchName
      schema:
        type: string
    annotation:
      name: name
      in: path
      required: true
      description: The annotation's name, such as ci/build; a slash in it travels escaped, as ci%2Fbuild.
      x-go-name: Name
      schema:
        type: string
    thread:
      name: thread
      in: path
      required: true
      description: One of the chat's threads, by ID.
      x-go-name: ThreadID
      schema:
        type: string
        format: uuid
    message:
      name: message
      in: path
      required: true
      description: One of the thread's messages, by ID.
      x-go-name: MessageID
      schema:
        type: string
        format: uuid
    ifMatchChat:
      name: If-Match
      in: header
      description: The ETag of the thread or the message the change was made from, which refuses with 412 one made meanwhile; * names whichever is there.
      schema:
        type: string
    ifMatchAnnotation:
      name: If-Match
      in: header
      description: The ETag of the annotation the change was made from, which refuses with 412 one made meanwhile, or one that isn't there; * names whichever is there.
      schema:
        type: string
    ifMatchBranch:
      name: If-Match
      in: header
      description: The head the viewer saw, quoted, such as "4b825dc642cb6eb9a060e54bf8d69288fbee4904", which refuses with 412 a branch that moved from it; * deletes the branch wherever it is, at its new head when it moves meanwhile, and answers 412 only once it kept moving.
      schema:
        type: string
    ifNoneMatchAnnotation:
      name: If-None-Match
      in: header
      description: "*, to set an annotation that isn't there: one the viewer set refuses with 412, and another principal's with 409, as every change of it does."
      schema:
        type: string
    org:
      name: org
      in: path
      required: true
      description: The organization's slug, or an old slug of its.
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      description: The repository's slug in its organization, or an old slug of its.
      schema:
        type: string
    principal:
      name: principal
      in: path
      required: true
      description: One of the organization's members or API keys, by principal ID.
      x-go-name: PrincipalID
      schema:
        type: string
        format: uuid
    user:
      name: user
      in: path
      required: true
      description: A member's user ID.
      x-go-name: UserID
      schema:
        type: string
        format: uuid
    role:
      name: role
      in: path
      required: true
      x-go-name: RoleID
      schema:
        type: string
        format: uuid
    key:
      name: key
      in: path
      required: true
      description: An API key's ID.
      x-go-name: KeyID
      schema:
        type: string
        format: uuid
    secret:
      name: secret
      in: path
      required: true
      description: One of an API key's secrets, by ID.
      x-go-name: SecretID
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ref:
      name: ref
      in: query
      description: >-
        The commit to read: a branch's or a tag's name, without refs/heads/ or refs/tags/, or a commit's full name. A
        full name is tried first, then a branch, then a tag.
      schema:
        type: string
        default: main
    path:
      name: path
      in: query
      description: The directory's path from the repository's root, as names separated by /; empty for the root.
      schema:
        type: string
        default: ""
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: The ETag of the answer the caller holds; while it is still theirs, the answer is 304.
      schema:
        type: string
    agent:
      name: agent
      in: path
      required: true
      description: One of the organization's agents, by its principal ID.
      x-go-name: AgentID
      schema:
        type: string
        format: uuid
    taskNumber:
      name: number
      in: path
      required: true
      description: The task's number in its organization.
      schema:
        type: integer
        format: int64
        minimum: 1
    ifMatchAgent:
      name: If-Match
      in: header
      description: The ETag of the agent the change was made from, which refuses with 412 one made meanwhile; * names whichever is there.
      schema:
        type: string
    ifMatchTask:
      name: If-Match
      in: header
      description: The ETag of the task the change was made from, which refuses with 412 one made meanwhile; * or none names whichever is there.
      schema:
        type: string
  headers:
    ETag:
      description: A strong entity tag of the answer.
      required: true
      schema:
        type: string
    Location:
      description: Where what the request made is, relative to the API's base.
      required: true
      schema:
        type: string
    RawCacheControl:
      description: >-
        private, max-age=31536000, immutable when the ref is the full name of the commit it resolved to, whose bytes
        never change; private, no-cache, as every other answer, when it is a branch or a tag.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: An error, as problem details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PageViews:
      type: object
      required: [views]
      properties:
        views:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PageView"
    PageView:
      type: object
      description: One view of a Console page, from the wait's start to the page drawn.
      required: [page, navigation, durationMs, gitReads]
      properties:
        page:
          type: string
          description: The Console's page.
          enum: [sign-in, welcome, settings, organization, organization.members, organization.roles,
            organization.api-keys, organization.settings, organization.new-repository, organization.issues, repository.code,
            repository.file, repository.commits, repository.commit, repository.branches, repository.branch,
            repository.changes, repository.access, repository.settings]
        navigation:
          type: string
          description: load, the browser loading the Console, timed from its navigation's start; route, a move inside it, timed from the click or Back.
          enum: [load, route]
        durationMs:
          type: number
          description: How long the page took to show, in milliseconds.
          minimum: 0
          maximum: 600000
        gitReads:
          type: integer
          description: How many Git reads the page's API calls took, as their answers' Server-Timing named them.
          minimum: 0
          maximum: 1000
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The version the server was built as, a release version or a commit's short SHA.
          examples: [v0.1.0, 1e76e84]
    User:
      type: object
      description: A person, a principal of kind user.
      required: [id, displayName, emails, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        emails:
          type: array
          description: The emails the user holds; the sign-up's verified one today, several later.
          items:
            $ref: "#/components/schemas/Email"
        permissions:
          type: array
          description: The permissions the user holds at the installation, such as orgs.create.
          items:
            type: string
    Email:
      type: object
      required: [email, verified]
      properties:
        email:
          type: string
        verified:
          type: boolean
    Session:
      type: object
      description: A signed-in browser.
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, ip, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the session ends however it is used.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: Whether this is the session the request itself came with.
    Organization:
      type: object
      description: An organization, with what the viewer may do there.
      required: [id, slug, name, membershipRoleId, acceptsJoinRequests, issueKey, createdAt, viewerPermissions]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: The current slug; a request by an old one gets the organization with this one.
        name:
          type: string
        membershipRoleId:
          type: string
          format: uuid
          description: The role everyone who joins gets.
        acceptsJoinRequests:
          type: boolean
        providers:
          type: array
          description: The identity providers its members may sign in with; absent, all of the installation's.
          items:
            type: string
        issueKey:
          type: string
          description: The key its issues' identifiers start with, such as ACME in ACME-42.
        createdAt:
          type: string
          format: date-time
        viewerPermissions:
          type: array
          description: The permissions the viewer holds at the organization.
          items:
            type: string
    OrganizationSettings:
      type: object
      description: What a manager changes; a field left out keeps its value.
      properties:
        slug:
          type: string
        name:
          type: string
        membershipRoleId:
          type: string
          format: uuid
        acceptsJoinRequests:
          type: boolean
        providers:
          type: array
          description: The identity providers members may sign in with, by ID. Empty, all of the installation's; left out or null, as before.
          items:
            type: string
        issueKey:
          type: string
          description: 1 to 10 uppercase letters and digits, starting with a letter; changing it renames every issue's identifier.
    Role:
      type: object
      description: A role granted at the organization, built in or its own.
      required: [id, name, description, permissions, builtIn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        builtIn:
          type: boolean
        orgId:
          type: string
          format: uuid
          description: The organization a custom role belongs to; absent on a built-in role.
    Repository:
      type: object
      description: One of an organization's Git repositories, with what the viewer may do there. Every repository opens on main, its default branch, which nobody changes.
      required: [id, orgId, slug, name, description, objectFormat, visibility, createdAt, viewerPermissions]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        slug:
          type: string
          description: The current slug; a request by an old one gets the repository with this one.
        name:
          type: string
        description:
          type: string
        objectFormat:
          type: string
          enum: [sha1, sha256]
          description: The hash its history's objects are named by.
        visibility:
          type: string
          enum: [private, internal]
          description: Who reaches it, as its grants say. Private, its creator and the organization's Owners; internal, someone else too.
        createdBy:
          type: string
          format: uuid
          description: Who created it; absent once they are gone.
        createdAt:
          type: string
          format: date-time
        viewerPermissions:
          type: array
          description: The permissions the viewer holds on the repository.
          items:
            type: string
    Usage:
      type: object
      description: What a user or an organization takes of what one limit caps, against the limit that applies.
      required: [used, limit]
      properties:
        used:
          type: integer
          format: int64
          description: How many it holds, or the bytes it stores.
        limit:
          type: integer
          format: int64
          description: The most it may hold or store; 0 caps nothing.
    ViewerUsage:
      type: object
      description: What the user takes of what the limits cap.
      required: [organizations]
      properties:
        organizations:
          $ref: "#/components/schemas/Usage"
          description: The organizations the user created for themselves that still exist, against the most a user may create. Those an administrator created for them count against nobody.
    OrganizationUsage:
      type: object
      description: What an organization takes of what its limits cap, with the Git data of each of its repositories the viewer reads.
      required: [repositories, gitData, byRepository]
      properties:
        repositories:
          $ref: "#/components/schemas/Usage"
          description: Its repositories, every one of them.
        gitData:
          $ref: "#/components/schemas/Usage"
          description: The bytes of its repositories' active packs, as the object store keeps them.
        byRepository:
          type: array
          description: The repositories the viewer reads, by slug, each with its Git data.
          items:
            $ref: "#/components/schemas/RepositoryUsage"
    RepositoryUsage:
      type: object
      description: One repository's share of its organization's Git data.
      required: [id, slug, name, gitData]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        gitData:
          type: integer
          format: int64
          description: The bytes of its active packs.
    RepositoryInput:
      type: object
      description: What makes a repository.
      required: [slug]
      properties:
        slug:
          type: string
          description: 1 to 100 lowercase letters, digits, hyphens, dots and underscores, starting with a letter or digit, not ending in .git, unique in the organization.
        name:
          type: string
          description: The slug when left out.
        description:
          type: string
    RepositorySettings:
      type: object
      description: What a maintainer changes; a field left out keeps its value.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
    RepositoryAccess:
      type: object
      description: A principal's grants on a repository.
      required: [principalId, kind, displayName, roles]
      properties:
        principalId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [user, api_key]
        displayName:
          type: string
        roles:
          type: array
          description: The roles it holds on the repository, each with the permissions it gives there.
          items:
            $ref: "#/components/schemas/Role"
    Branch:
      type: object
      description: >-
        One of a repository's live branches and the commit it is at. Every branch but main is a request to merge into
        its base, main, and carries its status; main carries none of base, status, ahead and behind, and its checks are empty.
      required: [name, head, createdAt, updatedAt, checks]
      properties:
        name:
          type: string
          description: Its name, without refs/heads/.
        head:
          type: string
          description: The object it is at.
        commit:
          $ref: "#/components/schemas/Commit"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When a push last moved it.
        base:
          type: string
          description: The branch it merges into, main.
        status:
          $ref: "#/components/schemas/BranchStatus"
        checks:
          type: array
          description: >-
            How it meets its base's merge requirements, as its status last worked them out: each required annotation,
            linear history when required, and being up to date. Empty for main.
          items:
            $ref: "#/components/schemas/BranchCheck"
        ahead:
          type: integer
          description: How many commits it has that its base lacks; left out until a push works it out.
        behind:
          type: integer
          description: How many commits its base has that it lacks; left out until a push works it out.
        requirements:
          $ref: "#/components/schemas/MergeRequirements"
        merge:
          $ref: "#/components/schemas/BranchMerge"
        issue:
          $ref: "#/components/schemas/BranchIssue"
        settingsError:
          type: string
          description: >-
            Why the /cobranch.yaml at its head doesn't parse, with the line at fault: its jobs run nothing until it
            does. Left out when it parses, or there is none.
    BranchIssue:
      type: object
      description: >-
        The issue a branch works on, and how the branch was linked to it; getBranch answers it, a list doesn't, and
        leaves it out for a branch that works on none, and for a viewer who holds no issues.read.
      required: [number, identifier, title, state, priority, linkedBy]
      properties:
        number:
          type: integer
        identifier:
          type: string
          description: Its organization's issue key and its number, such as ACME-42.
        title:
          type: string
        state:
          $ref: "#/components/schemas/IssueState"
        priority:
          $ref: "#/components/schemas/IssuePriority"
        linkedBy:
          $ref: "#/components/schemas/LinkedBy"
    LinkedBy:
      type: string
      description: How a branch was linked to its issue, or unlinked from it, by its name, or by hand, which its name never undoes.
      enum: [name, hand]
    LinkBranchInput:
      type: object
      description: The issue to link a branch to.
      required: [number]
      properties:
        number:
          type: integer
          description: One of the organization's issues, by its number.
    IssueBranch:
      type: object
      description: >-
        A branch linked to an issue, of a repository the viewer reads: the commit it is at, its status as a request to
        merge while a push has worked it out, and how it was linked. A deleted branch stays linked.
      required: [repository, name, head, deleted, linkedBy, linkedAt]
      properties:
        repository:
          $ref: "#/components/schemas/IssueRepository"
        name:
          type: string
          description: Its name, without refs/heads/.
        head:
          type: string
          description: The object it is at, or was at when it was deleted.
        status:
          $ref: "#/components/schemas/BranchStatus"
        deleted:
          type: boolean
        linkedBy:
          $ref: "#/components/schemas/LinkedBy"
        linkedAt:
          type: string
          format: date-time
    BranchMerge:
      type: object
      description: >-
        The last merge recorded of a branch into its base, which a push made; left out when none was. The branch is
        merged while its head is the merge's.
      required: [head, at]
      properties:
        head:
          type: string
          description: The head it brought into the base.
        by:
          $ref: "#/components/schemas/Principal"
        at:
          type: string
          format: date-time
          description: When Cobranch recorded the push.
    DeletedBranch:
      type: object
      description: The latest deletion of a branch of a name, which keeps what it was at and its merge.
      required: [name, head, createdAt, deletedAt]
      properties:
        name:
          type: string
          description: Its name, without refs/heads/.
        head:
          type: string
          description: The object it was at when deleted.
        commit:
          $ref: "#/components/schemas/Commit"
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          $ref: "#/components/schemas/Principal"
        merge:
          $ref: "#/components/schemas/BranchMerge"
    MergeInput:
      type: object
      description: How to merge a branch into its base.
      properties:
        head:
          type: string
          description: The head the requester saw; the merge is refused once the branch moved from it.
        method:
          $ref: "#/components/schemas/MergeMethod"
    MergeMethod:
      type: string
      description: >-
        How a merge moves its base: with a merge commit, Merge branch '<name>', authored and committed by the requester,
        or by a fast-forward, which writes nothing. Left out, a fast-forward where the base requires linear history,
        which allows only that, and a merge commit otherwise.
      enum: [merge, fast_forward]
    MergeResult:
      type: object
      description: A merge Cobranch recorded as a push of its base.
      required: [base, head, commit]
      properties:
        base:
          type: string
          description: The branch merged into, main.
        head:
          type: string
          description: The head merged.
        commit:
          type: string
          description: The commit the base is at now, the merge commit or, for a fast-forward, the head.
    BranchStatus:
      type: string
      description: >-
        Where a branch stands as a request to merge into its base, the first that holds: processing while the push
        worker hasn't worked out its last push, or a required annotation on its head is pending or in progress;
        blocked when it has commits to merge and a requirement holds them back; empty when it has none; merged when a
        merge took its head into its base; ready otherwise.
      enum: [processing, blocked, empty, merged, ready]
    BranchCheck:
      type: object
      description: One of a branch's merge requirements and how it stands.
      required: [kind, met]
      properties:
        kind:
          type: string
          description: >-
            annotation, an annotation its head must carry, Successful; linear_history, no merge among its commits to
            merge; approvals, people's approvals of its head, besides its author's and its pusher's; changes_requested,
            a reviewer whose latest review of its head requests changes, never met; up_to_date, its base's tip in it.
          enum: [annotation, linear_history, approvals, changes_requested, up_to_date]
        name:
          type: string
          description: The required annotation's name, for annotation; the reviewer's display name, for changes_requested.
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        count:
          type: integer
          description: For linear_history, the merges among its commits to merge; for approvals, the approvals that count; for up_to_date, the commits of its base it lacks.
        required:
          type: integer
          description: For approvals, how many the base requires.
        met:
          type: boolean
    MergeRequirements:
      type: object
      description: What a merge into a branch needs, as main's /cobranch.yaml names it under branches; left out of a branch it doesn't name.
      required: [annotations, linearHistory]
      properties:
        annotations:
          type: array
          description: The annotations the incoming head must carry, Successful.
          items:
            type: string
        linearHistory:
          type: boolean
          description: Whether no merge commit may come in.
        reviews:
          $ref: "#/components/schemas/ReviewRequirements"
    ReviewRequirements:
      type: object
      description: >-
        The reviews a merge needs of the incoming head, when /cobranch.yaml requires them: no reviewer's latest review
        requesting changes, and at least approvals people's latest reviews approving it, besides its author's and its
        pusher's.
      required: [approvals]
      properties:
        approvals:
          type: integer
          minimum: 0
          maximum: 10
    Commit:
      type: object
      description: A commit a push brought, as the push recorded it. A branch's commit leaves it out while the branch's head is no commit a push recorded.
      required: [sha, tree, parents, message, author, committer, signature, annotations, reviews]
      properties:
        sha:
          type: string
        tree:
          type: string
        parents:
          type: array
          description: "Its parents' names, in Git's order: history follows all of them, or the first alone, as asked."
          items:
            type: string
        message:
          type: string
        author:
          $ref: "#/components/schemas/Person"
        committer:
          $ref: "#/components/schemas/Person"
        signature:
          type: string
          description: Its signature as written, not checked yet; empty for an unsigned commit.
        annotations:
          type: array
          description: The annotations principals set on it, by name.
          items:
            $ref: "#/components/schemas/Annotation"
        reviews:
          type: array
          description: The reviews submitted of it, in the order they were; each reviewer's latest is the one that counts.
          items:
            $ref: "#/components/schemas/Review"
        push:
          $ref: "#/components/schemas/Push"
    Person:
      type: object
      description: A commit's author or committer as the commit writes them.
      required: [name, email, at, zone]
      properties:
        name:
          type: string
        email:
          type: string
        at:
          type: string
          format: date-time
        zone:
          type: string
          description: The zone the commit wrote its time in, such as +0200.
        principal:
          $ref: "#/components/schemas/Principal"
    IssueState:
      type: string
      description: Where an issue stands; done and canceled close it.
      enum: [backlog, todo, in_progress, in_review, done, canceled]
    IssuePriority:
      type: string
      description: How urgent an issue is.
      enum: [none, urgent, high, medium, low]
    Issue:
      type: object
      description: A piece of the organization's work, named by its organization's issue key and its number.
      required: [id, number, identifier, title, description, state, priority, labels, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        identifier:
          type: string
          description: Its organization's issue key and its number, such as ACME-42; a changed key renames it.
        title:
          type: string
        description:
          type: string
          description: Markdown.
        descriptionHtml:
          type: string
          description: The description rendered, as the Console shows it; getIssue, createIssue and updateIssue answer it, a list doesn't, nor an empty description.
        state:
          $ref: "#/components/schemas/IssueState"
        priority:
          $ref: "#/components/schemas/IssuePriority"
        assignee:
          $ref: "#/components/schemas/Principal"
        repository:
          $ref: "#/components/schemas/IssueRepository"
        labels:
          type: array
          description: The organization's labels it carries, by name.
          items:
            $ref: "#/components/schemas/IssueLabel"
        createdBy:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          description: When it was last done or canceled; absent while it is open.
        version:
          type: integer
          format: int64
          description: Counts its changes from 1; its ETag.
    IssueRepository:
      type: object
      description: The repository an issue is about; absent for none, and for a viewer who doesn't read it.
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    IssueInput:
      type: object
      description: What creates an issue.
      required: [title]
      properties:
        title:
          type: string
          description: 1 to 200 characters on one line.
        description:
          type: string
          description: Markdown, at most 65536 characters.
        state:
          $ref: "#/components/schemas/IssueState"
        priority:
          $ref: "#/components/schemas/IssuePriority"
        assigneeId:
          type: string
          format: uuid
          description: One of the organization's members.
        repositoryId:
          type: string
          format: uuid
          description: One of the organization's repositories, which the viewer reads.
        labelIds:
          type: array
          description: The organization's labels it carries, at most 20.
          items:
            type: string
            format: uuid
    IssuePatch:
      type: object
      description: What changes an issue, as a merge patch; a field left out keeps its value.
      properties:
        title:
          type: string
        description:
          type: string
        state:
          $ref: "#/components/schemas/IssueState"
        priority:
          $ref: "#/components/schemas/IssuePriority"
        assigneeId:
          type: [string, "null"]
          format: uuid
          description: One of the organization's members, or null for nobody.
        repositoryId:
          type: [string, "null"]
          format: uuid
          description: One of the organization's repositories, which the viewer reads, or null for none.
        labelIds:
          type: array
          description: The organization's labels it carries from now on, at most 20, in place of those it did; empty for none.
          items:
            type: string
            format: uuid
    IssueLabel:
      type: object
      description: A label as an issue shows it.
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColor"
    LabelColor:
      type: string
      description: A label's colour, which the Console draws in its tones of both themes.
      enum: [gray, blue, green, yellow, red]
    Label:
      type: object
      description: One of an organization's labels, which its issues carry.
      required: [id, name, color, description, issues, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 1 to 50 characters on one line, unlike the organization's other labels' whatever their case.
        color:
          $ref: "#/components/schemas/LabelColor"
        description:
          type: string
          description: What it is for, at most 200 characters on one line.
        issues:
          type: integer
          description: How many issues carry it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Counts its changes from 1; its ETag.
    LabelInput:
      type: object
      description: What creates a label.
      required: [name]
      properties:
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColor"
        description:
          type: string
    LabelPatch:
      type: object
      description: What changes a label, as a merge patch; a field left out keeps its value.
      properties:
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColor"
        description:
          type: string
    IssueEvent:
      type: object
      description: Something that happened to an issue.
      required: [id, kind, at, changes]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: issue.created, issue.changed, issue.branch_linked or issue.branch_unlinked.
        actor:
          $ref: "#/components/schemas/Principal"
        at:
          type: string
          format: date-time
        changes:
          type: array
          description: The fields an issue.changed changed.
          items:
            $ref: "#/components/schemas/IssueChange"
        branch:
          $ref: "#/components/schemas/IssueEventBranch"
    IssueEventBranch:
      type: object
      description: >-
        The branch an issue.branch_linked or issue.branch_unlinked names, and how; its repository and name are left out
        for a viewer who doesn't read the repository.
      required: [linkedBy]
      properties:
        repository:
          type: string
          description: Its repository's slug.
        name:
          type: string
          description: Its name, without refs/heads/.
        linkedBy:
          $ref: "#/components/schemas/LinkedBy"
    IssueChange:
      type: object
      description: A field a change changed, with its values as people read them, a labels' change their names by name, comma-separated; a description's change names no values, and a repository's only those the viewer reads.
      required: [field]
      properties:
        field:
          type: string
          enum: [title, description, state, priority, assignee, repository, labels]
        from:
          type: string
        to:
          type: string
    Principal:
      type: object
      description: Who is behind a commit's author or committer, a push, an annotation, a review, a merge or a deletion, and who an issue is assigned to, created it or changed it; absent from a person until the push worker maps their email, and from the rest once its principal is gone.
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    Push:
      type: object
      description: The push that first brought a commit; getCommit alone answers it.
      required: [id, transport, at]
      properties:
        id:
          type: string
          format: uuid
        pusher:
          $ref: "#/components/schemas/Principal"
        transport:
          type: string
          description: How the push came; api for a merge or a branch deletion asked of Cobranch.
          enum: [https, ssh, api]
        at:
          type: string
          format: date-time
          description: When Cobranch recorded it.
    ChatAnchor:
      type: object
      description: Points a thread at lines startLine to endLine of the file at path of a commit; it stays there when the branch moves on.
      required: [sha, path, startLine, endLine]
      properties:
        sha:
          type: string
          description: The commit's full name, in lowercase hexadecimal.
        path:
          type: string
          description: The file's path from the repository's root, as names separated by /.
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
          description: The last line, at or after startLine.
    ChatThread:
      type: object
      description: One of a branch's chat threads.
      required: [id, outdated, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        anchor:
          $ref: "#/components/schemas/ChatAnchor"
        outdated:
          type: boolean
          description: >-
            Whether the branch has moved on from the commit its anchor names, or for a review's comment from the commit
            the review reviewed, whose diff it may anchor at its base; false without an anchor.
        reviewId:
          type: string
          format: uuid
          description: >-
            The review the thread is a comment of, which opened it; absent for a thread started in the chat, and once
            its review is gone.
        startedBy:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          description: When it was resolved; absent while it is open.
        resolvedBy:
          $ref: "#/components/schemas/Principal"
        version:
          type: integer
          format: int64
          description: >-
            Counts its changes and its messages' from 1. Its ETag is this number and a digest of how it reads, which the
            branch's head, the slugs its links name and its people's names shape too, in quotes; If-Match names it, or
            this number alone in quotes, to refuse a change made meanwhile.
        messages:
          type: array
          description: Its messages in the order they were posted; absent from an update.
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      description: One of a thread's messages, in Markdown.
      required: [id, threadId, body, html, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        body:
          type: string
          description: Its Markdown; empty once it is deleted.
        html:
          type: string
          description: Its body rendered as GitHub-flavoured Markdown, sanitized as a README is, its relative links leading to the branch's files; empty once it is deleted, or where the installation renders no Markdown.
        author:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          description: When its author last edited it; absent until they do.
        deletedAt:
          type: string
          format: date-time
          description: When it was deleted; absent while it is there.
        deletedBy:
          $ref: "#/components/schemas/Principal"
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number and a digest of how it reads, which the branch's head, the slugs its links name and its people's names shape too, in quotes; If-Match names it, or this number alone in quotes, to refuse a change made meanwhile.
    ChatThreadInput:
      type: object
      description: A thread to start, with its first message.
      required: [body]
      properties:
        id:
          type: string
          format: uuid
          description: The thread's ID, a UUIDv7 its starter picks so that starting it again finds it; Cobranch picks one when it is left out.
        anchor:
          $ref: "#/components/schemas/ChatAnchor"
        body:
          type: string
          description: Its first message's Markdown, at most 20,000 characters.
    ChatThreadPatch:
      type: object
      description: How a thread changes.
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: Whether it is resolved, or open.
    ChatMessageInput:
      type: object
      description: A message to post.
      required: [body]
      properties:
        id:
          type: string
          format: uuid
          description: The message's ID, a UUIDv7 its poster picks so that posting it again finds it; Cobranch picks one when it is left out.
        body:
          type: string
          description: Its Markdown, at most 20,000 characters.
    ChatMessagePatch:
      type: object
      description: How a message changes.
      required: [body]
      properties:
        body:
          type: string
          description: Its Markdown, at most 20,000 characters.
    ChatUpdate:
      type: object
      description: A change to a chat, with the thread and the message it changed as they are now.
      required: [cursor, kind, thread]
      properties:
        cursor:
          type: string
          description: Where it stands among the chat's updates. Opaque.
        kind:
          type: string
          enum: [thread.started, message.posted, message.edited, message.deleted, thread.resolved, thread.reopened]
        thread:
          $ref: "#/components/schemas/ChatThread"
        message:
          $ref: "#/components/schemas/ChatMessage"
    Annotation:
      type: object
      description: A principal's verdict on a commit, such as ci/build passing. It belongs to the commit, so every branch at that commit shows it; a commit holds at most one of each name, which only its principal changes.
      required: [id, name, status, summary, link, createdAt, updatedAt, startedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        summary:
          type: string
        link:
          type: string
          description: Where its details are; empty without one.
        principal:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: When its run started, when it was set or when it last went back from failed or successful to pending or in_progress.
        completedAt:
          type: string
          format: date-time
          description: When it reached failed or successful; absent while it runs.
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number in quotes, which If-Match names to refuse a change made meanwhile.
    Run:
      type: object
      description: One run of a repository's job, at a commit and ref, for the event that queued it, of the job's definition as it was then. Its job's annotation on the commit says how it goes.
      required: [id, number, job, sha, ref, trigger, definition, state, reason, queuedAt, version]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: Counts the repository's runs from 1.
        job:
          $ref: "#/components/schemas/Principal"
        sha:
          type: string
        ref:
          type: string
          description: The branch or tag it runs on, in full.
        trigger:
          $ref: "#/components/schemas/RunTrigger"
        causeRun:
          type: integer
          format: int64
          description: The number of the run whose annotation triggered it; absent for any other.
        definition:
          $ref: "#/components/schemas/Job"
        state:
          $ref: "#/components/schemas/RunState"
        reason:
          type: string
          description: Why it waits, failed or was cancelled; empty otherwise.
        startedBy:
          $ref: "#/components/schemas/Principal"
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number in quotes.
    RunState:
      type: string
      description: Where a run stands. Waiting runs wait for a member to start them; queued ones for the controller.
      enum: [waiting, queued, running, succeeded, failed, cancelled]
    RunTrigger:
      type: object
      description: The event that queued a run.
      required: [kind, sha, ref]
      properties:
        kind:
          type: string
          enum: [push, tag, annotation, review, event, schedule, manual]
        sha:
          type: string
        ref:
          type: string
        name:
          type: string
          description: The annotation's name, or the posted event's.
        state:
          type: string
          description: The annotation's status, or the review's state.
        actor:
          type: string
          format: uuid
          description: Who caused it.
        push:
          type: string
          format: uuid
          description: The push that caused it, for a push or a tag.
    Job:
      type: object
      description: A job as /cobranch.yaml declared it.
      required: [name, kind, "on", permissions, checkout]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [pod, script, webhook]
        "on":
          $ref: "#/components/schemas/JobTriggers"
        pod:
          type: object
          description: A Kubernetes pod spec, for a pod.
          additionalProperties: true
        script:
          type: string
          description: A Bash script, for a script.
        image:
          type: string
          description: The image a script runs in; the installation's when empty.
        webhook:
          $ref: "#/components/schemas/JobWebhook"
        secrets:
          type: object
          description: The environment variables a run receives secrets in, each with the secret's ID.
          additionalProperties:
            type: string
            format: uuid
        permissions:
          type: array
          description: What a run's token may do, within the repository's job ceiling.
          items:
            type: string
        timeout:
          type: string
          description: How long a run may take, such as 30m0s; the installation's default when absent.
        checkout:
          type: boolean
    JobWebhook:
      type: object
      required: [url, signingSecret]
      properties:
        url:
          type: string
        signingSecret:
          type: string
          format: uuid
    JobTriggers:
      type: object
      description: What triggers a job; an absent trigger never does.
      properties:
        push:
          $ref: "#/components/schemas/RefPatterns"
        tag:
          $ref: "#/components/schemas/RefPatterns"
        annotation:
          type: object
          required: [names, statuses]
          properties:
            names:
              type: array
              items:
                type: string
            statuses:
              type: array
              items:
                type: string
            branches:
              type: array
              items:
                type: string
        review:
          type: object
          required: [states]
          properties:
            states:
              type: array
              items:
                type: string
            branches:
              type: array
              items:
                type: string
        event:
          type: object
          required: [names]
          properties:
            names:
              type: array
              items:
                type: string
        schedule:
          type: array
          items:
            type: object
            required: [cron]
            properties:
              cron:
                type: string
        manual:
          type: object
    RefPatterns:
      type: object
      description: The branches or tags a push or tag trigger fires for, by name or pattern; every one when none is listed.
      properties:
        branches:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    Environment:
      type: object
      description: A target of the repository and one of its live branches, delivered to the target's cluster in a namespace of its own. Its sync and health are as the controller last read them.
      required: [id, target, branch, namespace, sync, health, paused, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/Principal"
        branch:
          type: string
          description: The branch's short name.
        cluster:
          type: string
          format: uuid
          description: The ID of the secret that holds its cluster's kubeconfig; absent for the installation's own cluster.
        namespace:
          type: string
        revision:
          type: string
          description: The commit of its last successful delivery; absent before one.
        syncedAt:
          type: string
          format: date-time
          description: When a delivery last succeeded; absent before one.
        sync:
          $ref: "#/components/schemas/EnvironmentSync"
        health:
          $ref: "#/components/schemas/EnvironmentHealth"
        paused:
          type: boolean
          description: A paused environment takes no delivery until resumed.
        latest:
          $ref: "#/components/schemas/Delivery"
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number and a digest of how it reads, which its newest delivery, its target's name and its revision shape too, in quotes.
    EnvironmentSync:
      type: string
      description: Whether the environment's cluster holds its branch's newest commit.
      enum: [synced, out_of_sync]
    EnvironmentHealth:
      type: string
      description: The worst of the environment's objects' health; unknown until a delivery reads it.
      enum: [healthy, progressing, unknown, missing, degraded]
    Delivery:
      type: object
      description: One delivery of an environment, numbered in its repository. Its target's annotation on its commit, delivery/<target>, says how it goes.
      required: [id, number, environment, target, branch, kind, trigger, state, reason, queuedAt, version]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: Counts the repository's deliveries from 1.
        environment:
          type: string
          format: uuid
          description: Its environment's ID.
        target:
          type: string
          description: Its environment's target's name.
        branch:
          type: string
          description: Its environment's branch.
        kind:
          type: string
          description: What it does. deliver renders a commit and applies it; resync applies the last render again; teardown deletes what the environment holds.
          enum: [deliver, resync, teardown]
        sha:
          type: string
          description: The commit it delivers; absent for a teardown.
        trigger:
          type: string
          description: What queued it.
          enum: [push, redeliver, resume]
        push:
          type: string
          format: uuid
          description: The push that queued it; absent for any other.
        state:
          $ref: "#/components/schemas/DeliveryState"
        reason:
          type: string
          description: Why it waits, failed or was cancelled; empty otherwise.
        startedBy:
          $ref: "#/components/schemas/Principal"
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number and a digest of how it reads, which the names of its target and of who started it shape too, in quotes.
    DeliveryState:
      type: string
      description: Where a delivery stands. Waiting deliveries wait for a member to start them; queued ones for the controller. A superseded one is cancelled, saying by which.
      enum: [waiting, queued, rendering, applying, succeeded, failed, cancelled]
    AnnotationStatus:
      type: string
      description: Where an annotation stands, in any order its principal sets them.
      enum: [pending, in_progress, failed, successful]
    Review:
      type: object
      description: A principal's verdict on a commit, with what they wrote. It belongs to the commit, so every branch at that commit shows it, and it is never changed.
      required: [id, sha, state, body, person, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        sha:
          type: string
          description: The commit reviewed.
        state:
          $ref: "#/components/schemas/ReviewState"
        body:
          type: string
        reviewer:
          $ref: "#/components/schemas/Principal"
        person:
          type: boolean
          description: Whether its reviewer is a person, whose approvals count towards a branch's required approvals; agents' and API keys' don't.
        submittedAt:
          type: string
          format: date-time
    ReviewState:
      type: string
      description: >-
        A review's verdict: approved; changes_requested, which holds back a branch whose base requires reviews until
        its reviewer submits another; or neutral, a comment that takes back its reviewer's earlier verdict.
      enum: [approved, changes_requested, neutral]
    ReviewInput:
      type: object
      description: The review a principal submits.
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/ReviewState"
        body:
          type: string
          description: >-
            What the reviewer writes, at most 65,536 characters, which only an approval, or a review with comments, may
            leave blank.
        branch:
          type: string
          description: >-
            The live branch in whose chat the comments open their threads, without refs/heads/; a review without comments
            needs none.
        comments:
          type: array
          maxItems: 100
          description: >-
            The review's comments on lines of files, each a thread of the branch's chat that the review's transaction
            opens, anchored there, its first message the comment.
          items:
            $ref: "#/components/schemas/ReviewComment"
    ReviewComment:
      type: object
      description: >-
        A review's comment on lines of a file at a commit the repository holds: the reviewed commit's side of its diff,
        or its base's.
      required: [anchor, body]
      properties:
        anchor:
          $ref: "#/components/schemas/ChatAnchor"
        body:
          type: string
          description: The comment's Markdown, at most 20,000 characters, not blank.
    AnnotationInput:
      type: object
      description: What a principal sets an annotation to.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        summary:
          type: string
          description: At most 500 characters.
        link:
          type: string
          description: Where its details are, an absolute http or https URL of at most 2048 bytes; none when left out or empty.
    RoleInput:
      type: object
      description: A custom role's definition.
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: From the permissions listed at scope organization; at least one.
          items:
            type: string
    RoleChanges:
      type: object
      description: What changes about a custom role; a field left out keeps its value.
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      description: A user who belongs to the organization, with the roles they hold there.
      required: [userId, displayName, joinedAt, roles]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      description: An invitation to an email, which only a user holding it, verified, accepts.
      required: [id, orgId, orgSlug, orgName, email, roleId, roleName, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgSlug:
          type: string
        orgName:
          type: string
        email:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
          description: The role's name; empty once a custom role it offered is gone.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiKey:
      type: object
      description: An API key, a principal of the organization that a script acts as, with the roles it holds there and its secrets.
      required: [id, orgId, name, createdAt, roles, secrets]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
          format: uuid
          description: Who made the key; absent once they are gone.
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        secrets:
          type: array
          description: The key's secrets, oldest first, revoked and expired ones included.
          items:
            $ref: "#/components/schemas/ApiKeySecret"
    ApiKeySecret:
      type: object
      description: One of an API key's secrets, as its manager sees it; the secret itself was shown once.
      required: [id, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
        hint:
          type: string
          description: The secret's last four characters.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the secret stops working; absent for one that never expires.
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    PersonalToken:
      type: object
      description: A personal token, as its user sees it; the token itself was shown once.
      required: [id, name, hint, permissions, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: The token's last four characters.
        permissions:
          type: array
          description: The permissions the token may use, sorted; a check under it holds only what both these and the user's grants give.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working.
        lastUsedAt:
          type: string
          format: date-time
    PersonalTokenInput:
      type: object
      description: What makes a personal token.
      required: [name]
      properties:
        name:
          type: string
          description: What the token is for, 1 to 100 characters.
        permissions:
          type: array
          description: The permissions the token may use, from the catalog; repo.read and repo.push when absent or empty.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working, in the future and within a year; 30 days from now when absent.
    PersonalTokenCreated:
      type: object
      description: A personal token and its secret, which is shown here and never again.
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/PersonalToken"
        secret:
          type: string
          description: The token, to give a Git client as its password or a script as its bearer token.
    SSHKey:
      type: object
      description: An SSH key, as its user sees it.
      required: [id, name, publicKey, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        publicKey:
          type: string
          description: The key's type and base64, as an authorized_keys line has them, without its comment.
        fingerprint:
          type: string
          description: The key's SHA256 fingerprint, as ssh-keygen -l shows it.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    SSHKeyInput:
      type: object
      description: What adds an SSH key.
      required: [publicKey]
      properties:
        name:
          type: string
          description: What the key is for, 1 to 100 characters; the key's comment when absent or empty.
        publicKey:
          type: string
          description: One public key as an authorized_keys line has it, such as ssh-ed25519 AAAA… you@laptop, with no options; Ed25519, ECDSA, or RSA of 2048 bits or more.
    SecretInput:
      type: object
      description: When a new secret stops working; a year from now when neither is given.
      properties:
        expiresAt:
          type: string
          format: date-time
          description: The end, in the future.
        neverExpires:
          type: boolean
          description: True for a secret with no end; not with expiresAt.
    ApiKeyInput:
      type: object
      description: What makes an API key; its first secret's expiry as SecretInput's.
      required: [name, roleIds]
      properties:
        name:
          type: string
        roleIds:
          type: array
          description: The roles the key holds at the organization; at least one.
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        neverExpires:
          type: boolean
    ApiKeyCreated:
      type: object
      description: A key and a secret of its, which is shown here and never again.
      required: [apiKey, secret]
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The secret, to put in the script's own secret store.
    JoinRequest:
      type: object
      description: A user's request to join an organization, waiting for a member manager.
      required: [id, orgId, orgSlug, orgName, userId, userName, note, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgSlug:
          type: string
        orgName:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Tag:
      type: object
      description: One of a repository's tags and the object it names, a commit or an annotated tag.
      required: [name, target]
      properties:
        name:
          type: string
          description: Its name, without refs/tags/.
        target:
          type: string
          description: The object it names.
    Tree:
      type: object
      description: A directory at a commit.
      required: [commit, path, sha, entries]
      properties:
        commit:
          type: string
          description: The commit the ref resolved to, which every link to the directory's files may pin.
        path:
          type: string
          description: Its path from the repository's root; empty for the root.
        sha:
          type: string
          description: Its tree's object.
        entries:
          type: array
          description: Its directories and submodules first, then its files and symlinks, each by name.
          items:
            $ref: "#/components/schemas/TreeEntry"
        readme:
          $ref: "#/components/schemas/File"
          description: >-
            Its README, when it holds one: the first, whatever its case, of README.md, README.markdown, README.mdown,
            README.mkd, README.mkdn, README.txt and README, unless it is binary; Markdown comes rendered.
    TreeEntry:
      type: object
      description: One of a directory's entries.
      required: [name, path, kind, mode, sha]
      properties:
        name:
          type: string
        path:
          type: string
          description: Its path from the repository's root.
        kind:
          type: string
          description: A directory, a file, a symlink, or a submodule, which pins a commit of another repository.
          enum: [tree, blob, symlink, submodule]
        mode:
          type: string
          description: Its mode as Git writes it, such as 100644, 100755 or 040000.
        sha:
          type: string
          description: The object it names; a submodule's is the commit it pins.
        size:
          type: integer
          format: int64
          description: A file's or a symlink's size in bytes.
    Diff:
      type: object
      description: >-
        A change from one commit to another, up to the limits of a diff: at most 3000 files, 20000 lines and 4 MiB of
        hunks' text in all, 5000 lines and 1 MiB in one file, and 64 KiB in one line. Past them it lists what it left
        out rather than show it.
      required: [head, files, filesLeftOut, additions, deletions]
      properties:
        base:
          type: string
          description: >-
            The commit it runs from: a commit's first parent, or a branch's merge base with its base's tip. Absent
            when it runs from the empty tree, for a root commit or a branch that shares no history with its base.
        baseTip:
          type: string
          description: A branch's base's tip, which its merge base is reckoned from; absent for a commit.
        head:
          type: string
          description: The commit it runs to.
        files:
          type: array
          description: The files it changes, in Git's order, by path.
          items:
            $ref: "#/components/schemas/FileDiff"
        filesLeftOut:
          type: integer
          description: How many files it changes past the 3000 it lists.
        additions:
          type: integer
          description: The lines it adds, in every file it changes, those it left out included.
        deletions:
          type: integer
          description: The lines it removes, in every file it changes, those it left out included.
    FileDiff:
      type: object
      description: One file's change.
      required: [status, path, binary, additions, deletions, truncated, hunks]
      properties:
        status:
          type: string
          description: What the change did to the file; type_changed is a path whose kind changed, such as a symlink that became a file.
          enum: [added, modified, deleted, renamed, type_changed]
        path:
          type: string
          description: Its path from the repository's root; a deleted file's old one.
        oldPath:
          type: string
          description: The path it had before, for a renamed file.
        oldMode:
          type: string
          description: Its mode before, as Git writes it; absent for an added file.
        mode:
          type: string
          description: Its mode after; absent for a deleted file.
        binary:
          type: boolean
          description: Whether Git reads it as binary, which shows no lines.
        additions:
          type: integer
        deletions:
          type: integer
        truncated:
          type: boolean
          description: >-
            Whether its hunks were left out: it passes 5000 lines or 1 MiB of text, or holds a line past 64 KiB, or the
            diff passed 20000 lines or 4 MiB before it. Its counts stay.
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/Hunk"
    Hunk:
      type: object
      description: One run of a file's changes, with up to three lines around them.
      required: [oldStart, oldLines, newStart, newLines, section, lines]
      properties:
        oldStart:
          type: integer
          description: Its first line in the old file, or the line before it when it spans none.
        oldLines:
          type: integer
        newStart:
          type: integer
          description: Its first line in the new file, or the line before it when it spans none.
        newLines:
          type: integer
        section:
          type: string
          description: The heading Git found above it, such as a function's; empty when it found none.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
    DiffLine:
      type: object
      description: One of a hunk's lines, without its newline.
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [context, added, removed]
        old:
          type: integer
          description: Its number in the old file; absent for an added line.
        new:
          type: integer
          description: Its number in the new file; absent for a removed line.
        text:
          type: string
        noNewline:
          type: boolean
          description: Present and true when the file ends on it without a newline.
    File:
      type: object
      description: A file or a symlink at a commit, and its text when it isn't binary.
      required: [commit, path, name, kind, mode, sha, size, binary, truncated]
      properties:
        commit:
          type: string
          description: The commit the ref resolved to.
        path:
          type: string
          description: Its path from the repository's root.
        name:
          type: string
        kind:
          type: string
          enum: [blob, symlink]
        mode:
          type: string
          description: Its mode as Git writes it, such as 100644 or 120000.
        sha:
          type: string
          description: Its blob's object.
        size:
          type: integer
          format: int64
          description: Its size in bytes.
        binary:
          type: boolean
          description: Whether it is binary, as Git judges a file (a NUL in its first 8000 bytes), or not UTF-8.
        truncated:
          type: boolean
          description: Whether its text stops at 1 MiB, short of its size.
        text:
          type: string
          description: Its text, up to 1 MiB, when it isn't binary; a symlink's is its target.
        html:
          type: string
          description: >-
            A Markdown file's text rendered as GitHub-flavoured Markdown, sanitized: no scripts, styles, frames, forms
            or event handlers. Its relative links open the Console's pages at the same ref, its relative images load
            this API's raw bytes at the commit, images from elsewhere stay at their URLs for the browser to load, and
            its ids start with user-content-.
    Problem:
      type: object
      description: Problem details (RFC 9457), with Cobranch's stable error code and the request's ID.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI that names the problem's type; "about:blank" when the status says it all.
        title:
          type: string
          description: A short summary of the problem's type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: The stable error code, such as route.not_found.
        requestId:
          type: string
          description: The request's ID, which the response's X-Request-Id header names too.
    Agent:
      type: object
      description: One of an organization's agents, a principal it owns that takes tasks, with the roles it holds.
      required: [id, name, description, instructions, builtIn, createdAt, updatedAt, version, grants]
      properties:
        id:
          type: string
          format: uuid
          description: Its principal's ID.
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
          description: The standing instructions, in Markdown, that every task of it starts from.
        builtIn:
          type: boolean
          description: Whether Cobranch made it for the organization; it is never deleted.
        createdBy:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number and a digest of how it reads, which its creator's and its repositories' names shape too, in quotes; If-Match names it, or this number alone in quotes, to refuse a change made meanwhile.
        grants:
          type: array
          description: The roles it holds, those at the organization first.
          items:
            $ref: "#/components/schemas/AgentGrant"
    AgentGrant:
      type: object
      description: A role an agent holds, at its organization or, with a repository, on that repository.
      required: [roleId, roleName]
      properties:
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        repositoryId:
          type: string
          format: uuid
          description: The repository it holds the role on; absent at the organization.
        repositorySlug:
          type: string
    AgentGrantInput:
      type: object
      description: A role a new agent starts with, at the organization or, with a repository, on that repository.
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
        repositoryId:
          type: string
          format: uuid
    AgentInput:
      type: object
      description: A new agent.
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 100 characters, unique in the organization in any case.
        description:
          type: string
          description: At most 1000 characters.
        instructions:
          type: string
          description: At most 20000 characters of Markdown.
        grants:
          type: array
          description: At most 20, each one the creator holds every permission of where it applies.
          items:
            $ref: "#/components/schemas/AgentGrantInput"
    AgentPatch:
      type: object
      description: What changes about an agent; a field left out keeps its value.
      properties:
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
    TaskState:
      type: string
      description: Where a task stands. Queued tasks wait for the controller; waiting ones for an answer in their thread.
      enum: [queued, running, waiting, succeeded, failed, cancelled]
    Task:
      type: object
      description: A task of one of the organization's agents, which the organization numbers.
      required: [id, number, agent, kind, title, instructions, state, reason, summary, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: Counts the organization's tasks from 1.
        agent:
          $ref: "#/components/schemas/Principal"
        kind:
          type: string
          description: What it is for; assigned for a task a principal assigned.
        assignedBy:
          $ref: "#/components/schemas/Principal"
        title:
          type: string
        instructions:
          type: string
        repositoryId:
          type: string
          format: uuid
          description: The repository it works in; absent for none.
        repositorySlug:
          type: string
        branchId:
          type: string
          format: uuid
          description: The branch of that repository it works on; absent for none.
        branch:
          type: string
        threadId:
          type: string
          format: uuid
          description: The thread of that branch's chat it talks in; absent for none.
        state:
          $ref: "#/components/schemas/TaskState"
        reason:
          type: string
          description: Why it failed or was cancelled; empty otherwise.
        summary:
          type: string
          description: What the agent said it did, once it ended.
        cancelledBy:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number and a digest of how it reads, which its people's, its agent's and its repository's names shape too, in quotes; If-Match names it, or this number alone in quotes, to refuse a change made meanwhile.
    TaskInput:
      type: object
      description: >-
        A task to assign, and perhaps where it works: a repository, one of its live branches by ID or by name, and a
        thread of that branch's chat.
      required: [agentId, title]
      properties:
        agentId:
          type: string
          format: uuid
        title:
          type: string
          description: 1 to 200 characters.
        instructions:
          type: string
          description: At most 20000 characters of Markdown.
        repositoryId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        branch:
          type: string
          description: The branch's name, without refs/heads/, when branchId doesn't name it.
        threadId:
          type: string
          format: uuid
