  /orgs/{org}/repos/{repo}/branches/{branch}/merge:
    post:
      operationId: mergeBranch
      summary: >-
        Merges the branch into its base, main, for the viewer, and answers once Cobranch has recorded the merge as a push
        of main, which makes the branch merged once the push worker processes it; takes repo.merge for a ready branch,
        and repo.bypass for one that isn't, which also passes main's merge requirements. A head the branch has moved
        from, or a branch or a main that moved while Cobranch built the merge, answers 409 branch.moved; a branch with
        nothing to merge, one that isn't ready, a fast-forward of one behind main, a merge commit of one that conflicts
        with main and a push the merge requirements refuse answer 409 with codes of their own. It builds the merge on
        the Git server: an installation without one answers 503.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      requestBody:
        required: false
        content:
          application/json:
