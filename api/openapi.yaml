  /orgs/{org}/repos/{repo}/commits/{sha}/annotations/{name}:
    put:
      operationId: setAnnotation
      summary: Sets an annotation on one of the repository's commits for the viewer, or changes the one the viewer set there before; takes annotations.write. An annotation of that name that another principal set is refused, naming them, until it is deleted. A change names the ETag it was made from in If-Match, and a new annotation If-None-Match *; without either, the answer is 428.
      parameters:
