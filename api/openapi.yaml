    put:
      operationId: linkBranch
      summary: >-
        Links the branch to one of the organization's issues by hand, in place of any issue it works on, for the
        viewer; takes issues.write, and repo.read. An issue in Backlog or Todo moves to In progress. main works on no
        issue: 400 branch.default, as for an issue the organization doesn't have, issue.invalid.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBranchInput"
      responses:
        "200":
          description: The branch's issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchIssue"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unlinkBranch
      summary: >-
        Unlinks the branch from its issue by hand, for the viewer, so its name never links it again; takes issues.write,
        and repo.read. A branch with no issue answers 204 too.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/branch"
      responses:
        "204":
