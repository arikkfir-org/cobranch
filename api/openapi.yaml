      operationId: deleteBranch
      summary: >-
        Deletes the branch for the viewer, and answers once Cobranch has recorded the deletion as a push that deletes
        its ref, as git push --delete does: the branch leaves the list, and its commits, their annotations and its merge
        stay; takes repo.push, and repo.bypass for a branch main's /cobranch.yaml names. The deletion names the head the
