          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/issues/{number}/chat/updates:
    get:
      operationId: listIssueChatUpdates
      summary: >-
        The changes to the issue's chat after a cursor, in order, each with its thread and message as they are now;
        takes issues.read, checked at every read. With none yet, it waits up to wait seconds for one, so a client follows
        the chat by asking again after the answer's after. Applying them in order, replacing threads and messages by ID,
        holds the chat as it is.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/number"
        - name: after
          in: query
          required: true
          description: Where the updates start, as listIssueChatThreads' after or a previous answer's names it. Opaque.
          schema:
            type: string
        - name: wait
          in: query
          description: How many seconds to wait for an update when there is none yet; at most 15, so a server that stops lets every wait end first.
          schema:
            type: integer
            minimum: 0
            maximum: 15
            default: 0
      responses:
        "200":
          description: The updates, at most 100, in order.
          content:
            application/json:
              schema:
                type: object
                required: [updates, after]
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatUpdate"
                  after:
                    type: string
                    description: Where the next read starts, after the last update; the request's after when there is none. Opaque.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
