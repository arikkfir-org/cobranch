# DevHub's REST contract, written first: internal/adapters/rest generates its server from it, and the SDKs will be
# generated from it too (https://docs.dev.kfirs.com/devhub/designs/architecture.md, "API conventions").
openapi: 3.1.0
info:
  title: DevHub API
  version: v1
  description: The REST surface of DevHub, the surface of its SDKs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The version of DevHub that serves this installation.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: An error, as problem details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The version the server was built as, a release version or a commit's short SHA.
          examples: [v0.1.0, 1e76e84]
    Problem:
      type: object
      description: Problem details (RFC 9457), with DevHub's stable error code and the request's ID.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI that names the problem's type; "about:blank" when the status says it all.
        title:
          type: string
          description: A short summary of the problem's type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: The stable error code, such as route.not_found.
        requestId:
          type: string
          description: The request's ID, which the response's X-Request-Id header names too.
