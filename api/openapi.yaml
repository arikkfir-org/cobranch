      summary: >-
        Makes an artifact of the organization attached to no repository, with its first version, and no repository
        audience; takes org.read, since it reaches nobody but its owner until it is shared. Its maker owns it; an
        agent's task makes its assigner the owner and the agent an editor. An id the caller made attached to no
        repository already answers that artifact as it is, with 200, so a call sent again makes nothing more; one
        another principal took, or that is attached to a repository, is refused with 409.
