# Cobranch's REST contract, written first: internal/adapters/rest generates its server from it, and the SDKs will be
# generated from it too (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/architecture.md, "API conventions").
openapi: 3.1.0
info:
  title: Cobranch API
  version: v1
  description: The REST surface of Cobranch, the surface of its SDKs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The version of Cobranch that serves this installation.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Who the request's credential signs in.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: The user's live sessions, newest first.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      summary: Revokes one of the user's sessions; the next request with its cookie fails.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/tokens:
    get:
      operationId: listMyTokens
      summary: The user's personal tokens that are not revoked, expired ones included, newest first.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMyToken
      summary: Makes a personal token that acts as the user, narrowed to the permissions it lists, and shows it once; only from a session, never from another token or an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalTokenInput"
      responses:
        "201":
          description: The token and its secret, which is shown here and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalTokenCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/tokens/{id}:
    delete:
      operationId: revokeMyToken
      summary: Revokes one of the user's personal tokens; the next request with it fails.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/ssh-keys:
    get:
      operationId: listMySSHKeys
      summary: The user's SSH keys, newest first.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [sshKeys]
                properties:
                  sshKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/SSHKey"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMySSHKey
      summary: Adds an SSH key that acts as the user over SSH, as their session would; only from a session, never from a token or an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHKeyInput"
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/ssh-keys/{id}:
    delete:
      operationId: deleteMySSHKey
      summary: Deletes one of the user's SSH keys; the next connection with it fails. Only from a session, never from a token or an API key.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: The organizations the user belongs to, by name.
      responses:
        "200":
          description: The organizations.
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations:
    get:
      operationId: listMyInvitations
      summary: The invitations waiting for the user's verified emails, oldest first.
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations/{id}/accept:
    post:
      operationId: acceptInvitation
      summary: Joins the organization through an invitation to one of the user's verified emails.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The organization joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations/{id}/decline:
    post:
      operationId: declineInvitation
      summary: Declines an invitation to one of the user's verified emails.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/join-requests:
    get:
      operationId: listMyJoinRequests
      summary: The user's requests to join organizations that still wait, oldest first.
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [joinRequests]
                properties:
                  joinRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /roles:
    get:
      operationId: listBuiltInRoles
      deprecated: true
      summary: The built-in roles granted at a scope. Deprecated, since roles are an organization's; the organization's roles list them all.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [organization]
      responses:
        "200":
          description: The built-in roles, with the route's end announced.
          headers:
            Deprecation:
              description: When the route was deprecated, as RFC 9745 says.
              schema:
                type: string
            Sunset:
              description: When the route goes, as RFC 8594 says.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /permissions:
    get:
      operationId: listPermissions
      summary: The permissions a role granted at a scope may hold, from the catalog.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [organization]
      responses:
        "200":
          description: The permissions.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs:
    post:
      operationId: createOrganization
      summary: Creates an organization, with the user its first Owner; takes orgs.create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  description: 2 to 39 lowercase letters, digits and single hyphens, unique among organizations and their old slugs.
                name:
                  type: string
      responses:
        "201":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}:
    get:
      operationId: getOrganization
      summary: An organization by its slug, or an old slug of its; takes org.read, and otherwise answers 404.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The organization, with its current slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrganization
      summary: Changes an organization's name, slug or settings; takes org.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSettings"
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/leave:
    post:
      operationId: leaveOrganization
      summary: Leaves the organization, dropping every role held there; its last Owner can't.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "204":
          description: Left.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members:
    get:
      operationId: listMembers
      summary: The organization's members with the roles they hold there; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}:
    delete:
      operationId: removeMember
      summary: Removes a member, with every role they hold; takes org.members.manage and every permission of those roles.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}/roles:
    post:
      operationId: grantRole
      summary: Gives a member a role; takes org.grants.manage and every permission of the role.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Granted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}/roles/{role}:
    delete:
      operationId: revokeRole
      summary: Takes a role from a member; takes org.grants.manage and every permission of the role. The last Owner keeps Owner.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
        - $ref: "#/components/parameters/role"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/roles:
    get:
      operationId: listRoles
      summary: The roles the organization grants, the built-in ones first, then its own; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRole
      summary: Defines a custom role; takes org.grants.manage and every permission it lists.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/roles/{role}:
    patch:
      operationId: updateRole
      summary: Redefines a custom role, and with it every grant of it; takes org.grants.manage and every permission it listed or lists.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/role"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChanges"
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRole
      summary: Deletes a custom role nobody holds, cancelling the invitations that offered it; takes org.grants.manage and every permission of the role.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/role"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/api-keys:
    get:
      operationId: listAPIKeys
      summary: The organization's API keys, with their roles and secrets, by name; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [apiKeys]
                properties:
                  apiKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAPIKey
      summary: Makes an API key holding roles at the organization, and shows its first secret once; takes org.principals.manage, and the roles add the grant rules.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: The key and its secret, which is shown here and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/api-keys/{key}:
    delete:
      operationId: deleteAPIKey
      summary: Deletes an API key with its secrets and grants; takes org.principals.manage and every permission of the roles it holds.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/key"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/api-keys/{key}/secrets:
    post:
      operationId: rotateAPIKey
      summary: Gives the key a new secret, shown once, beside the old one, which works until revoked or expired; a key with two live secrets takes no third. Takes org.principals.manage.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/key"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretInput"
      responses:
        "201":
          description: The key and its new secret, which is shown here and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/api-keys/{key}/secrets/{secret}:
    delete:
      operationId: revokeAPIKeySecret
      summary: Revokes one of the key's secrets; a key with no live secret fails every call until rotated. Takes org.principals.manage.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/key"
        - $ref: "#/components/parameters/secret"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/invitations:
    get:
      operationId: listInvitations
      summary: The organization's invitations that wait, oldest first; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: invite
      summary: Invites an email; takes org.members.manage, and a role other than the membership role adds the grant rules.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                roleId:
                  type: string
                  format: uuid
                  description: The role the invitee gets; the organization's membership role when left out.
      responses:
        "201":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/invitations/{id}:
    delete:
      operationId: cancelInvitation
      summary: Cancels an invitation that waits; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/join-requests:
    get:
      operationId: listJoinRequests
      summary: The requests to join the organization that wait, oldest first; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [joinRequests]
                properties:
                  joinRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestToJoin
      summary: Asks to join the organization the slug names; one that takes no requests answers 404 like one that doesn't exist.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: A word for the managers, at most 500 characters.
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/join-requests/{id}/approve:
    post:
      operationId: approveJoinRequest
      summary: Makes the requester a member; takes org.members.manage, and a role other than the membership role adds the grant rules.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId:
                  type: string
                  format: uuid
                  description: The role the requester gets; the organization's membership role when left out.
      responses:
        "204":
          description: Approved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/join-requests/{id}/decline:
    post:
      operationId: declineJoinRequest
      summary: Declines a request that waits; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos:
    get:
      operationId: listRepositories
      summary: The organization's repositories the viewer reads, by slug; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The repositories.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRepository
      summary: Creates an empty repository in the organization, with the viewer its Maintainer, and answers it with the visibility its grants give it (Internal at once where an organization role reads every repository); takes repos.create.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryInput"
      responses:
        "201":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}:
    get:
      operationId: getRepository
      summary: A repository by its slug, or an old slug of its; takes repo.read, and otherwise answers 404.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
      responses:
        "200":
          description: The repository, with its current slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRepository
      summary: Changes a repository's slug, name or description; takes repo.manage. A new slug keeps the old one as a redirect.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositorySettings"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/roles:
    get:
      operationId: listRepositoryRoles
      summary: The roles the repository grants, each with the permissions it gives there; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
      responses:
        "200":
          description: The built-in repository roles, then the organization's own that give any repository permission.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/access:
    get:
      operationId: listRepositoryAccess
      summary: Who holds grants on the repository, with the roles they hold there; takes repo.read. Roles at the organization reach it too.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
      responses:
        "200":
          description: The principals with grants on the repository, by display name.
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepositoryAccess"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/access/{principal}/roles:
    post:
      operationId: grantRepositoryRole
      summary: Gives one of the organization's members or API keys a role on the repository; takes org.grants.manage and every permission the role gives there.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/principal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Granted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/access/{principal}/roles/{role}:
    delete:
      operationId: revokeRepositoryRole
      summary: Takes a role from a principal on the repository; takes org.grants.manage and every permission the role gives there.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/principal"
        - $ref: "#/components/parameters/role"
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/branches:
    get:
      operationId: listBranches
      summary: The repository's live branches, main first and then by name, each with the commit it is at; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
      responses:
        "200":
          description: The branches.
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits:
    get:
      operationId: listCommits
      summary: A page of a branch's first-parent history, nearest first, as git log --first-parent lists it; takes repo.read. A merge's second line stays out, and a branch at no commit a push recorded has none.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: query
          description: The branch whose history the page lists, without refs/heads/.
          schema:
            type: string
            default: main
        - name: cursor
          in: query
          description: Where the page starts, as the previous page's Link names it; the branch's head when left out. Opaque.
          schema:
            type: string
        - name: limit
          in: query
          description: How many commits the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: The page's commits, nearest first, without their pushes.
          headers:
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commit"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}:
    get:
      operationId: getCommit
      summary: One of the repository's commits by its full name, with the push that first brought it; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
      responses:
        "200":
          description: The commit, with its push.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commit"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}/annotations:
    get:
      operationId: listAnnotations
      summary: The annotations principals set on one of the repository's commits, by name; takes repo.read.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
      responses:
        "200":
          description: The annotations.
          content:
            application/json:
              schema:
                type: object
                required: [annotations]
                properties:
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}/annotations/{name}:
    put:
      operationId: setAnnotation
      summary: Sets an annotation on one of the repository's commits for the viewer, or changes the one the viewer set there before; takes annotations.write. An annotation of that name that another principal set is refused, naming them, until it is deleted.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
        - $ref: "#/components/parameters/annotation"
        - $ref: "#/components/parameters/ifMatchAnnotation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationInput"
      responses:
        "200":
          description: The annotation as it now is.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnnotation
      summary: Deletes an annotation from one of the repository's commits, which frees its name there; takes annotations.write for the viewer's own, and annotations.delete_any for another principal's.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
        - $ref: "#/components/parameters/annotation"
        - $ref: "#/components/parameters/ifMatchAnnotation"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    sha:
      name: sha
      in: path
      required: true
      description: The commit's full name, in lowercase hexadecimal.
      x-go-name: SHA
      schema:
        type: string
    annotation:
      name: name
      in: path
      required: true
      description: The annotation's name, such as ci/build; a slash in it travels escaped, as ci%2Fbuild.
      x-go-name: Name
      schema:
        type: string
    ifMatchAnnotation:
      name: If-Match
      in: header
      description: The ETag of the annotation the change was made from, which refuses with 412 one made meanwhile, or one that isn't there; * names whichever is there. Without it, the change applies to the annotation as it is.
      schema:
        type: string
    org:
      name: org
      in: path
      required: true
      description: The organization's slug, or an old slug of its.
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      description: The repository's slug in its organization, or an old slug of its.
      schema:
        type: string
    principal:
      name: principal
      in: path
      required: true
      description: One of the organization's members or API keys, by principal ID.
      x-go-name: PrincipalID
      schema:
        type: string
        format: uuid
    user:
      name: user
      in: path
      required: true
      description: A member's user ID.
      x-go-name: UserID
      schema:
        type: string
        format: uuid
    role:
      name: role
      in: path
      required: true
      x-go-name: RoleID
      schema:
        type: string
        format: uuid
    key:
      name: key
      in: path
      required: true
      description: An API key's ID.
      x-go-name: KeyID
      schema:
        type: string
        format: uuid
    secret:
      name: secret
      in: path
      required: true
      description: One of an API key's secrets, by ID.
      x-go-name: SecretID
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: A strong entity tag of the resource as it is now.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: An error, as problem details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The version the server was built as, a release version or a commit's short SHA.
          examples: [v0.1.0, 1e76e84]
    User:
      type: object
      description: A person, a principal of kind user.
      required: [id, displayName, emails, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        emails:
          type: array
          description: The emails the user holds; the sign-up's verified one today, several later.
          items:
            $ref: "#/components/schemas/Email"
        permissions:
          type: array
          description: The permissions the user holds at the installation, such as orgs.create.
          items:
            type: string
    Email:
      type: object
      required: [email, verified]
      properties:
        email:
          type: string
        verified:
          type: boolean
    Session:
      type: object
      description: A signed-in browser.
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, ip, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the session ends however it is used.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: Whether this is the session the request itself came with.
    Organization:
      type: object
      description: An organization, with what the viewer may do there.
      required: [id, slug, name, membershipRoleId, acceptsJoinRequests, createdAt, viewerPermissions]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: The current slug; a request by an old one gets the organization with this one.
        name:
          type: string
        membershipRoleId:
          type: string
          format: uuid
          description: The role everyone who joins gets.
        acceptsJoinRequests:
          type: boolean
        providers:
          type: array
          description: The identity providers its members may sign in with; absent, all of the installation's.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        viewerPermissions:
          type: array
          description: The permissions the viewer holds at the organization.
          items:
            type: string
    OrganizationSettings:
      type: object
      description: What a manager changes; a field left out keeps its value.
      properties:
        slug:
          type: string
        name:
          type: string
        membershipRoleId:
          type: string
          format: uuid
        acceptsJoinRequests:
          type: boolean
        providers:
          type: array
          description: The identity providers members may sign in with, by ID. Empty, all of the installation's; left out or null, as before.
          items:
            type: string
    Role:
      type: object
      description: A role granted at the organization, built in or its own.
      required: [id, name, description, permissions, builtIn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        builtIn:
          type: boolean
        orgId:
          type: string
          format: uuid
          description: The organization a custom role belongs to; absent on a built-in role.
    Repository:
      type: object
      description: One of an organization's Git repositories, with what the viewer may do there. Every repository opens on main, its default branch, which nobody changes.
      required: [id, orgId, slug, name, description, objectFormat, visibility, createdAt, viewerPermissions]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        slug:
          type: string
          description: The current slug; a request by an old one gets the repository with this one.
        name:
          type: string
        description:
          type: string
        objectFormat:
          type: string
          enum: [sha1, sha256]
          description: The hash its history's objects are named by.
        visibility:
          type: string
          enum: [private, internal]
          description: Who reaches it, as its grants say. Private, its creator and the organization's Owners; internal, someone else too.
        createdBy:
          type: string
          format: uuid
          description: Who created it; absent once they are gone.
        createdAt:
          type: string
          format: date-time
        viewerPermissions:
          type: array
          description: The permissions the viewer holds on the repository.
          items:
            type: string
    RepositoryInput:
      type: object
      description: What makes a repository.
      required: [slug]
      properties:
        slug:
          type: string
          description: 1 to 100 lowercase letters, digits, hyphens, dots and underscores, starting with a letter or digit, not ending in .git, unique in the organization.
        name:
          type: string
          description: The slug when left out.
        description:
          type: string
    RepositorySettings:
      type: object
      description: What a maintainer changes; a field left out keeps its value.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
    RepositoryAccess:
      type: object
      description: A principal's grants on a repository.
      required: [principalId, kind, displayName, roles]
      properties:
        principalId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [user, api_key]
        displayName:
          type: string
        roles:
          type: array
          description: The roles it holds on the repository, each with the permissions it gives there.
          items:
            $ref: "#/components/schemas/Role"
    Branch:
      type: object
      description: One of a repository's live branches and the commit it is at.
      required: [name, head, createdAt, updatedAt]
      properties:
        name:
          type: string
          description: Its name, without refs/heads/.
        head:
          type: string
          description: The object it is at.
        commit:
          $ref: "#/components/schemas/Commit"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When a push last moved it.
    Commit:
      type: object
      description: A commit a push brought, as the push recorded it. A branch's commit leaves it out while the branch's head is no commit a push recorded.
      required: [sha, tree, parents, message, author, committer, signature, annotations]
      properties:
        sha:
          type: string
        tree:
          type: string
        parents:
          type: array
          description: Its parents' names, the first of which its branch's history follows.
          items:
            type: string
        message:
          type: string
        author:
          $ref: "#/components/schemas/Person"
        committer:
          $ref: "#/components/schemas/Person"
        signature:
          type: string
          description: Its signature as written, not checked yet; empty for an unsigned commit.
        annotations:
          type: array
          description: The annotations principals set on it, by name.
          items:
            $ref: "#/components/schemas/Annotation"
        push:
          $ref: "#/components/schemas/Push"
    Person:
      type: object
      description: A commit's author or committer as the commit writes them.
      required: [name, email, at, zone]
      properties:
        name:
          type: string
        email:
          type: string
        at:
          type: string
          format: date-time
        zone:
          type: string
          description: The zone the commit wrote its time in, such as +0200.
        principal:
          $ref: "#/components/schemas/Principal"
    Principal:
      type: object
      description: Who is behind a commit's author or committer, a push or an annotation; absent from a person until the push worker maps their email, and from a push or an annotation once its principal is gone.
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    Push:
      type: object
      description: The push that first brought a commit; getCommit alone answers it.
      required: [id, transport, at]
      properties:
        id:
          type: string
          format: uuid
        pusher:
          $ref: "#/components/schemas/Principal"
        transport:
          type: string
          enum: [https, ssh]
        at:
          type: string
          format: date-time
          description: When Cobranch recorded it.
    Annotation:
      type: object
      description: A principal's verdict on a commit, such as ci/build passing. It belongs to the commit, so every branch at that commit shows it; a commit holds at most one of each name, which only its principal changes.
      required: [id, name, status, summary, link, createdAt, updatedAt, startedAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        summary:
          type: string
        link:
          type: string
          description: Where its details are; empty without one.
        principal:
          $ref: "#/components/schemas/Principal"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: When its run started, when it was set or when it last went back from failed or successful to pending or in_progress.
        completedAt:
          type: string
          format: date-time
          description: When it reached failed or successful; absent while it runs.
        version:
          type: integer
          format: int64
          description: Counts its changes from 1. Its ETag is this number in quotes, which If-Match names to refuse a change made meanwhile.
    AnnotationStatus:
      type: string
      description: Where an annotation stands, in any order its principal sets them.
      enum: [pending, in_progress, failed, successful]
    AnnotationInput:
      type: object
      description: What a principal sets an annotation to.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        summary:
          type: string
          description: At most 500 characters.
        link:
          type: string
          description: Where its details are, an absolute http or https URL of at most 2048 bytes; none when left out or empty.
    RoleInput:
      type: object
      description: A custom role's definition.
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: From the permissions listed at scope organization; at least one.
          items:
            type: string
    RoleChanges:
      type: object
      description: What changes about a custom role; a field left out keeps its value.
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      description: A user who belongs to the organization, with the roles they hold there.
      required: [userId, displayName, joinedAt, roles]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      description: An invitation to an email, which only a user holding it, verified, accepts.
      required: [id, orgId, orgSlug, orgName, email, roleId, roleName, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgSlug:
          type: string
        orgName:
          type: string
        email:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
          description: The role's name; empty once a custom role it offered is gone.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiKey:
      type: object
      description: An API key, a principal of the organization that a script acts as, with the roles it holds there and its secrets.
      required: [id, orgId, name, createdAt, roles, secrets]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
          format: uuid
          description: Who made the key; absent once they are gone.
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        secrets:
          type: array
          description: The key's secrets, oldest first, revoked and expired ones included.
          items:
            $ref: "#/components/schemas/ApiKeySecret"
    ApiKeySecret:
      type: object
      description: One of an API key's secrets, as its manager sees it; the secret itself was shown once.
      required: [id, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
        hint:
          type: string
          description: The secret's last four characters.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the secret stops working; absent for one that never expires.
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    PersonalToken:
      type: object
      description: A personal token, as its user sees it; the token itself was shown once.
      required: [id, name, hint, permissions, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: The token's last four characters.
        permissions:
          type: array
          description: The permissions the token may use, sorted; a check under it holds only what both these and the user's grants give.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working.
        lastUsedAt:
          type: string
          format: date-time
    PersonalTokenInput:
      type: object
      description: What makes a personal token.
      required: [name]
      properties:
        name:
          type: string
          description: What the token is for, 1 to 100 characters.
        permissions:
          type: array
          description: The permissions the token may use, from the catalog; repo.read and repo.push when absent or empty.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working, in the future and within a year; 30 days from now when absent.
    PersonalTokenCreated:
      type: object
      description: A personal token and its secret, which is shown here and never again.
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/PersonalToken"
        secret:
          type: string
          description: The token, to give a Git client as its password or a script as its bearer token.
    SSHKey:
      type: object
      description: An SSH key, as its user sees it.
      required: [id, name, publicKey, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        publicKey:
          type: string
          description: The key's type and base64, as an authorized_keys line has them, without its comment.
        fingerprint:
          type: string
          description: The key's SHA256 fingerprint, as ssh-keygen -l shows it.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    SSHKeyInput:
      type: object
      description: What adds an SSH key.
      required: [publicKey]
      properties:
        name:
          type: string
          description: What the key is for, 1 to 100 characters; the key's comment when absent or empty.
        publicKey:
          type: string
          description: One public key as an authorized_keys line has it, such as ssh-ed25519 AAAA… you@laptop, with no options; Ed25519, ECDSA, or RSA of 2048 bits or more.
    SecretInput:
      type: object
      description: When a new secret stops working; a year from now when neither is given.
      properties:
        expiresAt:
          type: string
          format: date-time
          description: The end, in the future.
        neverExpires:
          type: boolean
          description: True for a secret with no end; not with expiresAt.
    ApiKeyInput:
      type: object
      description: What makes an API key; its first secret's expiry as SecretInput's.
      required: [name, roleIds]
      properties:
        name:
          type: string
        roleIds:
          type: array
          description: The roles the key holds at the organization; at least one.
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        neverExpires:
          type: boolean
    ApiKeyCreated:
      type: object
      description: A key and a secret of its, which is shown here and never again.
      required: [apiKey, secret]
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The secret, to put in the script's own secret store.
    JoinRequest:
      type: object
      description: A user's request to join an organization, waiting for a member manager.
      required: [id, orgId, orgSlug, orgName, userId, userName, note, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgSlug:
          type: string
        orgName:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: Problem details (RFC 9457), with Cobranch's stable error code and the request's ID.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI that names the problem's type; "about:blank" when the status says it all.
        title:
          type: string
          description: A short summary of the problem's type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: The stable error code, such as route.not_found.
        requestId:
          type: string
          description: The request's ID, which the response's X-Request-Id header names too.
