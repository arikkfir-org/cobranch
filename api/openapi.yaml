              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/tasks/{number}/transcript:
    get:
      operationId: listTranscript
      summary: >-
        The entries of one of the organization's tasks, in order, numbered above after. The task's own token reads
        them, and so do its assigner, a principal holding org.principals.manage, and whoever reads the repository it
        names; others get 403, or 404 when they may not see the task.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/taskNumber"
        - name: after
          in: query
          description: The number of the last entry already read; 0, the default, for the first.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: How many entries the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The page's entries, in order.
          headers:
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent when the page isn't full.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/TranscriptEntry"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: appendTranscript
      summary: >-
        Appends the next entry to the transcript of one of the organization's tasks; only the task's own token appends,
        while the task hasn't ended (409 task.ended). An entry already numbered seq answers 200 unchanged, so a harness
        that repeats an append records it once; a number past the next answers 400 transcript.seq_invalid. A state
        entry moves the task too: a running task to waiting and back, one that runs or waits to succeeded with a
        summary or failed with a reason; another move answers 409 task.transition_invalid.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/taskNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptEntryInput"
      responses:
        "200":
          description: The entry already numbered seq.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntry"
        "201":
          description: The entry, appended.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntry"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/tasks/{number}/transcript/{seq}:
    get:
      operationId: getTranscriptEntry
      summary: One entry of a task's transcript, by its number; who reads the transcript reads it.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/taskNumber"
        - name: seq
          in: path
          required: true
          description: The entry's number in its task.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The entry.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptEntry"
        "304":
          description: The entry is the one If-None-Match names; entries never change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/issues:
    get:
      operationId: listIssues
      summary: A page of the organization's issues, newest first, open ones unless states are named; takes issues.read. An issue about a repository the viewer doesn't read shows no repository, and filtering by one finds none.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: state
          in: query
          description: The states to show, one parameter each; none, the open ones (backlog, todo, in_progress, in_review).
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IssueState"
        - name: assignee
          in: query
          description: Those assigned to one principal, by ID, or to nobody, for none.
          schema:
            type: string
        - name: repository
          in: query
          description: Those about one repository, by ID, or about none, for none.
          schema:
            type: string
        - name: label
          in: query
          description: Those that carry every one of these labels, by ID, one parameter each, at most 20.
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: q
          in: query
          description: Those whose title or description holds this text, in any case, or whose identifier it is, such as ACME-42.
          x-go-name: Text
          schema:
            type: string
        - name: cursor
          in: query
          description: Where the page starts, from the previous page's Link; absent for the first.
          schema:
            type: string
        - name: limit
          in: query
          description: How many issues the page holds, 1 to 100.
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The page's issues, newest first, without their rendered descriptions.
          headers:
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
