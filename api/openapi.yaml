  /orgs/{org}/repos/{repo}/commits/{sha}/reviews:
    get:
      operationId: listReviews
      summary: A page of the reviews submitted of one of the repository's commits, in the order they were; takes repo.read. Each reviewer's latest is the one that counts.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
        - name: cursor
          in: query
          description: Where the page starts, as the previous page's Link names it; the commit's first review when left out. Opaque.
          schema:
            type: string
        - name: limit
          in: query
          description: How many reviews the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The page's reviews, in the order they were submitted.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
        "304":
          description: The page is still the one If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: submitReview
      summary: Submits the viewer's review of one of the repository's commits, which works out again the status of the branches at it, and opens its comments as threads of the chat of the branch it names; takes reviews.submit, and messages.post with comments. A review is never changed; its reviewer submits another, and their latest is the one that counts. A branch deleted meanwhile is 409 branch.deleted.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - $ref: "#/components/parameters/sha"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: The review.
          headers:
            Location:
              description: The review's own URL, relative to this one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
