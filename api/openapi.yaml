  /orgs/{org}/repos/{repo}/conversation/updates:
    get:
      operationId: listRepositoryConversationUpdates
      summary: >-
        The changes to the viewer's conversation about the repository after a cursor, in order, each with its thread and
        message as they are now; takes repo.read, checked at every read. With none yet, it waits up to wait seconds for
        one, so a client follows the conversation by asking again after the answer's after. Applying them in order,
        replacing threads and messages by ID, holds the conversation as it is.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - name: after
          in: query
          required: true
          description: Where the updates start, as listRepositoryConversationThreads' after or a previous answer's names it. Opaque.
          schema:
            type: string
        - name: wait
          in: query
          description: How many seconds to wait for an update when there is none yet; at most 15, so a server that stops lets every wait end first.
          schema:
            type: integer
            minimum: 0
            maximum: 15
            default: 0
      responses:
        "200":
          description: The updates, at most 100, in order.
          content:
            application/json:
              schema:
                type: object
                required: [updates, after]
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatUpdate"
                  after:
                    type: string
                    description: Where the next read starts, after the last update; the request's after when there is none. Opaque.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits:
    get:
      operationId: listCommits
      summary: >-
        A page of history, nearest first; takes repo.read. Along first parents, as git log --first-parent lists it, it
        walks the commits pushes recorded, and a branch at no commit a push recorded has none. Along every parent, as
        git log --date-order lists it (no commit before its children, the newest first among those the graph leaves
        free), it reads the Git server (an installation without one answers 503) and leaves out any commit
        no push recorded. A path's history follows every parent and holds the commits that changed what is there, as
        git log -- path lists them. A query keeps the commits whose message holds it, and the first page counts the
        whole history.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/repo"
        - name: branch
          in: query
          description: The branch whose history the page lists, without refs/heads/, unless ref names another start.
          schema:
            type: string
            default: main
        - name: ref
          in: query
          description: >-
            Where the history starts instead of branch: a branch's or a tag's name, without refs/heads/ or refs/tags/,
            or a commit's full name. A full name is tried first, then a branch, then a tag.
          schema:
            type: string
        - name: path
          in: query
          description: >-
            A file's or a directory's path from the repository's root, as names separated by /, whose history the page
            lists: the commits that changed what is there, every parent followed. A path's history takes parents=all
            or none, and parents=first is 400 parents.path.
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Text the commits' messages hold, ignoring case, as git log -i -F --grep searches them: the page lists only
            those commits. Up to 200 characters on one line, or 400 q.invalid.
          schema:
            type: string
            maxLength: 200
        - name: parents
          in: query
          description: Which parents of each commit the history follows, the first alone or every one; every one for a path's.
          schema:
            type: string
            enum: [first, all]
            default: first
        - name: cursor
          in: query
          description: >-
            Where the page starts, as the previous page's Link names it, in place of branch and ref; the start's commit
            when left out. Opaque: every parent's cursor holds the commit the first page started from, so later pages
            hold still while the branch moves on.
          schema:
            type: string
        - name: limit
          in: query
          description: How many commits the page holds at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The page's commits, nearest first, without their pushes.
          headers:
            ETag:
              description: A strong entity tag of the page, which its commits and its next page's link fix.
              required: true
              schema:
                type: string
            Link:
              description: The next page, as rel="next" (RFC 8288), relative to this page's URL; absent after the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commit"
                  total:
                    type: integer
                    description: >-
                      How many commits the whole history holds, the query's alone when it has one, as git rev-list
                      --count counts them; on the first page only, the one without a cursor.
        "304":
          description: The page is still the one If-None-Match names.
          headers:
            ETag:
              description: A strong entity tag of the page, which its commits and its next page's link fix.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos/{repo}/commits/{sha}:
    get:
      operationId: getCommit
      summary: One of the repository's commits by its full name, with the push that first brought it; takes repo.read.
      parameters:
