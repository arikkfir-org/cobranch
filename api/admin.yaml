# Cobranch's Admin API, which the Back-office calls, written first: internal/adapters/adminapi generates its server from
# it (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/back-office.md). Every operation checks
# ordinary permissions at the installation, as the other APIs check theirs.
openapi: 3.1.0
info:
  title: Cobranch Admin API
  version: v1
  description: How an installation's administrators run it, through the Back-office.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The version of Cobranch that serves this installation.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    description: The version the server was built as, a release version or a commit's short SHA.
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Who the request's credential signs in, with what they hold at the installation.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs:
    get:
      operationId: listOrganizations
      summary: The installation's organizations, newest first, a page at a time; takes installation.manage.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of organizations. Link names the next page, when there is one.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOrganization
      summary: >-
        Creates an organization whose first Owner is the user who holds ownerEmail, verified; the administrator doesn't
        join it. Takes orgs.create and installation.users.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, ownerEmail]
              properties:
                slug:
                  type: string
                  description: 2 to 39 lowercase letters, digits and single hyphens, unique among organizations and their old slugs.
                name:
                  type: string
                ownerEmail:
                  type: string
                  description: A verified email of the user who becomes its Owner.
      responses:
        "201":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/entries:
    post:
      operationId: enterOrganization
      summary: >-
        Enters an organization: makes the administrator one of its Owners, a member first when they aren't one, and
        records the entry with its reason in the organization's audit trail. Takes installation.manage.
      parameters:
        - name: org
          in: path
          required: true
          description: The organization's slug, or an old slug of its.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Why the administrator enters, 1 to 500 characters, which the organization's Owners read.
      responses:
        "201":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users:
    get:
      operationId: listUsers
      summary: The installation's users, newest first, a page at a time; takes installation.users.manage.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of users. Link names the next page, when there is one.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      summary: >-
        The installation's settings, those the chart's values lock among them; takes installation.manage. A setting
        neither the values nor an administrator set shows its default.
      parameters:
        - name: If-None-Match
          in: header
          description: The settings' ETag the caller holds; while it is still theirs, the answer is 304.
          schema:
            type: string
      responses:
        "200":
          description: The settings. A change names their ETag in If-Match.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "304":
          description: The settings are still those If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: changeSettings
      summary: >-
        Changes the settings the body names (a JSON merge patch, RFC 7396), unless they changed since the caller read
        them; takes installation.manage. A setting the chart's values lock refuses any change.
      parameters:
        - name: If-Match
          in: header
          description: The ETag of the settings the change was made from. Without it, the answer is 428.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SettingsChange"
      responses:
        "200":
          description: The settings, changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    q:
      name: q
      in: query
      description: Keeps the items that hold it, in any case, in a slug or name, or a user's name or email.
      schema:
        type: string
    cursor:
      name: cursor
      in: query
      description: Where a page starts, as the previous page's Link names it; opaque.
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The most items a page holds.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    Link:
      description: The next page, as rel="next" (RFC 8288), relative to the request's own URL.
      schema:
        type: string
    ETag:
      description: A strong entity tag of the resource as it is now.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: An error, as problem details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Me:
      type: object
      description: The signed-in user, with what they hold at the installation.
      required: [id, displayName, emails, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        permissions:
          type: array
          description: The permissions the user holds at the installation, such as installation.manage.
          items:
            type: string
    Email:
      type: object
      required: [email, verified]
      properties:
        email:
          type: string
        verified:
          type: boolean
    Organization:
      type: object
      description: An organization as an administrator sees it, never its content.
      required: [id, slug, name, createdAt, members]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: integer
          description: How many members it has.
    Entry:
      type: object
      description: An administrator's entry into an organization, whose Owner they now are.
      required: [orgId, slug, name, reason]
      properties:
        orgId:
          type: string
          format: uuid
        slug:
          type: string
          description: The organization's current slug, its Console path.
        name:
          type: string
        reason:
          type: string
    User:
      type: object
      description: A user as an administrator sees them.
      required: [id, displayName, emails, issuers, roles, organizations, suspended, createdAt, lastSignInAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        issuers:
          type: array
          description: The issuers of the identity providers the user signs in with.
          items:
            type: string
        roles:
          type: array
          description: The roles the user holds at the installation, by name.
          items:
            type: string
        organizations:
          type: integer
          description: How many organizations the user belongs to.
        suspended:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: When the user signed up.
        lastSignInAt:
          type: string
          format: date-time
    Settings:
      type: object
      description: >-
        The installation's settings: each the chart's values' where they set it (locked), else an administrator's, else
        its default (anyone signs up, and creates organizations).
      required: [signUp, signUpDomains, selfServe, locked, updatedAt]
      properties:
        signUp:
          $ref: "#/components/schemas/SignUpPolicy"
        signUpDomains:
          type: array
          description: The email domains the domains policy admits, lowercase.
          items:
            type: string
        selfServe:
          type: boolean
          description: Whether every new user may create organizations (Installation user).
        locked:
          type: array
          description: The settings the chart's values set, which only they change.
          items:
            type: string
            enum: [signUp, selfServe]
        updatedAt:
          type: string
          format: date-time
          description: When an administrator last changed them, or when the installation began.
        updatedBy:
          type: string
          format: uuid
          description: Who last changed them; absent when nobody has, or they're gone.
    SettingsChange:
      type: object
      description: The settings to change; those it leaves out stay as they are.
      properties:
        signUp:
          $ref: "#/components/schemas/SignUpPolicy"
        signUpDomains:
          type: array
          description: The domains the domains policy admits, such as example.com; at least one under that policy.
          items:
            type: string
        selfServe:
          type: boolean
    SignUpPolicy:
      type: string
      description: >-
        Who may sign up: anyone, domains (a verified email in signUpDomains) or invited (a pending invitation). A first
        administrator's email always may.
      enum: [anyone, domains, invited]
    Problem:
      type: object
      description: Problem details (RFC 9457), with Cobranch's stable error code and the request's ID.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI that names the problem's type; "about:blank" when the status says it all.
        title:
          type: string
          description: A short summary of the problem's type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: The stable error code, such as route.not_found.
        requestId:
          type: string
          description: The request's ID, which the response's X-Request-Id header names too.
