# Task test of .tekton/ci.yaml: check out the commit, restore main's Go caches and test it, with the race detector,
# against a PostgreSQL sidecar. Octomaton inlines it, and the steps it references, into the PipelineRun.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  volumes:
    - name: go-cache
      emptyDir: {}
  stepTemplate:
    workingDir: $(workspaces.source.path)
    env:
      - name: GOCACHE
        value: /go-cache/build
      - name: GOMODCACHE
        value: /go-cache/mod
      - name: GOTOOLCHAIN
        value: local
      - name: GOFLAGS
        value: -mod=readonly
      # Compiles and tests run this many at once, whatever the node's CPUs: their memory, which ci.yaml reserves, grows
      # with it.
      - name: GOMAXPROCS
        value: "4"
    volumeMounts:
      - name: go-cache
        mountPath: /go-cache
  sidecars:
    # The tests' database server: each test that needs one makes its own database there (postgrestest). The steps start
    # once it accepts connections.
    - name: postgres
      image: docker.io/library/postgres:18.6-alpine
      env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
      # With the tests in parallel, creating and migrating their databases keeps about a core busy, bursting to two,
      # and peaks near 300Mi.
      computeResources:
        requests:
          cpu: "1"
          memory: 256Mi
        limits:
          memory: 512Mi
      readinessProbe:
        exec:
          command: [pg_isready, --host=127.0.0.1, --username=postgres]
        periodSeconds: 2
  steps:
    - name: clone
      ref: {name: clone} # clone.step.yaml
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
    - name: restore
      ref: {name: go-cache-restore} # go-cache-restore.step.yaml
    - name: test
      image: docker.io/library/golang:1.27.1
      env:
        - name: COBRANCH_TEST_DATABASE_URL
          value: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        # A test that needs the database fails without it, rather than skip.
        - name: CI
          value: "true"
      command: [go, test, -race, -count=1, ./...]
