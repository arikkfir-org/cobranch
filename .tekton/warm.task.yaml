# Task warm of .tekton/main.yaml: check out the commit, restore main's Go caches, compile what ci compiles as ci compiles
# it (build.task.yaml, lint.task.yaml, test.task.yaml) and the image build's static binary, then save the caches as
# main's, which every run restores. A step that fails costs later runs time, never main its images: each continues.
# Octomaton inlines it, and the step it references, into the PipelineRun.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: warm
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  volumes:
    - name: go-cache
      emptyDir: {}
  stepTemplate:
    workingDir: $(workspaces.source.path)
    env:
      - name: GOCACHE
        value: /go-cache/build
      - name: GOMODCACHE
        value: /go-cache/mod
      - name: GOLANGCI_LINT_CACHE
        value: /go-cache/lint
      - name: GOTOOLCHAIN
        value: local
      - name: GOFLAGS
        value: -mod=readonly
      # Compiles and lint run this many at once, whatever the node's CPUs: their memory, which main.yaml reserves,
      # grows with it.
      - name: GOMAXPROCS
        value: "4"
    volumeMounts:
      - name: go-cache
        mountPath: /go-cache
  steps:
    - name: clone
      ref: {name: clone} # clone.step.yaml
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
    - name: restore
      ref: {name: go-cache-restore} # go-cache-restore.step.yaml
    # The generators, which go tool builds and caches.
    - name: generate
      image: docker.io/library/golang:1.27.1
      command: [go, generate, ./...]
      onError: continue
    # Build's binaries, and the image build's: the same packages, compiled the same way, link alone differing.
    - name: build
      image: docker.io/library/golang:1.27.1
      env:
        - name: CGO_ENABLED
          value: "0"
      command: [go, build, -trimpath, -o, .ci/bin/, ./cmd/...]
      onError: continue
    - name: vet
      image: docker.io/library/golang:1.27.1
      command: [go, vet, ./...]
      onError: continue
    # The tests with the race detector, linked but never run.
    - name: test
      image: docker.io/library/golang:1.27.1
      command: [go, test, -race, -count=1, -run, '^$', -exec, /bin/true, ./...]
      onError: continue
    - name: lint
      image: docker.io/golangci/golangci-lint:v2.15.0
      command: [golangci-lint, run, ./...]
      onError: continue
    - name: save
      image: docker.io/curlimages/curl:8.22.0
      securityContext:
        runAsUser: 0
      command: [sh, .tekton/scripts/go-cache-save.sh]
