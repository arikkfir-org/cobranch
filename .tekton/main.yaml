# Cobranch's build of main: build images cobranch and cobranch-console of a commit and push them to Artifact Registry,
# tagged with the commit's short SHA (publish.task.yaml). The pod pushes as ServiceAccount ci-cobranch-release, through
# Workload Identity: the one ServiceAccount allowed to push to main's and the versions' repository, which only main and
# v* tags may use (octomaton.dev/branches, octomaton.dev/tags); pipeline preview pushes elsewhere (preview.yaml). A
# plain Tekton PipelineRun; Octomaton sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cobranch-main-
spec:
  taskRunTemplate:
    serviceAccountName: ci-cobranch-release
  # The steps only drive the Docker daemon, which its sidecar holds, with resources of its own.
  taskRunSpecs:
    - pipelineTaskName: publish
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to publish.
    workspaces:
      - name: source
    tasks:
      - name: publish
        # A lost node (an upgrade or a repair) kills the build. An installation runs the images of the commit main is
        # at, so try again: pushing the same tags twice is harmless.
        retries: 2
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: registry
            value: me-west1-docker.pkg.dev/arikkfir/cobranch
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: publish # .tekton/publish.task.yaml
