# The task of .tekton/ci.yaml: check out the commit, then lint, vet, test (with the race detector) and build it, and run
# the binary it built. Octomaton inlines it into the PipelineRun.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  volumes:
    - name: go-cache
      emptyDir: {}
  stepTemplate:
    workingDir: $(workspaces.source.path)
    env:
      - name: GOCACHE
        value: /go-cache/build
      - name: GOMODCACHE
        value: /go-cache/mod
      - name: GOLANGCI_LINT_CACHE
        value: /go-cache/lint
      - name: GOTOOLCHAIN
        value: local
      - name: GOFLAGS
        value: -mod=readonly
    volumeMounts:
      - name: go-cache
        mountPath: /go-cache
  steps:
    - name: clone
      image: docker.io/alpine/git:2.54.0
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/bin/sh
        set -eu
        git init --quiet .
        git fetch --quiet --depth=1 "$REPO_URL" "$REVISION"
        git -c advice.detachedHead=false checkout --quiet FETCH_HEAD
        git log -1 --format='Checked out %H: %s'
    - name: lint
      image: docker.io/golangci/golangci-lint:v2.15.0
      command: [golangci-lint, run, ./...]
    - name: vet
      image: docker.io/library/golang:1.27.1
      command: [go, vet, ./...]
    - name: test
      image: docker.io/library/golang:1.27.1
      command: [go, test, -race, -count=1, ./...]
    - name: build
      image: docker.io/library/golang:1.27.1
      env:
        - name: CGO_ENABLED
          value: "0"
      command: [go, build, -trimpath, -o, .ci/bin/, ./cmd/...]
    - name: version
      image: docker.io/library/golang:1.27.1
      command: [$(workspaces.source.path)/.ci/bin/devhub, version]
