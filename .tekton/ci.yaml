# Cobranch's CI, two tasks side by side: ci lints, vets, tests (with the race detector) and builds the Go module
# (ci.task.yaml); chart builds the images and installs, tests and upgrades the chart on a throwaway kind cluster
# (chart.task.yaml). A plain Tekton PipelineRun; Octomaton sets the params.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cobranch-ci-
spec:
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once). With
  # Go Cloud's drivers (the AWS, Azure and Google Cloud SDKs), lint peaks near 1.5Gi and the compiles near 1Gi on a cold
  # cache, measured at GOMAXPROCS=4 (ci.task.yaml); size them again from real runs as the code grows.
  taskRunSpecs:
    - pipelineTaskName: ci
      computeResources:
        requests:
          cpu: "1"
          memory: 1536Mi
        limits:
          memory: 3Gi
    # The steps only drive the Docker daemon and the cluster, which its sidecar holds, with resources of its own;
    # building kind is their peak.
    - pipelineTaskName: chart
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 2Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit to test.
    workspaces:
      - name: source
    tasks:
      - name: ci
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: ci # .tekton/ci.task.yaml
      - name: chart
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: chart # .tekton/chart.task.yaml
